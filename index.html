"z":"成功辦成（困難的事）","c":"策略與綜合","ex":[["Few thought the team could pull off such a complex deal.","很少人認為團隊能成功完成如此複雜的交易。"],["They pulled off a successful launch despite the tight budget.","儘管預算吃緊，他們仍成功辦成了發表。"]]},{"w":"follow through","p":"phr.","z":"貫徹到底、落實","c":"策略與綜合","ex":[["It is not enough to plan; you must follow through.","光有計畫還不夠，你必須貫徹執行。"],["The manager followed through on every promise to the staff.","主管對員工的每項承諾都確實兌現。"]]},{"w":"cut corners","p":"phr.","z":"偷工減料、走捷徑","c":"策略與綜合","ex":[["The firm was fined for cutting corners on safety.","這家公司因在安全上偷工減料而被罰款。"],["We refuse to cut corners just to save money.","我們拒絕為了省錢而偷工減料。"]]},{"w":"meet the deadline","p":"phr.","z":"趕上期限","c":"策略與綜合","ex":[["We worked all weekend to meet the deadline.","我們整個週末都在工作以趕上期限。"],["It will be hard to meet the deadline with so few staff.","人手這麼少很難趕上期限。"]]},{"w":"ahead of schedule","p":"phr.","z":"比預定時程提前","c":"策略與綜合","ex":[["The construction was completed ahead of schedule.","這項工程比預定時程提前完工。"],["We delivered the order two days ahead of schedule.","我們提前兩天交付了訂單。"]]},{"w":"behind schedule","p":"phr.","z":"進度落後","c":"策略與綜合","ex":[["The project is three weeks behind schedule.","這個專案進度落後三週。"],["Supplier delays put the whole production line behind schedule.","供應商延誤使整條生產線進度落後。"]]},{"w":"on track","p":"phr.","z":"進度正常、按計畫進行","c":"策略與綜合","ex":[["Sales are on track to hit this year's target.","銷售正按計畫朝今年目標邁進。"],["Are we still on track to launch in June?","我們仍然有望在六月發表嗎？"]]},{"w":"in the pipeline","p":"phr.","z":"在籌備中、即將推出","c":"策略與綜合","ex":[["We have several new products in the pipeline.","我們有好幾項新產品正在籌備中。"],["There are big changes in the pipeline for the sales team.","業務團隊即將有重大變動。"]]},{"w":"at stake","p":"phr.","z":"岌岌可危、利害攸關","c":"策略與綜合","ex":[["With millions at stake, we cannot afford any mistakes.","牽涉數百萬的利害，我們不容許任何失誤。"],["The company's reputation is at stake in this negotiation.","公司的聲譽在這場談判中岌岌可危。"]]},{"w":"ramp up","p":"phr.","z":"提高、加大（產量、力度）","c":"策略與綜合","ex":[["The factory will ramp up production before the holiday season.","工廠將在假期旺季前提高產量。"],["We need to ramp up our marketing efforts this quarter.","我們本季需要加強行銷力道。"]]},{"w":"scale back","p":"phr.","z":"縮減、減少規模","c":"策略與綜合","ex":[["The firm had to scale back its expansion plans.","公司不得不縮減擴張計畫。"],["We will scale back advertising until sales recover.","在銷售回升之前我們會縮減廣告。"]]},{"w":"feasibility study","p":"phr.","z":"可行性研究","c":"策略與綜合","ex":[["The board ordered a feasibility study before approving the factory.","董事會在核准設廠前要求做可行性研究。"],["The feasibility study suggests the project will pay for itself in four years.","可行性研究顯示該專案四年內可回本。"]]},{"w":"pilot program","p":"phr.","z":"試辦計畫","c":"策略與綜合","ex":[["We will run a pilot program in two stores first.","我們會先在兩家店舉辦試辦計畫。"],["The pilot program convinced management to expand the service.","試辦計畫說服了管理層擴大這項服務。"]]},{"w":"proof of concept","p":"phr.","z":"概念驗證","c":"策略與綜合","ex":[["The engineers built a proof of concept to show investors.","工程師做了概念驗證來向投資人展示。"],["We need a working proof of concept before requesting more funding.","在申請更多資金前我們需要可運作的概念驗證。"]]},{"w":"negotiable","p":"adj.","z":"可協商的","c":"策略與綜合","ex":[["The salary is negotiable depending on experience.","薪資可依經驗協商。"],["The delivery date is not negotiable, so please plan accordingly.","交貨日期不可協商，請據此規劃。"]]},{"w":"agile","p":"adj.","z":"敏捷的","c":"策略與綜合","ex":[["We use an agile approach so the team can adapt quickly.","我們採用敏捷方法讓團隊能快速調整。"],["Small startups are often more agile than large corporations.","小型新創公司往往比大企業更敏捷。"]]},{"w":"pivot","p":"v.","z":"轉向、調整策略","c":"策略與綜合","ex":[["The startup had to pivot when its first product failed.","這家新創公司在首款產品失敗後不得不轉型。"],["We pivoted from selling hardware to offering subscription services.","我們從賣硬體轉向提供訂閱服務。"]]},{"w":"ambitious","p":"adj.","z":"野心勃勃的、宏大的","c":"策略與綜合","ex":[["The company set an ambitious goal of doubling revenue.","公司設定了營收翻倍的宏大目標。"],["She is an ambitious manager who wants to run the division.","她是一位想掌管整個部門的有抱負的經理。"]]},{"w":"revamp","p":"v.","z":"改造、徹底翻新","c":"策略與綜合","ex":[["We plan to revamp our website before the holiday season.","我們計畫在假期旺季前改版網站。"],["The firm revamped its training program to attract talent.","公司翻新了培訓計畫以吸引人才。"]]},{"w":"overhaul","p":"n.","z":"全面檢修、徹底改革","c":"策略與綜合","ex":[["The department needs a complete overhaul of its procedures.","該部門的流程需要徹底改革。"],["The overhaul of our IT systems took over a year.","我們資訊系統的全面升級花了一年多。"]]},{"w":"synergy","p":"n.","z":"綜效、協同效應","c":"策略與綜合","ex":[["The merger is expected to create real synergy between the two firms.","這次合併預期將在兩家公司之間創造真正的綜效。"],["We saw little synergy between the sales and marketing teams.","我們看不出業務與行銷團隊之間有什麼協同效應。"]]},{"w":"alignment","p":"n.","z":"一致性、對齊","c":"策略與綜合","ex":[["We need better alignment between sales goals and company strategy.","我們需要讓銷售目標與公司策略更一致。"],["The workshop improved alignment across all departments.","這場工作坊提高了各部門之間的一致性。"]]},{"w":"roadmap","p":"n.","z":"路線圖、發展藍圖","c":"策略與綜合","ex":[["The product roadmap shows what features we will release over the next year.","產品路線圖顯示我們明年將推出哪些功能。"],["Management shared a three-year roadmap with all employees.","管理層與全體員工分享了三年發展藍圖。"]]},{"w":"competitive landscape","p":"n.","z":"競爭態勢","c":"策略與綜合","ex":[["We analyzed the competitive landscape before choosing our pricing.","我們在訂價前分析了競爭態勢。"],["The competitive landscape changed quickly when two new rivals entered the market.","兩家新對手進入市場後，競爭態勢迅速改變。"]]},{"w":"expand","p":"v.","z":"擴張、擴大","c":"策略與綜合","ex":[["The company plans to expand into Southeast Asia within two years.","公司計劃在兩年內拓展到東南亞。"],["We need more funding if we want to expand our product range.","如果想擴大產品範圍，我們需要更多資金。"]]},{"w":"disrupt","p":"v.","z":"顛覆、擾亂","c":"策略與綜合","ex":[["New technology can disrupt entire industries almost overnight.","新科技幾乎能在一夜之間顛覆整個產業。"],["A port strike could disrupt our deliveries for several weeks.","港口罷工可能擾亂我們數週的交貨。"]]},{"w":"outlook","p":"n.","z":"展望、前景","c":"策略與綜合","ex":[["The economic outlook for next year looks cautiously positive.","明年的經濟前景看來審慎樂觀。"],["Analysts have a negative outlook on the retail sector.","分析師對零售業的前景看法悲觀。"]]},{"w":"mission statement","p":"n.","z":"使命宣言","c":"策略與綜合","ex":[["Our mission statement says we aim to make healthy food affordable.","我們的使命宣言說明我們的目標是讓健康食品價格親民。"],["A clear mission statement helps employees understand the company's purpose.","清楚的使命宣言能幫助員工了解公司的目的。"]]},{"w":"capitalize on","p":"phr.","z":"利用、把握","c":"策略與綜合","ex":[["We should capitalize on the growing demand for electric vehicles.","我們應該把握電動車需求成長的機會。"],["The firm managed to capitalize on its rival's recent mistakes.","這家公司成功利用了對手最近的失誤。"]]},{"w":"tap into","p":"phr.","z":"開發、利用","c":"策略與綜合","ex":[["The company hopes to tap into the fast-growing market for online education.","公司希望開發快速成長的線上教育市場。"],["We can tap into our alumni network to find new clients.","我們可以利用校友網絡尋找新客戶。"]]},{"w":"downturn","p":"n.","z":"衰退、低迷","c":"策略與綜合","ex":[["The economic downturn forced many small businesses to close.","經濟低迷迫使許多小型企業關門。"],["Our company stayed profitable even during the downturn.","即使在景氣低迷期間，我們公司仍維持獲利。"]]},{"w":"monetize","p":"v.","z":"將…變現、獲利","c":"策略與綜合","ex":[["The app has millions of users, but we still need to monetize it.","這款應用程式有數百萬用戶，但我們仍需想辦法讓它獲利。"],["They plan to monetize their video content through advertising.","他們計劃透過廣告把影片內容變現。"]]},{"w":"optimize","p":"v.","z":"優化、使最佳化","c":"策略與綜合","ex":[["We hired an expert to optimize our delivery routes and save fuel.","我們聘請專家優化配送路線以節省燃料。"],["The team will optimize the website to load faster on mobile phones.","團隊會優化網站，讓它在手機上載入更快。"]]},{"w":"trade-off","p":"n.","z":"取捨、權衡","c":"策略與綜合","ex":[["There is always a trade-off between speed and quality in production.","在生產中，速度與品質之間總是需要取捨。"],["We accepted a higher price as a trade-off for faster delivery.","我們接受較高價格，以換取更快的交貨。"]]},{"w":"red flag","p":"n.","z":"警訊、危險信號","c":"策略與綜合","ex":[["Unusually low prices from a supplier should be treated as a red flag.","供應商開出異常低的價格，應被視為警訊。"],["The auditor noticed several red flags in the company's accounts.","稽核員在公司帳目中發現了幾個警訊。"]]},{"w":"in-house","p":"adj.","z":"公司內部的","c":"策略與綜合","ex":[["We prefer to keep the design work in-house rather than hire an agency.","我們寧願把設計工作留在公司內部，而不是請代理商。"],["The company runs an in-house training program for new managers.","公司為新任主管開辦內部培訓計畫。"]]},{"w":"state-of-the-art","p":"adj.","z":"最先進的","c":"策略與綜合","ex":[["The new factory is equipped with state-of-the-art robots and sensors.","新工廠配備了最先進的機器人與感測器。"],["Customers expect state-of-the-art security when they use online banking.","客戶使用網路銀行時期望有最先進的安全防護。"]]},{"w":"upfront","p":"adj.","z":"預先的、先付的","c":"策略與綜合","ex":[["The supplier requires an upfront payment of thirty percent.","供應商要求預先支付百分之三十的款項。"],["Please be upfront about any risks so we can plan properly.","請坦白告知任何風險，我們才能妥善規劃。"]]},{"w":"outage","p":"n.","z":"停機、中斷","c":"策略與綜合","ex":[["A power outage shut down our servers for three hours yesterday.","昨天的停電讓我們的伺服器關閉了三個小時。"],["Customers were angry about the repeated service outage last week.","客戶對上週反覆發生的服務中斷感到憤怒。"]]},{"w":"deploy","p":"v.","z":"部署、配置","c":"策略與綜合","ex":[["The IT team will deploy the new software to all offices next month.","資訊團隊下個月將把新軟體部署到所有辦公室。"],["We plan to deploy more staff to the busiest branches during the holiday.","假期期間，我們計劃調派更多員工到最忙的分店。"]]}]},{"id":"restaurant","en":"Restaurant & Ordering","zh":"餐廳點餐單字","ds":"訂位、點餐、特殊需求與結帳常用字彙","cats":["訂位與入座","餐點與菜單","飲品與點餐用語","烹調口味與特殊需求","結帳與服務"],"words":[{"w":"reservation","p":"n.","z":"訂位、預約","c":"訂位與入座","ex":[["I made a reservation for six people at seven o'clock.","我訂了七點六人的位子。"],["Do you have a reservation with us tonight?","請問您今晚有訂位嗎?"]]},{"w":"reserve","p":"v.","z":"預訂、保留","c":"訂位與入座","ex":[["I would like to reserve a table for Friday night.","我想預訂週五晚上的一張桌子。"],["We can reserve the corner table for your anniversary dinner.","我們可以為您的結婚紀念晚餐保留角落那一桌。"]]},{"w":"book","p":"v.","z":"訂位、預訂","c":"訂位與入座","ex":[["I'd like to book a table for tomorrow lunch.","我想訂明天午餐的位子。"],["It is hard to book this place on weekends.","這家店週末很難訂位。"]]},{"w":"booking","p":"n.","z":"訂位、預約紀錄","c":"訂位與入座","ex":[["Can I change my booking to eight o'clock?","我可以把訂位改到八點嗎?"],["We have no booking under that name, I'm afraid.","恐怕我們沒有那個名字的訂位紀錄。"]]},{"w":"make a reservation","p":"phr.","z":"訂位","c":"訂位與入座","ex":[["I'd like to make a reservation for this Saturday.","我想訂這個星期六的位子。"],["You can make a reservation on our website.","您可以在我們的網站上訂位。"]]},{"w":"reservation required","p":"phr.","z":"需要事先訂位","c":"訂位與入座","ex":[["Reservation required for groups of eight or more.","八人以上的團體需要事先訂位。"],["The sign says reservation required on weekends.","告示牌寫著週末需要事先訂位。"]]},{"w":"under the name of","p":"phr.","z":"以……的名字(訂位)","c":"訂位與入座","ex":[["I have a reservation under the name of Chen.","我以陳的名字訂了位。"],["The table was booked under the name of Lin.","那桌是以林的名字預訂的。"]]},{"w":"walk-in","p":"n.","z":"未預約的客人、現場客人","c":"訂位與入座","ex":[["Do you accept walk-ins or only reservations?","你們接受現場客人還是只接受訂位?"],["We keep a few tables open for walk-ins every night.","我們每晚都會留幾張桌子給現場客人。"]]},{"w":"a table for two","p":"phr.","z":"兩人桌","c":"訂位與入座","ex":[["Hi, a table for two, please.","你好,麻煩兩位。"],["Do you have a table for two by the window?","你們有靠窗的兩人桌嗎?"]]},{"w":"a table for four","p":"phr.","z":"四人桌","c":"訂位與入座","ex":[["We would like a table for four, please.","我們想要一張四人桌。"],["Sorry, we only have a table for four in the back.","抱歉,我們只剩後面有四人桌。"]]},{"w":"party","p":"n.","z":"一行人、團體","c":"訂位與入座","ex":[["How many people are in your party tonight?","你們今晚一行有幾位?"],["Our party of five is still waiting for one friend.","我們一行五人還在等一位朋友。"]]},{"w":"how many in your party","p":"phr.","z":"請問幾位","c":"訂位與入座","ex":[["Good evening, how many in your party?","晚安,請問幾位?"],["The host asked how many in your party before leading us in.","帶位前,領檯人員先問了幾位。"]]},{"w":"host","p":"n.","z":"(餐廳)領檯人員","c":"訂位與入座","ex":[["The host showed us to a quiet table.","領檯人員帶我們到一張安靜的桌子。"],["Please check in with the host at the front door.","請到門口向領檯人員報到。"]]},{"w":"hostess","p":"n.","z":"女領檯人員","c":"訂位與入座","ex":[["The hostess smiled and asked for our name.","女領檯人員微笑著詢問我們的名字。"],["Ask the hostess if there is a table available.","問問女領檯人員有沒有空桌。"]]},{"w":"waiter","p":"n.","z":"男服務生","c":"訂位與入座","ex":[["Our waiter recommended the grilled fish.","我們的服務生推薦了烤魚。"],["Excuse me, waiter, could we have some water?","不好意思,服務生,可以給我們一些水嗎?"]]},{"w":"waitress","p":"n.","z":"女服務生","c":"訂位與入座","ex":[["The waitress brought us the menus right away.","女服務生馬上把菜單拿來給我們。"],["Our waitress was very friendly and patient.","我們的女服務生非常親切又有耐心。"]]},{"w":"server","p":"n.","z":"服務人員","c":"訂位與入座","ex":[["Your server will be with you in a moment.","您的服務人員馬上就來。"],["Our server explained the daily specials to us.","我們的服務人員向我們說明了今日特餐。"]]},{"w":"busser","p":"n.","z":"收拾桌面的助手","c":"訂位與入座","ex":[["The busser cleared our plates quickly.","收拾桌面的助手很快就把我們的盤子收走了。"],["Please ask the busser to clean this table.","請叫收桌的人員來清理這張桌子。"]]},{"w":"chef","p":"n.","z":"主廚、廚師","c":"訂位與入座","ex":[["The chef came out to greet the guests.","主廚出來向客人問候。"],["This restaurant's chef trained in Japan for ten years.","這家餐廳的主廚曾在日本受訓十年。"]]},{"w":"head chef","p":"n.","z":"主廚、廚師長","c":"訂位與入座","ex":[["The head chef created this dish himself.","主廚親自創作了這道菜。"],["I would like to thank the head chef for the meal.","我想為這頓飯感謝主廚。"]]},{"w":"manager","p":"n.","z":"經理","c":"訂位與入座","ex":[["Could I speak to the manager, please?","我可以和經理談一談嗎?"],["The manager apologized and offered us a free dessert.","經理道歉並招待我們一份免費甜點。"]]},{"w":"sommelier","p":"n.","z":"侍酒師","c":"訂位與入座","ex":[["The sommelier suggested a red wine for the steak.","侍酒師推薦了一款搭配牛排的紅酒。"],["Ask the sommelier if you need help choosing wine.","如果您需要挑酒的協助,可以請教侍酒師。"]]},{"w":"bartender","p":"n.","z":"調酒師、吧檯人員","c":"訂位與入座","ex":[["The bartender makes an excellent lemon cocktail.","這位調酒師做的檸檬調酒很棒。"],["We sat at the bar and chatted with the bartender.","我們坐在吧檯,和調酒師聊天。"]]},{"w":"cashier","p":"n.","z":"收銀員","c":"訂位與入座","ex":[["Please pay the cashier at the front counter.","請到前面櫃檯向收銀員結帳。"],["The cashier gave me my receipt and change.","收銀員給了我收據和零錢。"]]},{"w":"staff","p":"n.","z":"員工","c":"訂位與入座","ex":[["The staff here are always polite and helpful.","這裡的員工總是有禮貌又樂於幫忙。"],["Please ask a member of staff for the menu.","請向一位員工索取菜單。"]]},{"w":"seat","p":"v.","z":"帶位、安排入座","c":"訂位與入座","ex":[["The host will seat you in a few minutes.","領檯人員幾分鐘後會帶您入座。"],["They seated us near the kitchen, which was noisy.","他們安排我們坐在廚房附近,很吵。"]]},{"w":"seating","p":"n.","z":"座位(安排)","c":"訂位與入座","ex":[["What is the seating like upstairs?","樓上的座位是什麼樣的?"],["The restaurant has seating for about eighty people.","這間餐廳大約有八十個座位。"]]},{"w":"take a seat","p":"phr.","z":"請坐、入座","c":"訂位與入座","ex":[["Please take a seat and I will be right back.","請坐,我馬上回來。"],["You can take a seat anywhere you like.","您可以隨意找位子坐。"]]},{"w":"is this seat taken","p":"phr.","z":"這個位子有人坐嗎","c":"訂位與入座","ex":[["Excuse me, is this seat taken? We need one more chair.","不好意思,這個位子有人坐嗎?我們還需要一張椅子。"],["Is this seat taken, or may I sit here?","這個位子有人坐嗎,還是我可以坐這裡?"]]},{"w":"this way, please","p":"phr.","z":"請往這邊走","c":"訂位與入座","ex":[["Your table is ready, this way, please.","您的桌位好了,請往這邊走。"],["This way, please, I'll show you to your seats.","請往這邊走,我帶你們入座。"]]},{"w":"follow me","p":"phr.","z":"請跟我來","c":"訂位與入座","ex":[["Follow me, and I'll take you to your table.","請跟我來,我帶您去您的桌位。"],["Please follow me, we have a quiet booth for you.","請跟我來,我們有一個安靜的包廂座給您。"]]},{"w":"booth","p":"n.","z":"卡座、包廂座","c":"訂位與入座","ex":[["Could we sit in a booth instead of a table?","我們可以坐卡座而不是一般桌子嗎?"],["The booth by the wall is more private.","靠牆的卡座比較有隱私。"]]},{"w":"window seat","p":"n.","z":"靠窗座位","c":"訂位與入座","ex":[["We asked for a window seat with a nice view.","我們要了一個景觀好的靠窗座位。"],["Is there a window seat available for two?","有兩人的靠窗座位嗎?"]]},{"w":"counter seat","p":"n.","z":"吧檯座位","c":"訂位與入座","ex":[["There are two counter seats free right now.","現在有兩個吧檯座位是空的。"],["I prefer a counter seat when I eat alone.","我一個人吃飯時比較喜歡坐吧檯座位。"]]},{"w":"private room","p":"n.","z":"包廂","c":"訂位與入座","ex":[["We booked a private room for the company dinner.","我們為公司聚餐訂了一間包廂。" 有什麼?"]]},{"w":"would you like","p":"phr.","z":"您想要…嗎?(店員用語)","c":"飲品與點餐用語","ex":[["Would you like fries with that?","您的餐點要加薯條嗎?"],["Would you like some dessert or coffee?","您想要來點甜點或咖啡嗎?"]]},{"w":"make it","p":"phr.","z":"改成…、就點…","c":"飲品與點餐用語","ex":[["Make it a large, please.","請改成大杯。"],["Make it two coffees, one with milk.","兩杯咖啡,其中一杯加牛奶。"]]},{"w":"the check","p":"n.","z":"帳單(美)","c":"飲品與點餐用語","ex":[["Could we have the check, please?","可以給我們帳單嗎?"],["I'll get the check tonight.","今晚帳單我來付。"]]},{"w":"split the bill","p":"phr.","z":"分開付帳、平分帳單","c":"飲品與點餐用語","ex":[["Can we split the bill four ways?","我們可以分成四份來付嗎?"],["Let's split the bill and pay separately.","我們分開算,各付各的。"]]},{"w":"keep the change","p":"phr.","z":"不用找零了","c":"飲品與點餐用語","ex":[["Here's a hundred dollars. Keep the change.","這裡一百元,不用找了。"],["You can keep the change as a tip.","零錢就當小費給你吧。"]]},{"w":"tip","p":"n.","z":"小費","c":"飲品與點餐用語","ex":[["Do you leave a tip in Taiwan?","在台灣要給小費嗎?"],["I left a ten dollar tip for the waiter.","我留了十元小費給服務生。"]]},{"w":"a table for","p":"phr.","z":"…人座位","c":"飲品與點餐用語","ex":[["Hi, a table for three, please.","你好,請給我三個人的位子。"],["We'd like a table for four by the window.","我們想要一張靠窗的四人桌。"]]},{"w":"soft drink","p":"n.","z":"不含酒精的汽水飲料","c":"飲品與點餐用語","ex":[["Would you like a soft drink with your meal?","您用餐想配一杯汽水嗎？"],["Refills on any soft drink are free.","任何汽水飲料都可免費續杯。"]]},{"w":"tap water","p":"n.","z":"自來水、免費白開水","c":"飲品與點餐用語","ex":[["Could I have some tap water, please?","可以給我一些白開水嗎？"],["Tap water is served free at every table.","每桌都免費提供白開水。"]]},{"w":"flat white","p":"n.","z":"澳式白咖啡","c":"飲品與點餐用語","ex":[["I will have a flat white with oat milk.","我要一杯加燕麥奶的澳式白咖啡。"],["A flat white has less foam than a latte.","澳式白咖啡的奶泡比拿鐵少。"]]},{"w":"iced tea","p":"n.","z":"冰茶","c":"飲品與點餐用語","ex":[["One iced tea with no sugar, please.","請給我一杯無糖冰茶。"],["The iced tea comes with a slice of lemon.","這杯冰茶附有一片檸檬。"]]},{"w":"mocktail","p":"n.","z":"無酒精調酒","c":"飲品與點餐用語","ex":[["I am driving, so I will order a mocktail.","我要開車，所以點一杯無酒精調酒。"],["This mocktail is made with mint and soda.","這杯無酒精調酒是用薄荷和蘇打水調的。"]]},{"w":"wine list","p":"n.","z":"酒單","c":"飲品與點餐用語","ex":[["Could we see the wine list, please?","可以請你給我們看酒單嗎？"],["The waiter brought the wine list with the menus.","服務生把酒單和菜單一起拿來了。"]]},{"w":"corkage fee","p":"n.","z":"開瓶費","c":"飲品與點餐用語","ex":[["The restaurant charges a corkage fee for outside wine.","這間餐廳對自帶酒水收取開瓶費。"],["Is there a corkage fee if we bring our own bottle?","如果我們自己帶酒，需要付開瓶費嗎？"]]},{"w":"pitcher","p":"n.","z":"一大壺（飲料）","c":"飲品與點餐用語","ex":[["Let us get a pitcher of beer for the group.","我們幫大家點一大壺啤酒吧。"],["She poured water from the pitcher into our glasses.","她把壺裡的水倒進我們的杯子裡。"]]},{"w":"on tap","p":"phr.","z":"生啤酒（桶裝）、現打供應","c":"飲品與點餐用語","ex":[["They have six kinds of beer on tap.","他們有六種生啤酒。"],["Is the local craft beer on tap tonight?","今晚有供應在地精釀生啤酒嗎？"]]},{"w":"bottled water","p":"n.","z":"瓶裝水","c":"飲品與點餐用語","ex":[["We asked for two bottles of bottled water.","我們要了兩瓶瓶裝水。"],["Bottled water costs extra at this restaurant.","這間餐廳的瓶裝水要另外收費。"]]},{"w":"grilled","p":"adj.","z":"炭烤的、烤架烤的","c":"烹調口味與特殊需求","ex":[["I'd like the grilled salmon with steamed vegetables, please.","我想點烤鮭魚配蒸蔬菜。"],["The grilled chicken here has a lovely smoky flavor.","這裡的烤雞有很棒的煙燻香味。"]]},{"w":"fried","p":"adj.","z":"油炸的、煎的","c":"烹調口味與特殊需求","ex":[["Is the fried rice made with real shrimp?","這道炒飯是用真的蝦子做的嗎？"],["We ordered fried chicken and a side of fries.","我們點了炸雞和一份薯條。"]]},{"w":"steamed","p":"adj.","z":"蒸的","c":"烹調口味與特殊需求","ex":[["The steamed fish comes with ginger and green onions.","蒸魚搭配薑絲和蔥花。"],["Can I have steamed rice instead of fried rice?","我可以點白飯而不要炒飯嗎？"]]},{"w":"roasted","p":"adj.","z":"烘烤的、烤的","c":"烹調口味與特殊需求","ex":[["Our roasted duck is served with thin pancakes.","我們的烤鴨附有薄餅皮。"],["I'll have the roasted vegetables as a side dish.","我要點烤時蔬當配菜。"]]},{"w":"boiled","p":"adj.","z":"水煮的、煮熟的","c":"烹調口味與特殊需求","ex":[["Would you like a boiled egg with your noodles?","您的麵要加一顆水煮蛋嗎？"],["The boiled dumplings are served with vinegar and chili oil.","水餃附有醋和辣油。"]]},{"w":"baked","p":"adj.","z":"烘焙的、焗烤的","c":"烹調口味與特殊需求","ex":[["The baked potato comes with sour cream and chives.","烤馬鈴薯附有酸奶油和細香蔥。"],["Try our baked pasta with melted cheese on top.","試試我們表面鋪滿融化起司的焗烤義大利麵。"]]},{"w":"braised","p":"adj.","z":"紅燒的、燉煮的","c":"烹調口味與特殊需求","ex":[["The braised pork belly is our most popular dish.","紅燒五花肉是我們最受歡迎的菜。"],["I love the braised beef noodle soup in this restaurant.","我很喜歡這家餐廳的紅燒牛肉麵。"]]},{"w":"stir-fried","p":"adj.","z":"快炒的、炒的","c":"烹調口味與特殊需求","ex":[["Today's special is stir-fried beef with black pepper.","今日特餐是黑胡椒炒牛肉。"],["We'd like one stir-fried vegetable dish, please.","我們想要一道炒青菜。"]]},{"w":"deep-fried","p":"adj.","z":"油炸的、酥炸的","c":"烹調口味與特殊需求","ex":[["The deep-fried tofu is crispy outside and soft inside.","酥炸豆腐外酥內軟。"],["I'm avoiding deep-fried food because I'm on a diet.","我在減肥，所以避免油炸食物。"]]},{"w":"pan-fried","p":"adj.","z":"煎的、香煎的","c":"烹調口味與特殊需求","ex":[["The pan-fried dumplings are crispy on the bottom.","煎餃底部很酥脆。"],["I'll have the pan-fried steak with mushroom sauce.","我要點香煎牛排佐蘑菇醬。"]]},{"w":"smoked","p":"adj.","z":"煙燻的","c":"烹調口味與特殊需求","ex":[["Would you like smoked salmon or fresh salmon?","您要煙燻鮭魚還是新鮮鮭魚？"],["The smoked bacon adds a rich flavor to the soup.","煙燻培根為這道湯增添濃郁風味。"]]},{"w":"poached","p":"adj.","z":"水煮的（蛋、魚）、水波的","c":"烹調口味與特殊需求","ex":[["I'd like my eggs poached, please.","我的蛋請做成水波蛋。"],["The poached chicken is served cold with ginger sauce.","白斬雞冷盤搭配薑蓉醬。"]]},{"w":"sauteed","p":"adj.","z":"嫩煎的、清炒的","c":"烹調口味與特殊需求","ex":[["The sauteed mushrooms go well with the steak.","嫩煎蘑菇和牛排很搭。"],["We have sauteed spinach with garlic as a side.","我們有蒜炒菠菜可作配菜。"]]},{"w":"barbecued","p":"adj.","z":"燒烤的、烤肉的","c":"烹調口味與特殊需求","ex":[["The barbecued ribs fall right off the bone.","燒烤肋排肉嫩到一碰就脫骨。"],["Do you serve barbecued pork with your rice dishes?","你們的飯類有附叉燒嗎？"]]},{"w":"marinated","p":"adj.","z":"醃漬過的","c":"烹調口味與特殊需求","ex":[["The chicken is marinated overnight in soy sauce and garlic.","這隻雞用醬油和大蒜醃了一整夜。"],["Are the marinated cucumbers spicy or sweet?","這道醃小黃瓜是辣的還是甜的？"]]},{"w":"pickled","p":"adj.","z":"醃漬的","c":"烹調口味與特殊需求","ex":[["The pickled vegetables help cut through the greasy pork.","醃漬蔬菜能解豬肉的油膩。"],["Would you like some pickled radish with your meal?","您的餐點要附醃蘿蔔嗎？"]]},{"w":"raw","p":"adj.","z":"生的","c":"烹調口味與特殊需求","ex":[["Is the fish raw or cooked in this dish?","這道菜裡的魚是生的還是熟的？"],["I don't eat raw oysters because they upset my stomach.","我不吃生蠔，因為會讓我胃不舒服。"]]},{"w":"rare","p":"adj.","z":"三分熟的、很生的","c":"烹調口味與特殊需求","ex":[["I'd like my steak rare, please.","我的牛排請做三分熟。"],["Rare beef is too bloody for me.","三分熟的牛肉對我來說血水太多了。"]]},{"w":"medium rare","p":"adj.","z":"五分熟","c":"烹調口味與特殊需求","ex":[["Most customers order the ribeye medium rare.","大多數客人點肋眼牛排都是五分熟。"],["Medium rare, please, with the sauce on the side.","請做五分熟，醬汁另外放。"]]},{"w":"medium","p":"adj.","z":"七分熟","c":"烹調口味與特殊需求","ex":[["How would you like your steak cooked, medium or well done?","您的牛排要幾分熟，七分熟還是全熟？"],["I'll have it medium, with a little pink inside.","我要七分熟，裡面帶一點粉紅色。"]]},{"w":"medium well","p":"adj.","z":"八分熟","c":"烹調口味與特殊需求","ex":[["I'd like my burger medium well, please.","我的漢堡請做八分熟。"],["The pork chop is best served medium well.","豬排八分熟最好吃。"]]},{"w":"well done","p":"adj.","z":"全熟","c":"烹調口味與特殊需求","ex":[["My son wants his steak well done.","我兒子要全熟的牛排。"],["If you order it well done, it may take longer.","如果您點全熟，可能需要久一點。"]]},{"w":"overcooked","p":"adj.","z":"煮過頭的","c":"烹調口味與特殊需求","ex":[["Excuse me, this pasta is a little overcooked.","不好意思，這份義大利麵有點煮過頭了。"],["The fish was overcooked and very dry.","這條魚煮過頭了，又乾又柴。"]]},{"w":"undercooked","p":"adj.","z":"沒煮熟的、半生不熟的","c":"烹調口味與特殊需求","ex":[["I think the chicken is undercooked in the middle.","我覺得這塊雞肉中間沒煮熟。"],["Sorry, the rice is undercooked, so we'll make a new batch.","抱歉，飯沒煮熟，我們重做一份。"]]},{"w":"crispy","p":"adj.","z":"酥脆的","c":"烹調口味與特殊需求","ex":[["I love the crispy skin on the roast duck.","我愛烤鴨那層酥脆的皮。"],["Could you make the fries extra crispy?","可以把薯條炸得特別酥脆嗎？"]]},{"w":"crunchy","p":"adj.","z":"脆口的、鬆脆的","c":"烹調口味與特殊需求","ex":[["The salad has crunchy nuts and fresh lettuce.","這份沙拉有脆口堅果和新鮮生菜。"],["These crunchy noodles are great on top of the soup.","這些脆麵放在湯上很好吃。"]]},{"w":"tender","p":"adj.","z":"軟嫩的","c":"烹調口味與特殊需求","ex":[["The beef is so tender that it melts in your mouth.","這牛肉嫩到入口即化。"],["Our lamb is slow-cooked until it's tender.","我們的羊肉慢火燉到軟嫩。"]]},{"w":"juicy","p":"adj.","z":"多汁的","c":"烹調口味與特殊需求","ex":[["The burger was thick and juicy.","這個漢堡又厚又多汁。"],["These juicy dumplings are filled with hot soup.","這些多汁的小籠包裡面有熱湯。"]]},{"w":"chewy","p":"adj.","z":"有嚼勁的、Q彈的","c":"烹調口味與特殊需求","ex":[["The noodles are nice and chewy.","這些麵條很有嚼勁。"],["I don't like chewy meat because it's hard to eat.","我不喜歡很韌的肉，因為很難咬。"]]},{"w":"creamy","p":"adj.","z":"綿密的、奶油味濃的","c":"烹調口味與特殊需求","ex":[["The pasta has a rich, creamy sauce.","這份義大利麵有濃郁綿密的奶醬。"],["Do you have a creamy soup of the day?","你們今天有奶油濃湯嗎？"]]},{"w":"fluffy","p":"adj.","z":"鬆軟的","c":"烹調口味與特殊需求","ex":[["The pancakes are light and fluffy.","這些鬆餅又輕又鬆軟。"],["I'd like the omelet fluffy, not too dry.","我的歐姆蛋要做得鬆軟，不要太乾。"]]},{"w":"greasy","p":"adj.","z":"油膩的","c":"烹調口味與特殊需求","ex":[["The fried noodles were too greasy for me.","這份炒麵對我來說太油膩了。"],["Please make it less greasy if you can.","可以的話請做得不要那麼油膩。"]]},{"w":"oily","p":"adj.","z":"油的、多油的","c":"烹調口味與特殊需求","ex":[["The soup looks a bit oily on top.","這碗湯表面看起來有點油。"],["Could you use less oil? I don't like oily food.","可以少放一點油嗎？我不喜歡太油的食物。"]]},{"w":"tough","p":"adj.","z":"老的、硬的、咬不動的","c":"烹調口味與特殊需求","ex":[["Sorry, but the steak is a bit tough.","抱歉，這塊牛排有點老。"],["The squid was tough and hard to chew.","這條魷魚又硬又難嚼。"]]},{"w":"soggy","p":"adj.","z":"軟爛濕黏的","c":"烹調口味與特殊需求","ex":[["The french fries arrived cold and soggy.","薯條送來時又冷又軟爛。"],["I hate soggy bread in a sandwich.","我討厭三明治裡濕軟的麵包。"]]},{"w":"spicy","p":"adj.","z":"辣的","c":"烹調口味與特殊需求","ex":[["Is this dish very spicy?","這道菜很辣嗎？"],["I can't eat spicy food, so please make it mild.","我不能吃辣，所以請做不辣的。"]]},{"w":"mild","p":"adj.","z":"溫和的、不辣的","c":"烹調口味與特殊需求","ex":[["We have mild, medium and hot chicken wings.","我們有微辣、中辣和大辣的雞翅。"],["I prefer a mild curry for the kids.","我想幫孩子點不辣的咖哩。"]]},{"w":"salty","p":"adj.","z":"鹹的","c":"烹調口味與特殊需求","ex":[["The soup is a little too salty for me.","這碗湯對我來說有點太鹹了。"],["Soy sauce can make the dish salty, so add it slowly.","醬油會讓菜變鹹，所以慢慢加。"]]},{"w":"bland","p":"adj.","z":"清淡無味的","c":"烹調口味與特殊需求","ex":[["The porridge tastes a bit bland without any toppings.","這碗粥不加配料有點淡而無味。"],["Could we have some chili sauce? The soup is bland.","可以給我們一些辣椒醬嗎？這湯很淡。"]]},{"w":"sour","p":"adj.","z":"酸的","c":"烹調口味與特殊需求","ex":[["The hot and sour soup is my favorite.","酸辣湯是我的最愛。"],["This milk tastes sour, so please bring a new one.","這牛奶嚐起來是酸的，請換一杯新的。"]]},{"w":"bitter","p":"adj.","z":"苦的","c":"烹調口味與特殊需求","ex":[["The coffee is too bitter without sugar.","這咖啡不加糖太苦了。"],["Bitter melon is good for you, but I find it too bitter.","苦瓜對身體好，但我覺得太苦了。"]]},{"w":"sweet","p":"adj.","z":"甜的","c":"烹調口味與特殊需求","ex":[["The sauce is too sweet for my taste.","這醬汁對我的口味來說太甜了。"],["We have sweet potato fries on the side menu.","我們的配菜有地瓜條。"]]},{"w":"savory","p":"adj.","z":"鹹香的、開胃的","c":"烹調口味與特殊需求","ex":[["I prefer savory breakfasts to sweet ones.","我比較喜歡鹹食早餐勝過甜食。"],["This savory pancake is filled with eggs and green onions.","這個鹹蔥蛋餅裡面有蛋和蔥。"]]},{"w":"tangy","p":"adj.","z":"酸甜開胃的、味道濃烈的","c":"烹調口味與特殊需求","ex":[["The tangy lemon sauce goes well with fried fish.","酸香檸檬醬和炸魚很搭。"],["I love the tangy flavor of this barbecue sauce.","我愛這款烤肉醬酸甜濃郁的味道。"]]},{"w":"rich","p":"adj.","z":"濃郁的、油膩味重的","c":"烹調口味與特殊需求","ex":[["The chocolate cake is very rich, so share it.","巧克力蛋糕非常濃郁，所以大家分著吃。"],["This rich broth is simmered for twelve hours.","這濃郁的湯頭熬了十二小時。"]]},{"w":"light","p":"adj.","z":"清爽的、份量輕的","c":"烹調口味與特殊需求","ex":[["I'd like something light for lunch today.","我今天午餐想吃點清爽的。"],["The soup is light and not too heavy.","這湯很清爽不會太膩。"]]},{"w":"fresh","p":"adj.","z":"新鮮的","c":"烹調口味與特殊需求","ex":[["All our seafood is fresh from the market this morning.","我們所有海鮮都是今早從市場進的新鮮貨。"],["Is the fish fresh today?","今天的魚新鮮嗎？"]]},{"w":"stale","p":"adj.","z":"不新鮮的、放太久的","c":"烹調口味與特殊需求","ex":[["This bread tastes stale, so could you change it?","這麵包吃起來不新鮮，可以幫我換嗎？"],["The chips were stale and soft.","這些洋芋片放太久，軟掉了。"]]},{"w":"seasoning","p":"n.","z":"調味料、調味","c":"烹調口味與特殊需求","ex":[["It needs a bit more seasoning.","這道菜需要再調味一點。"],["Do you use any artificial seasoning in the soup?","你們的湯有加人工調味料嗎？"]]},{"w":"flavor","p":"n.","z":"味道、口味","c":"烹調口味與特殊需求","ex":[["What flavor of ice cream do you have today?","你們今天有什麼口味的冰淇淋？"],["The sauce adds a lot of flavor to the dish.","醬汁為這道菜增添許多風味。"]]},{"w":"texture","p":"n.","z":"口感、質地","c":"烹調口味與特殊需求","ex":[["I love the soft texture of this tofu.","我很喜歡這豆腐柔軟的口感。"],["The texture of the noodles is just right.","這些麵條的口感剛剛好。"]]},{"w":"aftertaste","p":"n.","z":"餘味、回味","c":"烹調口味與特殊需求","ex":[["The tea has a sweet aftertaste.","這茶有甘甜的回味。"],["This drink leaves a strange aftertaste in my mouth.","這飲料在我嘴裡留下奇怪的餘味。"]]},{"w":"less salt","p":"phr.","z":"少鹽","c":"烹調口味與特殊需求","ex":[["Could you make it with less salt, please?","可以請你們少放點鹽嗎？"],["My grandfather needs his meals with less salt.","我爺爺的餐點需要少鹽。"]]},{"w":"no sugar","p":"phr.","z":"不加糖、無糖","c":"烹調口味與特殊需求","ex":[["I'd like an iced tea with no sugar.","我要一杯無糖冰茶。"],["Please make the soy milk with no sugar.","請把豆漿做成無糖的。"]]},{"w":"less ice","p":"phr.","z":"少冰","c":"烹調口味與特殊需求","ex":[["I'll have a lemon tea with less ice.","我要一杯少冰的檸檬茶。"],["Can I get the juice with less ice, please?","果汁可以少冰嗎？"]]},{"w":"extra spicy","p":"phr.","z":"特辣、加辣","c":"烹調口味與特殊需求","ex":[["I'd like the hot pot extra spicy.","我的火鍋要特辣。"],["Do you want it mild or extra spicy?","您要微辣還是特辣？"]]},{"w":"without","p":"prep.","z":"不要加、沒有","c":"烹調口味與特殊需求","ex":[["I'd like the burger without pickles, please.","我的漢堡請不要加酸黃瓜。"],["Can you make the soup without any meat?","可以做不加肉的湯嗎？"]]},{"w":"hold the onions","p":"phr.","z":"不要加洋蔥","c":"烹調口味與特殊需求","ex":[["I'll have the sandwich, but hold the onions.","我要這個三明治，但不要加洋蔥。"],["Hold the onions on my burger, please.","我的漢堡請不要加洋蔥。"]]},{"w":"no cilantro","p":"phr.","z":"不要香菜","c":"烹調口味與特殊需求","ex":[["Beef noodle soup with no cilantro, please.","牛肉麵請不要加香菜。"],["I have to say no cilantro because I really dislike the taste.","我得說不要香菜，因為我真的不喜歡那個味道。"]]},{"w":"allergy","p":"n.","z":"過敏","c":"烹調口味與特殊需求","ex":[["I have a serious shrimp allergy.","我對蝦子嚴重過敏。"],["Does anyone in your group have a food allergy?","你們這桌有人對食物過敏嗎？"]]},{"w":"allergic","p":"adj.","z":"過敏的","c":"烹調口味與特殊需求","ex":[["I'm allergic to peanuts, so please be careful.","我對花生過敏，所以請小心。"],["My daughter is allergic to eggs and milk.","我女兒對蛋和牛奶過敏。"]]},{"w":"peanut","p":"n.","z":"花生","c":"烹調口味與特殊需求","ex":[["Does this sauce contain peanut?","這個醬料含有花生嗎？"],["Our kitchen uses peanut oil for frying.","我們廚房用花生油來炸東西。"]]},{"w":"shellfish","p":"n.","z":"貝類、甲殼類海鮮","c":"烹調口味與特殊需求","ex":[["I can't eat shellfish because I'm allergic.","我不能吃甲殼類海鮮，因為我會過敏。"],["Is there any shellfish in the fried rice?","這份炒飯裡有任何甲殼類海鮮嗎？"]]},{"w":"gluten-free","p":"adj.","z":"無麩質的","c":"烹調口味與特殊需求","ex":[["Do you have any gluten-free noodles?","你們有無麩質麵條嗎？"],["We offer a gluten-free menu for customers with celiac disease.","我們為乳糜瀉的顧客提供無麩質菜單。"]]},{"w":"lactose intolerant","p":"adj.","z":"乳糖不耐的","c":"烹調口味與特殊需求","ex":[["I'm lactose intolerant, so I can't drink regular milk.","我有乳糖不耐症，所以不能喝一般牛奶。"],["Is there an option for people who are lactose intolerant?","有給乳糖不耐者的選擇嗎？"]]},{"w":"dairy-free","p":"adj.","z":"不含乳製品的","c":"烹調口味與特殊需求","ex":[["Is this dessert dairy-free?","這道甜點不含乳製品嗎？"],["We can make a dairy-free version with oat milk.","我們可以用燕麥奶做不含乳製品的版本。"]]},{"w":"vegetarian","p":"adj.","z":"素食的","c":"烹調口味與特殊需求","ex":[["Do you have any vegetarian dishes?","你們有素食料理嗎？"],["I'm vegetarian, but I eat eggs and dairy.","我吃素，但我吃蛋和乳製品。"]]},{"w":"vegan","p":"adj.","z":"純素的","c":"烹調口味與特殊需求","ex":[["Is this soup vegan, or does it contain milk?","這湯是純素的，還是含有牛奶？"],["We now offer a vegan burger made from beans.","我們現在有用豆類做的純素漢堡。"]]},{"w":"halal","p":"adj.","z":"清真的","c":"烹調口味與特殊需求","ex":[["Is your chicken halal?","你們的雞肉是清真的嗎？"],["We have halal options for Muslim customers.","我們為穆斯林顧客提供清真選項。"]]},{"w":"kosher","p":"adj.","z":"符合猶太教規的","c":"烹調口味與特殊需求","ex":[["Do you serve kosher meals?","你們有供應符合猶太教規的餐點嗎？"],["This restaurant isn't kosher, I'm afraid.","這間餐廳恐怕不是符合猶太教規的。"]]},{"w":"ingredient","p":"n.","z":"食材、成分","c":"烹調口味與特殊需求","ex":[["What are the main ingredients in this dish?","這道菜的主要食材是什麼？"],["Could you tell me every ingredient in the sauce?","可以告訴我醬汁裡所有的成分嗎？"]]},{"w":"cross-contamination","p":"n.","z":"交叉污染","c":"烹調口味與特殊需求","ex":[["We take care to avoid cross-contamination in the kitchen.","我們在廚房中會注意避免交叉污染。"],["Is there a risk of cross-contamination with nuts?","有沒有堅果交叉污染的風險？"]]},{"w":"nut-free","p":"adj.","z":"不含堅果的","c":"烹調口味與特殊需求","ex":[["The children's menu is completely nut-free.","兒童菜單完全不含堅果。"],["Can you make a nut-free dessert for my son?","你們能為我兒子做不含堅果的甜點嗎？"]]},{"w":"egg-free","p":"adj.","z":"不含蛋的","c":"烹調口味與特殊需求","ex":[["Is the mayonnaise egg-free?","這美乃滋不含蛋嗎？"],["We have an egg-free cake for guests with allergies.","我們有為過敏客人準備的無蛋蛋糕。"]]},{"w":"sodium","p":"n.","z":"鈉、鹽分","c":"烹調口味與特殊需求","ex":[["Do you have a low-sodium option for this dish?","這道菜有低鈉的選擇嗎？"],["The soup is high in sodium, so drink it slowly.","這湯含鈉量高，所以請慢慢喝。"]]},{"w":"low-carb","p":"adj.","z":"低碳水的","c":"烹調口味與特殊需求","ex":[["I'm on a low-carb diet, so no rice for me.","我在低碳飲食，所以我不要飯。"],["Do you have any low-carb dishes?","你們有任何低碳水的料理嗎？"]]},{"w":"low-fat","p":"adj.","z":"低脂的","c":"烹調口味與特殊需求","ex":[["Do you have low-fat milk for the latte?","拿鐵可以用低脂牛奶嗎？"],["I'll have the low-fat yogurt with fruit.","我要低脂優格配水果。"]]},{"w":"sugar-free","p":"adj.","z":"無糖的","c":"烹調口味與特殊需求","ex":[["Do you have a sugar-free dessert?","你們有無糖甜點嗎？"],["My dad is diabetic, so he needs sugar-free drinks.","我爸有糖尿病，所以他需要無糖飲料。"]]},{"w":"substitute","p":"v.","z":"替換、用...代替","c":"烹調口味與特殊需求","ex":[["Can I substitute fries with a side salad?","我可以把薯條換成沙拉嗎？"],["We can substitute tofu for the meat in this dish.","這道菜我們可以用豆腐代替肉。"]]},{"w":"swap","p":"v.","z":"交換、替換","c":"烹調口味與特殊需求","ex":[["Could I swap the rice for noodles?","我可以把飯換成麵嗎？"],["Sure, we can swap the soup for a salad.","當然，我們可以把湯換成沙拉。"]]},{"w":"extra","p":"adj.","z":"額外的、多加的","c":"烹調口味與特殊需求","ex":[["I'd like extra cheese on my pizza, please.","我的披薩想多加起司。"],["Is there an extra charge for more sauce?","多加醬料要額外收費嗎？"]]},{"w":"add","p":"v.","z":"加、添加","c":"烹調口味與特殊需求","ex":[["Could you add an egg to my noodles?","可以在我的麵裡加一顆蛋嗎？"],["Please add some chili oil to the dumplings.","請在水餃裡加一點辣油。"]]},{"w":"remove","p":"v.","z":"去掉、拿掉","c":"烹調口味與特殊需求","ex":[["Can you remove the tomatoes from my salad?","可以把我沙拉裡的番茄拿掉嗎？"],["The kitchen can remove the nuts from the dish.","廚房可以把這道菜裡的堅果去掉。"]]},{"w":"well-seasoned","p":"adj.","z":"調味得宜的","c":"烹調口味與特殊需求","ex":[["The fish is well-seasoned and not too salty.","這條魚調味得宜，不會太鹹。"],["Everything on this table is well-seasoned.","這桌的每道菜都調味得很好。"]]},{"w":"gamey","p":"adj.","z":"有野味腥羶味的","c":"烹調口味與特殊需求","ex":[["I don't like lamb because it tastes too gamey.","我不喜歡羊肉，因為太有羶味。"],["The duck is a little gamey, but I like it.","這隻鴨有點野味，但我喜歡。"]]},{"w":"fishy","p":"adj.","z":"腥的、有魚腥味的","c":"烹調口味與特殊需求","ex":[["The soup tastes a bit fishy to me.","這湯我喝起來有點腥。"],["Lemon juice helps remove the fishy smell.","檸檬汁有助於去除魚腥味。"]]},{"w":"smoky","p":"adj.","z":"煙燻味的","c":"烹調口味與特殊需求","ex":[["The sausage has a nice smoky taste.","這香腸有很棒的煙燻味。"],["I love the smoky aroma of grilled eggplant.","我愛烤茄子的煙燻香氣。"]]},{"w":"garlicky","p":"adj.","z":"蒜味重的","c":"烹調口味與特殊需求","ex":[["These garlicky green beans are very tasty.","這道蒜香四季豆非常好吃。"],["The sauce is a bit too garlicky for me.","這醬汁對我來說蒜味太重了。"]]},{"w":"numbing","p":"adj.","z":"麻的、令人發麻的","c":"烹調口味與特殊需求","ex":[["The Sichuan pepper gives the soup a numbing, spicy kick.","花椒讓這湯帶有麻辣的刺激感。"],["Do you like numbing and spicy hot pot?","你喜歡麻辣火鍋嗎？"]]},{"w":"refreshing","p":"adj.","z":"清爽的、提神的","c":"烹調口味與特殊需求","ex":[["The cold cucumber salad is light and refreshing.","涼拌小黃瓜清淡又爽口。"],["A glass of iced lemon tea is so refreshing in summer.","夏天來杯冰檸檬茶真是清爽。"]]},{"w":"hearty","p":"adj.","z":"豐盛的、份量足的","c":"烹調口味與特殊需求","ex":[["This hearty stew will keep you warm in winter.","這道豐盛的燉菜能讓你在冬天暖呼呼的。"],["We serve a hearty breakfast with eggs, bacon and toast.","我們供應有蛋、培根和吐司的豐盛早餐。"]]},{"w":"lukewarm","p":"adj.","z":"溫溫的、不夠熱的","c":"烹調口味與特殊需求","ex":[["The soup is only lukewarm, so could you heat it up?","這湯只是溫的，可以幫我加熱嗎？"],["My coffee arrived lukewarm.","我的咖啡送來時是溫的。"]]},{"w":"piping hot","p":"adj.","z":"熱騰騰的、燙口的","c":"烹調口味與特殊需求","ex":[["The pot is piping hot, so please be careful.","這鍋燙得很，請小心。"],["Your soup is coming out piping hot.","您的湯熱騰騰地來了。"]]},{"w":"gluten","p":"n.","z":"麩質","c":"烹調口味與特殊需求","ex":[["Does this bread contain gluten?","這麵包含有麩質嗎？"],["I avoid gluten because it makes me sick.","我避免麩質，因為它會讓我不舒服。"]]},{"w":"dairy","p":"n.","z":"乳製品","c":"烹調口味與特殊需求","ex":[["I can't have dairy, so no cheese, please.","我不能吃乳製品，所以請不要加起司。"],["Is there any dairy in this curry?","這咖哩裡有任何乳製品嗎？"]]},{"w":"sauce","p":"n.","z":"醬汁","c":"烹調口味與特殊需求","ex":[["Could I have some more sauce, please?","可以再給我一些醬汁嗎？"],["Is the sauce made with milk or cream?","這醬汁是用牛奶或鮮奶油做的嗎？"]]},{"w":"portion","p":"n.","z":"份量","c":"烹調口味與特殊需求","ex":[["The portion is too big for one person.","這份量對一個人來說太大了。"],["Could I order a smaller portion of the noodles?","我可以點小份量的麵嗎？"]]},{"w":"half portion","p":"n.","z":"半份","c":"烹調口味與特殊需求","ex":[["Do you offer a half portion for kids?","你們有提供兒童半份嗎？"],["I'll take a half portion of the fried rice.","我要半份炒飯。"]]},{"w":"preference","p":"n.","z":"偏好、喜好","c":"烹調口味與特殊需求","ex":[["Do you have any preference for the spice level?","您對辣度有什麼偏好嗎？"],["Please tell us your preference for how it's cooked.","請告訴我們您想要的烹調方式。"]]},{"w":"dietary restrictions","p":"phr.","z":"飲食禁忌、飲食限制","c":"烹調口味與特殊需求","ex":[["Do you have any dietary restrictions we should know about?","您有什麼我們需要知道的飲食禁忌嗎？"],["Our chef can adjust dishes for dietary restrictions.","我們的主廚可以依飲食限制調整菜色。"]]},{"w":"food allergy","p":"phr.","z":"食物過敏","c":"烹調口味與特殊需求","ex":[["My son has a severe food allergy.","我兒子有嚴重的食物過敏。"],["Please tell your server about any food allergy before ordering.","點餐前請告訴服務生任何食物過敏。"]]},{"w":"not too sweet","p":"phr.","z":"不要太甜","c":"烹調口味與特殊需求","ex":[["Please make the milk tea not too sweet.","請把奶茶做得不要太甜。"],["I like my desserts not too sweet.","我喜歡甜點不要太甜。"]]},{"w":"al dente","p":"adj.","z":"有嚼勁的（義大利麵煮法）","c":"烹調口味與特殊需求","ex":[["We cook our pasta al dente, which means slightly firm.","我們的義大利麵煮成彈牙口感，也就是稍微有點硬度。"],["Do you prefer your noodles al dente or soft?","您的麵要彈牙的還是軟一點的？"]]},{"w":"cooked through","p":"phr.","z":"完全煮熟","c":"烹調口味與特殊需求","ex":[["Please make sure the pork is cooked through.","請確保豬肉完全煮熟。"],["The chicken is cooked through and safe to eat.","這雞肉已完全煮熟，可安心食用。"]]},{"w":"charred","p":"adj.","z":"焦香的、烤焦的","c":"烹調口味與特殊需求","ex":[["I love the charred edges of grilled corn.","我愛烤玉米焦香的邊緣。"],["The steak is a bit charred on the outside.","這塊牛排外面有點焦。"]]},{"w":"seared","p":"adj.","z":"煎得表面焦香的","c":"烹調口味與特殊需求","ex":[["The seared tuna is rare in the middle.","這煎鮪魚中間是生的。"],["I'll have the seared scallops as a starter.","我要點香煎干貝當前菜。"]]},{"w":"customize","p":"v.","z":"客製化、依需求調整","c":"烹調口味與特殊需求","ex":[["You can customize your bowl with any toppings.","您可以選擇任何配料來客製化您的碗餐。"],["Can I customize the spice level of the soup?","我可以客製這湯的辣度嗎？"]]},{"w":"leave out","p":"phr.","z":"省略、不要放","c":"烹調口味與特殊需求","ex":[["Could you leave out the peanuts, please?","可以請你們不要放花生嗎？"],["Please leave out the cheese because I'm vegan.","請不要放起司，因為我吃純素。"]]},{"w":"well-done","p":"adj.","z":"煮得很熟的","c":"烹調口味與特殊需求","ex":[["Some people like well-done toast with dark edges.","有些人喜歡邊緣焦黑的烤得很透的吐司。"],["I prefer well-done fries, very crunchy and golden.","我喜歡炸得很透的薯條，又脆又金黃。"]]},{"w":"stewed","p":"adj.","z":"燉煮的","c":"烹調口味與特殊需求","ex":[["The stewed beef was soft and full of flavor.","燉牛肉軟嫩又入味。"],["I love stewed tomatoes with a bit of garlic.","我喜歡加一點蒜頭的燉番茄。"]]},{"w":"blanched","p":"adj.","z":"汆燙過的","c":"烹調口味與特殊需求","ex":[["The blanched spinach stays bright green.","汆燙過的菠菜仍保持翠綠。"],["Serve the blanched vegetables with a little sesame oil.","把汆燙過的蔬菜配上一點麻油上桌。"]]},{"w":"slow-cooked","p":"adj.","z":"慢燉的、慢煮的","c":"烹調口味與特殊需求","ex":[["The slow-cooked pork melts in your mouth.","慢燉的豬肉入口即化。"],["This slow-cooked soup takes six hours to make.","這道慢燉湯要花六個小時製作。"]]},{"w":"umami","p":"n.","z":"鮮味","c":"烹調口味與特殊需求","ex":[["Mushrooms and soy sauce add a deep umami taste.","香菇和醬油增添濃郁的鮮味。"],["The broth has a rich umami flavor.","這個湯頭有濃郁的鮮味。"]]},{"w":"zesty","p":"adj.","z":"風味強烈清爽的、帶勁的","c":"烹調口味與特殊需求","ex":[["The zesty lime dressing wakes up the salad.","清爽的檸檬醬汁讓沙拉更開胃。"],["I like a zesty sauce on my grilled fish.","我喜歡在烤魚上淋風味十足的醬汁。"]]},{"w":"mouthwatering","p":"adj.","z":"令人垂涎的","c":"烹調口味與特殊需求","ex":[["The mouthwatering smell came from the kitchen.","令人垂涎的香味從廚房飄來。"],["That mouthwatering steak on the table looks perfect.","那塊令人垂涎的牛排看起來完美極了。"]]},{"w":"sizzling","p":"adj.","z":"滋滋作響的","c":"烹調口味與特殊需求","ex":[["The waiter brought a sizzling iron plate of steak.","服務生端來一盤滋滋作響的鐵板牛排。"],["I heard the sizzling sound from the open kitchen.","我聽到開放式廚房傳來滋滋聲。"]]},{"w":"peppery","p":"adj.","z":"胡椒味重的、帶辣味的","c":"烹調口味與特殊需求","ex":[["The soup is a little too peppery for me.","這碗湯對我來說胡椒味有點重。"],["Arugula gives the salad a fresh, peppery taste.","芝麻葉讓沙拉有清新帶辛辣的口感。"]]},{"w":"buttery","p":"adj.","z":"奶油味濃的","c":"烹調口味與特殊需求","ex":[["The croissant was flaky and buttery.","這個可頌酥脆又有濃濃奶油香。"],["I prefer buttery mashed potatoes with my steak.","我喜歡牛排配奶油味濃的馬鈴薯泥。"]]},{"w":"garnish","p":"n.","z":"裝飾配菜、點綴","c":"烹調口味與特殊需求","ex":[["The dessert came with a mint leaf as garnish.","甜點附了一片薄荷葉作裝飾。"],["Please leave off the garnish because I do not like parsley.","請不要放裝飾配菜，因為我不喜歡巴西里。"]]},{"w":"allergen","p":"n.","z":"過敏原","c":"烹調口味與特殊需求","ex":[["All allergens are listed at the back of the menu.","所有過敏原都列在菜單背面。"],["Peanuts are a common allergen in many dishes.","花生是許多料理中常見的過敏原。"]]},{"w":"pescatarian","p":"n.","z":"吃魚素者","c":"烹調口味與特殊需求","ex":[["My sister is a pescatarian, so she eats fish.","我姊姊是吃魚素者，所以她吃魚。"],["Do you have any dishes for a pescatarian?","你們有適合吃魚素者的菜嗎？"]]},{"w":"lactose-free","p":"adj.","z":"不含乳糖的","c":"烹調口味與特殊需求","ex":[["Do you offer lactose-free milk for coffee?","你們有提供咖啡用的無乳糖牛奶嗎？"],["This lactose-free ice cream tastes just like the real one.","這款無乳糖冰淇淋吃起來跟一般的一樣。"]]},{"w":"bill","p":"n.","z":"帳單","c":"結帳與服務","ex":[["Could we have the bill, please?","可以給我們帳單嗎?"],["The bill came to two thousand dollars.","帳單總共兩千元。"]]},{"w":"check","p":"n.","z":"帳單(美式)","c":"結帳與服務","ex":[["Can I get the check, please?","可以幫我結帳嗎?"],["The waiter brought the check right away.","服務生馬上把帳單拿來了。"]]},{"w":"receipt","p":"n.","z":"收據、發票","c":"結帳與服務","ex":[["May I have a receipt, please?","可以給我收據嗎?"],["Please keep your receipt for the lucky draw.","請保留您的發票以便對獎。"]]},{"w":"tipping","p":"n.","z":"給小費(習慣)","c":"結帳與服務","ex":[["Tipping is not common in Taiwan.","在台灣給小費並不常見。"],["Tipping is expected in most American restaurants.","在多數美國餐廳給小費是慣例。"]]},{"w":"gratuity","p":"n.","z":"小費(正式用語)","c":"結帳與服務","ex":[["A gratuity of 18 percent is added for large parties.","人數多的團體會加收百分之十八的小費。"],["Is gratuity included in the total?","總額包含小費嗎?"]]},{"w":"separate checks","p":"phr.","z":"分開結帳","c":"結帳與服務","ex":[["Could we have separate checks, please?","可以分開結帳嗎?"],["The waiter asked if we wanted separate checks.","服務生問我們要不要分開結帳。"]]},{"w":"go Dutch","p":"phr.","z":"各付各的","c":"結帳與服務","ex":[["Let's go Dutch tonight.","今晚各付各的吧。"],["My friends and I always go Dutch.","我和朋友總是各付各的。"]]},{"w":"treat","p":"v.","z":"請客","c":"結帳與服務","ex":[["Let me treat you to dinner.","讓我請你吃晚餐。"],["My boss treated the whole team to hot pot.","老闆請全組吃火鍋。"]]},{"w":"my treat","p":"phr.","z":"我請客","c":"結帳與服務","ex":[["Put your wallet away, it's my treat.","把錢包收起來,我請客。"],["Dinner is my treat tonight.","今晚晚餐我請客。"]]},{"w":"on me","p":"phr.","z":"我請(客)","c":"結帳與服務","ex":[["The drinks are on me.","飲料我請。"],["Dinner is on me this time.","這次晚餐我請。"]]},{"w":"pay","p":"v.","z":"付款","c":"結帳與服務","ex":[["How would you like to pay?","您要如何付款?"],["I'll pay for the coffee.","咖啡我來付。"]]},{"w":"cash","p":"n.","z":"現金","c":"結帳與服務","ex":[["Do you accept cash only?","你們只收現金嗎?"],["I'll pay in cash.","我用現金付。"]]},{"w":"credit card","p":"n.","z":"信用卡","c":"結帳與服務","ex":[["Do you take credit cards here?","你們這裡可以刷信用卡嗎?"],["I'd like to pay by credit card.","我想用信用卡付款。"]]},{"w":"debit card","p":"n.","z":"金融卡、簽帳卡","c":"結帳與服務","ex":[["Can I use my debit card here?","這裡可以用我的金融卡嗎?"],["Sorry, our machine doesn't accept this debit card.","抱歉,我們的機器不接受這張金融卡。"]]},{"w":"mobile payment","p":"n.","z":"行動支付","c":"結帳與服務","ex":[["We accept mobile payment like Line Pay.","我們接受像 Line Pay 的行動支付。"],["Is mobile payment available here?","這裡可以用行動支付嗎?"]]},{"w":"card machine","p":"n.","z":"刷卡機","c":"結帳與服務","ex":[["The card machine is not working.","刷卡機壞了。"],["Please insert your card into the card machine.","請把卡片插入刷卡機。"]]},{"w":"swipe","p":"v.","z":"刷(卡)","c":"結帳與服務","ex":[["Please swipe your card here.","請在這裡刷卡。"],["Can I swipe my card at the table?","我可以在座位上刷卡嗎?"]]},{"w":"sign","p":"v.","z":"簽名","c":"結帳與服務","ex":[["Please sign here on the slip.","請在這裡簽名。"],["Do I need to sign the receipt?","我需要在收據上簽名嗎?"]]},{"w":"change","p":"n.","z":"零錢、找零","c":"結帳與服務","ex":[["Here is your change.","這是您的找零。"],["You gave me the wrong change.","你找錯錢給我了。"]]},{"w":"exact change","p":"n.","z":"剛好的零錢","c":"結帳與服務","ex":[["Do you have exact change?","你有剛好的零錢嗎?"],["Please prepare exact change for the delivery driver.","請為外送員準備剛好的零錢。"]]},{"w":"counter","p":"n.","z":"櫃檯","c":"結帳與服務","ex":[["You can pay at the counter.","您可以在櫃檯付款。"],["Please order at the counter.","請在櫃檯點餐。"]]},{"w":"total","p":"n.","z":"總額","c":"結帳與服務","ex":[["The total is 850 dollars.","總共是八百五十元。"],["What's the total with tax?","含稅總共多少?"]]},{"w":"tax","p":"n.","z":"稅金","c":"結帳與服務","ex":[["Is tax included in the price?","價格含稅嗎?"],["Tax is added at the register.","稅金在結帳時加上。"]]},{"w":"discount","p":"n.","z":"折扣","c":"結帳與服務","ex":[["Do you offer a student discount?","你們有學生折扣嗎?"],["We got a ten percent discount.","我們拿到九折。"]]},{"w":"coupon","p":"n.","z":"優待券","c":"結帳與服務","ex":[["I have a coupon for this meal.","我有這餐的優待券。"],["This coupon expires next week.","這張優待券下週到期。"]]},{"w":"voucher","p":"n.","z":"餐券、禮券","c":"結帳與服務","ex":[["Can I use this voucher today?","我今天可以用這張餐券嗎?"],["The voucher covers one main dish.","這張餐券可抵一份主餐。"]]},{"w":"overcharge","p":"v.","z":"多收錢","c":"結帳與服務","ex":[["I think you overcharged me.","我覺得你們多收我錢了。"],["They overcharged us for the drinks.","他們飲料多收我們錢了。"]]},{"w":"mistake","p":"n.","z":"錯誤、疏失","c":"結帳與服務","ex":[["There's a mistake on the bill.","帳單上有錯誤。"],["Sorry, that was our mistake.","抱歉,那是我們的疏失。"]]},{"w":"charge","p":"v.","z":"收費","c":"結帳與服務","ex":[["They charged us for the bread.","他們向我們收了麵包的錢。"],["Were we charged for the water?","我們的水有被收費嗎?"]]},{"w":"refund","p":"n.","z":"退款","c":"結帳與服務","ex":[["I'd like a refund, please.","我想要退款。"],["The manager gave us a full refund.","經理給了我們全額退款。"]]},{"w":"complaint","p":"n.","z":"抱怨、投訴","c":"結帳與服務","ex":[["I'd like to make a complaint.","我想投訴。"],["We received a complaint about the noise.","我們收到關於噪音的投訴。"]]},{"w":"complain","p":"v.","z":"抱怨","c":"結帳與服務","ex":[["I don't want to complain, but the soup is cold.","我不想抱怨,但湯是冷的。"],["Several guests complained about the wait.","幾位客人抱怨等太久。"]]},{"w":"apologize","p":"v.","z":"道歉","c":"結帳與服務","ex":[["We apologize for the delay.","我們為延誤道歉。"],["The waiter apologized for the mix-up.","服務生為弄錯而道歉。"]]},{"w":"sorry for the wait","p":"phr.","z":"抱歉讓您久等","c":"結帳與服務","ex":[["Sorry for the wait, your table is ready.","抱歉讓您久等了,您的位子好了。"],["Sorry for the wait, we are very busy tonight.","抱歉讓您久等,今晚很忙。"]]},{"w":"mix-up","p":"n.","z":"搞錯、混淆","c":"結帳與服務","ex":[["There was a mix-up with our order.","我們的餐點搞錯了。"],["Sorry about the mix-up.","抱歉搞錯了。"]]},{"w":"wrong order","p":"phr.","z":"送錯餐","c":"結帳與服務","ex":[["This is the wrong order.","這是送錯的餐。"],["We got the wrong order again.","我們又被送錯餐了。"]]},{"w":"cold","p":"adj.","z":"冷掉的、冰的","c":"結帳與服務","ex":[["My soup is cold.","我的湯冷了。"],["Could you heat this up? It's cold.","可以幫我加熱嗎?它冷了。"]]},{"w":"hair","p":"n.","z":"頭髮","c":"結帳與服務","ex":[["There's a hair in my soup.","我的湯裡有頭髮。"],["I found a hair in my salad yesterday.","我昨天在沙拉裡發現一根頭髮。"]]},{"w":"fly","p":"n.","z":"蒼蠅","c":"結帳與服務","ex":[["There's a fly in my drink.","我的飲料裡有蒼蠅。"],["A fly landed on our table.","一隻蒼蠅停在我們桌上。"]]},{"w":"too salty","p":"phr.","z":"太鹹","c":"結帳與服務","ex":[["This soup is too salty.","這湯太鹹了。"],["The fried rice is too salty for me.","這炒飯對我來說太鹹。"]]},{"w":"take back","p":"phr.v.","z":"拿回去、退回","c":"結帳與服務","ex":[["Could you take back this dish?","可以請你把這道菜拿回去嗎?"],["Please take back the steak and cook it longer.","請把牛排拿回去再煮久一點。"]]},{"w":"remake","p":"v.","z":"重做","c":"結帳與服務","ex":[["Could you remake this dish, please?","可以請你重做這道菜嗎?"],["The kitchen will remake it right away.","廚房會馬上重做。"]]},{"w":"replace","p":"v.","z":"更換","c":"結帳與服務","ex":[["Can you replace my fork? It's dirty.","可以幫我換叉子嗎?它很髒。"],["We will replace it with a fresh one.","我們會換一份新的。"]]},{"w":"on the house","p":"phr.","z":"店家招待","c":"結帳與服務","ex":[["The dessert is on the house.","甜點由本店招待。"],["They gave us a drink on the house.","他們招待我們一杯飲料。"]]},{"w":"compensate","p":"v.","z":"補償","c":"結帳與服務","ex":[["We'd like to compensate you with a free dessert.","我們想以免費甜點補償您。"],["How will you compensate us for the long wait?","你們要如何補償我們久等?"]]},{"w":"service","p":"n.","z":"服務","c":"結帳與服務","ex":[["The service here is excellent.","這裡的服務很好。"],["Service was slow tonight.","今晚服務很慢。"]]},{"w":"slow","p":"adj.","z":"慢的","c":"結帳與服務","ex":[["The service is very slow.","服務非常慢。"],["The kitchen is slow tonight.","今晚廚房出菜很慢。"]]},{"w":"rude","p":"adj.","z":"無禮的","c":"結帳與服務","ex":[["The waiter was rude to us.","服務生對我們很無禮。"],["I won't come back because the staff were rude.","因為員工很無禮,我不會再來。"]]},{"w":"attentive","p":"adj.","z":"周到的","c":"結帳與服務","ex":[["The staff were very attentive.","員工非常周到。"],["An attentive waiter refilled our water often.","周到的服務生常幫我們加水。"]]},{"w":"chopsticks","p":"n.","z":"筷子","c":"結帳與服務","ex":[["Could I have a pair of chopsticks?","可以給我一雙筷子嗎?"],["These chopsticks are too long.","這雙筷子太長了。"]]},{"w":"fork","p":"n.","z":"叉子","c":"結帳與服務","ex":[["May I have a clean fork?","可以給我乾淨的叉子嗎?"],["I dropped my fork.","我的叉子掉了。"]]},{"w":"knife","p":"n.","z":"刀子","c":"結帳與服務","ex":[["Could we have a steak knife?","可以給我們牛排刀嗎?"],["This knife is not sharp.","這把刀不利。"]]},{"w":"spoon","p":"n.","z":"湯匙","c":"結帳與服務","ex":[["I need a spoon for the soup.","我需要一支喝湯的湯匙。"],["Can I get a small spoon?","可以給我小湯匙嗎?"]]},{"w":"plate","p":"n.","z":"盤子","c":"結帳與服務","ex":[["Could we have extra plates for sharing?","可以多給我們幾個盤子分食嗎?"],["This plate is chipped.","這盤子缺角了。"]]},{"w":"bowl","p":"n.","z":"碗","c":"結帳與服務","ex":[["Could I have an empty bowl?","可以給我一個空碗嗎?"],["One more bowl of rice, please.","請再來一碗飯。"]]},{"w":"glass","p":"n.","z":"玻璃杯","c":"結帳與服務","ex":[["Can I have another glass of water?","可以再給我一杯水嗎?"],["This glass is not clean.","這個杯子不乾淨。"]]},{"w":"cup","p":"n.","z":"杯子","c":"結帳與服務","ex":[["A cup of tea, please.","請給我一杯茶。"],["Could I have a paper cup?","可以給我紙杯嗎?"]]},{"w":"toothpick","p":"n.","z":"牙籤","c":"結帳與服務","ex":[["Do you have toothpicks?","你們有牙籤嗎?"],["The toothpicks are next to the cashier.","牙籤在收銀台旁邊。"]]},{"w":"tray","p":"n.","z":"托盤","c":"結帳與服務","ex":[["Please return your tray after eating.","用餐後請歸還托盤。"],["The waiter carried a tray of drinks.","服務生端著一盤飲料。"]]},{"w":"tablecloth","p":"n.","z":"桌巾","c":"結帳與服務","ex":[["The tablecloth has a stain.","桌巾有污漬。"],["They changed the tablecloth for us.","他們幫我們換了桌巾。"]]},{"w":"wipe","p":"v.","z":"擦拭","c":"結帳與服務","ex":[["Could you wipe the table, please?","可以請你擦一下桌子嗎?"],["Please wipe the seat; it's wet.","請擦一下座位,它是濕的。"]]},{"w":"clear","p":"v.","z":"收拾(餐盤)","c":"結帳與服務","ex":[["Can you clear the table, please?","可以請你收一下桌子嗎?"],["The staff cleared our plates quickly.","員工很快收走了我們的盤子。"]]},{"w":"doggy bag","p":"n.","z":"打包袋(吃剩餐點)","c":"結帳與服務","ex":[["Could I have a doggy bag for this?","這個可以給我打包袋嗎?"],["We asked for a doggy bag for the leftovers.","我們為剩菜要了打包袋。"]]},{"w":"takeaway","p":"n.","z":"外帶(英式)","c":"結帳與服務","ex":[["We do takeaway as well.","我們也有外帶。"],["Is there a takeaway menu?","有外帶菜單嗎?"]]},{"w":"pack up","p":"phr.v.","z":"打包","c":"結帳與服務","ex":[["Could you pack up the leftovers?","可以幫我把剩菜打包嗎?"],["Please pack up the rest for me.","請幫我把剩下的打包。"]]},{"w":"container","p":"n.","z":"容器、餐盒","c":"結帳與服務","ex":[["Could I have a container for the soup?","湯可以給我容器嗎?"],["The container leaked in my bag.","容器在我包包裡漏了。"]]},{"w":"bag","p":"n.","z":"袋子","c":"結帳與服務","ex":[["Do you need a bag?","您需要袋子嗎?"],["Please put them in separate bags.","請分開裝在不同袋子。"]]},{"w":"deliver","p":"v.","z":"送達","c":"結帳與服務","ex":[["Can you deliver to my office?","你們可以送到我辦公室嗎?"],["They deliver until ten o'clock.","他們送到十點。"]]},{"w":"delivery fee","p":"n.","z":"外送費","c":"結帳與服務","ex":[["The delivery fee is sixty dollars.","外送費是六十元。"],["Is there a delivery fee?","要收外送費嗎?"]]},{"w":"minimum order","p":"n.","z":"最低訂購金額","c":"結帳與服務","ex":[["There is a minimum order of 300 dollars.","最低訂購金額是三百元。"],["Is there a minimum order for delivery?","外送有最低訂購金額嗎?"]]},{"w":"driver","p":"n.","z":"外送員、司機","c":"結帳與服務","ex":[["The driver is outside.","外送員在外面。"],["The driver called me when he arrived.","外送員到時打電話給我。"]]},{"w":"order online","p":"phr.","z":"線上訂餐","c":"結帳與服務","ex":[["You can order online on our website.","您可以在網站上線上訂餐。"],["It's easy to order online.","線上訂餐很簡單。"]]},{"w":"pick up","p":"phr.v.","z":"取餐、自取","c":"結帳與服務","ex":[["I'm here to pick up my order.","我來取餐。"],["You can pick up your food at the window.","您可以在窗口取餐。"]]},{"w":"pickup","p":"n.","z":"自取","c":"結帳與服務","ex":[["Is this order for pickup or delivery?","這筆訂單是自取還是外送?"],["Pickup is ready in fifteen minutes.","十五分鐘後可自取。"]]},{"w":"order number","p":"n.","z":"訂單號碼","c":"結帳與服務","ex":[["What's your order number?","您的訂單號碼是多少?"],["Please wait until we call your order number.","請等我們叫您的訂單號碼。"]]},{"w":"leftovers","p":"n.","z":"剩菜","c":"結帳與服務","ex":[["Can I take the leftovers home?","我可以把剩菜帶回家嗎?"],["We had leftovers for lunch.","我們午餐吃剩菜。"]]},{"w":"feedback","p":"n.","z":"意見回饋","c":"結帳與服務","ex":[["We'd love your feedback.","我們很期待您的意見回饋。"],["Please leave feedback on our app.","請在我們的應用程式留下意見。"]]},{"w":"review","p":"n.","z":"評價","c":"結帳與服務","ex":[["I'll write a good review online.","我會在網路上寫好評。"],["The restaurant has great reviews.","這間餐廳評價很好。"]]},{"w":"enjoy your meal","p":"phr.","z":"請慢用","c":"結帳與服務","ex":[["Enjoy your meal!","請慢用!"],["The waiter smiled and said enjoy your meal.","服務生微笑說請慢用。"]]},{"w":"is everything okay","p":"phr.","z":"一切都還好嗎","c":"結帳與服務","ex":[["Is everything okay with your meal?","您的餐點一切都好嗎?"],["Is everything okay here?","這裡一切還好嗎?"]]},{"w":"thank you for coming","p":"phr.","z":"謝謝光臨","c":"結帳與服務","ex":[["Thank you for coming, see you again!","謝謝光臨,歡迎再來!"],["Thank you for coming to our restaurant.","謝謝您來我們餐廳。"]]},{"w":"come again","p":"phr.","z":"歡迎再來","c":"結帳與服務","ex":[["Please come again soon.","歡迎很快再來。"],["We will definitely come again.","我們一定會再來。"]]},{"w":"invoice","p":"n.","z":"發票、請款單","c":"結帳與服務","ex":[["May I have an invoice with my company number?","可以幫我開有公司統編的發票嗎？"],["The waiter forgot to print the invoice.","服務生忘記列印發票了。"]]},{"w":"tab","p":"n.","z":"帳單、記帳","c":"結帳與服務","ex":[["Can you keep a tab open for our table?","你可以幫我們這桌先記帳嗎？"],["He closed his tab and left a good tip.","他結清了帳單並留下不少小費。"]]},{"w":"payment method","p":"n.","z":"付款方式","c":"結帳與服務","ex":[["Which payment method do you accept here?","你們這裡接受哪些付款方式？"],["Cash is the only payment method at this stall.","這個攤位只收現金。"]]},{"w":"service fee","p":"n.","z":"服務費","c":"結帳與服務","ex":[["A ten percent service fee is added to the bill.","帳單上會加收百分之十的服務費。"],["Is the service fee already included in the price?","服務費已經包含在價格裡了嗎？"]]},{"w":"split evenly","p":"phr.","z":"平均分攤","c":"結帳與服務","ex":[["Can we split evenly, four ways, please?","我們四個人平均分攤帳單吧。"],["Can the total be split evenly on three cards?","總額可以平均分到三張卡上嗎？"]]},{"w":"overpriced","p":"adj.","z":"價格過高的","c":"結帳與服務","ex":[["I thought the wine was overpriced for its quality.","我覺得這支酒以品質來說太貴了。"],["The dishes were small and overpriced.","這些菜份量小又價格過高。"]]},{"w":"waive","p":"v.","z":"免收、豁免","c":"結帳與服務","ex":[["The manager agreed to waive the service fee.","經理同意免收服務費。"],["They waived the corkage fee because it was my birthday.","因為是我的生日，他們免收了開瓶費。"]]},{"w":"complimentary","p":"adj.","z":"免費贈送的","c":"結帳與服務","ex":[["We got a complimentary dessert for our delay.","因為上菜延誤，我們獲贈一份免費甜點。"],["Complimentary bread is served before every meal.","每餐前都會免費送上麵包。"]]},{"w":"to-go box","p":"n.","z":"外帶盒","c":"結帳與服務","ex":[["Could I have a to-go box for the rest of my pasta?","可以給我一個外帶盒裝剩下的義大利麵嗎？"],["The waiter brought a to-go box and a bag.","服務生拿來了外帶盒和袋子。"]]},{"w":"reheat","p":"v.","z":"重新加熱","c":"結帳與服務","ex":[["Please reheat the soup because it is lukewarm.","這碗湯是溫的，請幫我重新加熱。"],["You can reheat the leftovers in the microwave.","你可以用微波爐重新加熱剩菜。"]]},{"w":"curbside pickup","p":"n.","z":"路邊取餐","c":"結帳與服務","ex":[["The cafe now offers curbside pickup for takeout orders.","這間咖啡館現在提供外帶訂單的路邊取餐。"],["I chose curbside pickup because the baby was asleep.","因為寶寶睡著了，我選擇路邊取餐。"]]}]},{"id":"interview","en":"Job Interview","zh":"英文面試單字","ds":"履歷、面試問答、薪資與軟實力字彙","cats":["履歷與資歷","面試問答","職位與工作內容","薪資與錄取","軟實力與態度"],"words":[{"w":"resume","p":"n.","z":"履歷、簡歷","c":"履歷與資歷","ex":[["I updated my resume last night before sending it to your HR department.","我昨晚在寄給貴公司人資部門之前更新了我的履歷。"],["Your resume shows that you have worked in marketing for five years.","你的履歷顯示你已有五年的行銷經驗。"]]},{"w":"curriculum vitae","p":"n.","z":"履歷表（CV）、學經歷","c":"履歷與資歷","ex":[["My curriculum vitae includes all of my publications and academic awards.","我的履歷表包含我所有的出版著作與學術獎項。"],["Please attach your curriculum vitae to the online application form.","請將你的履歷表附在線上申請表上。"]]},{"w":"cover letter","p":"n.","z":"求職信、自薦信","c":"履歷與資歷","ex":[["I explained why I want this role in my cover letter.","我在求職信中說明了我為何想要這份工作。"],["A strong cover letter should be short and specific to the company.","好的求職信應該簡短，並針對該公司量身撰寫。"]]},{"w":"work experience","p":"n.","z":"工作經驗","c":"履歷與資歷","ex":[["I have three years of work experience in customer service.","我有三年的客戶服務工作經驗。"],["Could you tell me about your most recent work experience?","可以請你談談最近的工作經驗嗎？"]]},{"w":"educational background","p":"n.","z":"學歷背景","c":"履歷與資歷","ex":[["My educational background is in business administration and statistics.","我的學歷背景是企業管理與統計。"],["Tell us a little about your educational background and why you chose it.","請簡單介紹你的學歷背景以及選擇它的原因。"]]},{"w":"bachelor's degree","p":"n.","z":"學士學位","c":"履歷與資歷","ex":[["I earned a bachelor's degree in economics from National Taiwan University.","我在國立臺灣大學取得經濟學學士學位。"],["This position requires a bachelor's degree or equivalent experience.","這個職位需要學士學位或同等經驗。"]]},{"w":"master's degree","p":"n.","z":"碩士學位","c":"履歷與資歷","ex":[["I am currently finishing my master's degree in information management.","我目前正在完成資訊管理碩士學位。"],["A master's degree is preferred but not required for this role.","這個職位偏好碩士學位，但並非必要條件。"]]},{"w":"graduate","p":"v.","z":"畢業","c":"履歷與資歷","ex":[["I graduated from university with honors in 2022.","我在2022年以優異成績從大學畢業。"],["When did you graduate, and what did you study?","你什麼時候畢業的，主修什麼？"]]},{"w":"major in","p":"phr.","z":"主修","c":"履歷與資歷","ex":[["What did you major in when you were at university?","你大學主修什麼？"],["I decided to major in computer science because I love solving problems.","我決定主修資訊工程，因為我喜歡解決問題。"]]},{"w":"qualification","p":"n.","z":"資格、資歷","c":"履歷與資歷","ex":[["I believe my qualifications match the requirements of this position.","我相信我的資歷符合這個職位的要求。"],["What qualifications do you have for this project manager role?","你具備哪些資格來擔任這個專案經理的職務？"]]},{"w":"certification","p":"n.","z":"證照、認證","c":"履歷與資歷","ex":[["I recently earned a project management certification from PMI.","我最近取得了PMI的專案管理認證。"],["Do you hold any certification related to data analysis?","你有任何與數據分析相關的證照嗎？"]]},{"w":"certificate","p":"n.","z":"證書、結業證明","c":"履歷與資歷","ex":[["I received a certificate after completing the six-month training program.","完成為期六個月的訓練課程後，我拿到了結業證書。"],["I can show you my English proficiency certificate if you like.","如果你想看，我可以出示我的英文能力證書。"]]},{"w":"credential","p":"n.","z":"資格證明、資歷","c":"履歷與資歷","ex":[["Her academic credentials are impressive, especially her work in finance.","她的學術資歷令人印象深刻，尤其是她在金融方面的工作。"],["We will verify all credentials before making a final offer.","在提出最終錄取條件前，我們會查驗所有資格證明。"]]},{"w":"diploma","p":"n.","z":"文憑、畢業證書","c":"履歷與資歷","ex":[["I have a high school diploma and a vocational training certificate.","我有高中文憑和一張職業訓練證書。"],["Please bring your original diploma on your first day of work.","請在上班第一天帶來你的畢業證書正本。"]]},{"w":"internship","p":"n.","z":"實習","c":"履歷與資歷","ex":[["I completed a three-month internship at a software company last summer.","我去年夏天在一家軟體公司完成了為期三個月的實習。"],["My internship taught me how to work with a real team.","我的實習讓我學會如何與真正的團隊合作。"]]},{"w":"intern","p":"n.","z":"實習生","c":"履歷與資歷","ex":[["As an intern, I helped prepare weekly sales reports for the manager.","身為實習生，我協助經理準備每週的銷售報告。"],["We hired two interns this year to support the design team.","我們今年聘請了兩位實習生來支援設計團隊。"]]},{"w":"part-time job","p":"n.","z":"兼職工作","c":"履歷與資歷","ex":[["I had a part-time job at a bookstore while I was studying.","我求學期間在一家書店兼職。"],["That part-time job taught me how to handle difficult customers.","那份兼職工作教會我如何應付難搞的客人。"]]},{"w":"full-time","p":"adj.","z":"全職的","c":"履歷與資歷","ex":[["I am looking for a full-time position with room for growth.","我正在尋找有成長空間的全職職位。"],["Were you working full-time or part-time at your previous company?","你在前一家公司是全職還是兼職？"]]},{"w":"freelance","p":"adj.","z":"自由接案的","c":"履歷與資歷","ex":[["I did freelance translation work for several years before applying here.","在應徵這裡之前，我做了好幾年自由接案的翻譯工作。"],["Your freelance experience shows that you can manage your own time well.","你的自由接案經驗顯示你能妥善管理自己的時間。"]]},{"w":"track record","p":"n.","z":"過往成績、實績","c":"履歷與資歷","ex":[["I have a strong track record of meeting sales targets.","我有達成銷售目標的優良實績。"],["We are looking for someone with a proven track record in logistics.","我們在找在物流方面有實證成績的人。"]]},{"w":"accomplishment","p":"n.","z":"成就、成績","c":"履歷與資歷","ex":[["What is your greatest accomplishment in your career so far?","到目前為止，你職涯中最大的成就是什麼？"],["Leading the product launch was my proudest accomplishment last year.","主導產品上市是我去年最自豪的成就。"]]},{"w":"achievement","p":"n.","z":"成就、成果","c":"履歷與資歷","ex":[["Winning the company's innovation award was a major achievement for me.","獲得公司創新獎對我而言是一項重大成就。"],["Please list your key achievements in each of your previous roles.","請列出你在每個前職中的主要成就。"]]},{"w":"responsibility","p":"n.","z":"職責、責任","c":"履歷與資歷","ex":[["My main responsibility was managing the company's social media accounts.","我的主要職責是管理公司的社群媒體帳號。"],["This role comes with a lot of responsibility, so are you ready for it?","這個職位責任重大，你準備好了嗎？"]]},{"w":"in charge of","p":"phr.","z":"負責、主管","c":"履歷與資歷","ex":[["I was in charge of a team of five engineers.","我曾負責帶領一個五人的工程師團隊。"],["Who was in charge of the project when you joined?","你加入時，專案是由誰負責的？"]]},{"w":"responsible for","p":"phr.","z":"負責（某事）","c":"履歷與資歷","ex":[["I was responsible for handling customer complaints and returns.","我負責處理客訴與退貨。"],["In my last job, I was responsible for a budget of two million.","在上一份工作中，我負責兩百萬的預算。"]]},{"w":"promotion","p":"n.","z":"升遷、晉升","c":"履歷與資歷","ex":[["I received a promotion after only eighteen months at the company.","我在公司僅十八個月就獲得了升遷。"],["What kind of promotion opportunities does this position offer?","這個職位提供什麼樣的升遷機會？"]]},{"w":"be promoted","p":"phr.","z":"被升職","c":"履歷與資歷","ex":[["I hope to be promoted to team leader after I exceed my targets.","我希望在超越目標後能被升為組長。"],["Employees who perform well can be promoted within two years of joining.","表現優異的員工在加入後兩年內就有機會被升職。"]]},{"w":"previous employer","p":"n.","z":"前雇主","c":"履歷與資歷","ex":[["My previous employer gave me a lot of freedom to try new ideas.","我的前雇主給了我很多嘗試新點子的自由。"],["May we contact your previous employer for a reference?","我們可以聯絡你的前雇主做背景查核嗎？"]]},{"w":"current position","p":"n.","z":"目前職位","c":"履歷與資歷","ex":[["In my current position, I manage relationships with our biggest clients.","在我目前的職位上，我負責管理與最大客戶的關係。"],["Why are you leaving your current position after only a year?","你為什麼才做一年就要離開目前的職位？"]]},{"w":"job title","p":"n.","z":"職稱","c":"履歷與資歷","ex":[["My job title was Assistant Marketing Manager at my last company.","我在上一家公司的職稱是行銷經理助理。"],["Did your job title change when you took on more duties?","當你承擔更多職務時，你的職稱有改變嗎？"]]},{"w":"job description","p":"n.","z":"職務說明","c":"履歷與資歷","ex":[["The job description says you will work closely with the sales team.","職務說明中提到你會與業務團隊密切合作。"],["I read the job description carefully and I think I am a good fit.","我仔細讀過職務說明，認為自己很適合。"]]},{"w":"tenure","p":"n.","z":"任期、任職期間","c":"履歷與資歷","ex":[["During my tenure at the bank, I trained over thirty new employees.","在我任職銀行期間，我訓練了超過三十位新進員工。"],["His long tenure at the firm gives him a deep knowledge of the industry.","他在公司的長期任職使他對產業有深入的了解。"]]},{"w":"employment history","p":"n.","z":"工作經歷","c":"履歷與資歷","ex":[["Your employment history shows that you change jobs quite often.","你的工作經歷顯示你相當常換工作。"],["Please walk me through your employment history from the beginning.","請從頭依序向我說明你的工作經歷。"]]},{"w":"gap in employment","p":"phr.","z":"工作空窗期","c":"履歷與資歷","ex":[["I can explain the gap in employment on my resume.","我可以說明我履歷上的工作空窗期。"],["There was a gap in employment because I went back to school.","因為我回學校進修，所以有一段工作空窗期。"]]},{"w":"career break","p":"n.","z":"職涯中斷、暫停工作","c":"履歷與資歷","ex":[["I took a career break to care for my family.","我為了照顧家人而暫停工作了一段時間。"],["After a two-year career break, I am excited to return to work.","在中斷職涯兩年後，我很期待重返職場。"]]},{"w":"relevant experience","p":"n.","z":"相關經驗","c":"履歷與資歷","ex":[["I have five years of relevant experience in international trade.","我有五年國際貿易的相關經驗。"],["Do you have any relevant experience that we should know about?","你有任何我們應該知道的相關經驗嗎？"]]},{"w":"hands-on experience","p":"n.","z":"實務經驗、實際操作經驗","c":"履歷與資歷","ex":[["I gained hands-on experience with data analysis tools during my internship.","我在實習期間獲得了使用數據分析工具的實務經驗。"],["We prefer candidates who have hands-on experience with this software.","我們偏好具有這套軟體實際操作經驗的應徵者。"]]},{"w":"transferable skills","p":"n.","z":"可轉移的技能","c":"履歷與資歷","ex":[["My teaching background gave me transferable skills like public speaking and planning.","我的教學背景讓我具備公開演說和規劃等可轉移的技能。"],["Changing careers is easier when you can show transferable skills.","當你能展現可轉移的技能時，轉換職涯會比較容易。"]]},{"w":"soft skills","p":"n.","z":"軟實力、軟技能","c":"履歷與資歷","ex":[["Good soft skills such as listening and empathy matter in this role.","傾聽與同理心等良好的軟實力在這個職位上很重要。"],["I have worked hard to improve my soft skills over the years.","這些年來我努力提升自己的軟實力。"]]},{"w":"hard skills","p":"n.","z":"硬實力、專業技能","c":"履歷與資歷","ex":[["Coding and statistics are the hard skills required for this job.","寫程式與統計是這份工作所需的專業技能。"],["Hard skills can be taught, but a positive attitude is harder to teach.","專業技能可以教，但積極的態度比較難教。"]]},{"w":"technical skills","p":"n.","z":"技術能力","c":"履歷與資歷","ex":[["My technical skills include Python, SQL, and basic cloud computing.","我的技術能力包括Python、SQL和基本的雲端運算。"],["Which technical skills would you say are your strongest?","你認為自己哪些技術能力最強？"]]},{"w":"proficiency","p":"n.","z":"熟練度、精通程度","c":"履歷與資歷","ex":[["Please rate your proficiency in Excel on a scale of one to ten.","請以一到十分評估你的Excel熟練度。"],["Proficiency in English is essential for communicating with our overseas clients.","英文流利對於與我們的海外客戶溝通是必要的。"]]},{"w":"proficient in","p":"phr.","z":"精通、熟練於","c":"履歷與資歷","ex":[["I am proficient in both Mandarin and English.","我精通中文和英文。"],["Are you proficient in any design software besides Photoshop?","除了Photoshop之外，你還熟練其他設計軟體嗎？"]]},{"w":"fluent in","p":"phr.","z":"（語言）流利","c":"履歷與資歷","ex":[["I am fluent in English and have basic Japanese skills.","我英文流利，也有基本的日文能力。"],["Being fluent in two languages helped me work with clients abroad.","能流利使用兩種語言幫助我與海外客戶合作。"]]},{"w":"familiar with","p":"phr.","z":"熟悉","c":"履歷與資歷","ex":[["I am familiar with the accounting software your company uses.","我熟悉貴公司使用的會計軟體。"],["How familiar are you with agile project management methods?","你對敏捷專案管理方法有多熟悉？"]]},{"w":"expertise","p":"n.","z":"專業知識、專長","c":"履歷與資歷","ex":[["My expertise lies in supply chain management and cost control.","我的專長在於供應鏈管理與成本控制。"],["We need someone with expertise in digital advertising for this campaign.","我們需要在數位廣告方面有專業知識的人來負責這次活動。"]]},{"w":"specialize in","p":"phr.","z":"專攻、專精於","c":"履歷與資歷","ex":[["I specialize in financial analysis for small and medium-sized businesses.","我專精於中小企業的財務分析。"],["Our team specializes in mobile app development for the retail industry.","我們的團隊專精於零售業的行動應用程式開發。"]]},{"w":"background","p":"n.","z":"背景、經歷","c":"履歷與資歷","ex":[["My background in education helps me explain complex ideas simply.","我的教育背景幫助我把複雜的概念簡單地說明。"],["Can you tell us about your professional background?","可以請你談談你的專業背景嗎？"]]},{"w":"strength","p":"n.","z":"優點、強項","c":"履歷與資歷","ex":[["One of my greatest strengths is staying calm under pressure.","我最大的強項之一是在壓力下保持冷靜。"],["What would you say is your biggest strength as a team member?","你認為身為團隊成員，你最大的優點是什麼？"]]},{"w":"weakness","p":"n.","z":"缺點、弱點","c":"履歷與資歷","ex":[["My weakness is that I sometimes spend too long on small details.","我的缺點是有時會在小細節上花太多時間。"],["How are you working to overcome that weakness?","你正如何努力克服這個缺點？"]]},{"w":"competency","p":"n.","z":"能力、職能","c":"履歷與資歷","ex":[["Problem solving is a core competency for this position.","解決問題是這個職位的核心能力。"],["We evaluate each candidate on several key competencies, including leadership.","我們針對幾項關鍵職能評估每位應徵者，包括領導力。"]]},{"w":"qualified","p":"adj.","z":"合格的、有資格的","c":"履歷與資歷","ex":[["I feel well qualified for this role because of my training.","由於我所受的訓練，我覺得自己很適合這個職務。"],["We received many applications, but only a few were qualified.","我們收到很多申請，但只有少數人符合資格。"]]},{"w":"overqualified","p":"adj.","z":"資歷過高的","c":"履歷與資歷","ex":[["Some employers worry that I may be overqualified for this position.","有些雇主擔心我對這個職位來說資歷過高。"],["I don't think I'm overqualified because this role offers new challenges.","我不認為自己資歷過高，因為這個職務帶來新的挑戰。"]]},{"w":"requirement","p":"n.","z":"要求、條件","c":"履歷與資歷","ex":[["I meet every requirement listed in the job posting.","我符合職缺公告中列出的每一項條件。"],["Fluent English is a basic requirement for this customer-facing role.","流利的英文是這個面對客戶的職務的基本條件。"]]},{"w":"reference","p":"n.","z":"推薦人、推薦函","c":"履歷與資歷","ex":[["I can provide two professional references upon request.","如有需要，我可以提供兩位專業推薦人。"],["Your former manager gave you an excellent reference.","你的前任主管給了你非常好的推薦。"]]},{"w":"letter of recommendation","p":"n.","z":"推薦信","c":"履歷與資歷","ex":[["My professor wrote a letter of recommendation for my application.","我的教授為我的申請寫了一封推薦信。"],["Do you have a letter of recommendation from your last supervisor?","你有上一任主管的推薦信嗎？"]]},{"w":"portfolio","p":"n.","z":"作品集","c":"履歷與資歷","ex":[["I brought my portfolio to show some of my recent design work.","我帶了作品集來展示一些我近期的設計作品。"],["Your portfolio shows a wide range of creative projects.","你的作品集展現了各式各樣的創意專案。"]]},{"w":"GPA","p":"n.","z":"學業平均成績","c":"履歷與資歷","ex":[["My GPA was 3.8 out of 4.0 in my final year.","我最後一年的學業平均成績是4.0滿分中的3.8。"],["We don't focus only on GPA, but also on practical experience.","我們不只看學業成績，也看重實務經驗。"]]},{"w":"honors","p":"n.","z":"榮譽、優異成績","c":"履歷與資歷","ex":[["I graduated with honors and was active in several student clubs.","我以優異成績畢業，並積極參與多個學生社團。"],["She received honors for her research on renewable energy.","她因再生能源研究而獲得榮譽。"]]},{"w":"scholarship","p":"n.","z":"獎學金","c":"履歷與資歷","ex":[["I won a scholarship to study abroad for one year.","我獲得獎學金出國留學一年。"],["The scholarship was awarded for my outstanding academic performance.","這份獎學金是因我傑出的學業表現而頒發的。"]]},{"w":"thesis","p":"n.","z":"論文","c":"履歷與資歷","ex":[["My master's thesis focused on consumer behavior in online shopping.","我的碩士論文聚焦於網路購物中的消費者行為。"],["I wrote my thesis under the guidance of a respected professor.","我在一位備受敬重的教授指導下撰寫論文。"]]},{"w":"coursework","p":"n.","z":"課程作業、修習課程","c":"履歷與資歷","ex":[["My coursework covered marketing, statistics, and international business.","我修習的課程涵蓋行銷、統計與國際商務。"],["Which coursework do you think best prepared you for this job?","你認為哪些課程最能讓你為這份工作做好準備？"]]},{"w":"training","p":"n.","z":"訓練、培訓","c":"履歷與資歷","ex":[["I completed a two-week training course on customer relationship management.","我完成了一個為期兩週的客戶關係管理訓練課程。"],["Does your company provide training for new employees?","貴公司會為新進員工提供訓練嗎？"]]},{"w":"workshop","p":"n.","z":"工作坊、研習會","c":"履歷與資歷","ex":[["I attended a workshop on effective presentation skills last month.","我上個月參加了一場有效簡報技巧的工作坊。"],["She led a workshop to teach colleagues how to use the new tool.","她主持了一場工作坊，教同事如何使用新工具。"]]},{"w":"seminar","p":"n.","z":"研討會","c":"履歷與資歷","ex":[["I spoke at a seminar about digital marketing trends in Asia.","我在一場關於亞洲數位行銷趨勢的研討會上發表演講。"],["Our company sponsors employees to attend industry seminars every year.","我們公司每年贊助員工參加產業研討會。"]]},{"w":"bilingual","p":"adj.","z":"雙語的","c":"履歷與資歷","ex":[["I am bilingual in Mandarin and English, which helps with overseas clients.","我能使用中英雙語，這對海外客戶很有幫助。"],["We are looking for a bilingual assistant to support our Asia team.","我們正在找一位雙語助理來支援亞洲團隊。"]]},{"w":"language proficiency","p":"n.","z":"語言能力","c":"履歷與資歷","ex":[["Our company requires proof of language proficiency such as a TOEIC score.","我們公司要求提供多益成績等語言能力證明。"],["Your language proficiency will be tested during the second interview.","你的語言能力會在第二次面試時接受測試。"]]},{"w":"leadership","p":"n.","z":"領導力、領導能力","c":"履歷與資歷","ex":[["I developed my leadership skills as president of the student council.","我擔任學生會會長時培養了領導能力。"],["Can you give an example of when you showed leadership?","你可以舉例說明你何時展現過領導力嗎？"]]},{"w":"teamwork","p":"n.","z":"團隊合作","c":"履歷與資歷","ex":[["Teamwork was the key to finishing the project ahead of schedule.","團隊合作是專案提前完成的關鍵。"],["This job requires strong teamwork and open communication.","這份工作需要良好的團隊合作與開放的溝通。"]]},{"w":"collaborate","p":"v.","z":"合作、協作","c":"履歷與資歷","ex":[["I often collaborate with designers and developers on new features.","我經常與設計師和開發人員合作開發新功能。"],["How do you collaborate with colleagues in other departments?","你如何與其他部門的同事合作？"]]},{"w":"communication skills","p":"n.","z":"溝通能力","c":"履歷與資歷","ex":[["Strong communication skills are essential for a customer service representative.","良好的溝通能力對客服人員而言至關重要。"],["I improved my communication skills by giving weekly team presentations.","我透過每週在團隊中做簡報來提升溝通能力。"]]},{"w":"problem-solving","p":"n.","z":"解決問題（的能力）","c":"履歷與資歷","ex":[["My problem-solving skills helped me fix a major delay in shipping.","我的解決問題能力幫助我處理了出貨的重大延遲。"],["Problem-solving is a daily part of this job.","解決問題是這份工作的日常。"]]},{"w":"analytical","p":"adj.","z":"分析的、善於分析的","c":"履歷與資歷","ex":[["I have a strong analytical mind and enjoy working with data.","我有很強的分析頭腦，也喜歡處理數據。"],["The role requires analytical thinking and attention to detail.","這個職位需要分析性思考與對細節的注意。"]]},{"w":"detail-oriented","p":"adj.","z":"注重細節的","c":"履歷與資歷","ex":[["I am detail-oriented, so I always double-check my reports.","我很注重細節，所以總是會再三檢查報告。"],["We need a detail-oriented person to review our financial statements.","我們需要一位注重細節的人來審閱財務報表。"]]},{"w":"self-motivated","p":"adj.","z":"自發性強的、積極主動的","c":"履歷與資歷","ex":[["I am a self-motivated person who does not need constant supervision.","我是個自發性強的人，不需要持續被監督。"],["The ideal candidate is self-motivated and eager to learn.","理想的人選要積極主動且渴望學習。"]]},{"w":"adaptable","p":"adj.","z":"適應力強的","c":"履歷與資歷","ex":[["I am adaptable and I can learn new systems quickly.","我適應力強，能很快學會新系統。"],["Being adaptable is important in a fast-changing startup environment.","在快速變化的新創環境中，適應力很重要。"]]},{"w":"time management","p":"n.","z":"時間管理","c":"履歷與資歷","ex":[["Good time management allowed me to study and work part-time.","良好的時間管理讓我能夠一邊求學一邊兼職。"],["How would you describe your time management skills?","你會如何形容自己的時間管理能力？"]]},{"w":"multitask","p":"v.","z":"同時處理多項工作","c":"履歷與資歷","ex":[["I can multitask well when several deadlines are close together.","當多個截止日期接近時，我能夠同時處理多項工作。"],["Do you find it easy to multitask in a busy office?","你覺得在忙碌的辦公室裡同時處理多項工作容易嗎？"]]},{"w":"deadline","p":"n.","z":"截止期限","c":"履歷與資歷","ex":[["I have never missed a deadline in my four years of work.","在四年的工作中，我從未錯過截止期限。"],["How do you handle pressure when a deadline is approaching?","當截止期限逼近時，你如何處理壓力？"]]},{"w":"deliver","p":"v.","z":"交付、達成（成果）","c":"履歷與資歷","ex":[["I always deliver high-quality work on time for my clients.","我總是準時交出高品質的工作成果。"],["My team delivered the project two weeks ahead of schedule.","我的團隊提前兩週完成了專案交付。"]]},{"w":"manage","p":"v.","z":"管理、負責","c":"履歷與資歷","ex":[["I managed a team of eight sales representatives in Taipei.","我曾在台北管理一個八人的業務團隊。"],["Did you manage any budgets in your previous role?","你在前一個職位中管理過任何預算嗎？"]]},{"w":"oversee","p":"v.","z":"監督、督導","c":"履歷與資歷","ex":[["I oversaw the entire production process from design to delivery.","我監督了從設計到出貨的整個生產流程。"],["In this role, you will oversee a team of ten staff members.","在這個職務中，你會督導十位員工的團隊。"]]},{"w":"supervise","p":"v.","z":"監督、管理（人員）","c":"履歷與資歷","ex":[["I supervised six interns during the summer program.","我在暑期計畫中帶領了六位實習生。"],["Have you ever supervised employees who were older than you?","你曾經管理過比你年長的員工嗎？"]]},{"w":"coordinate","p":"v.","z":"協調","c":"履歷與資歷","ex":[["I coordinated schedules between the design team and the clients.","我協調了設計團隊與客戶之間的時程。"],["She coordinates all of the company's training events.","她負責協調公司所有的培訓活動。"]]},{"w":"implement","p":"v.","z":"實施、執行","c":"履歷與資歷","ex":[["I implemented a new filing system that saved the team hours each week.","我實施了新的檔案系統，讓團隊每週節省了數小時。"],["We plan to implement your ideas if you join our team.","如果你加入我們的團隊，我們計畫實施你的想法。"]]},{"w":"launch","p":"v.","z":"推出、啟動","c":"履歷與資歷","ex":[["I helped launch a mobile app that gained fifty thousand users.","我協助推出了一款獲得五萬名用戶的行動應用程式。"],["Our team will launch three new products next year.","我們的團隊明年將推出三項新產品。"]]},{"w":"streamline","p":"v.","z":"精簡、使流程更順暢","c":"履歷與資歷","ex":[["I streamlined the ordering process and reduced errors by thirty percent.","我精簡了訂購流程，使錯誤減少了百分之三十。"],["We hope you can streamline our reporting procedures.","我們希望你能精簡我們的報告流程。"]]},{"w":"spearhead","p":"v.","z":"帶頭推動、領軍","c":"履歷與資歷","ex":[["I spearheaded a project to cut energy costs in our office.","我帶頭推動了一項降低辦公室能源成本的專案。"],["She spearheaded the company's expansion into Southeast Asian markets.","她帶領公司拓展東南亞市場。"]]},{"w":"contribute","p":"v.","z":"貢獻","c":"履歷與資歷","ex":[["I believe I can contribute a lot to your marketing team.","我相信我能為貴公司的行銷團隊貢獻良多。"],["How did you contribute to the success of your last project?","你如何對上一個專案的成功有所貢獻？"]]},{"w":"exceed","p":"v.","z":"超越、超出","c":"履歷與資歷","ex":[["I exceeded my sales target by twenty percent last quarter.","我上一季的銷售成績超越目標百分之二十。"],["Our goal is to exceed customer expectations every single time.","我們的目標是每一次都超越客戶的期待。"]]},{"w":"quantify","p":"v.","z":"量化","c":"履歷與資歷","ex":[["It is helpful to quantify your results with numbers on a resume.","在履歷上用數字量化你的成果是很有幫助的。"],["I tried to quantify my achievements so employers can see my impact.","我試著量化我的成就，讓雇主看到我的影響力。"]]},{"w":"metric","p":"n.","z":"指標","c":"履歷與資歷","ex":[["We use customer satisfaction as our main metric for success.","我們以客戶滿意度作為成功的主要指標。"],["Which metrics did you use to measure the success of your campaign?","你用哪些指標來衡量活動的成效？"]]},{"w":"KPI","p":"n.","z":"關鍵績效指標","c":"履歷與資歷","ex":[["My KPIs included monthly revenue and customer retention rate.","我的關鍵績效指標包括每月營收和客戶留存率。"],["How are KPIs set for this team and who reviews them?","這個團隊的關鍵績效指標是如何設定的，由誰來檢視？"]]},{"w":"resign","p":"v.","z":"辭職","c":"履歷與資歷","ex":[["I resigned from my previous job because I wanted more challenges.","我從前一份工作辭職，因為我想要更多挑戰。"],["He resigned last month after receiving a better offer.","他上個月在收到更好的工作機會後辭職了。"]]},{"w":"laid off","p":"phr.","z":"被裁員、被資遣","c":"履歷與資歷","ex":[["I was laid off when my company closed its Taiwan office.","我所屬的公司關閉台灣辦公室時，我被資遣了。"],["Many workers were laid off during the economic downturn.","許多員工在經濟衰退期間被裁員。"]]},{"w":"notice period","p":"n.","z":"離職預告期","c":"履歷與資歷","ex":[
