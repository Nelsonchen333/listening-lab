ast","預測"],["exceed","超過"],["renegotiate","重新協商"]],"g":[["We have spent about eighty-five percent of the allocated budget","現在完成式 have spent 表示到目前為止已花費的累積結果。"],["I should have raised it earlier.","should have + 過去分詞 表示對過去事情的後悔或自責。"],["Please send me a revised forecast by Friday so that I can take it to finance.","by + 時間 表示最晚期限；so that I can 表示目的。"]],"s":"Grace 與 Paul 檢討第三季預算，發現因外包顧問費用而超支，雙方討論延後訓練與重新議價以降低超支金額。","tr":["Paul，謝謝你參加預算檢討。我們來看看第三季的數字。","好的。我們已經花掉大約百分之八十五的分配預算，但專案只完成了百分之七十。","這表示我們超出預算了。額外的成本從哪裡來？","主要來自外包人員費用。我們多請了兩位顧問來解決資料品質問題。","這有事先核准嗎？","沒有正式核准，對此我很抱歉。我應該更早提出來。","我們把重點放在解決方案上。剩下的工作預估如何？","如果沒有任何改變，我們會超出預算大約四萬美元。","我們能否把訓練課程延到下一季，來減少這筆支出？","可以，這樣大約能省下一萬五千美元。我也會重新協商顧問的費率。","很好。請在週五前把修訂後的預測寄給我，以便我拿去給財務部門。"]},{"t":"Introducing a New Team Member","z":"介紹新成員","ty":"dialogue","lv":"B1","d":"Laura: Good morning, team. Before we start, I would like to introduce Kevin, who joined us this week.\nKevin: Hello, everyone. I am really happy to be here.\nLaura: Kevin will be working as a business analyst on the logistics project. He has five years of experience in supply chain planning.\nKevin: I previously worked at a shipping company, so I am familiar with warehouse systems.\nMark: Welcome, Kevin. I am Mark, the project manager. Please feel free to ask me anything.\nKevin: Thank you, Mark. Could you tell me who to contact for system access?\nMark: Of course. Talk to Emily in IT. I will send you her email address after the meeting.\nLaura: We have also arranged a buddy for you. Sophie will show you around and explain our usual processes.\nKevin: That is very kind. I would like to learn how the team works as quickly as possible.\nLaura: Great. Let's give Kevin a few days to settle in, and then we can discuss his first tasks.","v":[["introduce","介紹"],["business analyst","商業分析師"],["logistics","物流"],["supply chain","供應鏈"],["familiar with","熟悉"],["system access","系統權限"],["buddy","輔導夥伴"],["settle in","適應新環境"]],"g":[["I would like to introduce Kevin, who joined us this week.","who joined us this week 是非限定關係子句，補充說明 Kevin。"],["Could you tell me who to contact for system access?","who to contact 為疑問詞 + to 不定詞，表示「該聯絡誰」。"],["Let's give Kevin a few days to settle in","give + 人 + 事物 + to 不定詞，表示給某人時間去做某事。"]],"s":"Laura 在會議中向團隊介紹新成員 Kevin，並安排窗口與輔導夥伴，協助他盡快熟悉環境與流程。","tr":["大家早安。在開始之前，我想先介紹本週剛加入我們的 Kevin。","大家好，我真的很高興能來到這裡。","Kevin 將擔任物流專案的業務分析師。他在供應鏈規劃方面有五年的經驗。","我之前在一家航運公司工作，所以對倉儲系統很熟悉。","歡迎，Kevin。我是 Mark，專案經理。有任何問題都歡迎隨時問我。","謝謝你，Mark。請問系統權限的部分該找誰聯絡？","當然。你可以找資訊部門的 Emily。會議結束後，我會把她的電子郵件地址寄給你。","我們也為你安排了一位夥伴。Sophie 會帶你熟悉環境，並說明我們平常的工作流程。","你們真是太貼心了。我希望能盡快了解團隊的運作方式。","太好了。我們先讓 Kevin 花幾天時間適應環境，之後再來討論他的第一批工作任務。"]},{"t":"Remote Meeting Etiquette","z":"遠端會議禮儀","ty":"article","lv":"B1","d":"Remote meetings are now part of daily work, so good etiquette matters more than ever. A few simple habits can make online discussions faster and more respectful.\nFirst, be on time and be prepared. Join a minute or two early to check your microphone, camera, and internet connection. Keep your microphone muted when you are not speaking, because background noise can distract everyone. If you have a question, use the chat or the raise hand button instead of interrupting.\nSecond, show that you are engaged. Turn your camera on when possible, look at the screen, and avoid checking messages or answering emails. Small gestures such as nodding or giving a thumbs-up help speakers feel that someone is listening.\nThird, remember that people may be in different time zones or may have a weak connection. Share documents in advance, and speak clearly and at a steady pace. At the end of the meeting, summarise the key points and thank the participants. These small courtesies keep remote teams productive and friendly.","v":[["etiquette","禮儀"],["microphone","麥克風"],["muted","靜音"],["distract","使分心"],["raise hand button","舉手按鈕"],["engaged","專注投入"],["weak connection","連線不佳"],["courtesies","禮貌之舉"]],"g":[["Keep your microphone muted when you are not speaking, because background noise can distract everyone.","Keep + 受詞 + 過去分詞 表示保持某種狀態；because 說明原因。"],["avoid checking messages or answering emails","avoid 後面接動名詞（-ing），不能接 to 不定詞。"],["Share documents in advance, and speak clearly and at a steady pace.","兩個祈使句以 and 連接；in advance 表示「事先」。"]],"s":"遠端會議要準時、適時靜音、保持專注，並事先分享文件、說話清楚，最後總結重點並致謝，讓團隊溝通順暢友善。","tr":["遠距會議如今已成為日常工作的一部分，因此良好的會議禮儀比以往更加重要。一些簡單的習慣，就能讓線上討論更有效率，也更有禮貌。","首先，要準時並做好準備。請提早一兩分鐘進入會議，檢查麥克風、鏡頭和網路連線。不發言時請將麥克風靜音，因為背景噪音會干擾所有人。如果有問題，請使用聊天功能或舉手按鈕，而不要打斷別人。","第二，要表現出你的專注。盡可能開啟鏡頭、看著螢幕，並避免查看訊息或回覆電子郵件。點頭或比出讚等小動作，能讓發言者感受到有人在聆聽。","第三，請記得與會者可能身處不同時區，或網路連線不穩。請事先分享文件，並以清楚、穩定的速度說話。會議結束時，請總結重點並感謝與會者。這些小小的體貼，能讓遠距團隊保持高效率與友好的氣氛。"]},{"t":"Escalating an Issue to Management","z":"向上呈報問題","ty":"dialogue","lv":"B2","d":"Tom: Susan, do you have a minute? I need to raise a serious issue about the supplier delay.\nSusan: Of course. What has happened?\nTom: The supplier has told us that the main components will arrive three weeks late. This puts our launch date at risk.\nSusan: Have you tried talking to them about faster shipping?\nTom: Yes, twice. They said it is not possible because of a shortage of raw materials.\nSusan: Then this should be escalated. Who else needs to know?\nTom: I think the director of operations should be informed, since the delay could affect customer contracts.\nSusan: I agree. Please write a short summary covering the cause, the impact, and the options we have.\nTom: I have already drafted it. The options are to find a second supplier or to delay the launch.\nSusan: Good. Send it to me, and I will bring it to the management meeting tomorrow so that we can get a decision quickly.","v":[["raise a serious issue","提出嚴重問題"],["components","零件"],["at risk","處於風險中"],["shortage","短缺"],["raw materials","原料"],["escalate","向上呈報"],["director of operations","營運總監"],["options","選項"]],"g":[["This puts our launch date at risk.","put + 受詞 + at risk 表示「使…陷入風險」。"],["Then this should be escalated.","should be + 過去分詞 為被動語態，表示應該被處理，強調事情而非執行者。"],["I have already drafted it.","現在完成式搭配 already，表示動作已完成且與現在相關。"]],"s":"Tom 向 Susan 報告供應商延遲將危及上市日期，兩人決定整理原因、影響與選項，向管理層呈報以快速取得決策。","tr":["Susan，你有空嗎？我需要提出一個關於供應商延遲的嚴重問題。","當然。發生什麼事了？","供應商告訴我們，主要零組件會晚三週到貨。這讓我們的上市日期面臨風險。","你有試著和他們談談加快出貨的事嗎？","有，談了兩次。他們說因為原料短缺，所以沒辦法。","那這件事應該往上呈報。還有誰需要知道？","我認為應該通知營運總監，因為這次延遲可能會影響客戶合約。","我同意。請寫一份簡短的摘要，說明原因、影響，以及我們有哪些選項。","我已經擬好草稿了。選項是找第二家供應商，或是延後上市。","很好。把它寄給我，我明天會帶到管理會議上，這樣我們就能盡快得到決定。"]},{"t":"Milestone Completion Report","z":"里程碑完成報告","ty":"article","lv":"B2","d":"The milestone completion report is a short document that confirms a key stage of the project has been reached. It gives sponsors and stakeholders the confidence that the work is progressing as planned, or alerts them early when it is not.\nA strong report begins with a clear statement of the milestone and its status. For instance, the team may state that the prototype was delivered on the agreed date and passed all acceptance tests. It then compares actual results with the original plan, covering schedule, cost, and quality.\nThe report should also highlight lessons learned and any issues that remain open. Honest reporting is essential, since hiding problems usually makes them more costly later. Where possible, attach evidence, such as test results or signed approval forms.\nFinally, the report should look ahead. It should list the next milestone, its target date, and any decisions required from management. Keeping this section concise helps readers see immediately what they need to do.","v":[["milestone","里程碑"],["stakeholders","利害關係人"],["status","狀態"],["prototype","原型"],["acceptance tests","驗收測試"],["lessons learned","經驗教訓"],["signed approval forms","簽核核准表"],["concise","簡潔的"]],"g":[["It gives sponsors and stakeholders the confidence that the work is progressing as planned","that 子句為同位語，說明 confidence 的內容；progressing as planned 為現在進行式。"],["Honest reporting is essential, since hiding problems usually makes them more costly later.","since 在此表示「因為」；hiding problems 為動名詞作主詞；make + 受詞 + 形容詞。"],["Keeping this section concise helps readers see immediately what they need to do.","動名詞片語作主詞；what they need to do 為名詞子句作 see 的受詞。"]],"s":"里程碑完成報告需說明里程碑狀態、與計畫的差異、經驗教訓與待解問題，並列出下一個里程碑與需要的決策。","tr":["里程碑完成報告是一份簡短的文件，用來確認專案的某個關鍵階段已經達成。它能讓贊助者和利害關係人確信工作正按計畫進行，或在情況不如預期時及早提醒他們。","一份出色的報告會以清楚說明里程碑及其狀態作為開頭。例如，團隊可以說明原型已在約定日期交付，並通過了所有驗收測試。接著，報告會將實際成果與原始計畫進行比較，涵蓋時程、成本和品質。","報告也應該強調所學到的教訓，以及仍未解決的問題。誠實的報告至關重要，因為隱瞞問題通常會讓日後付出更高的代價。可能的話，請附上佐證資料，例如測試結果或已簽署的核准表單。","最後，報告應該展望未來。它應列出下一個里程碑、目標日期，以及需要管理階層做出的決策。讓這一部分保持簡潔，有助於讀者立刻看出自己需要做什麼。"]},{"t":"Cross-Department Coordination","z":"跨部門協調","ty":"dialogue","lv":"B1","d":"Rita: Hi David, I am calling because our team needs the sales figures for the quarterly report.\nDavid: Hi Rita. When do you need them?\nRita: By Thursday afternoon, if possible. The report goes to the board on Friday.\nDavid: That is a bit tight. Our system is being updated, so the numbers might be delayed.\nRita: I understand. Could you give us a preliminary version first, and then send the final data later?\nDavid: That should be possible. I will send the draft by Wednesday evening.\nRita: Perfect. Also, could someone from your team join our review meeting on Thursday morning?\nDavid: I can attend myself. What time does it start?\nRita: At ten o'clock. We will go through the charts together and make sure everything is consistent.\nDavid: Sounds good. I will put it in my calendar and confirm by email.\nRita: Thanks, David. This really helps us stay on schedule.","v":[["sales figures","銷售數字"],["quarterly report","季報"],["board","董事會"],["tight","緊迫的"],["preliminary version","初步版本"],["final data","最終資料"],["consistent","一致的"],["stay on schedule","維持進度"]],"g":[["Our system is being updated, so the numbers might be delayed.","is being updated 為現在進行式被動語態，表示正在進行的動作；might 表示可能性。"],["Could you give us a preliminary version first, and then send the final data later?","Could you...? 為禮貌請求；first 與 then 表示先後順序。"],["This really helps us stay on schedule.","help + 受詞 + 原形動詞，表示「幫助我們做…」。"]],"s":"Rita 與 David 協調兩個部門的資料交付，約定先提供初步版本、最終資料稍後補上，並安排共同審查會議。","tr":["嗨，David，我打電話來是因為我們團隊需要季度報告用的銷售數字。","嗨，Rita。你們什麼時候要？","可以的話，希望週四下午前拿到。報告週五就要送交董事會。","這時間有點緊。我們的系統正在更新，所以數字可能會延遲。","我了解。可以先給我們一份初步版本，之後再寄最終資料嗎？","應該可以。我會在週三晚上前把草稿寄給你。","太好了。另外，你們團隊可以派人參加我們週四早上的審查會議嗎？","我自己可以參加。幾點開始？","十點。我們會一起檢視圖表，確保所有內容一致。","聽起來不錯。我會記在行事曆上，並以電子郵件確認。","謝謝你，David。這真的幫助我們能夠如期完成。"]},{"t":"Customer Project Review Call","z":"客戶專案檢討電話","ty":"dialogue","lv":"B2","d":"Alice: Good afternoon, Chen. Thank you for making time for today's project review.\nChen: Thank you, Alice. I have to say I am concerned about the delay in the training module.\nAlice: I understand your concern. We found an error in the test data, which set us back by one week.\nChen: A week is significant. Our staff are expecting to start training on the first of next month.\nAlice: We are working to recover the time. We have added two developers, and the module should be ready by the twenty-eighth.\nChen: Can you guarantee that date?\nAlice: I cannot make a firm guarantee, but we are confident, and I will update you every two days until it is complete.\nChen: That would be helpful. What about the remaining budget?\nAlice: We are still within budget, and the extra developers are covered by our contingency fund.\nChen: All right. Please send me a written recovery plan by tomorrow, and we will talk again on Monday.","v":[["project review","專案檢討"],["concern","擔憂"],["set us back","使我們延誤"],["significant","重大的"],["recover the time","追回時間"],["guarantee","保證"],["contingency fund","應急基金"],["recovery plan","補救計畫"]],"g":[["We found an error in the test data, which set us back by one week.","which 引導非限定關係子句，指前面整件事；set back 為不規則動詞（過去式相同）。"],["I cannot make a firm guarantee, but we are confident","cannot 表示無法做到；but 轉折，表達謹慎但有信心。"],["I will update you every two days until it is complete.","will 表示承諾；until 引導時間子句，表示「直到…」。"]],"s":"Alice 向客戶 Chen 先生說明訓練模組因測試資料錯誤而延遲，並承諾補救措施、定期更新與提交書面補救計畫。","tr":["午安，Chen。謝謝你撥空參加今天的專案審查。","謝謝你，Alice。我必須說，我很擔心培訓模組的延遲。","我明白你的顧慮。我們在測試資料中發現了一個錯誤，讓進度落後了一週。","一週很可觀。我們的員工預計下個月一日開始培訓。","我們正努力把時間追回來。我們已經增加了兩名開發人員，模組應該能在二十八號前準備好。","你能保證這個日期嗎？","我無法給出確切的保證，但我們有信心，而且在完成之前，我會每兩天向你更新一次進度。","那樣會很有幫助。剩餘的預算呢？","我們仍在預算範圍內，額外的開發人員由我們的應變基金支應。","好的。請在明天前給我一份書面的復原計畫，我們週一再談。"]},{"t":"Post-Mortem After a Project","z":"專案結案檢討","ty":"article","lv":"B2","d":"A post-mortem is a structured meeting held after a project ends, whether it succeeded or failed. Its purpose is not to blame individuals but to understand what happened and to improve future work.\nThe best post-mortems begin with the facts. The team reviews the original goals, the timeline, and the final results, and compares them. \nNext, participants discuss what went well, what went wrong, and what surprised them. Using these three questions encourages balanced feedback. It is important to look for root causes instead of symptoms. For example, if a deadline was missed, the team should ask why estimates were unrealistic, not just who was late.\nThe meeting should end with a short list of concrete recommendations, each with an owner. Without follow-up, lessons are quickly forgotten. Many organisations store the findings in a shared knowledge base so that new teams can learn from earlier experience. Done well, a post-mortem turns every project, even a difficult one, into a valuable source of learning.","v":[["post-mortem","事後檢討"],["blame","指責"],["timeline","時間軸"],["follow-up","後續追蹤"],["root cause","根本原因"],["symptom","症狀／表象"],["recommendations","建議事項"],["knowledge base","知識庫"]],"g":[["Its purpose is not to blame individuals but to understand what happened","not A but B 表示「不是 A 而是 B」，A 與 B 結構平行（to 不定詞）。"],["if a deadline was missed, the team should ask why estimates were unrealistic","if 引導條件句；why 引導名詞子句，作 ask 的受詞，語序為肯定句。"],["Done well, a post-mortem turns every project, even a difficult one, into a valuable source of learning","Done well 為過去分詞片語，相當於 When it is done well，表示條件。"]],"s":"事後檢討會不是為了追究責任，而是回顧事實、找出根本原因，並提出有負責人的具體建議，讓未來專案受益。","tr":["事後檢討是在專案結束後舉行的結構化會議，無論專案成功或失敗。其目的不是要責怪個人，而是要了解發生了什麼事，並改善未來的工作。","最好的事後檢討會從事實開始。團隊會回顧原始目標、時程和最終結果，並加以比較。","接著，與會者會討論哪些地方做得好、哪些地方出了錯，以及哪些事讓他們感到意外。運用這三個問題，能促進平衡的回饋。重要的是要找出根本原因，而不是表面症狀。例如，如果錯過了截止日期，團隊應該探究為什麼預估不切實際，而不只是追究誰遲到了。","會議應以一份簡短的具體建議清單作結，每項建議都要有負責人。若沒有後續追蹤，經驗教訓很快就會被遺忘。許多組織會把檢討結果存放在共用的知識庫中，讓新團隊能從先前的經驗中學習。只要做得好，事後檢討能讓每個專案，即使是困難的專案，都成為寶貴的學習來源。"]},{"t":"Setting Priorities with Limited Resources","z":"資源有限時設定優先順序","ty":"article","lv":"B2","d":"When resources are limited, setting priorities is one of the most important tasks for a project manager. Teams rarely have enough time, money, or people to do everything at once, so choices must be made deliberately.\nA useful first step is to list all tasks and rate each one by its value to the business and the effort it requires. Tasks with high value and low effort should come first. Tasks with low value and high effort are strong candidates for delay or removal.\nOnce the priorities are agreed, communicate them clearly. Everyone should understand not only what is being done but also what is being postponed, and why. Otherwise, team members may waste energy on work that no longer matters.\nFinally, review the priorities regularly. Conditions change, and a decision that was right last month may not be right today. Being flexible while keeping the main goal in sight allows a team to achieve more with less.","v":[["resources are limited","資源有限"],["setting priorities","設定優先順序"],["deliberately","審慎地"],["value to the business","對業務的價值"],["effort","投入心力"],["candidates","候選項"],["postponed","被延後的"],["flexible","有彈性的"]],"g":[["Teams rarely have enough time, money, or people to do everything at once, so choices must be made deliberately.","rarely 為頻率副詞，帶否定意味；must be made 為被動語態，表示必須被做出。"],["Everyone should understand not only what is being done but also what is being postponed","not only ... but also ... 連接兩個平行的名詞子句；is being done 為現在進行式被動。"],["a decision that was right last month may not be right today","that was right last month 為關係子句修飾 decision；may not 表示可能不再成立。"]],"s":"資源有限時，應依價值與投入程度排序工作、清楚溝通被延後的項目，並定期檢視，隨情勢調整優先順序。","tr":["當資源有限時，設定優先順序是專案經理最重要的任務之一。團隊很少有足夠的時間、金錢或人力同時完成所有事情，因此必須審慎地做出取捨。","有用的第一步是列出所有任務，並依每項任務對業務的價值及所需投入的心力進行評分。高價值、低投入的任務應該優先處理。低價值、高投入的任務則很適合延後或刪除。","優先順序一經確定，就要清楚地傳達出去。每個人不僅要了解正在進行的工作，也要知道哪些工作被延後，以及原因。否則，團隊成員可能會把精力浪費在已不再重要的工作上。","最後，要定期檢視優先順序。情況會改變，上個月正確的決定，今天未必仍然正確。在保持彈性的同時不忘主要目標，能讓團隊以較少的資源達成更多的成果。"]},{"t":"Requesting Extra Resources","z":"申請額外資源","ty":"dialogue","lv":"B2","d":"Julia: Michael, thanks for seeing me. I would like to request additional resources for the migration project.\nMichael: Go ahead, Julia. What exactly do you need?\nJulia: We need two more engineers for three months. Otherwise, we will not meet the deadline in December.\nMichael: That is a big request. Can you justify it?\nJulia: Yes. The scope has grown by thirty percent since the start because the client added new requirements. I have prepared a comparison of the original and current workload.\nMichael: I see. What would happen if we did not add people?\nJulia: We would have to cut features or accept a delay of at least six weeks, and the client would probably complain.\nMichael: What about using contractors instead of permanent staff?\nJulia: That is a good alternative. It would cost slightly more per month, but we would avoid long-term commitments.\nMichael: All right. Send me the numbers and I will discuss the options with finance. I should be able to give you an answer by Friday.","v":[["additional resources","額外資源"],["justify","說明理由"],["scope","範圍"],["requirements","需求"],["workload","工作量"],["permanent staff","正職人員"],["alternative","替代方案"],["long-term commitments","長期承諾"]],"g":[["Otherwise, we will not meet the deadline in December.","Otherwise 表示「否則」，引出不採取行動的後果。"],["What would happen if we did not add people?","第二類條件句：if + 過去式，主要子句用 would，詢問假設情況。"],["I should be able to give you an answer by Friday.","should be able to 表示「應該能夠」，語氣比 will 更保守。"]],"s":"Julia 向主管 Michael 說明專案範圍擴大，請求增加人手；兩人討論約聘人員等替代方案，Michael 將與財務討論後回覆。","tr":["Michael，謝謝你撥時間見我。我想為遷移專案申請額外的資源。","請說，Julia。你具體需要什麼？","我們需要再增加兩名工程師，為期三個月。否則，我們無法趕上十二月的截止日期。","這是個很大的要求。你能說明理由嗎？","可以。自從專案開始以來，範圍已擴大了百分之三十，因為客戶新增了需求。我已準備好原始工作量與目前工作量的比較資料。","我明白了。如果我們不增加人手，會發生什麼事？","我們就得削減功能，或接受至少六週的延遲，而客戶很可能會抱怨。","那改用外部承包人員而不是正職員工呢？","那是個不錯的替代方案。每個月的成本會稍微高一些，但我們可以避免長期的承諾。","好的。把數字寄給我，我會和財務部門討論各個選項。我應該能在週五前給你答覆。"]},{"t":"Wrapping Up and Assigning Action Items","z":"會議結尾與分派待辦事項","ty":"dialogue","lv":"B1","d":"Peter: Let's wrap up. We covered a lot today, so I will quickly review the action items.\nOlivia: Good idea. I want to make sure I have everything correct.\nPeter: First, Olivia, you will update the project schedule and share it with the team by Wednesday.\nOlivia: Yes, that is fine. I will also add the new deadlines for the testing phase.\nPeter: Second, Raj will contact the vendor about the late delivery and report back on Thursday.\nOlivia: He mentioned that already, so he is aware of it.\nPeter: Third, I will prepare the budget summary and send it to finance. Does anyone have anything to add?\nOlivia: Could we also set a date for the next meeting?\nPeter: Good point. How about next Tuesday at ten o'clock?\nOlivia: That works for me.\nPeter: Great. I will send out the minutes this afternoon. Thank you all for your input today.","v":[["wrap up","結束／收尾"],["action items","待辦事項"],["phase","階段"],["report back","回報"],["aware of","察覺"],["budget summary","預算摘要"],["add","補充"],["input","意見／貢獻"]],"g":[["I will quickly review the action items.","will + 副詞 + 原形動詞，副詞置於助動詞與動詞之間；表示說話者的決定。"],["I want to make sure I have everything correct.","make sure + 子句 表示「確保…」；省略了連接詞 that。"],["How about next Tuesday at ten o'clock?","How about + 名詞 用來提出建議，常用於約定時間。"]],"s":"Peter 在會議結尾逐項重述待辦事項、負責人與期限，並約定下次會議時間，會後會寄出會議紀錄。","tr":["我們來做個總結。今天討論了很多事情，所以我會快速複習一下待辦事項。","好主意。我想確認我記得的都正確。","第一，Olivia，你要更新專案時程表，並在週三前與團隊分享。","好的，沒問題。我也會加入測試階段的新截止日期。","第二，Raj 會就延遲交貨的問題聯絡供應商，並在週四回報。","他已經提過了，所以他知道這件事。","第三，我會準備預算摘要並寄給財務部門。有人要補充嗎？","我們可以也訂一下下次會議的日期嗎？","好意見。下週二十點如何？","我可以。","太好了。我今天下午會寄出會議紀錄。感謝大家今天的意見。"]}],"more":""},{"id":"quality","en":"Quality & Customer Service","zh":"品質、訂單與客訴處理","ds":"客戶反映品質問題、退貨保固，以及訂單與客服溝通。","lessons":[{"t":"Handling a Quality Complaint","z":"處理客戶品質客訴","ty":"dialogue","lv":"B2","d":"Grace: Thank you for calling customer support. This is Grace speaking. How can I help you today?\nPaul: Hi Grace, this is Paul from Northwind Electronics. I'm calling about the last shipment we received. We found a serious problem with some of the units.\nGrace: I'm sorry to hear that, Paul. Could you tell me more about the problem, and give me your order number?\nPaul: The order number is seven seven three one nine. During our incoming inspection, we found that about three percent of the connectors have bent pins.\nGrace: Three percent is definitely above the acceptable level. I apologize for the trouble this has caused. How many units did you inspect?\nPaul: We inspected five hundred units, and fifteen of them failed. We haven't checked the rest of the shipment yet, so the actual number could be higher.\nGrace: I understand. First, I'd like to ask you to hold the affected lot, so it doesn't go into production. Could you send me photos of the defective parts and the packaging?\nPaul: Yes, I can do that today. The packaging looks fine on the outside, but we haven't opened every box.\nGrace: Thank you. That will help our quality team find the cause. We'll start an investigation right away, and I'll send you an initial report within forty-eight hours.\nPaul: That's good, but we also need a solution. Our line needs these parts next week, and I can't afford to stop production.\nGrace: Of course. Here's what I can offer. We can ship replacement units by express this afternoon from our local stock. They'll be fully inspected before they leave our warehouse.\nPaul: That would be a big help. What about the defective units?\nGrace: Once you confirm the quantity, I'll issue a return authorization number. You can send the bad units back at our expense, and we'll issue a credit for them.\nPaul: Okay. And will there be any compensation for the extra inspection work we've had to do?\nGrace: I can't make that decision on my own, but I'll raise it with my manager. I'll let you know our answer by tomorrow.\nPaul: Fair enough. I just want to make sure this doesn't happen again.\nGrace: Absolutely. Our report will include the root cause and the corrective actions we'll take, including extra checks on our packing line.\nPaul: Thank you, Grace. I appreciate the quick response.\nGrace: You're welcome, Paul. Thank you for your patience, and again, I apologize for the inconvenience. I'll follow up with you by email within the hour.","v":[["incoming inspection","進料檢驗"],["connector","連接器"],["bent pin","彎針"],["lot","批次"],["defective","有瑕疵的"],["investigation","調查"],["replacement","替換品"],["return authorization (RMA)","退貨授權"],["credit","貸項、折讓"],["compensation","賠償"],["root cause","根本原因"],["corrective action","矯正措施"],["at our expense","由我方負擔費用"]],"g":[["I'm sorry to hear that.","表達同理的固定說法，聽到壞消息時使用。"],["I can't afford to stop production.","can't afford to + 原形動詞：承擔不起……。"],["Once you confirm the quantity, I'll issue a return authorization number.","once：一旦……就……；後面用現在式表示未來。"],["I'd like to ask you to hold the affected lot, so it doesn't go into production.","ask someone to V；so 後接子句表示目的。"],["We haven't checked the rest of the shipment yet.","現在完成式 + yet：到目前為止還沒有。"]],"s":"客戶 Paul 在進料檢驗發現約 3% 連接器有彎針。客服 Grace 先致歉並要求保留該批貨、提供照片，承諾四十八小時內提交初步報告，今天先以快遞寄出替換品，並核發退貨授權；賠償問題需請示主管，最後承諾提供根本原因與矯正措施。","tr":["感謝您致電客服中心，我是 Grace。請問今天有什麼可以為您服務的嗎？","嗨，Grace，我是 Northwind Electronics 的 Paul。我來電是想談談我們最近收到的那批貨。我們發現其中一些產品有嚴重的問題。","很抱歉聽到這個消息，Paul。可以請您多說明一下問題，並告訴我您的訂單編號嗎？","訂單編號是 77319。在進料檢驗時，我們發現大約百分之三的連接器有彎針的情形。","百分之三肯定超出了可接受的水準。對於造成您的困擾，我深表歉意。請問您檢驗了多少個？","我們檢驗了五百個，其中十五個不合格。這批貨的其餘部分我們還沒檢查，所以實際數字可能更高。","我明白了。首先，想請您將受影響的批次隔離保留，避免投入生產。可以請您把瑕疵品和包裝的照片寄給我嗎？","可以，我今天就能辦到。包裝外觀看起來沒問題，但我們還沒有把每個箱子都打開。","謝謝您。這會幫助我們的品質團隊找出原因。我們會立即展開調查，並在四十八小時內提供初步報告給您。","這很好，但我們也需要解決方案。我們的產線下週就需要這些零件，我無法承擔停產的後果。","當然。我可以提供以下方案：今天下午我們就從本地庫存以快遞寄出替換品，出貨前都會經過全數檢驗。","那會幫上很大的忙。那有問題的產品要怎麼處理呢？","您確認數量之後，我會開立退貨授權編號。您可以由我們負擔費用將不良品寄回，我們也會為這些產品開立折讓。","好的。那針對我們額外投入的檢驗工作，會有任何補償嗎？","這件事我無法自行決定，但我會向我的主管提出。明天之前我會告訴您我們的答覆。","合理。我只是想確保這種事不會再發生。","當然。我們的報告會包含根本原因以及我們將採取的矯正措施，其中包括加強包裝產線的檢查。","謝謝你，Grace。感謝你這麼迅速的回應。","不客氣，Paul。感謝您的耐心，也再次為造成的不便致歉。我會在一小時內以電子郵件向您回報後續進度。"]},{"t":"Our Warranty and Return Policy","z":"保固與退貨政策說明","ty":"article","lv":"B1","d":"Welcome to today's training session on our warranty and return policy. As a customer-facing team member, you will often be asked about it, so it is important to explain it clearly and confidently.\nLet's start with the warranty. All of our products come with a standard warranty of twenty-four months from the date of shipment. During this period, if a product fails under normal use, we will repair or replace it free of charge. The warranty does not cover damage caused by misuse, unauthorized modification, or accidents.\nNext, the return process. If a customer wants to return a product, the first step is to contact us and request a return authorization number, which we call an RMA. Please remind customers that we cannot accept any return without this number, because it helps us track the case.\nAfter receiving the returned units, our quality team will test them and prepare a failure analysis report within ten working days. If the problem is confirmed to be our responsibility, we will provide a replacement or a credit note. If not, we will explain the result and offer a repair service for a fee.\nThere are also special cases. For example, if a customer receives the wrong item or finds shipping damage, they should report it within seven days of delivery and send photos. In these cases, we cover the freight cost for returning the goods.\nWhen you talk to a customer who is upset, remember three things. First, listen without interrupting. Second, apologize sincerely and show that you understand the impact on their business. Third, give a clear next step and a specific time when you will follow up.\nFinally, always record each case in our system. Good records help us identify patterns, improve our products, and prevent the same issue from happening again. Thank you, and let's move on to some practice scenarios.","v":[["warranty","保固"],["misuse","誤用"],["unauthorized modification","未經授權的改裝"],["free of charge","免費"],["RMA","退貨授權編號"],["failure analysis","失效分析"],["credit note","貸項通知單"],["customer-facing","直接面對客戶的"],["sincerely","誠懇地"],["pattern","規律、模式"],["prevent","預防"],["shipping damage","運送損壞"]],"g":[["If a product fails under normal use, we will repair or replace it.","第一類條件句，用來說明政策與規則。"],["...an RMA, which we call...","which 非限定關係子句，補充名詞的說明。"],["...within seven days of delivery...","within + 期間：在……期限內。"],["...prevent the same issue from happening again.","prevent + 受詞 + from + V-ing：防止……發生。"],["You will often be asked about it.","被動語態 will be asked：會被詢問。"]],"s":"這是給客服與業務人員的訓練講解：標準保固為出貨後 24 個月，誤用與擅改不在保固內；退貨需先申請 RMA，品質部門十個工作天內提出失效分析；收到錯貨或運損需七天內通報。也教導面對不滿客戶時要傾聽、誠懇道歉、提出明確下一步，並記錄案件。","tr":["歡迎參加今天關於我們保固與退貨政策的訓練課程。身為第一線面對客戶的團隊成員，你們經常會被問到這個主題，因此清楚且有自信地說明非常重要。","我們先從保固談起。我們所有產品都附有自出貨日起二十四個月的標準保固。在這段期間內，如果產品在正常使用下發生故障，我們會免費維修或更換。保固不涵蓋因誤用、未經授權的改裝或意外所造成的損壞。","接下來是退貨流程。如果客戶想要退貨，第一步是聯繫我們並申請退貨授權編號，也就是我們所稱的 RMA。請提醒客戶，沒有這個編號我們無法接受任何退貨，因為它有助於我們追蹤案件。","收到退回的產品後，我們的品質團隊會進行測試，並在十個工作天內準備好失效分析報告。如果確認問題是我們的責任，我們會提供替換品或貸項通知單。如果不是，我們會說明結果，並提供付費的維修服務。","另外還有一些特殊情況。例如，如果客戶收到錯誤的品項或發現運送過程中受損，應在送達後七天內回報並附上照片。在這些情況下，退貨的運費由我們負擔。","當你面對情緒不佳的客戶時，請記住三件事。第一，不打斷地傾聽。第二，誠懇道歉，並表現出你理解這對他們業務的影響。第三，提供明確的下一步，以及你將跟進的具體時間。","最後，請務必將每個案件記錄在我們的系統中。良好的紀錄能幫助我們找出規律、改善產品，並防止相同問題再次發生。謝謝大家，接下來我們進入一些情境演練。"]},{"t":"Explaining a Root Cause Analysis","z":"說明根本原因分析","ty":"dialogue","lv":"B2","d":"Anna: Thanks for joining, Mark. I will walk you through the root cause analysis for the cracked housings.\nMark: Great. What did you find?\nAnna: The cracks started at the weld seam. We used a five-why approach to trace the problem back to its source.\nMark: And what was the source?\nAnna: The injection pressure was set too high after a mold change. The operator had no checklist, so nobody caught it.\nMark: So it was a process gap, not operator error.\nAnna: Exactly. We also checked the material lot, and it was within specification.\nMark: How do you plan to prevent a recurrence?\nAnna: We added a setup checklist and a first-article inspection after every mold change. We will also retrain all shift leaders by Friday.\nMark: Good. Please send me the full report so I can share it with our customer.\nAnna: I will send it this afternoon, along with the containment data.","v":[["root cause analysis","根本原因分析"],["housing","外殼"],["weld seam","焊縫"],["trace the problem back","追溯"],["process gap","流程缺口"],["recurrence","再次發生"],["first-article inspection","首件檢驗"],["containment","遏制措施"]],"g":[["The operator had no checklist, so nobody caught it.","so 連接結果：因為操作員沒有檢查表，所以沒人發現。so 前後為因果關係。"],["We will also retrain all shift leaders by Friday.","will + 原形動詞表示計畫或承諾；by Friday 表示最晚期限。"],["Please send me the full report so I can share it with our customer.","so (that) I can 表示目的：為了能夠……。"]],"s":"安娜向馬克說明外殼裂紋的根本原因是換模後缺少檢查表造成的流程缺口，並提出預防與教育訓練措施。","tr":["謝謝你加入，Mark。我來為你說明外殼破裂的根本原因分析。","太好了。你們發現了什麼？","裂縫是從焊接縫開始的。我們用五個為什麼的方法，一路追溯到問題的源頭。","那源頭是什麼？","更換模具之後，射出壓力被設定得太高。操作員沒有檢查表可以參考，所以沒有人發現。","所以這是流程上的缺漏，而不是操作員的失誤。","沒錯。我們也檢查了材料批次，結果是符合規格的。","你們打算如何防止再次發生？","我們新增了設定檢查表，並在每次更換模具後進行首件檢驗。我們也會在週五前對所有班組長重新培訓。","很好。請把完整報告寄給我，我好轉交給我們的客戶。","我今天下午會寄出，連同遏止措施的數據一併附上。"]},{"t":"Corrective Action Report (8D)","z":"矯正措施報告 8D","ty":"article","lv":"B2","d":"An 8D report is a structured method for solving a quality problem and proving to the customer that it will not return. It follows eight disciplines, from forming a team to congratulating that team at the end.\nThe first steps focus on the customer. The team describes the problem in measurable terms, such as how many units failed and in which lot. Then it applies a containment action, for example sorting inventory or adding a temporary inspection, so that no more defective parts reach the customer.\nThe middle steps look for the cause. The team uses tools like the fishbone diagram and the five whys to find the root cause, and then verifies it with data. A permanent corrective action is chosen only after the cause has been confirmed.\nFinally, the team implements the fix, checks that the defect rate stays low, and updates procedures to prevent similar issues. A good report is short, factual and honest about what went wrong. Customers value clear evidence far more than long explanations.","v":[["8D report","8D 報告"],["discipline","步驟、準則"],["measurable","可衡量的"],["lot","批次"],["containment action","遏制措施"],["fishbone diagram","魚骨圖"],["corrective action","矯正措施"],["defect rate","不良率"]],"g":[["The team uses tools like the fishbone diagram and the five whys to find the root cause, and then verifies it with data.","to + 原形動詞表示目的（為了找出）；and then 連接先後動作。"],["A permanent corrective action is chosen only after the cause has been confirmed.","被動語態 is chosen；only after 後接現在完成式被動，強調時間順序。"],["Customers value clear evidence far more than long explanations.","far more than 為比較級加強語氣：遠比……更。"]],"s":"本文介紹 8D 報告的八個步驟，從描述問題、遏制、找出根本原因到實施矯正並防止再發生。","tr":["8D 報告是一種結構化的方法，用來解決品質問題，並向客戶證明問題不會再發生。它遵循八個步驟，從組成團隊開始，到最後表揚團隊為止。","最初的步驟以客戶為重心。團隊以可衡量的方式描述問題，例如有多少產品不合格、屬於哪一個批次。接著採取遏止措施，例如篩選庫存或增加臨時檢驗，以確保不會再有不良品送到客戶手上。","中間的步驟是尋找原因。團隊使用魚骨圖和五個為什麼等工具找出根本原因，然後以數據加以驗證。只有在原因確認之後，才會選定永久的矯正措施。","最後，團隊實施改善方案，確認不良率維持在低水準，並更新程序以防止類似問題。一份好的報告簡短、基於事實，並且誠實說明出了什麼問題。客戶重視的是明確的證據，遠勝於冗長的解釋。"]},{"t":"Receiving Inspection Results","z":"進料檢驗結果","ty":"article","lv":"B1","d":"Receiving inspection is the first line of defense in a quality system. When a shipment arrives, inspectors check the quantity, the labels and the condition of the packaging before anything goes into stock.\nNext, they pull a sample from each lot according to a sampling plan. They measure key dimensions, test function and compare the results with the drawing. If the number of defects stays below the acceptance limit, the lot is released to production.\nThis week, our incoming inspection reviewed twelve lots. Eleven passed without any issues. One lot of rubber seals failed because the hardness was out of tolerance. We have put that lot on hold and sent a nonconformance notice to the supplier.\nThe supplier now has five working days to reply with a root cause and a plan. Until then, we will use stock from the previous lot. If the problem repeats, we will increase the sample size for the next three shipments.","v":[["receiving inspection","進料檢驗"],["line of defense","防線"],["sampling plan","抽樣計畫"],["dimension","尺寸"],["acceptance limit","允收標準"],["out of tolerance","超出公差"],["on hold","暫扣"],["nonconformance notice","不合格通知"]],"g":[["If the number of defects stays below the acceptance limit, the lot is released to production.","第一類條件句：If + 現在式，主要子句用現在式，表示規則或標準流程。"],["One lot of rubber seals failed because the hardness was out of tolerance.","because 引導原因子句，說明為何批次不合格。"],["The supplier now has five working days to reply with a root cause and a plan.","days to reply：不定詞 to 修飾名詞，表示可用來回覆的時間。"]],"s":"本文說明進料檢驗流程與本週結果：十二批中十一批合格，一批橡膠密封件因硬度超差被暫扣並通知供應商。","tr":["進料檢驗是品質系統的第一道防線。貨物抵達時，檢驗人員會在任何東西入庫之前，先檢查數量、標籤和包裝的狀況。","接著，他們會依據抽樣計畫從每個批次抽取樣品。他們測量關鍵尺寸、測試功能，並將結果與圖面比對。如果缺陷數量維持在允收標準之下，該批次就會放行進入生產。","本週，我們的進料檢驗審查了十二個批次。其中十一批順利通過，沒有任何問題。有一批橡膠密封件因為硬度超出公差而不合格。我們已將該批次暫時扣留，並向供應商發出了不合格通知。","供應商現在有五個工作天的時間，回覆根本原因和改善計畫。在此之前，我們將使用上一批的庫存。如果問題再次發生，我們會在接下來的三次出貨中加大抽樣數量。"]},{"t":"Handling a Return Request (RMA)","z":"處理退貨申請 RMA","ty":"dialogue","lv":"B1","d":"Linda: Hello, this is Linda from customer service. How can I help you?\nCarlos: Hi Linda, I need to return a pallet of connectors. Some of them do not fit our assembly.\nLinda: I am sorry to hear that. Could you give me your order number?\nCarlos: Yes, it is 40582, shipped on October 28th.\nLinda: Thank you. I see it here. Are the parts unused and in the original packaging?\nCarlos: Most of them are. We opened two boxes to test them.\nLinda: That is fine. I will issue an RMA number now, which is R-7731. Please write it on the outside of the carton.\nCarlos: Will you send a prepaid label?\nLinda: Yes, since the mismatch was in our drawing, we will cover the freight. Once we receive the goods, we will issue a credit within five working days.\nCarlos: Perfect. Thanks for the quick help.\nLinda: You are welcome. You will get the label by email in a few minutes.","v":[["RMA (return merchandise authorization)","退貨授權"],["pallet","棧板"],["connector","連接器"],["assembly","組裝"],["original packaging","原包裝"],["prepaid label","預付運單"],["freight","運費"],["credit","貸項、退款額度"]],"g":[["Could you give me your order number?","Could you...? 是禮貌請求的句型，比 Can you 更客氣。"],["Once we receive the goods, we will issue a credit within five working days.","Once 引導時間子句，用現在式表示未來；主句用 will。"],["Please write it on the outside of the carton.","Please + 原形動詞構成禮貌的祈使句。"]],"s":"客服琳達協助卡洛斯處理連接器退貨，核發 RMA 編號、提供預付運單，並承諾收貨後五個工作天內退款。","tr":["您好，我是客服部的 Linda。請問有什麼可以幫您的嗎？","嗨，Linda，我需要退回一棧板的連接器。其中有些和我們的組裝不相符。","很遺憾聽到這個消息。可以請您提供訂單編號嗎？","好的，是 40582，十月二十八日出貨的。","謝謝。我在這裡查到了。這些零件未使用過，而且還在原包裝內嗎？","大部分是。我們打開了兩個箱子來測試。","沒問題。我現在就開立 RMA 編號，是 R-7731。請把它寫在紙箱的外面。","你們會寄預付運費的標籤嗎？","會的，因為這次不相符是我們圖面的問題，所以運費由我們負擔。收到貨品後，我們會在五個工作天內開立折讓。","太好了。謝謝你這麼快幫忙。","不客氣。幾分鐘後您會透過電子郵件收到標籤。"]},{"t":"Order Confirmation Call","z":"訂單確認電話","ty":"dialogue","lv":"B1","d":"Peter: Good morning, this is Peter from Delta Supply. I am calling to confirm your order.\nGrace: Hello, Peter. Thanks for calling.\nPeter: You ordered five hundred units of the steel bracket, model SB-20. Is that correct?\nGrace: Yes, that is right.\nPeter: The unit price is 3.40 dollars, and the total is 1,700 dollars before tax. Is that what you expected?\nGrace: Yes. And the delivery date is December 3rd?\nPeter: Correct. We will ship by sea on November 20th, and it should arrive on December 3rd.\nGrace: Good. Please use our Taipei warehouse as the delivery address.\nPeter: Noted. Payment terms are net 30 days from the invoice date.\nGrace: That works for us.\nPeter: Great. I will send the written confirmation by email today. Please reply to it so we can start production.\nGrace: Will do. Thank you, Peter.","v":[["confirmation","確認書"],["bracket","支架"],["unit price","單價"],["before tax","未稅"],["delivery date","交貨日"],["ship by sea","海運出貨"],["payment terms","付款條件"],["net 30 days","月結30天"]],"g":[["I am calling to confirm your order.","I am calling to + 原形動詞，用來說明來電目的。"],["We will ship by sea on November 20th, and it should arrive on December 3rd.","will 表示計畫，should 表示合理預期；兩者語氣不同。"],["Please reply to it so we can start production.","so we can 表示目的：以便我們可以開始生產。"]],"s":"彼得致電確認五百個鋼製支架的訂單，包括單價、總額、交期、地址與付款條件，並承諾寄出書面確認。","tr":["早安，我是 Delta Supply 的 Peter。我來電是想確認您的訂單。","你好，Peter。謝謝你來電。","您訂購了五百個鋼製支架，型號是 SB-20。對嗎？","對，沒錯。","單價是 3.40 美元，未稅總額是 1,700 美元。這是您預期的金額嗎？","是的。交貨日期是十二月三日嗎？","沒錯。我們會在十一月二十日以海運出貨，預計十二月三日抵達。","好的。請以我們台北的倉庫作為送貨地址。","了解。付款條件是發票日起算淨 30 天。","這樣我們可以接受。","太好了。我今天會以電子郵件寄出書面確認。請您回覆該郵件，我們才能開始生產。","好的。謝謝你，Peter。"]},{"t":"Changing or Canceling an Order","z":"更改或取消訂單","ty":"dialogue","lv":"B1","d":"Sophie: Hi Tom, it is Sophie from Brightline. I need to change our order from last week.\nTom: Sure. What would you like to change?\nSophie: We want to increase the quantity from 200 to 300 units, and move the delivery one week earlier.\nTom: Let me check the schedule. The extra 100 units are possible, but the earlier date may be a problem.\nSophie: How early could you deliver?\nTom: If we add overtime, we can ship three days earlier.\nSophie: That could work. Is there an extra charge?\nTom: There is a small rush fee of two percent. Otherwise, the price stays the same.\nSophie: Understood. Actually, can we cancel the blue version in the order?\nTom: Production for that color has not started, so yes, we can cancel it without a penalty.\nSophie: Great. Please send me a revised order confirmation.\nTom: I will do it right after this call.","v":[["change our order","更改訂單"],["quantity","數量"],["overtime","加班"],["rush fee","急件費"],["extra charge","額外費用"],["cancel","取消"],["penalty","違約金"],["revised","修訂後的"]],"g":[["If we add overtime, we can ship three days earlier.","第一類條件句：If + 現在式，主句用 can/will，表示可行的方案。"],["Production for that color has not started, so yes, we can cancel it without a penalty.","現在完成式否定 has not started 表示到目前為止尚未開始。"],["Please send me a revised order confirmation.","revised 為過去分詞作形容詞，修飾名詞。"]],"s":"蘇菲要求增加數量並提早交貨，湯姆同意以加班與兩成急件費配合，並免違約金取消藍色款，之後會寄出修訂確認書。","tr":["嗨，Tom，我是 Brightline 的 Sophie。我需要更改我們上週的訂單。","好的。您想更改什麼？","我們想把數量從 200 個增加到 300 個，並把交貨日期提前一週。","我來看一下排程。多出的 100 個是可以的，但提前交貨可能有困難。","你們最早能多早交貨？","如果加班的話，我們可以提早三天出貨。","那應該可行。需要額外收費嗎？","會有百分之二的小額急件費。除此之外，價格不變。","了解。其實，我們可以取消訂單裡的藍色款嗎？","那個顏色還沒開始生產，所以可以，我們能無罰款取消。","太好了。請寄一份修訂後的訂單確認給我。","這通電話結束後我馬上處理。"]},{"t":"Wrong Item Shipped","z":"出錯貨的處理","ty":"dialogue","lv":"B1","d":"Nina: Hello, this is Nina from customer care. I understand you received the wrong item.\nDavid: Yes. I ordered the model X200 printers, but the box contains X100 units.\nNina: I am very sorry about that. Could you send me a photo of the label and the packing slip?\nDavid: Sure. I will email them in a minute.\nNina: Thank you. While I check, are you able to keep the boxes unopened?\nDavid: Yes, we have not unpacked anything.\nNina: Good. I see the mistake now. Our warehouse picked the wrong item code. We will send the correct units today by express.\nDavid: And what about the wrong ones?\nNina: Our courier will collect them tomorrow at no cost to you. You do not need to do anything else.\nDavid: That is helpful. We have a customer event on Monday.\nNina: The new shipment will arrive on Friday. I will send you the tracking number shortly.","v":[["wrong item","錯誤的品項"],["label","標籤"],["packing slip","裝箱單"],["unopened","未拆封"],["item code","料號"],["by express","以快遞"],["courier","快遞員"],["tracking number","追蹤編號"]],"g":[["I understand you received the wrong item.","I understand (that) + 子句，用來表示理解並確認對方的情況。"],["we have not unpacked anything","現在完成式否定，表示到目前為止還沒做。"],["Our courier will collect them tomorrow at no cost to you.","at no cost to you 是固定說法：對你完全免費。"]],"s":"客戶收到錯誤型號的印表機，客服確認是倉庫揀貨錯誤，將快遞寄出正確商品並免費回收錯貨。","tr":["您好，我是客戶關懷部的 Nina。我了解您收到了錯誤的商品。","是的。我訂的是 X200 型號的印表機，但箱子裡是 X100。","對此我非常抱歉。可以請您把標籤和裝箱單的照片寄給我嗎？","當然。我一分鐘後就用電子郵件寄給你。","謝謝您。在我查核的同時，您可以先不要拆封這些箱子嗎？","可以，我們什麼都還沒拆。","好的。我現在看出錯誤了。是我們的倉庫挑錯了品項代碼。我們今天會以快遞寄出正確的產品。","那錯的那些怎麼辦？","我們的快遞明天會去收回，您不需要負擔任何費用，也不用再做其他事。","那幫助很大。我們星期一有一場客戶活動。","新的貨品星期五會送達。我稍後會把追蹤編號寄給您。"]},{"t":"Damaged Goods in Transit","z":"運送途中損壞","ty":"dialogue","lv":"B2","d":"Helen: Mr. Park, thank you for the photos. I can see the corner of the carton is crushed.\nPark: Yes, and two of the monitors inside have cracked screens.\nHelen: I am sorry. Did you note the damage on the delivery receipt when the driver arrived?\nPark: Yes, I wrote damaged on the receipt and signed it with the driver.\nHelen: That is very important, because it lets us file a claim with the carrier. We will replace the two monitors at once.\nPark: Do you need the damaged units back?\nHelen: Please keep them for the inspection. The carrier may send an agent to examine them within three days.\nPark: Understood. Will this delay the rest of my order?\nHelen: No. The remaining units are intact, so you can use them. I will also review our packaging with the logistics team to avoid damage in the future.\nPark: I appreciate that.\nHelen: Thank you for your patience. The replacements leave the warehouse today.","v":[["crushed","壓壞的"],["cracked screen","螢幕破裂"],["delivery receipt","簽收單"],["file a claim","提出理賠"],["carrier","運送業者"],["replacement","替換品"],["intact","完好的"],["logistics","物流"]],"g":[["Did you note the damage on the delivery receipt when the driver arrived?","過去式疑問句用 Did + 原形動詞；when 引導過去的時間點。"],["That is very important, because it lets us file a claim with the carrier.","let + 受詞 + 原形動詞：讓我們能夠提出理賠。"],["The carrier may send an agent to examine them within three days.","may 表示可能性；to examine 表示目的。"]],"s":"客戶收到運送中受損的螢幕，赫倫請他保留受損品供查驗並已在簽收單註記，公司將立即補寄並向運送業者索賠。","tr":["Park 先生，謝謝您提供照片。我看到紙箱的一角被壓壞了。","是的，而且裡面有兩台螢幕的螢幕破裂了。","很抱歉。司機到達時，您有在送貨簽收單上註記損壞嗎？","有，我在簽收單上寫了「受損」，並和司機一起簽名了。","這非常重要，因為這讓我們能向運送業者提出索賠。我們會立即替換那兩台螢幕。","需要把損壞的產品寄回給你們嗎？","請先保留，以供檢驗。運送業者可能會在三天內派人來檢查。","了解。這會延誤我其餘的訂單嗎？","不會。其餘的產品完好無損，您可以使用。我也會與物流團隊檢討我們的包裝，以避免日後再發生損壞。","我很感謝。","感謝您的耐心。替換品今天就會從倉庫出貨。"]},{"t":"Product Certification and Compliance","z":"產品認證與法規符合","ty":"article","lv":"B2","d":"Certification is how a manufacturer proves to the market that a product is safe and legal. Depending on the destination, a product may need a CE mark for Europe, UL listing for North America, or local approval in countries such as Japan or Taiwan.\nCompliance does not end with a certificate. Regulations such as RoHS and REACH limit hazardous substances, so suppliers must provide material declarations for every component. If one supplier changes a material without notice, the entire product can fall out of compliance.\nFor this reason, our company keeps a technical file for each product. It contains test reports, the bill of materials, and the declaration of conformity. We also schedule an annual review with an accredited laboratory to confirm that production still matches the approved design.\nCustomers often ask for these documents during tendering, and a quick, complete answer builds confidence. Companies that treat compliance as a routine part of quality, rather than a last-minute task, avoid delays at customs and protect their reputation.","v":[["certification","認證"],["CE mark","CE 標誌"],["compliance","法規符合"],["hazardous substance","有害物質"],["material declaration","材料聲明"],["technical file","技術文件"],["declaration of conformity","符合性聲明"],["accredited laboratory","認可實驗室"]],"g":[["If one supplier changes a material without notice, the entire product can fall out of compliance.","第一類條件句，說明可能的後果；fall out of 表示脫離。"],["We also schedule an annual review with an accredited laboratory to confirm that production still matches the approved design.","to confirm 為目的不定詞；approved 為過去分詞作形容詞。"],["Customers often ask for these documents during tendering, and a quick, complete answer builds confidence.","often 為頻率副詞置於動詞前；and 連接兩個獨立子句。"]],"s":"本文說明產品認證與法規符合的重點，包括 CE、RoHS、供應商材料聲明與技術文件，並強調將合規視為日常品質工作。","tr":["認證是製造商向市場證明產品安全且合法的方式。依目的地不同，產品可能需要歐洲的 CE 標誌、北美的 UL 認證，或日本、台灣等國家的當地核准。","合規並不會隨著取得證書而結束。RoHS 和 REACH 等法規限制有害物質，因此供應商必須為每個零組件提供材料聲明。如果某家供應商未經通知就更改材料，整個產品可能因此不再合規。","基於這個原因，我們公司為每項產品保存一份技術文件，內容包括測試報告、物料清單和符合性聲明。我們也每年與認可實驗室安排一次審查，以確認生產仍與核准的設計一致。","客戶在投標過程中經常要求提供這些文件，而迅速且完整的答覆能建立信心。把合規視為品質的例行工作、而非臨時抱佛腳的公司，能避免在海關受到延誤，並維護自身的聲譽。"]},{"t":"Customer Audit Visit","z":"客戶稽核訪廠","ty":"dialogue","lv":"B2","d":"Karen: Welcome to our plant, Mr. Weber. Shall we start with the document review?\nWeber: Yes, please. I would like to see your calibration records and the training files.\nKaren: Of course. Here are the calibration certificates for all gauges, and all of them are up to date.\nWeber: Good. I notice that one micrometer is due next week.\nKaren: It is already scheduled for Monday. We track every due date in the system.\nWeber: Then let us walk the production line. How do you control nonconforming material?\nKaren: We use red bins with a tag and a log. Only the quality team can release the parts.\nWeber: Excellent. Can I see traceability for this lot?\nKaren: Certainly. From the lot number we can trace the raw material, the machine and the operator.\nWeber: I will list any findings in my report, but so far I see no major issues.\nKaren: Thank you. We welcome your feedback and will respond to every finding within two weeks.","v":[["production line","生產線"],["calibration record","校正紀錄"],["gauge","量規"],["up to date","最新的"],["nonconforming material","不合格物料"],["traceability","可追溯性"],["finding","稽核發現"],["major issue","重大缺失"]],"g":[["Shall we start with the document review?","Shall we...? 用於提出建議，詢問對方是否同意。"],["It is already scheduled for Monday.","被動語態 is scheduled，表示已被排定；already 強調已完成安排。"],["will respond to every finding within two weeks","within + 期間，表示在該期限之內。"]],"s":"客戶韋伯到廠稽核，卡蘭展示校正紀錄、不合格品管制與可追溯性，稽核暫無重大缺失，公司承諾兩週內回覆所有發現。","tr":["歡迎來到我們的工廠，韋伯先生。我們先從文件審查開始好嗎？","好的，麻煩了。我想看一下你們的校驗紀錄和訓練檔案。","當然。這裡是所有量規的校驗證書，全部都是最新的。","很好。我注意到有一支分厘卡下週到期。","已經排定在星期一了。我們在系統中追蹤每一個到期日。","那我們就去生產線走一趟吧。你們如何管制不合格物料？","我們使用附有標籤和記錄表的紅色料箱。只有品質團隊可以放行這些零件。","太好了。我可以看這個批次的可追溯性嗎？","當然可以。從批號就能追溯到原物料、機台和操作人員。","我會在報告中列出任何發現事項，不過目前為止我沒看到重大問題。","謝謝您。我們歡迎您的意見回饋，並會在兩週內回應每一項發現事項。"]},{"t":"Warranty Claim Discussion","z":"保固理賠討論","ty":"dialogue","lv":"B2","d":"Julia: Thank you for filing the warranty claim, Mr. Evans. Can you describe the problem?\nEvans: The pump stopped working after only eight months. It started leaking from the main seal.\nJulia: I see. Our warranty covers defects in materials and workmanship for twelve months, so you are still covered.\nEvans: That is a relief. Do I need to send the pump back?\nJulia: Yes, we need to inspect it first. If the failure is caused by a defect, we will repair or replace it at no charge.\nEvans: What if you find that it was misused?\nJulia: In that case, the warranty would not apply, but we would give you a repair quote.\nEvans: Fair enough. How long does the process take?\nJulia: Typically ten working days after the unit arrives. We will lend you a spare pump in the meantime if you need one.\nEvans: That would be great. We cannot stop the line.\nJulia: I will arrange the loan today.","v":[["warranty claim","保固理賠"],["leak","漏"],["seal","密封圈"],["workmanship","工藝"],["covered","在保固範圍內"],["misuse","誤用"],["repair quote","維修報價"],["spare","備用的"]],"g":[["If the failure is caused by a defect, we will repair or replace it at no charge.","第一類條件句；is caused 為被動語態。"],["In that case, the warranty would not apply, but we would give you a repair quote.","would 表示假設情況下的結果，語氣較委婉。"],["The pump stopped working after only eight months.","過去式 stopped；after only + 期間強調時間很短。"]],"s":"客戶的泵浦在八個月後漏水，茱莉亞說明十二個月保固範圍與檢驗流程，並提供備用泵浦以免停線。","tr":["謝謝您提出保固索賠，伊文斯先生。可以請您描述一下問題嗎？","這台幫浦才用了八個月就停止運作了。主密封處開始漏水。","了解。我們的保固涵蓋十二個月內的材料與製造瑕疵，所以您仍在保固範圍內。","那就放心了。我需要把幫浦寄回去嗎？","是的，我們需要先檢測。如果故障是由瑕疵造成的，我們會免費維修或更換。","如果你們發現是使用不當呢？","那樣的話，保固就不適用，不過我們會提供您維修報價。","合理。整個流程需要多久？","通常是在設備送達後十個工作天。如果您需要，這段期間我們會借您一台備用幫浦。","那太好了。我們的生產線不能停。","我今天就安排借用。"]},{"t":"Invoice and Payment Inquiry","z":"發票與付款查詢","ty":"dialogue","lv":"B1","d":"Ryan: Hello, accounts receivable. Ryan speaking.\nMia: Hi Ryan, this is Mia from Orion Tech. I have a question about invoice 9021.\nRyan: Sure, let me pull it up. The invoice is for 8,200 dollars, issued on October 5th.\nMia: Yes. Our system shows a different amount. We were quoted 7,800 dollars.\nRyan: Let me check. I see, the invoice includes a freight charge of 400 dollars.\nMia: But the quote said freight was included.\nRyan: You are right. I will ask the sales team to confirm, and if it was our mistake, I will issue a credit note.\nMia: Thank you. Also, I would like to confirm that we paid invoice 8977 last week.\nRyan: Yes, we received the payment on Tuesday. Everything is up to date on that one.\nMia: Great. Should I hold payment on 9021?\nRyan: Please hold it until you receive the corrected invoice. I will email you by tomorrow.","v":[["accounts receivable","應收帳款"],["invoice","發票、請款單"],["quote","報價"],["freight charge","運費"],["included","已包含"],["credit note","貸項通知單"],["payment","付款"],["hold payment","暫緩付款"]],"g":[["We were quoted 7,800 dollars.","被動語態：We were quoted 表示我們被報價為……。"],["if it was our mistake, I will issue a credit note","if 條件句；這裡 was 表示確認過去事實後的處理。"],["Please hold it until you receive the corrected invoice.","until 引導時間子句，用現在式表示未來。"]],"s":"客戶詢問發票金額與報價不符，瑞恩發現多收運費，將向業務確認並開立貸項通知單，並請對方暫緩付款。","tr":["您好，這裡是應收帳款部門，我是萊恩。","嗨，萊恩，我是 Orion Tech 的米雅。我有一個關於發票 9021 的問題。","好的，讓我調出來看看。這張發票金額是 8,200 美元，開立日期是 10 月 5 日。","對。我們的系統顯示的金額不一樣。我們當初拿到的報價是 7,800 美元。","我來確認一下。我看到了，發票中包含了 400 美元的運費。","但是報價單上說運費已經包含在內。","您說得對。我會請業務團隊確認，如果是我們的錯，我會開立貸項通知單。","謝謝。另外，我想確認我們上週已經付清發票 8977。","是的，我們星期二收到款項了。那一筆一切都已處理完畢。","太好了。那發票 9021 我們要先暫緩付款嗎？","請先暫緩，等收到更正後的發票再付。我明天之前會用電子郵件寄給您。"]},{"t":"Technical Support for a Product Issue","z":"產品問題技術支援","ty":"dialogue","lv":"B2","d":"Alex: Technical support, Alex speaking. How can I help?\nBen: Hi Alex. Our new controller keeps restarting every few minutes.\nAlex: Thanks for letting us know. What is the firmware version?\nBen: It shows 2.1.4.\nAlex: That version has a known issue with the power management setting. Let me walk you through a quick fix.\nAlex: Please open the settings menu and turn off sleep mode. Then restart the device.\nBen: Done. It is starting up now.\nAlex: Let it run for ten minutes and tell me if the problem comes back.\nBen: It seems stable so far.\nAlex: Good. I also recommend updating to firmware 2.2.0, which resolves the bug permanently. I will email you the download link and the instructions.\nBen: Thank you, that saves us a lot of time.\nAlex: If it happens again, call me directly, and I will escalate it to engineering.","v":[["technical support","技術支援"],["controller","控制器"],["firmware","韌體"],["known issue","已知問題"],["walk you through","逐步帶領"],["sleep mode","睡眠模式"],["stable","穩定的"],["escalate","升級處理"]],"g":[["Our new controller keeps restarting every few minutes.","keep + V-ing 表示一再發生或持續。"],["Let me walk you through a quick fix.","Let me + 原形動詞，表示我來做某事。"],["I also recommend updating to firmware 2.2.0, which resolves the bug permanently.","recommend + V-ing；which 引導非限定關係子句補充說明。"]],"s":"客戶的控制器一直重開機，技術支援關閉睡眠模式暫時解決，並建議更新韌體到 2.2.0 以根本修復。","tr":["技術支援部，我是艾力克斯。請問有什麼可以協助您的？","嗨，艾力克斯。我們的新控制器每隔幾分鐘就會重新啟動。","謝謝您告知。韌體版本是多少？","顯示是 2.1.4。","那個版本在電源管理設定上有已知的問題。我來帶您做一個快速的修正。","請打開設定選單，把睡眠模式關閉，然後重新啟動裝置。","好了。現在正在啟動。","請讓它運轉十分鐘，如果問題再次發生請告訴我。","到目前為止看起來很穩定。","很好。我也建議您更新到韌體 2.2.0，它能徹底解決這個錯誤。我會用電子郵件把下載連結和說明寄給您。","謝謝，這幫我們省了很多時間。","如果再發生，請直接打電話給我，我會將問題轉交給工程部門。"]},{"t":"Apologizing to an Upset Customer","z":"向不滿客戶致歉","ty":"dialogue","lv":"B2","d":"Emma: Mr. Lopez, I want to apologize personally for the delay in your shipment.\nLopez: This is the third time this year. My customers are losing patience.\nEmma: You are right to be frustrated, and I take full responsibility. A supplier problem held up the materials, and we should have warned you earlier.\nLopez: Why did nobody call me?\nEmma: That was our failure. From now on, I will update you every day until the order ships.\nLopez: I need more than updates. I need a date.\nEmma: I understand. I have moved your order to the front of the queue, and we can ship on Thursday.\nLopez: Can you also cover the air freight?\nEmma: Yes, we will pay for it, and I will also offer a five percent discount on this order.\nLopez: That is reasonable. I hope this will not happen again.\nEmma: I promise we will fix the root cause. Thank you for giving us another chance.","v":[["apologize","道歉"],["losing patience","失去耐心"],["frustrated","感到挫折的"],["take full responsibility","負起責任"],["held up","延誤"],["front of the queue","優先處理"],["air freight","空運"],["discount","折扣"]],"g":[["we should have warned you earlier","should have + 過去分詞：早該做卻沒做，表示後悔或自責。"],["From now on, I will update you every day until the order ships.","From now on 表示從現在起；until 子句用現在式。"],["I hope this will not happen again.","hope + 子句，表示期望。"]],"s":"艾瑪向第三次遇到延遲的客戶誠懇道歉、承擔責任，並承諾每日更新、週四出貨、負擔空運及給予折扣。","tr":["羅培茲先生，我想為您的貨物延遲親自向您道歉。","這是今年第三次了。我的客戶已經失去耐心。","您感到沮喪是理所當然的，我願意負起全部責任。供應商的問題耽誤了物料，我們本來應該更早通知您。","為什麼沒有人打電話給我？","那是我們的疏失。從現在起，我會每天向您更新進度，直到訂單出貨為止。","我需要的不只是更新進度，我需要一個日期。","我明白。我已經把您的訂單移到佇列最前面，我們可以在星期四出貨。","你們可以連空運費用也一併負擔嗎？","可以，我們會支付，而且這筆訂單我還會提供百分之五的折扣。","這樣合理。我希望這種事不會再發生。","我保證我們會解決根本原因。謝謝您再給我們一次機會。"]},{"t":"Quality Agreement Negotiation","z":"品質協議談判","ty":"dialogue","lv":"B2","d":"Chris: Let us go through the quality agreement draft. First, the defect limit. We propose 500 parts per million.\nDana: That is too loose for us. Our standard is 200 parts per million.\nChris: A tighter limit means more inspection costs. Could we meet in the middle at 300?\nDana: I could accept 300 if you provide capability data every quarter.\nChris: That is reasonable. Next, the response time for complaints. We suggest ten working days for the corrective action report.\nDana: We need an initial reply within 48 hours and the full report in ten days.\nChris: Agreed. What about liability for line stoppages?\nDana: We expect the supplier to cover direct costs if the defect is proven to be your fault.\nChris: We can accept that, provided that the cause is verified jointly.\nDana: Fine. I will update the draft tonight and send it to legal.\nChris: Great. Hopefully we can sign next week.","v":[["quality agreement","品質協議"],["defect limit","不良上限"],["parts per million","百萬分之一(ppm)"],["capability data","製程能力數據"],["complaint","客訴"],["liability","責任"],["line stoppage","停線"],["verified jointly","共同確認"]],"g":[["Could we meet in the middle at 300?","Could we...? 禮貌地提出折衷方案；meet in the middle 為慣用語。"],["I could accept 300 if you provide capability data every quarter.","could 表示有條件的可能；if 子句用現在式。"],["We can accept that, provided that the cause is verified jointly.","provided that 表示唯一條件：只要……。"]],"s":"克里斯與黛娜協商品質協議，將不良上限折衷為 300 ppm，並談定客訴回覆時限與停線責任，條件是共同確認原因。","tr":["我們來看品質協議的草案。首先是不良率上限，我們提議百萬分之 500。","這對我們來說太寬鬆了。我們的標準是百萬分之 200。","更嚴格的上限意味著更高的檢驗成本。我們可以折衷定在 300 嗎？","如果你們每季提供製程能力數據，我可以接受 300。","這很合理。接下來是客訴的回應時間。我們建議矯正措施報告在十個工作天內提出。","我們需要在 48 小時內得到初步回覆，並在十天內收到完整報告。","同意。那停線的責任如何處理？","如果證實缺陷是你們的責任，我們期望供應商負擔直接成本。","我們可以接受，前提是原因必須經過雙方共同確認。","好。我今晚會更新草案並送交法務。","太好了。希望我們下週就能簽約。"]},{"t":"Yield Improvement Update","z":"良率改善進度","ty":"article","lv":"B2","d":"Yield is the percentage of good products out of everything we start to produce, and it directly affects cost, delivery time and customer satisfaction. This month our overall yield on the main assembly line rose from 93.5 percent to 96.2 percent.\nThree actions drove the improvement. First, we replaced the worn nozzle on the dispensing machine, which removed most glue defects. Second, the engineering team adjusted the soldering temperature profile after analyzing data from two hundred boards. Third, operators received training on handling sensitive parts, so scratches dropped by almost half.\nDespite this progress, we have not reached the target of 98 percent. The remaining losses come mainly from misaligned labels and occasional connector damage. Next month, we will install a vision system to check labels automatically and redesign the tray that holds the connectors.\nWe will review the numbers every Monday and report to management monthly. If the trend continues, we expect to meet the target by the end of the first quarter.","v":[["yield","良率"],["assembly line","組裝線"],["nozzle","噴嘴"],["dispensing machine","點膠機"],["soldering","焊接"],["temperature profile","溫度曲線"],["misaligned","錯位的"],["vision system","視覺檢測系統"]],"g":[["our overall yield on the main assembly line rose from 93.5 percent to 96.2 percent","rose from A to B 表示從A上升到B，用過去式描述變化。"],["Despite this progress, we have not reached the target of 98 percent.","Despite + 名詞片語表示儘管；現在完成式表示目前仍未達成。"],["If the trend continues, we expect to meet the target by the end of the first quarter.","If + 現在式表示可能發生的條件；expect to + 原形動詞。"]],"s":"本月主線良率由 93.5% 升至 96.2%，主因是更換噴嘴、調整焊接溫度與加強培訓，下一步將導入視覺檢測以達 98% 目標。","tr":["良率是指在我們開始生產的所有產品中，良品所占的百分比，它直接影響成本、交期和客戶滿意度。本月主要組裝線的整體良率從 93.5% 提升到 96.2%。","有三項措施帶動了這次改善。首先，我們更換了點膠機上磨損的噴嘴，消除了大部分膠水瑕疵。其次，工程團隊在分析了兩百片電路板的數據後，調整了焊接溫度曲線。第三，作業員接受了處理敏感零件的訓練，因此刮傷減少了將近一半。","儘管有這樣的進展，我們還沒有達到 98% 的目標。剩餘的損失主要來自標籤貼歪和偶爾發生的連接器損壞。下個月，我們將安裝視覺系統來自動檢查標籤，並重新設計放置連接器的托盤。","我們每週一都會檢視這些數字，並每月向管理階層報告。如果這個趨勢持續下去，我們預期在第一季底前達成目標。"]},{"t":"Customer Satisfaction Survey Results","z":"客戶滿意度調查結果","ty":"article","lv":"B1","d":"Our annual customer satisfaction survey closed last Friday. We sent it to 420 customers and received 268 responses, which is a response rate of 64 percent. That is our best result in five years.\nOverall satisfaction reached 4.3 out of 5, up from 4.0 last year. Customers rated product quality and technical support the highest. On-time delivery scored 3.8, and it was the lowest category, mostly because of delays in the summer.\nThe written comments were also helpful. Many customers praised our fast replies to complaints. Several said that our invoices are sometimes hard to understand, and a few asked for an online portal to track their orders.\nBased on these results, we will take three actions. We will improve our delivery planning, simplify the invoice format, and launch an order tracking page next quarter. We will share the full results with every customer who took part and show them what we changed.","v":[["customer satisfaction survey","客戶滿意度調查"],["response rate","回覆率"],["out of 5","滿分5分"],["rate","評分"],["on-time delivery","準時交貨"],["category","類別"],["praise","稱讚"],["portal","入口網站"]],"g":[["Overall satisfaction reached 4.3 out of 5, up from 4.0 last year.","up from 用來補充說明比去年上升；out of 5 表示滿分5分。"],["On-time delivery scored 3.8, and it was the lowest category, mostly because of delays in the summer.","the lowest 為最高級；because of + 名詞片語表示原因。"],["Based on these results, we will take three actions.","Based on... 為過去分詞片語，表示根據……。"]],"s":"年度客戶調查回覆率 64%，整體滿意度升至 4.3 分，準時交貨最低，公司將改善交期規劃、簡化發票並推出訂單追蹤頁。","tr":["我們的年度客戶滿意度調查在上週五結束。我們將問卷寄給 420 位客戶，收到 268 份回覆，回收率為 64%。這是我們五年來最好的成績。","整體滿意度達到 4.3 分（滿分 5 分），高於去年的 4.0 分。客戶對產品品質和技術支援的評價最高。準時交貨得分 3.8，是最低的項目，主要是因為夏季發生了延誤。","書面意見也很有幫助。許多客戶稱讚我們對客訴回覆迅速。有幾位表示我們的發票有時很難看懂，也有少數客戶希望有線上入口網站可以追蹤訂單。","根據這些結果，我們將採取三項行動：改善我們的交貨規劃、簡化發票格式，並在下一季推出訂單追蹤頁面。我們會與每一位參與調查的客戶分享完整結果，並讓他們知道我們做了哪些改變。"]},{"t":"Building Long-Term Customer Trust","z":"建立長期客戶信任","ty":"article","lv":"B2","d":"Customer trust is built slowly and lost quickly. It is not created by a single great delivery, but by thousands of small promises kept day after day. When a company says a shipment will arrive on Tuesday, it must arrive on Tuesday.\nTrust also depends on how a company behaves when something goes wrong. Customers rarely expect perfection, but they do expect honesty. Telling a customer about a delay before they discover it themselves shows respect and gives them time to adjust their plans.\nAnother key factor is consistency. If different employees give different answers, customers begin to doubt the whole organization. Clear procedures, shared information and well-trained staff help everyone speak with one voice.\nFinally, long-term trust requires listening. Regular reviews, open feedback channels and visible follow-up actions show customers that their opinions matter. Over time, these habits turn a one-time buyer into a partner who recommends the company to others and stays loyal even when competitors offer lower prices.","v":[["customer trust","客戶信任"],["promises kept","信守承諾"],["perfection","完美"],["honesty","誠實"],["consistency","一致性"],["procedure","程序"],["feedback channel","意見回饋管道"],["loyal","忠誠的"]],"g":[["It is not created by a single great delivery, but by thousands of small promises kept day after day.","not A but B 表示不是A而是B；kept 為過去分詞修飾 promises。"],["Telling a customer about a delay before they discover it themselves shows respect and gives them time to adjust their plans.","動名詞 Telling... 作主詞，後接單數動詞 shows。"],["If different employees give different answers, customers begin to doubt the whole organization.","If + 現在式，主句用現在式，表示一般性的因果。"]],"s":"本文指出客戶信任來自信守小承諾、出問題時的誠實、一致的對外說法，以及持續傾聽並跟進回饋。","tr":["客戶的信任需要慢慢建立，卻很容易失去。它不是靠一次出色的交貨就能建立，而是靠日復一日遵守成千上萬個小承諾。當公司說貨會在星期二送達，就必須在星期二送達。","信任也取決於公司在出問題時的表現。客戶很少期待完美，但他們確實期待誠實。在客戶自己發現之前就告知延遲，既表示尊重，也讓他們有時間調整計畫。","另一個關鍵因素是一致性。如果不同的員工給出不同的答案，客戶就會開始懷疑整個組織。清楚的程序、共享的資訊和訓練有素的員工，能幫助大家以同一個聲音說話。","最後，長期的信任需要傾聽。定期檢討、開放的意見回饋管道和看得見的後續行動，讓客戶知道他們的意見很重要。久而久之，這些習慣會把一次性的買家變成合作夥伴，不僅向他人推薦公司，即使競爭對手提供更低的價格，也依然保持忠誠。"]}],"more":""}];
const VOCAB=[{"id":"business","en":"Business English","zh":"商務英文單字","ds":"會議、業務、財務、供應鏈等職場常用字彙","cats":["會議與管理","業務與客戶","財務與合約","供應鏈與製造","策略與綜合"],"words":[{"w":"agenda","p":"n.","z":"議程、待辦事項","c":"會議與管理","ex":[["Please send me the agenda before the meeting so I can prepare.","請在會議前把議程寄給我，我才能準備。"],["The first item on the agenda is the budget for next quarter.","議程上的第一項是下一季的預算。"]]},{"w":"minutes","p":"n.","z":"會議記錄","c":"會議與管理","ex":[["Who will take the minutes during today's board meeting?","今天的董事會議由誰負責做會議記錄？"],["I will circulate the minutes by the end of the day.","我會在今天下班前傳閱會議記錄。"]]},{"w":"attendee","p":"n.","z":"與會者、出席者","c":"會議與管理","ex":[["Each attendee received a copy of the sales report.","每位與會者都拿到一份銷售報告。"],["The list of attendees includes several clients from Japan.","與會者名單包括幾位來自日本的客戶。"]]},{"w":"chair","p":"v.","z":"主持（會議）","c":"會議與管理","ex":[["Ms. Lin will chair the meeting while the director is away.","主任不在時，林小姐將主持這場會議。"],["He has chaired the project committee for three years.","他已擔任專案委員會主席三年。"]]},{"w":"adjourn","p":"v.","z":"休會、散會","c":"會議與管理","ex":[["The chairperson decided to adjourn the meeting until Friday.","主席決定將會議延到星期五再開。"],["We adjourned at five o'clock after approving the proposal.","我們在通過提案後於五點散會。"]]},{"w":"postpone","p":"v.","z":"延期、延後","c":"會議與管理","ex":[["We had to postpone the launch because of a supplier delay.","由於供應商延誤，我們必須延後上市。"],["Could we postpone the call until tomorrow morning?","我們可以把通話延到明天早上嗎？"]]},{"w":"reschedule","p":"v.","z":"重新安排時間","c":"會議與管理","ex":[["I need to reschedule our appointment because of a client visit.","因為要接待客戶，我得重新安排我們的約會時間。"],["Can we reschedule the review for early next week?","我們可以把審查改到下週初嗎？"]]},{"w":"follow up","p":"phr.","z":"後續跟進、追蹤","c":"會議與管理","ex":[["I will follow up with the client after the presentation.","簡報結束後，我會與客戶進行後續聯繫。"],["Please follow up on the invoice if they have not paid yet.","如果對方還沒付款，請追蹤那張發票。"]]},{"w":"action item","p":"n.","z":"待辦事項、行動項目","c":"會議與管理","ex":[["Every action item needs an owner and a clear deadline.","每個待辦事項都需要負責人和明確的期限。"],["We listed five action items at the end of the meeting.","我們在會議結束時列出五項待辦事項。"]]},{"w":"brainstorm","p":"v.","z":"腦力激盪","c":"會議與管理","ex":[["Let's brainstorm some ideas for the new advertising campaign.","我們來為新的廣告活動腦力激盪一些點子。"],["The team brainstormed for an hour and came up with ten options.","團隊腦力激盪了一小時，想出十個方案。"]]},{"w":"consensus","p":"n.","z":"共識","c":"會議與管理","ex":[["The committee finally reached a consensus on the new policy.","委員會最後對新政策達成共識。"],["There is no consensus among the managers about the pricing plan.","經理們對定價方案沒有共識。"]]},{"w":"proposal","p":"n.","z":"提案、建議書","c":"會議與管理","ex":[["Our proposal was approved by the executive team yesterday.","我們的提案昨天獲得管理團隊核准。"],["She submitted a detailed proposal for the new training program.","她提交了一份新訓練計畫的詳細提案。"]]},{"w":"delegate","p":"v.","z":"授權、委派","c":"會議與管理","ex":[["A good manager knows how to delegate tasks to the team.","好的主管懂得把工作授權給團隊。"],["I delegated the data analysis to my assistant.","我把資料分析工作交給了我的助理。"]]},{"w":"supervise","p":"v.","z":"監督、指導","c":"會議與管理","ex":[["She supervises a team of twelve customer service agents.","她負責管理十二位客服人員。"],["New employees will be supervised closely during the first month.","新進員工在第一個月會受到密切指導。"]]},{"w":"deadline","p":"n.","z":"截止期限","c":"會議與管理","ex":[["We must meet the deadline, or the client will cancel the order.","我們必須趕上期限，否則客戶會取消訂單。"],["The deadline for submitting expense reports is the 25th.","提交費用報告的截止日是二十五號。"]]},{"w":"milestone","p":"n.","z":"里程碑、重要階段","c":"會議與管理","ex":[["Completing the prototype was an important milestone for the project.","完成原型是這個專案的重要里程碑。"],["We will review the progress of the team at each milestone.","我們會在每個階段性里程碑檢視進度。"]]},{"w":"priority","p":"n.","z":"優先事項","c":"會議與管理","ex":[["Customer satisfaction is our top priority this year.","客戶滿意度是我們今年的首要任務。"],["You need to set priorities when you have too many tasks.","任務太多時你需要排定優先順序。"]]},{"w":"workload","p":"n.","z":"工作量","c":"會議與管理","ex":[["My workload has doubled since two colleagues left the company.","自從兩位同事離職後，我的工作量增加了一倍。"],["The manager adjusted the workload to prevent burnout.","主管調整了工作量以避免過勞。"]]},{"w":"accountable","p":"adj.","z":"負有責任的","c":"會議與管理","ex":[["Managers are accountable for the results of their departments.","主管要為其部門的成果負責。"],["Who is accountable if the project goes over budget?","如果專案超出預算，誰要負責？"]]},{"w":"accountability","p":"n.","z":"問責、責任歸屬","c":"會議與管理","ex":[["The new system increases accountability across the whole organization.","新系統提高了整個組織的責任歸屬。"],["Clear roles and regular reviews create accountability within the whole team.","明確的角色分工讓團隊有責任感。"]]},{"w":"hierarchy","p":"n.","z":"階層、層級制度","c":"會議與管理","ex":[["The company has a flat hierarchy with very few managers.","這家公司層級扁平，主管很少。"],["Respect for hierarchy is strong in many traditional firms.","在許多傳統企業中，階層觀念很強。"]]},{"w":"subordinate","p":"n.","z":"部屬","c":"會議與管理","ex":[["A good leader listens to the opinions of his subordinates.","好的領導者會傾聽部屬的意見。"],["She gives her subordinates clear instructions and regular feedback.","她給部屬明確的指示和定期回饋。"]]},{"w":"colleague","p":"n.","z":"同事","c":"會議與管理","ex":[["My colleague will cover my duties while I am on leave.","我休假時，同事會代理我的職務。"],["I asked a colleague from finance to check the numbers.","我請財務部的同事核對數字。"]]},{"w":"counterpart","p":"n.","z":"對等職位的人、對口人員","c":"會議與管理","ex":[["I will discuss the schedule with my counterpart in the Tokyo office.","我會和東京辦公室的對口人員討論時程。"],["Our German counterparts agreed to the new terms.","我們的德國對口單位同意了新條款。"]]},{"w":"stakeholder","p":"n.","z":"利害關係人","c":"會議與管理","ex":[["We must keep all stakeholders informed about the changes.","我們必須讓所有利害關係人了解這些變動。"],["Key stakeholders attended the kickoff meeting last week.","主要利害關係人參加了上週的啟動會議。"]]},{"w":"escalate","p":"v.","z":"上報、升級（問題）","c":"會議與管理","ex":[["If you cannot solve the issue, escalate it to your manager.","如果你無法解決問題，就上報給你的主管。"],["The customer complaint was escalated to senior management for a final decision.","這項客訴被上呈給高階主管。"]]},{"w":"outsource","p":"v.","z":"外包","c":"會議與管理","ex":[["The company decided to outsource its payroll processing.","公司決定把薪資處理外包。"],["Many firms outsource customer support to reduce costs.","許多公司把客服外包以降低成本。"]]},{"w":"streamline","p":"v.","z":"精簡、使流程更順暢","c":"會議與管理","ex":[["We need to streamline the approval process to save time.","我們需要精簡核准流程以節省時間。"],["The new software has streamlined our daily reporting and saved us hours.","新軟體簡化了我們的每日報告。"]]},{"w":"implement","p":"v.","z":"實施、執行","c":"會議與管理","ex":[["The team will implement the new policy next month.","團隊將在下個月實施新政策。"],["It took six months to implement the software across all offices.","這套軟體花了六個月才在所有辦公室上線。"]]},{"w":"oversee","p":"v.","z":"監督、管理","c":"會議與管理","ex":[["She oversees all marketing activities in the Asia region.","她負責監督亞洲地區所有的行銷活動。"],["An external auditor will oversee the inventory count.","外部稽核員將監督盤點作業。"]]},{"w":"coordinate","p":"v.","z":"協調","c":"會議與管理","ex":[["Please coordinate with the sales team before contacting the client.","聯絡客戶前，請先與業務團隊協調。"],["He coordinated the efforts of three departments during the merger.","合併期間，他協調了三個部門的工作。"]]},{"w":"liaise","p":"v.","z":"聯絡、居中協調","c":"會議與管理","ex":[["I will liaise with the legal department about the contract.","我會就合約事宜與法務部門聯繫。"],["She liaises between the engineers and the customers.","她在工程師與客戶之間居中聯繫。"]]},{"w":"collaborate","p":"v.","z":"合作、協作","c":"會議與管理","ex":[["Our designers collaborate closely with the product team.","我們的設計師與產品團隊密切合作。"],["The two firms collaborated on a new mobile app.","兩家公司合作開發了一款新的行動應用程式。"]]},{"w":"facilitate","p":"v.","z":"促進、主持（討論）","c":"會議與管理","ex":[["An outside consultant will facilitate the strategy workshop.","外部顧問將主持這場策略工作坊。"],["The new tool facilitates communication between remote teams.","新工具促進了遠端團隊之間的溝通。"]]},{"w":"clarify","p":"v.","z":"釐清、說明","c":"會議與管理","ex":[["Could you clarify what you mean by a flexible deadline?","你能說明一下彈性期限是什麼意思嗎？"],["I sent an email to clarify the new reporting rules.","我寄了封電子郵件來說明新的報告規定。"]]},{"w":"elaborate","p":"v.","z":"詳細說明","c":"會議與管理","ex":[["Could you elaborate on your plan to reduce shipping costs?","你能詳細說明降低運費的計畫嗎？"],["He declined to elaborate on the reasons for the delay.","他拒絕詳述延誤的原因。"]]},{"w":"summarize","p":"v.","z":"摘要、總結","c":"會議與管理","ex":[["Let me summarize the main points before we finish.","在結束前，讓我總結一下要點。"],["She summarized the quarterly results in three slides.","她用三張投影片總結了季度成果。"]]},{"w":"recap","p":"n.","z":"重點回顧","c":"會議與管理","ex":[["Here is a quick recap of what we agreed on today.","以下是我們今天達成共識的簡短回顧。"],["I will send a recap of the meeting by email.","我會用電子郵件寄出會議重點回顧。"]]},{"w":"bring up","p":"phr.","z":"提出（話題）","c":"會議與管理","ex":[["She will bring up the issue of overtime pay in the next meeting.","她在會議中提出加班費的問題。"],["Please do not bring up the budget until the CEO arrives.","執行長到場前請不要提預算的事。"]]},{"w":"raise a concern","p":"phr.","z":"表達疑慮、提出關切","c":"會議與管理","ex":[["Several employees raised a concern about the new schedule.","數名員工對新的時程表表達疑慮。"],["If you have doubts, please raise a concern early.","如果你有疑慮，請及早提出。"]]},{"w":"take the floor","p":"phr.","z":"開始發言、上台發言","c":"會議與管理","ex":[["The finance director will take the floor to present the figures.","接著財務長開始發言報告數據。"],["May I take the floor for a moment?","我可以發言一下嗎？"]]},{"w":"touch base","p":"phr.","z":"聯絡、碰個面確認進度","c":"會議與管理","ex":[["Let's touch base next week to check on the progress.","我們下週碰個面確認一下進度。"],["I just wanted to touch base before the deadline.","我只是想在期限前跟你確認一下。"]]},{"w":"loop in","p":"phr.","z":"讓某人加入（郵件、討論）","c":"會議與管理","ex":[["Please loop in the finance team on this email thread.","請把財務團隊加進這封郵件討論串。"],["I forgot to loop her in on the decision.","我忘了讓她知道這項決定。"]]},{"w":"keep someone posted","p":"phr.","z":"隨時告知某人最新進展","c":"會議與管理","ex":[["Please keep me posted on any changes to the schedule.","時程有任何變動請隨時通知我。"],["I will keep you posted as soon as I hear from the client.","一收到客戶的回覆我就通知你。"]]},{"w":"heads-up","p":"n.","z":"事先通知、提醒","c":"會議與管理","ex":[["Thanks for the heads-up about the schedule change.","謝謝你事先通知時程有變。"],["I'm giving you a heads-up that the report is due early.","我先提醒你，報告要提前繳交。"]]},{"w":"bottleneck","p":"n.","z":"瓶頸","c":"會議與管理","ex":[["The approval stage is the main bottleneck in our workflow.","核准階段是我們工作流程中的主要瓶頸。"],["We removed the bottleneck by hiring two more staff.","我們多聘了兩位人手來消除瓶頸。"]]},{"w":"on the same page","p":"phr.","z":"看法一致、達成共識","c":"會議與管理","ex":[["Before we start, let's make sure we are all on the same page.","開始之前，我們先確認大家的看法一致。"],["The sales and marketing teams are not on the same page.","業務與行銷團隊的想法不一致。"]]},{"w":"get the ball rolling","p":"phr.","z":"開始著手進行","c":"會議與管理","ex":[["Let's get the ball rolling by assigning tasks to everyone.","我們先把工作分配給每個人，讓事情動起來。"],["He called a meeting to get the ball rolling on the project.","他召開會議，讓專案開始啟動。"]]},{"w":"touch on","p":"phr.","z":"簡短提及","c":"會議與管理","ex":[["The speaker only touched on the issue of staff turnover.","講者只簡短提到員工流動率的問題。"],["I'd like to touch on a few points before we vote.","投票前我想簡單提幾點。"]]},{"w":"table","p":"v.","z":"擱置（美）、提出（英）","c":"會議與管理","ex":[["We decided to table the discussion until the next meeting.","我們決定把這項討論擱置到下次會議。"],["Let's table that issue and move on to the next item.","我們先把那個議題擱置，進行下一項。"]]},{"w":"motion","p":"n.","z":"動議","c":"會議與管理","ex":[["She made a motion to approve the annual budget.","她提出動議要通過年度預算。"],["The motion was carried by a vote of seven to two.","該動議以七比二的票數通過。"]]},{"w":"quorum","p":"n.","z":"法定人數","c":"會議與管理","ex":[["We cannot start the vote because we do not have a quorum.","我們沒有達到法定人數，所以無法開始投票。"],["A quorum of five directors is required for the meeting.","這場會議需要五位董事達到法定人數。"]]},{"w":"unanimous","p":"adj.","z":"全體一致的","c":"會議與管理","ex":[["The board's decision to hire her was unanimous.","董事會聘用她的決定是全體一致的。"],["We reached a unanimous agreement on the new strategy.","我們對新策略達成全體一致的共識。"]]},{"w":"objective","p":"n.","z":"目標、目的","c":"會議與管理","ex":[["Our main objective is to increase market share by ten percent.","我們的主要目標是把市占率提高百分之十。"],["Each team member should understand the objectives of the project.","每位團隊成員都應了解專案的目標。"]]},{"w":"deliverable","p":"n.","z":"應交付成果","c":"會議與管理","ex":[["The first deliverable is a market analysis report.","第一項交付成果是市場分析報告。"],["All deliverables must be approved by the client.","所有交付成果都必須經客戶核准。"]]},{"w":"scope","p":"n.","z":"範圍","c":"會議與管理","ex":[["The scope of the project has grown beyond our original plan.","專案範圍已超出我們原本的計畫。"],["That request is outside the scope of our contract.","那項要求超出我們合約的範圍。"]]},{"w":"timeline","p":"n.","z":"時程表","c":"會議與管理","ex":[["What is the timeline for completing the software update?","軟體更新的完成時程是什麼？"],["We need to adjust the timeline because of the delay.","由於延誤，我們需要調整時程表。"]]},{"w":"allocate","p":"v.","z":"分配、撥出","c":"會議與管理","ex":[["We allocated more funds to research and development this year.","我們今年撥了更多經費給研發。"],["The manager will allocate tasks according to each person's skills.","經理會依每個人的專長分配工作。"]]},{"w":"resource","p":"n.","z":"資源、人力與物力","c":"會議與管理","ex":[["We lack the resources to launch two projects at once.","我們沒有足夠資源同時啟動兩個專案。"],["Human resources will help with the hiring process.","人力資源部門會協助招聘流程。"]]},{"w":"headcount","p":"n.","z":"人員編制數","c":"會議與管理","ex":[["The company froze headcount until the end of the year.","公司凍結人員編制到年底。"],["We requested extra headcount for the customer service team.","我們為客服團隊申請了額外的人員編制。"]]},{"w":"reorganize","p":"v.","z":"重組","c":"會議與管理","ex":[["The firm plans to reorganize its sales department next year.","這家公司計畫明年重組業務部門。"],["After the merger, the two teams were reorganized into one.","合併之後，兩個團隊被重組為一個。"]]},{"w":"restructure","p":"v.","z":"重整、改組","c":"會議與管理","ex":[["The company had to restructure to cut costs.","公司為了降低成本必須進行改組。"],["Management plans to restructure the debt next quarter.","管理階層計畫下一季重整債務。"]]},{"w":"appraisal","p":"n.","z":"績效考核、評估","c":"會議與管理","ex":[["Your annual appraisal will take place in December.","你的年度考核將在十二月進行。"],["The appraisal showed that she exceeded all her targets.","考核顯示她超越了所有目標。"]]},{"w":"feedback","p":"n.","z":"意見回饋","c":"會議與管理","ex":[["I appreciate your honest feedback on my presentation.","我很感謝你對我簡報的誠實回饋。"],["Managers should give constructive feedback to their staff regularly.","主管應定期給予員工有建設性的回饋。"]]},{"w":"mentor","p":"n.","z":"導師、資深指導者","c":"會議與管理","ex":[["My mentor taught me how to handle difficult clients.","我的導師教我如何應對難搞的客戶。"],["The company assigns a mentor to every new employee.","公司為每位新員工指派一位導師。"]]},{"w":"onboarding","p":"n.","z":"新人到職培訓","c":"會議與管理","ex":[["The onboarding process lasts two weeks for new employees.","新進員工的到職培訓為期兩週。"],["Good onboarding helps new hires feel welcome and become productive more quickly.","良好的到職培訓能讓新進人員有受歡迎的感覺。"]]},{"w":"induction","p":"n.","z":"新人入職訓練","c":"會議與管理","ex":[["All new staff attend an induction session on their first day.","所有新進員工在第一天都要參加入職訓練。"],["The induction covered safety rules and company policies.","入職訓練涵蓋了安全規定與公司政策。"]]},{"w":"probation","p":"n.","z":"試用期","c":"會議與管理","ex":[["He is still on probation for the first three months.","他前三個月仍在試用期。"],["She passed her probation and received a permanent contract.","她通過試用期並拿到正式合約。"]]},{"w":"promote","p":"v.","z":"升遷、晉升","c":"會議與管理","ex":[["She was promoted to regional manager last month.","她上個月被升為區域經理。"],["The company promotes employees based on performance rather than on how long they stay.","公司依績效晉升員工。"]]},{"w":"resign","p":"v.","z":"辭職","c":"會議與管理","ex":[["He decided to resign after receiving a better offer.","他收到更好的工作機會後決定辭職。"],["Two directors resigned yesterday over the disagreement about the new strategy.","兩位董事因意見不合而辭職。"]]},{"w":"reassign","p":"v.","z":"重新指派","c":"會議與管理","ex":[["The manager reassigned him to the Taipei branch.","經理把他重新調派到台北分公司。"],["Several staff were reassigned after the department closed.","部門關閉後，幾位員工被重新指派。"]]},{"w":"shift","p":"n.","z":"輪班、班次","c":"會議與管理","ex":[["I am working the night shift this week.","我這週上夜班。"],["The factory runs three shifts every day to meet demand.","工廠每天有三個班次。"]]},{"w":"overtime","p":"n.","z":"加班（時間或費用）","c":"會議與管理","ex":[["Employees receive extra pay for overtime on weekends.","員工週末加班可領額外薪資。"],["I worked overtime all week to finish the report.","我整週都加班趕完報告。"]]},{"w":"flexible","p":"adj.","z":"有彈性的","c":"會議與管理","ex":[["Our company offers flexible working hours for parents.","我們公司為父母提供彈性工時。"],["Please be flexible about the meeting time if the client asks for changes.","請對會議時間保持彈性。"]]},{"w":"remote","p":"adj.","z":"遠端的","c":"會議與管理","ex":[["Our team has been working remotely since the pandemic.","我們團隊自疫情以來一直遠端工作。"],["Remote meetings save time and travel costs for companies with global teams.","遠端會議能節省時間與差旅費用。"]]},{"w":"teleconference","p":"n.","z":"電話會議、遠距會議","c":"會議與管理","ex":[["We will hold a teleconference with the Berlin office on Monday.","我們週一會與柏林辦公室召開遠距會議。"],["The teleconference was cut off because of a poor connection.","由於連線不良，遠距會議中斷了。"]]},{"w":"conference call","p":"n.","z":"電話會議","c":"會議與管理","ex":[["I have a conference call with our suppliers at ten.","我十點要和供應商開電話會議。"],["Please dial in to the conference call five minutes early.","請提前五分鐘撥入電話會議。"]]},{"w":"projector","p":"n.","z":"投影機","c":"會議與管理","ex":[["The projector in the meeting room is not working.","會議室的投影機壞了。"],["Please connect your laptop to the projector before the presentation starts.","請把你的筆電連接到投影機。"]]},{"w":"handout","p":"n.","z":"講義、發送的資料","c":"會議與管理","ex":[["I will distribute a handout summarizing the key figures.","我會發一份摘要重點數字的講義。"],["Each participant received a handout at the door.","每位參加者在入口處拿到一份講義。"]]},{"w":"slide","p":"n.","z":"投影片","c":"會議與管理","ex":[["The last slide shows our sales forecast for next year.","最後一張投影片顯示我們明年的銷售預測。"],["Could you go back to the previous slide, please?","可以請你回到上一張投影片嗎？"]]},{"w":"overview","p":"n.","z":"概要、概述","c":"會議與管理","ex":[["She gave a brief overview of the company's performance.","她簡要概述了公司的業績。"],["Here is an overview of today's discussion topics.","以下是今天討論主題的概要。"]]},{"w":"update","p":"n.","z":"最新進度、更新","c":"會議與管理","ex":[["Can you give us an update on the sales figures?","你可以向我們報告最新的銷售數字嗎？"],["I'll send a weekly upd
