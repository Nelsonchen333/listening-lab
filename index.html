":[["summarize","摘要、總結"],["agreed","同意"],["shipment","出貨"],["invoice date","發票日期"],["samples","樣品"],["open","尚未解決的"],["commit to","承諾"],["sign","簽署"]],"g":[["Let me summarize what we have agreed.","Let me + 原形動詞，用來禮貌地表示「讓我來……」；what we have agreed 是名詞子句。"],["we can commit to that, as long as we receive the purchase order by the end of this week.","as long as 表示「只要」，引導條件；by 表示期限。"],["I am looking forward to working with you.","look forward to 後面接動名詞（working），不是原形動詞。"]],"s":"Victor 與 Elena 確認價格、數量、付款與交貨日期，並約定週一簽約，順利成交。","tr":["Elena，我想我們快談妥了。讓我整理一下我們達成的共識。","請說。","單價是 8.50 美元，數量 20,000 件，分兩批出貨。","沒錯。付款條件是發票日起算 45 天內付款。","是的。我們也同意第一批樣品的費用由您負擔。","沒錯。還有什麼未決的事項嗎？","只剩交貨日期。您能確認第一批貨會在 3 月 10 日前送達嗎？","可以，我們能承諾，只要在本週結束前收到採購單就行。","沒問題。我星期五會寄出。","太好了。我今天會準備合約，我們可以星期一簽約。","太棒了。期待與您合作。"]},{"t":"Price Review at Contract Renewal","z":"合約續約的價格檢討","ty":"article","lv":"B2","d":"A contract renewal is the best moment to review prices. Costs change over time, and what seemed fair two years ago may no longer reflect the market.\nBefore you meet, prepare carefully. Compare your current prices with recent market data, and list the changes in your own costs, such as materials, freight, and wages. If you are the buyer, collect evidence of competing offers and your own purchase volumes.\nDuring the meeting, start with what has worked well. Mention on-time delivery, quality, and good communication. This creates a positive tone and shows that the relationship has value beyond the price.\nThen present your proposal with clear reasons. A seller might request a small increase linked to inflation, while a buyer might ask for a discount in exchange for a longer commitment. Be ready to offer alternatives, such as extending the term or changing the payment schedule. Finally, record the new prices in writing and set a date for the next review.","v":[["contract renewal","合約續約"],["reflect the market","反映市場"],["freight","運費"],["wages","薪資"],["evidence","證據"],["purchase volumes","採購量"],["inflation","通膨"],["payment schedule","付款時程"]],"g":[["what seemed fair two years ago may no longer reflect the market.","what 引導名詞子句當主詞；may no longer 表示「可能已不再」。"],["If you are the buyer, collect evidence of competing offers and your own purchase volumes.","if 條件句後面接祈使句，直接給出建議。"],["A seller might request a small increase linked to inflation, while a buyer might ask for a discount in exchange for a longer commitment.","while 連接兩個對比的情況；in exchange for 表示「作為交換」。"]],"s":"本文建議在合約續約時檢討價格：事前蒐集資料，會議中先肯定合作成果，再提出有理由的提案並以書面記錄。","tr":["合約續約是檢視價格的最佳時機。成本會隨時間變動，兩年前看似合理的價格，現在可能已無法反映市場行情。","會議前請仔細準備。將目前的價格與近期的市場資料比較，並列出自身成本的變化，例如原料、運費和工資。如果您是買方，請蒐集競爭報價的證據以及您自己的採購量。","會議中，先從合作順利的地方談起，例如準時交貨、品質和良好的溝通。這能營造正面的氣氛，並顯示這段關係的價值不僅止於價格。","接著，提出您的方案並說明清楚的理由。賣方可能會要求配合通貨膨脹小幅漲價，而買方可能會以更長期的承諾換取折扣。也要準備好提出替代方案，例如延長合約期限或調整付款時程。最後，將新價格以書面記錄下來，並訂下下次檢討的日期。"]},{"t":"Handling Last-Minute Price Pressure","z":"應對臨時壓價","ty":"dialogue","lv":"B2","d":"Greg: Olivia, I have just spoken with my director, and she wants to cut the price by another ten percent.\nOlivia: Greg, we finalized the quote last week. The numbers have not changed.\nGreg: I know, and I am sorry for the late request. The budget was reduced yesterday.\nOlivia: That is a serious change. What exactly is the new budget?\nGreg: We have to stay under 90,000 dollars.\nOlivia: Our current price is 98,000. I cannot drop that much without changing the scope.\nGreg: Could we remove some features?\nOlivia: Yes. If we take out the extra training sessions and reduce the reports, I can bring it down to 91,500.\nGreg: That is close. Can you do 90,000 if we sign today?\nOlivia: I will need approval. Give me an hour, and I will call you back.\nGreg: Thank you. I will wait for your call.","v":[["cut the price","降價"],["finalize","定案"],["budget","預算"],["scope","範圍"],["features","功能"],["training sessions","訓練課程"],["bring it down","把價格降下來"],["approval","核准"]],"g":[["we finalized the quote last week.","last week 是明確的過去時間，所以用過去簡單式。"],["I cannot drop that much without changing the scope.","without + 動名詞，表示「在不……的情況下」；scope 指工作範圍。"],["If we take out the extra training sessions and reduce the reports, I can bring it down to 91,500.","if 條件句：用減少服務內容換取降價，是常見的應對臨時壓價的方式。"]],"s":"Greg 在最後一刻要求再降價，Olivia 不直接降價，而是提出縮減服務範圍，並表示需要主管核准。","tr":["Olivia，我剛和我的主管談過，她希望價格再降百分之十。","Greg，我們上週已經敲定報價了，數字沒有變。","我知道，很抱歉這麼晚才提出要求。預算昨天被縮減了。","這是很大的變動。新的預算究竟是多少？","我們必須控制在 90,000 美元以下。","我們目前的價格是 98,000。如果不調整範圍，我無法降那麼多。","我們可以拿掉一些功能嗎？","可以。如果取消額外的訓練課程並減少報告，我可以降到 91,500。","很接近了。如果我們今天簽約，你能做到 90,000 嗎？","我需要核准。給我一個小時，我會回電給你。","謝謝。我等你的電話。"]},{"t":"Bundling Products for a Better Offer","z":"組合方案提升報價吸引力","ty":"dialogue","lv":"B1","d":"Paula: Kevin, thanks for your time. I would like to suggest a package for your store.\nKevin: Go ahead.\nPaula: Right now you order our coffee machines and the filters separately.\nKevin: That is correct. Each order is handled on its own.\nPaula: If you buy both together, I can offer a bundle price. Fifty machines and 500 filter packs for 18,000 dollars.\nKevin: What is the price if I buy them separately?\nPaula: Around 20,500 dollars, so you would save about twelve percent.\nKevin: That is attractive. Does the bundle include delivery?\nPaula: Yes, and we can add a one-year service plan at half price.\nKevin: Interesting. Would you be able to send me the details in writing?\nPaula: Of course. I will email the offer this afternoon, and it is valid until the end of the month, so there is no rush.","v":[["package","套裝方案"],["separately","分開地"],["bundle price","組合價"],["filter packs","濾芯包"],["attractive","有吸引力的"],["service plan","服務方案"],["in writing","書面"],["offer","報價、提案"]],"g":[["If you buy both together, I can offer a bundle price.","if 條件句用現在簡單式，後面接 can 表示可能提供的優惠。"],["you would save about twelve percent","would 表示假設情況下的結果；save + 比例表示省下多少。"],["Would you be able to send me the details in writing?","Would you be able to...? 是比 Can you 更禮貌的請求說法。"]],"s":"Paula 向 Kevin 提出咖啡機加濾芯的組合方案，可省約十二%並附贈半價服務方案。","tr":["Kevin，謝謝您撥冗。我想為您的店面提議一個組合方案。","請說。","目前您是分開訂購我們的咖啡機和濾紙。","沒錯。每筆訂單都是各自處理的。","如果兩者一起購買，我可以提供組合價。五十台機器加 500 包濾紙，共 18,000 美元。","如果我分開買，價格是多少？","大約 20,500 美元，所以您可以省下大約百分之十二。","這很吸引人。組合方案包含運送嗎？","包含，而且我們還可以用半價加購一年的維修服務方案。","有意思。你可以把細節以書面寄給我嗎？","當然。我今天下午會用電子郵件寄出報價，有效期限到月底，所以不用急。"]},{"t":"Raw Material Surcharge Discussion","z":"原物料附加費討論","ty":"article","lv":"B2","d":"Raw material prices can rise quickly, and many suppliers cannot absorb these changes without hurting their margins. A raw material surcharge is one way to handle this problem fairly.\nA surcharge is an extra amount added to the base price when the cost of a key material goes above an agreed level. For instance, if the contract assumes copper at 8,000 dollars per ton and the market price reaches 9,000, the supplier adds a fixed percentage to each invoice.\nTo keep the system transparent, both sides should agree on three things. First, which public index will be used, such as the London Metal Exchange. Second, how often the surcharge will be recalculated, usually every month or quarter. Third, when it will be removed, because it should fall again when the material becomes cheaper.\nBuyers should not simply reject surcharges. A better strategy is to ask for a formula and a cap, which gives them predictability and protects the relationship.","v":[["raw material","原物料"],["surcharge","附加費"],["base price","基本價格"],["invoice","發票"],["transparent","透明的"],["index","指數"],["recalculated","重新計算"],["cap","上限"]],"g":[["A surcharge is an extra amount added to the base price when the cost of a key material goes above an agreed level.","added to the base price 是過去分詞片語，修飾 amount；when 子句說明觸發條件。"],["if the contract assumes copper at 8,000 dollars per ton and the market price reaches 9,000, the supplier adds a fixed percentage to each invoice.","if 條件句加現在簡單式，用來舉例說明一般的運作方式。"],["Buyers should not simply reject surcharges.","should not 表示建議不要做；simply 強調「只是單純地」。"]],"s":"本文說明原物料附加費的運作方式，建議雙方事先約定指數、重算頻率與取消條件，買方可要求公式與上限。","tr":["原物料價格可能快速上漲，許多供應商無法在不損及利潤的情況下消化這些變動。原物料附加費是公平處理這個問題的方法之一。","附加費是指當關鍵原料的成本超過約定水準時，加在基本價格上的額外金額。舉例來說，如果合約假設銅價為每噸 8,000 美元，而市價漲到 9,000，供應商就會在每張發票上加收固定的百分比。","為了讓制度透明，雙方應該就三件事達成共識。第一，要採用哪一個公開指數，例如倫敦金屬交易所。第二，附加費多久重新計算一次，通常是每月或每季。第三，何時取消，因為當原料變便宜時，附加費也應該跟著下降。","買方不應該一味拒絕附加費。更好的策略是要求制定計算公式和上限，這樣既能獲得可預測性，也能保護彼此的關係。"]},{"t":"Negotiating Warranty Terms","z":"保固條款談判","ty":"dialogue","lv":"B2","d":"Alan: Sophie, we are happy with the machine, but the one-year warranty is too short.\nSophie: What would you prefer?\nAlan: Three years, including parts and labor.\nSophie: Three years on everything is not something we usually offer.\nAlan: Our maintenance costs would be very high if a major part failed in year two.\nSophie: I understand. What if we offer two years on the full machine and five years on the motor?\nAlan: Could the warranty also cover on-site repairs?\nSophie: Yes, as long as the machine is installed by our technicians and serviced once a year.\nAlan: That sounds reasonable. What happens if you cannot repair it within a week?\nSophie: In that case, we will provide a replacement unit at no cost.\nAlan: Good. Please put those conditions in the contract, and I will ask our finance team to review the final draft.","v":[["warranty","保固"],["parts and labor","零件與人工"],["maintenance costs","維護成本"],["major part","主要零件"],["cover","涵蓋"],["on-site repairs","現場維修"],["serviced","被保養"],["replacement unit","替換機器"]],"g":[["Our maintenance costs would be very high if a major part failed in year two.","這是假設語氣：if + 過去式，主要子句用 would，描述可能但尚未發生的情況。"],["What if we offer two years on the full machine and five years on the motor?","What if... 用來提出建議或假設的方案。"],["Yes, as long as the machine is installed by our technicians and serviced once a year.","is installed 與 serviced 是被動語態；as long as 表示條件。"]],"s":"Alan 想把保固延長到三年，Sophie 折衷提出整機兩年、馬達五年，並說明現場維修的條件。","tr":["Sophie，我們對這台機器很滿意，但一年的保固太短了。","您希望是多久？","三年，包含零件和人工。","全部項目保固三年，不是我們通常會提供的。","如果第二年有主要零件故障，我們的維修成本會非常高。","我了解。如果我們提供整機兩年保固，馬達五年保固，您覺得如何？","保固也能涵蓋到府維修嗎？","可以，只要機器是由我們的技師安裝，並且每年保養一次。","聽起來合理。如果你們無法在一週內修好，會怎麼處理？","那種情況下，我們會免費提供一台替換機。","很好。請把這些條件寫進合約，我會請我們的財務團隊審閱最終草稿。"]},{"t":"Follow-Up Call After a Quotation","z":"報價後追蹤電話","ty":"dialogue","lv":"B1","d":"Rachel: Hello Ian, this is Rachel from Brightline Supplies. Do you have a few minutes?\nIan: Hi Rachel. Yes, I do.\nRachel: I am calling to follow up on the quotation I sent you last Tuesday. Did you have a chance to review it?\nIan: I looked at it yesterday. The price is a little higher than we expected.\nRachel: I understand. Which part of the quote concerns you most?\nIan: The shipping cost. It seems high for such a small order.\nRachel: Good point. If you combine this order with your next one, the shipping cost per unit will drop.\nIan: That is helpful. We also need to compare it with another offer.\nRachel: Of course. When do you expect to make a decision?\nIan: By the end of next week.\nRachel: Perfect. I will call you again on Thursday, in case you have any questions.","v":[["follow up on","追蹤"],["quotation","報價單"],["review","檢視"],["concern","讓人擔心"],["shipping cost","運費"],["combine","合併"],["compare","比較"],["make a decision","做決定"]],"g":[["I am calling to follow up on the quotation I sent you last Tuesday.","to + 原形動詞表示目的；I sent you last Tuesday 是省略 that 的關係子句，修飾 quotation。"],["Did you have a chance to review it?","Did you have a chance to...? 是禮貌詢問對方是否有機會做某事。"],["I will call you again on Thursday, in case you have any questions.","in case 表示「以防萬一」，後面用現在簡單式。"]],"s":"Rachel 在報價後打電話追蹤，了解 Ian 對運費的疑慮，並提出合併訂單降低單位運費，約定週四再聯絡。","tr":["Ian 您好，我是 Brightline Supplies 的 Rachel。您現在方便談幾分鐘嗎？","嗨，Rachel。方便。","我打電話是想跟進上週二寄給您的報價單。請問您有機會看過了嗎？","我昨天看過了。價格比我們預期的稍微高一點。","我了解。報價中哪個部分最讓您在意？","運費。對這麼小的訂單來說似乎偏高。","您說得對。如果您把這張訂單和下一張合併，每個單位的運費就會降低。","這很有幫助。我們還需要和另一家的報價做比較。","當然。您預計什麼時候做決定？","下週結束前。","太好了。我星期四會再打給您，以防您有任何問題。"]},{"t":"Walking Away from a Deal","z":"何時該放棄談判","ty":"article","lv":"B2","d":"Knowing when to walk away is one of the most important negotiation skills. Many professionals feel pressure to close every deal, but a bad agreement can cost more than no agreement at all.\nBefore any negotiation, define your walk-away point. This is the lowest price, or the weakest terms, that you can accept. It should be based on your costs, your alternatives, and your strategic goals. If you do not decide this in advance, emotions can push you to say yes too quickly.\nDuring the discussion, watch for warning signs. The other side may refuse to share basic information, ask for constant changes, or demand terms that make your margin disappear. When that happens, pause and review your options.\nWalking away does not have to be hostile. You can say, I appreciate your time, but we cannot meet these conditions. Leave the door open for the future. Often, the other party will return with a better offer, and your reputation for fairness will be stronger.","v":[["walk away","離開談判"],["negotiation","談判"],["walk-away point","底線"],["alternatives","替代方案"],["strategic goals","策略目標"],["warning signs","警訊"],["margin","利潤"],["hostile","敵意的"]],"g":[["a bad agreement can cost more than no agreement at all.","cost more than 是比較結構；at all 加強否定語氣，強調「完全沒有」。"],["If you do not decide this in advance, emotions can push you to say yes too quickly.","if 條件句說明沒有事先決定的後果；push + 人 + to 原形動詞。"],["Walking away does not have to be hostile.","Walking away 是動名詞當主詞；does not have to 表示「不一定要」。"]],"s":"本文強調談判前要先定義底線，出現警訊時要敢於放棄，並以禮貌方式留下未來合作的空間。","tr":["懂得何時該放手離開，是最重要的談判技巧之一。許多專業人士覺得有壓力要談成每一筆交易，但一份糟糕的協議，代價可能比沒有協議還高。","在任何談判之前，先定義好您的底線。這是您能接受的最低價格，或最差條件。它應該根據您的成本、替代方案和策略目標來訂定。如果事先沒有決定好，情緒可能會讓您太快答應。","討論過程中，要留意警訊。對方可能拒絕分享基本資訊、不斷要求更改，或是要求會讓您利潤消失的條件。遇到這種情況，請暫停並重新檢視您的選項。","放手離開不一定要帶著敵意。您可以說：感謝您撥冗，但我們無法接受這些條件。並為未來留下餘地。通常對方會帶著更好的條件回來，而您公平待人的聲譽也會更加穩固。"]}],"more":""},{"id":"strategy","en":"Company Direction","zh":"公司發展方向與策略","ds":"公司願景、產品藍圖、市場布局，以及向客戶說明未來規劃。","lessons":[{"t":"Our Three-Year Vision","z":"公司三年願景","ty":"article","lv":"B2","d":"Good morning, everyone, and thank you for joining this year's strategy briefing. Today, I would like to share where our company is heading over the next three years, and what it means for our customers, our partners, and our employees.\nOver the past five years, we have grown from a regional component supplier into a global solutions provider. Our revenue has doubled, and we now serve customers in more than thirty countries. But the market is changing quickly, and the strategies that brought us here will not be enough to take us further.\nOur vision for the next three years rests on three pillars. The first pillar is customer focus. We will move from simply selling products to solving problems. That means we will invest more in application engineers, so we can help customers design our parts into their products earlier.\nThe second pillar is operational resilience. The past few years showed us how fragile global supply chains can be. We plan to open a second distribution center, increase our safety stock for critical parts, and build closer relationships with at least two suppliers for every key component.\nThe third pillar is innovation with responsibility. We will increase our research budget by twenty percent each year, focusing on energy-efficient products and smart-factory applications. At the same time, we have committed to reducing our carbon emissions by thirty percent by the end of the third year.\nOf course, these goals are ambitious, and there will be challenges. Raw material costs may rise, competition will intensify, and customer expectations will continue to grow. However, I am confident that if we stay focused and work together, we can turn these challenges into opportunities.\nTo our customers, I want to say that your success is our success. To our employees, thank you for your hard work, and I invite you to share your ideas with me directly. Thank you very much, and let's make the next three years our best yet.","v":[["vision","願景"],["pillar","支柱、核心面向"],["resilience","韌性"],["fragile","脆弱的"],["distribution center","配銷中心"],["safety stock","安全庫存"],["carbon emissions","碳排放"],["ambitious","有企圖心的"],["intensify","加劇"],["solutions provider","解決方案供應商"],["design in","設計導入"],["revenue","營收"]],"g":[["We have grown from a regional component supplier into a global solutions provider.","現在完成式 have grown：從過去持續到現在的成長；grow from A into B。"],["We will move from simply selling products to solving problems.","from + V-ing to + V-ing：這裡的 to 是介系詞，後面接動名詞。"],["The strategies that brought us here will not be enough to take us further.","that 引導關係子句修飾 strategies；be enough to + V。"],["If we stay focused and work together, we can turn these challenges into opportunities.","條件句；turn A into B：把 A 變成 B。"],["...reducing our carbon emissions by thirty percent...","by + 數字：表示變動的幅度。"]],"s":"執行長在年度策略說明中，回顧公司從區域供應商成長為全球解決方案提供者，並提出未來三年三大支柱：以客戶為中心（增加應用工程師）、營運韌性（第二配銷中心、關鍵料件雙供應商）、負責任的創新（每年增加 20% 研發預算、減碳 30%）。","tr":["各位早安，感謝大家參加今年的策略說明會。今天我想和大家分享公司未來三年的發展方向，以及這對我們的客戶、合作夥伴和員工所代表的意義。","過去五年，我們從一家區域性的零組件供應商，成長為全球性的解決方案提供者。我們的營收成長了一倍，目前服務超過三十個國家的客戶。但市場變化快速，帶我們走到今天的策略，已不足以帶領我們走得更遠。","我們未來三年的願景建立在三大支柱上。第一大支柱是以客戶為中心。我們將從單純銷售產品，轉變為解決問題。這意味著我們會投入更多應用工程師，協助客戶更早將我們的零件設計到他們的產品中。","第二大支柱是營運韌性。過去幾年讓我們看到全球供應鏈有多麼脆弱。我們計畫開設第二個配送中心，提高關鍵零件的安全庫存，並與每項關鍵元件至少兩家供應商建立更緊密的關係。","第三大支柱是負責任的創新。我們每年將研發預算提高百分之二十，專注於節能產品與智慧工廠應用。同時，我們承諾在第三年底前將碳排放量減少百分之三十。","當然，這些目標相當具有挑戰性，過程中也會遇到困難。原物料成本可能上漲、競爭將會加劇、客戶的期望也會持續提高。然而，我有信心，只要我們保持專注、攜手合作，就能把這些挑戰轉化為機會。","對我們的客戶，我想說，您的成功就是我們的成功。對我們的員工，感謝你們的辛勤付出，也邀請大家直接與我分享你們的想法。非常感謝大家，讓我們一起把未來三年打造成最好的三年。"]},{"t":"A Customer Asks About Our Product Roadmap","z":"客戶詢問產品藍圖","ty":"dialogue","lv":"B2","d":"Emily: James, before we sign the long-term agreement, I'd like to understand where your product line is heading. Can you give me an overview of your roadmap?\nJames: Absolutely. We have a clear plan for the next eighteen months. The current generation will remain in full production through next year, and we'll launch the next generation in the third quarter.\nEmily: What will be different in the new generation?\nJames: Mainly three things. Power consumption will be about twenty-five percent lower, the size will be smaller, and it will support the latest communication standard.\nEmily: That sounds promising. But will the new version be compatible with the design we're using now?\nJames: Good question. We designed it to be pin-compatible, so you won't need to redesign your board. You'll only need to update the firmware and run a new round of testing.\nEmily: That's a relief. What happens to the current generation when the new one launches? We don't want to be forced to switch too early.\nJames: We understand that concern. We have a policy to keep every product available for at least five years after launch, and we'll give you twelve months' notice before any end-of-life.\nEmily: Twelve months is good. Would you also give us a last-time-buy option, in case we need extra stock?\nJames: Yes, that's standard. We'd offer a final order window of six months, and we can hold the inventory for you if needed.\nEmily: Now, regarding pricing. Will the new generation cost more?\nJames: Initially, yes, by roughly five percent, because of the new technology. But since it uses less power and fewer external parts, your total system cost should actually go down.\nEmily: I see. Can we get early samples for evaluation? We'd like to start testing as soon as possible.\nJames: We'll have engineering samples ready in about two months. I'll put your name on the early-access list, and an application engineer will contact you to arrange support.\nEmily: Excellent. If the testing goes well, we may want to move more of our volume to the new generation.\nJames: That's great to hear. We'll make sure you're a priority customer for the launch, with dedicated allocation in the first six months.\nEmily: Thanks, James. This gives me the confidence to move forward with the agreement.\nJames: My pleasure. I'll send the roadmap in writing this afternoon, so you can share it with your team.","v":[["roadmap","產品藍圖"],["power consumption","功耗"],["communication standard","通訊標準"],["compatible","相容的"],["firmware","韌體"],["end-of-life (EOL)","停產"],["last-time buy","最後採購"],["engineering sample","工程樣品"],["dedicated allocation","專屬配貨"],["early-access list","搶先體驗名單"],["priority customer","優先客戶"],["inventory","庫存"]],"g":[["Before we sign the long-term agreement, I'd like to understand...","before + 子句：在……之前；I'd like to 為禮貌用法。"],["You won't need to redesign your board.","need to + 原形動詞：需要做……；won't need to：不需要。"],["...in case we need extra stock.","in case + 子句：以防萬一。"],["Since it uses less power, your total system cost should actually go down.","since 表原因；should 表示合理推測。"],["Will the new version be compatible with the design we're using now?","be compatible with：與……相容。"]],"s":"客戶 Emily 在簽署長約前詢問產品藍圖。James 說明下一代產品預計第三季推出，功耗降低 25%、腳位相容；現有產品至少供應五年，停產前提前十二個月通知並提供最後採購機會；新品初期價格約高 5%，但整體系統成本可能下降，並提供工程樣品。","tr":["James，在我們簽署長期合約之前，我想了解貴公司產品線的發展方向。你能為我概述一下產品路線圖嗎？","當然可以。我們對未來十八個月有明確的規劃。現行世代產品明年會持續全面量產，而下一代產品將在第三季推出。","新一代產品會有哪些不同？","主要有三點。功耗大約會降低百分之二十五，尺寸會更小，而且支援最新的通訊標準。","聽起來很有前景。不過，新版本會與我們目前使用的設計相容嗎？","問得好。我們把它設計成腳位相容，所以您不需要重新設計電路板。您只需要更新韌體，並進行新一輪的測試。","那就放心了。新一代推出後，現行世代的產品會怎麼處理？我們不希望被迫太早換代。","我們理解這個顧慮。我們的政策是每項產品在上市後至少供貨五年，而且在任何停產之前，我們會提前十二個月通知您。","十二個月很好。你們是否也能提供最後採購選項，以防我們需要額外庫存？","可以，這是標準做法。我們會提供六個月的最後下單期，如有需要，我們也可以為您保管庫存。","接下來談價格。新一代產品會比較貴嗎？","一開始是的，因為採用新技術，大約貴百分之五。但由於它耗電更少、外部零件也更少，您的整體系統成本實際上應該會下降。","原來如此。我們能取得早期樣品進行評估嗎？我們想盡快開始測試。","工程樣品大約兩個月後就會準備好。我會把您的名字列入早期取得名單，並由一位應用工程師與您聯絡，安排相關支援。","太好了。如果測試順利，我們可能會把更多採購量轉移到新一代產品。","聽到這個消息真好。我們會確保您成為此次新品上市的優先客戶，在前六個月提供專屬配額。","謝謝你，James。這讓我有信心繼續推進這份合約。","這是我的榮幸。我今天下午會把路線圖以書面形式寄給您，方便您與團隊分享。"]},{"t":"Our Mission and Core Values","z":"公司使命與核心價值","ty":"article","lv":"B1","d":"Our mission is simple. We help small manufacturers work faster and waste less by giving them software that is easy to use. Since our founding twelve years ago, this goal has guided every decision we make.\nWe rely on four core values. The first is customer focus. We listen before we build, and we measure our success by the results our customers achieve. The second is integrity. We say what we mean, and we keep our promises, even when it is difficult.\nThe third value is teamwork. No single department can solve a complex problem alone, so we encourage open communication across all levels of the company. The fourth is continuous improvement. We believe that every process can be better, and we welcome honest feedback from anyone.\nThese values are not just words on a wall. We use them when we review performance, choose partners, and decide which projects deserve investment. If a plan does not support our mission, we do not pursue it, no matter how profitable it looks.","v":[["mission","使命"],["core values","核心價值"],["customer focus","以客戶為中心"],["integrity","誠信正直"],["teamwork","團隊合作"],["continuous improvement","持續改善"],["feedback","意見回饋"],["guide","引導、指引"]],"g":[["Since our founding twelve years ago, this goal has guided every decision we make.","since 加過去時間點，主要子句用現在完成式 has guided，表示從過去持續到現在。"],["We listen before we build, and we measure our success by the results our customers achieve.","before 連接兩個動作表示先後順序；results 後面省略了關係代名詞 that，our customers achieve 是修飾 results 的子句。"],["If a plan does not support our mission, we do not pursue it","這是現在式的條件句（If + 現在式，現在式），用來描述公司固定的原則或做法。"]],"s":"本文說明公司的使命，以及客戶導向、誠信、團隊合作與持續改善四大核心價值，並強調這些價值會實際用於績效評估與投資決策。","tr":["我們的使命很簡單。我們透過提供簡單易用的軟體，幫助小型製造商提高效率、減少浪費。自十二年前創立以來，這個目標一直指引著我們的每一項決策。","我們秉持四項核心價值。第一是以客戶為中心。我們先傾聽再開發，並以客戶所達成的成果來衡量我們的成功。第二是誠信。我們言行一致、信守承諾，即使這麼做並不容易。","第三項價值是團隊合作。沒有任何單一部門能獨自解決複雜的問題，因此我們鼓勵公司上下各層級之間開放溝通。第四是持續改善。我們相信每個流程都能更好，也歡迎任何人提出誠實的意見回饋。","這些價值不只是掛在牆上的口號。我們在評估績效、選擇合作夥伴，以及決定哪些專案值得投資時，都會運用這些價值。如果一項計畫無法支持我們的使命，無論看起來多麼有利可圖，我們都不會去做。"]},{"t":"Entering a New Market","z":"進入新市場","ty":"dialogue","lv":"B2","d":"Mei: Thanks for joining, Tom. I want to walk you through our plan to enter the Vietnamese market.\nTom: Great. What made you choose Vietnam over Thailand or Indonesia?\nMei: Three reasons. Demand for our product is growing about twenty percent a year, labor costs are lower, and the government offers tax incentives to foreign investors.\nTom: That sounds attractive. Who are the main competitors there?\nMei: Mostly local firms with strong distribution networks. They have a head start, so we cannot compete on price alone.\nTom: Then how do you plan to differentiate?\nMei: We will focus on quality and after-sales service. We also intend to partner with a local distributor to speed up our market entry.\nTom: What is the timeline?\nMei: We will run a pilot in Ho Chi Minh City for six months. If the results meet our targets, we will roll out nationwide next year.\nTom: Sensible. Let me review the budget and get back to you by Friday.","v":[["market entry","進入市場"],["tax incentives","租稅優惠"],["competitors","競爭對手"],["distribution networks","經銷網絡"],["head start","先行優勢"],["differentiate","做出差異化"],["pilot","試辦計畫"],["roll out","全面推出"]],"g":[["They have a head start, so we cannot compete on price alone.","so 連接原因與結果；alone 放在名詞片語後，表示僅靠價格是不夠的。"],["We also intend to partner with a local distributor to speed up our market entry.","intend to + 原形動詞表示打算；不定詞 to speed up 表示目的。"],["If the results meet our targets, we will roll out nationwide next year.","這是第一類條件句：If + 現在式，主要子句用 will，表示未來可能發生的情況。"]],"s":"兩位同事討論進入越南市場的計畫，包括選擇理由、競爭情況、差異化策略，以及先在胡志明市試辦六個月的時程。","tr":["謝謝你來，Tom。我想向你說明我們進軍越南市場的計畫。","好的。你們為什麼選擇越南，而不是泰國或印尼？","有三個原因。我們產品的需求每年成長約百分之二十，勞動成本較低，而且政府為外國投資者提供租稅優惠。","聽起來很有吸引力。那裡主要的競爭對手是誰？","大多是擁有強大配銷網路的本地企業。他們起步較早，所以我們不能只靠價格競爭。","那你們打算如何做出差異化？","我們會專注於品質與售後服務。我們也打算與當地經銷商合作，以加快進入市場的速度。","時程是如何安排的？","我們會在胡志明市進行為期六個月的試辦。如果成果達到目標，明年我們就會推廣到全國。","很合理。讓我審閱一下預算，週五前回覆你。"]},{"t":"Investing in R&D","z":"投資研發","ty":"article","lv":"B2","d":"Over the next three years, we plan to increase our research and development budget from six to ten percent of revenue. This is a significant commitment, and the board has approved it because innovation is the foundation of our long-term growth.\nOur R&D efforts will focus on three areas. First, we will develop a new generation of energy-efficient sensors that cut power use by thirty percent. Second, we will invest in artificial intelligence to improve predictive maintenance. Third, we will explore new materials that make our products lighter and more durable.\nTo support this work, we will hire forty engineers and open a second research center near the university campus. We also intend to collaborate with academic institutions, which gives us access to fresh ideas.\nResearch does not always lead to a successful product. Some projects will fail, and we accept that risk. However, we will track milestones closely, and we will stop any project that no longer fits our strategy. This discipline allows us to take bold bets without losing financial control.","v":[["research and development","研究與開發"],["revenue","營收"],["board","董事會"],["energy-efficient","節能的"],["predictive maintenance","預測性維護"],["durable","耐用的"],["collaborate","合作"],["milestones","里程碑"]],"g":[["the board has approved it because innovation is the foundation of our long-term growth.","because 引導原因子句；has approved 為現在完成式，強調已完成且影響現在的決定。"],["Second, we will invest in artificial intelligence to improve predictive maintenance.","to improve 是表示目的的不定詞；first, second, third 用來條理清楚地列出重點。"],["This discipline allows us to take bold bets without losing financial control.","allow somebody to + 原形動詞表示讓某人能夠；without + V-ing 表示在不…的情況下。"]],"s":"公司計畫三年內把研發預算提高到營收的百分之十，聚焦感測器、人工智慧與新材料，並透過嚴格追蹤里程碑來控管風險。","tr":["未來三年，我們計畫將研發預算從營收的百分之六提高到百分之十。這是一項重大承諾，董事會已經核准，因為創新是我們長期成長的基石。","我們的研發工作將聚焦於三個領域。首先，我們將開發新一代節能感測器，使耗電量降低百分之三十。其次，我們將投資人工智慧，以改善預測性維護。第三，我們將探索新材料，讓我們的產品更輕盈、更耐用。","為了支持這項工作，我們將招募四十名工程師，並在大學校園附近開設第二個研究中心。我們也打算與學術機構合作，這讓我們能夠獲得嶄新的想法。","研究並不一定都能做出成功的產品。有些專案會失敗，這個風險我們接受。不過，我們會密切追蹤各項里程碑，並終止任何不再符合我們策略的專案。這樣的紀律讓我們能夠大膽下注，同時不失財務掌控。"]},{"t":"Sustainability and ESG Goals","z":"永續與 ESG 目標","ty":"article","lv":"B2","d":"Sustainability is no longer a side project for our company. It is now part of our core strategy, and we have set clear environmental, social, and governance goals, often called ESG goals, for the next decade.\nOn the environmental side, we aim to reach net zero carbon emissions by 2040. By 2030, we will cut our emissions in half and source seventy percent of our electricity from renewable energy. We will also reduce packaging waste by eliminating single-use plastics.\nOn the social side, we are committed to fair labor practices throughout our supply chain. Every supplier must pass an annual audit, and we will provide training to help them meet our standards. Inside the company, we want women to hold forty percent of leadership roles.\nFinally, good governance means transparency. We will publish an annual sustainability report, and an independent firm will verify our data. Investors and customers increasingly expect this level of accountability, and we believe it builds trust over time.","v":[["sustainability","永續性"],["governance","公司治理"],["net zero","淨零"],["emissions","排放"],["renewable energy","再生能源"],["supply chain","供應鏈"],["audit","稽核"],["transparency","透明度"]],"g":[["It is now part of our core strategy, and we have set clear environmental, social, and governance goals","have set 為現在完成式；and 連接兩個獨立子句，說明現況與已做的行動。"],["By 2030, we will cut our emissions in half and source seventy percent of our electricity from renewable energy.","By + 未來時間點搭配 will，表示到那時之前會完成的目標；cut in half 是常用說法，意為減半。"],["Investors and customers increasingly expect this level of accountability","increasingly 是副詞，放在動詞前表示程度逐漸增加。"]],"s":"本文介紹公司未來十年的 ESG 目標，包括二〇四〇年達成淨零排放、供應商稽核、領導層性別比例，以及公開透明的永續報告。","tr":["永續發展對我們公司而言，已不再是附屬專案。它現在是我們核心策略的一部分，我們已為未來十年訂定明確的環境、社會與公司治理目標，也就是常說的 ESG 目標。","在環境方面，我們的目標是在 2040 年達到碳排放淨零。到 2030 年，我們將把排放量減半，並使電力來源有百分之七十來自再生能源。我們也將透過淘汰一次性塑膠來減少包裝廢棄物。","在社會方面，我們致力於在整個供應鏈中落實公平的勞動實務。每家供應商都必須通過年度稽核，我們也會提供訓練，協助他們達到我們的標準。在公司內部，我們希望女性能擔任百分之四十的領導職位。","最後，良好的治理意味著透明。我們將發布年度永續報告，並由獨立機構驗證我們的數據。投資人與客戶越來越期待這種程度的問責，而我們相信這會隨著時間建立信任。"]},{"t":"A Customer Visit: Company Overview","z":"客戶來訪公司簡介","ty":"dialogue","lv":"B1","d":"Anna: Welcome to our headquarters, Mr. Silva. I hope your flight was comfortable.\nCarlos: It was, thank you. Please call me Carlos. I am looking forward to learning more about your company.\nAnna: Of course. We were founded in 2008, and today we employ about eight hundred people in six countries.\nCarlos: That is impressive growth. What does your main business look like?\nAnna: We design and manufacture industrial pumps. Our biggest customers are in water treatment, food processing, and energy.\nCarlos: And what makes you different from other suppliers?\nAnna: Reliability and service. Our pumps last longer, and our support team responds within four hours, anywhere in the world.\nCarlos: That is exactly what we need. Our current supplier is often late.\nAnna: Then let me show you our factory floor. After that, we can discuss how we might work together.\nCarlos: Excellent. Lead the way.","v":[["headquarters","總部"],["founded","創立"],["employ","僱用"],["manufacture","製造"],["water treatment","水處理"],["reliability","可靠度"],["support team","支援團隊"],["factory floor","工廠生產線"]],"g":[["We were founded in 2008, and today we employ about eight hundred people in six countries.","were founded 是過去式被動語態；today 後改用現在式，對比過去與現在。"],["Our pumps last longer, and our support team responds within four hours","last longer 是比較級；within + 一段時間表示在該時間內。"],["After that, we can discuss how we might work together.","how we might work together 是名詞子句，用陳述句語序（不倒裝）；might 表示委婉的可能性。"]],"s":"安娜歡迎客戶卡洛斯來訪並簡介公司歷史、工業泵浦業務與可靠服務優勢，接著帶他參觀工廠並討論合作。","tr":["歡迎來到我們的總部，Silva 先生。希望您的班機搭乘得舒適。","很舒適，謝謝。請叫我 Carlos。我很期待進一步了解貴公司。","當然。我們成立於 2008 年，如今在六個國家擁有約八百名員工。","成長真令人印象深刻。你們的主要業務是什麼？","我們設計並製造工業用泵浦。我們最大的客戶來自水處理、食品加工和能源產業。","那麼你們與其他供應商有什麼不同？","可靠度與服務。我們的泵浦壽命更長，而且我們的支援團隊無論在世界哪個角落，都會在四小時內回應。","這正是我們需要的。我們目前的供應商經常延遲交貨。","那讓我帶您參觀我們的工廠產線。之後，我們可以討論如何合作。","太好了。請帶路。"]},{"t":"Strategic Partnership Proposal","z":"策略合作提案","ty":"dialogue","lv":"B2","d":"Grace: Thank you for meeting with us, David. We would like to propose a strategic partnership between our two companies.\nDavid: I am listening. What do you have in mind?\nGrace: Your company has excellent logistics technology, and we have a large base of retail customers. Together, we could offer a complete delivery solution.\nDavid: How would the arrangement work?\nGrace: We would integrate your platform into our service, and you would gain access to our customer network. Revenue would be shared on a sixty-forty basis.\nDavid: Who would own the data?\nGrace: Each side would keep its own data. We would only share what is necessary to run the service.\nDavid: That is reassuring. What about exclusivity?\nGrace: We are open to a limited exclusive period of two years, as long as performance targets are met.\nDavid: Interesting. Send me a written proposal, and I will discuss it with our leadership team next week.","v":[["strategic partnership","策略夥伴關係"],["logistics","物流"],["base of retail customers","零售客戶群"],["integrate","整合"],["gain access to","取得…的管道"],["revenue","營收"],["exclusivity","獨家性"],["performance targets","績效目標"]],"g":[["Together, we could offer a complete delivery solution.","could 用於提出可能性或委婉建議，語氣比 can 更客氣、不武斷。"],["We are open to a limited exclusive period of two years, as long as performance targets are met.","as long as 表示只要…就…（條件）；are met 是被動語態，不必說明誰達成。"],["Send me a written proposal, and I will discuss it with our leadership team next week.","祈使句 + and + will 句型，表示先做這件事，然後我就會做另一件事。"]],"s":"葛蕾絲向大衛提議結合物流技術與零售客戶網絡的策略合作，雙方討論了分潤比例、資料歸屬與兩年獨家期。","tr":["謝謝你與我們會面，David。我們想向貴公司提議建立策略合作夥伴關係。","我洗耳恭聽。你們有什麼構想？","貴公司擁有出色的物流技術，而我們擁有龐大的零售客戶基礎。結合起來，我們就能提供完整的配送解決方案。","這個安排會如何運作？","我們會將貴公司的平台整合到我們的服務中，而貴公司可以接觸到我們的客戶網路。收益將以六四比例分配。","數據由誰擁有？","雙方各自保有自己的數據。我們只會共享營運這項服務所必需的部分。","這讓人安心。那麼獨家性呢？","只要達成績效目標，我們願意接受為期兩年的有限獨家期。","有意思。請寄一份書面提案給我，我下週會與我們的領導團隊討論。"]},{"t":"Expanding Production Capacity","z":"擴充產能","ty":"dialogue","lv":"B1","d":"Ken: Lisa, our factory is running at ninety-five percent capacity. We cannot accept any more large orders.\nLisa: I know. Sales tells me we turned down three contracts last quarter.\nKen: That is lost revenue. I think it is time to expand production.\nLisa: What are the options?\nKen: We can add a third shift, install new machines, or build a second plant. A third shift is the fastest, but it increases labor costs.\nLisa: And the second plant?\nKen: It would double our output, but it needs a large investment and about eighteen months to complete.\nLisa: What do you recommend?\nKen: I suggest we start with new machines now, and prepare the plan for a second plant in parallel. That way, we can respond quickly without taking too much risk.\nLisa: I agree. Please prepare a cost estimate for the leadership meeting.","v":[["capacity","產能"],["turned down","拒絕（過去式）"],["contract","合約"],["expand production","擴大生產"],["shift","輪班"],["plant","工廠"],["output","產出量"],["in parallel","同步進行"]],"g":[["We cannot accept any more large orders.","cannot 表示無法；any more 用在否定句，意思是不能再接更多。"],["I suggest we start with new machines now","suggest 後面可接省略 that 的子句，動詞用原形（或 should + 原形），這裡 we start 即為此用法。"],["It would double our output, but it needs a large investment","would 表示假設性的結果；but 引出需要付出的代價，形成對比。"]],"s":"工廠產能已達百分之九十五，兩人比較增加輪班、購買新機器與興建第二座工廠，最後決定先添購機器並同步規劃新廠。","tr":["Lisa，我們的工廠目前產能利用率達百分之九十五，已經無法再接任何大型訂單了。","我知道。業務部告訴我，上一季我們推掉了三份合約。","那是損失的營收。我認為是時候擴大生產了。","有哪些選項？","我們可以增加第三班、安裝新機器，或是興建第二座工廠。增加第三班最快，但會提高人力成本。","那第二座工廠呢？","它能讓我們的產出倍增，但需要龐大的投資，而且大約要十八個月才能完工。","你有什麼建議？","我建議我們現在先添購新機器，同時並行準備第二座工廠的計畫。這樣一來，我們既能快速因應，又不必承擔太大風險。","我同意。請為領導階層會議準備一份成本估算。"]},{"t":"Digital Transformation Plan","z":"數位轉型計畫","ty":"article","lv":"B2","d":"Our digital transformation plan has one goal, which is to make the company faster, smarter, and easier to do business with. It will take place in three phases over the next two years.\nIn the first phase, we will move our core systems to the cloud. This will reduce maintenance costs and give our employees secure access to information from any location. We will also replace several outdated tools with a single platform for finance, sales, and inventory.\nIn the second phase, we will focus on data. By collecting information from every department, we can spot trends sooner and make better decisions. We will train managers to read dashboards and use analytics in their daily work.\nThe final phase is about customer experience. We will launch a new online portal where customers can place orders, track shipments, and request support at any time. Technology alone is not enough, however. We will also provide training and support, because the success of this plan depends on people who are willing to change how they work.","v":[["digital transformation","數位轉型"],["phase","階段"],["cloud","雲端"],["outdated","過時的"],["platform","平台"],["dashboard","儀表板"],["analytics","數據分析"],["portal","入口網站"]],"g":[["It will take place in three phases over the next two years.","take place 意為舉行、發生；over + 一段期間表示在這段時間內。"],["By collecting information from every department, we can spot trends sooner","By + V-ing 表示藉由某種方式；sooner 是 soon 的比較級。"],["the success of this plan depends on people who are willing to change how they work.","who are willing to 是關係子句修飾 people；how they work 是名詞子句，作 change 的受詞。"]],"s":"本文說明為期兩年、分三階段的數位轉型計畫：系統上雲、資料分析，以及新的客戶線上入口，並強調員工訓練同樣重要。","tr":["我們的數位轉型計畫只有一個目標，就是讓公司更快速、更聰明，也更容易合作。這項計畫將在未來兩年分三個階段進行。","在第一階段，我們會將核心系統遷移到雲端。這將降低維護成本，並讓員工能夠從任何地點安全地存取資訊。我們也會用單一平台取代數個過時的工具，整合財務、銷售與庫存。","在第二階段，我們將聚焦於數據。透過收集各部門的資訊，我們能更早發現趨勢，做出更好的決策。我們會訓練主管閱讀儀表板，並在日常工作中運用分析。","最後一個階段著重於客戶體驗。我們將推出全新的線上入口網站，讓客戶隨時都能下訂單、追蹤貨運並申請支援。然而，光靠技術是不夠的。我們也會提供訓練與支援，因為這項計畫的成功，取決於願意改變工作方式的人。"]},{"t":"Responding to Market Changes","z":"因應市場變化","ty":"dialogue","lv":"B2","d":"Paul: Rina, raw material prices have jumped fifteen percent, and two competitors have already cut their prices. How should we respond?\nRina: I would not rush into a price war. Our margins are already thin.\nPaul: Agreed. But if we do nothing, we might lose market share.\nRina: Then let us look at costs first. We can renegotiate with suppliers and reduce waste on the production line.\nPaul: That will take time. What can we do in the short term?\nRina: We could offer long-term contracts to our key customers at a stable price. That protects our relationships and gives us predictable demand.\nPaul: Good idea. And in the long term?\nRina: We should develop higher-value products so we depend less on price. Customers will pay more for features they truly need.\nPaul: Makes sense. Let us hold a strategy meeting on Thursday.\nRina: I will prepare the numbers and invite the sales team.","v":[["raw material","原物料"],["price war","價格戰"],["margin","利潤率"],["market share","市占率"],["renegotiate","重新協商"],["production line","生產線"],["in the short term","短期內"],["higher-value products","高附加價值產品"]],"g":[["I would not rush into a price war.","would not 用於委婉表達個人看法或建議；rush into 意為倉促投入。"],["if we do nothing, we might lose market share.","If + 現在式，主要子句用 might，表示可能發生的後果。"],["We should develop higher-value products so we depend less on price.","so 在此表示目的，意為以便；less 是 little 的比較級，表示程度較低。"]],"s":"面對原物料上漲與對手降價，兩人決定不打價格戰，而是降低成本、提供長期合約，並發展高附加價值產品。","tr":["Rina，原物料價格上漲了百分之十五，而且已有兩家競爭對手降價。我們該如何因應？","我不建議貿然捲入價格戰。我們的利潤本來就已經很薄了。","同意。但如果我們什麼都不做，可能會失去市占率。","那我們先檢視成本吧。我們可以與供應商重新議價，並減少生產線上的浪費。","那需要一些時間。短期內我們能做什麼？","我們可以向主要客戶提供穩定價格的長期合約。這樣既能維繫客戶關係，也能讓我們掌握可預期的需求。","好主意。那長期呢？","我們應該開發更高附加價值的產品，減少對價格的依賴。客戶願意為真正需要的功能付出更多。","有道理。我們週四開個策略會議吧。","我會準備數據，並邀請業務團隊參加。"]},{"t":"Investor Update Call","z":"投資人說明電話","ty":"dialogue","lv":"B2","d":"Operator: Welcome to the quarterly investor call. I will now hand over to our CFO, Helen Park.\nHelen: Thank you, and good morning everyone. I will begin with the headline numbers. Revenue for the third quarter was two hundred ten million dollars, up eight percent from last year.\nMark: Helen, this is Mark from Redwood Capital. What drove that growth?\nHelen: Mainly our software subscriptions, which grew eighteen percent. Hardware sales were flat.\nMark: And what about profitability?\nHelen: Operating margin improved to fourteen percent, thanks to better cost control. We expect it to reach sixteen percent by year end.\nMark: Is your full-year guidance still unchanged?\nHelen: Yes, we are maintaining our guidance of eight hundred and fifty million in revenue.\nMark: Any risks we should be aware of?\nHelen: Currency fluctuations and slower demand in Europe. We are monitoring both carefully.\nMark: Thank you, that is very clear.","v":[["investor call","投資人電話會議"],["CFO","財務長"],["headline numbers","重點數字"],["subscriptions","訂閱服務"],["flat","持平"],["operating margin","營業利益率"],["guidance","財測"],["currency fluctuations","匯率波動"]],"g":[["Revenue for the third quarter was two hundred ten million dollars, up eight percent from last year.","up eight percent 是補充說明的形容詞片語，表示成長幅度；from last year 指比較基準。"],["Operating margin improved to fourteen percent, thanks to better cost control.","thanks to 意為多虧、由於，後面接名詞片語。"],["We expect it to reach sixteen percent by year end.","expect somebody/something to + 原形動詞，表示預期某事會發生。"]],"s":"財務長在投資人電話會議中報告第三季營收成長百分之八、營業利益率改善，維持全年財測，並說明匯率與歐洲需求的風險。","tr":["歡迎參加季度投資人電話會議。現在交給我們的財務長 Helen Park。","謝謝，各位早安。我先從重點數字開始。第三季營收為兩億一千萬美元，較去年成長百分之八。","Helen，我是 Redwood Capital 的 Mark。是什麼帶動了這樣的成長？","主要是我們的軟體訂閱業務，成長了百分之十八。硬體銷售則持平。","那獲利能力呢？","由於成本控管改善，營業利益率提升至百分之十四。我們預期到年底可達到百分之十六。","全年財測是否維持不變？","是的，我們維持全年營收八億五千萬美元的財測。","有什麼風險是我們需要留意的嗎？","匯率波動以及歐洲需求放緩。我們正在密切監控這兩項因素。","謝謝，說明得非常清楚。"]},{"t":"Product Roadmap Presentation","z":"產品藍圖簡報","ty":"article","lv":"B1","d":"Today I will present our product roadmap for the next eighteen months. A roadmap shows what we plan to build, when we plan to release it, and why it matters to our customers.\nIn the first six months, we will focus on improving our current mobile app. Customers have asked for faster loading times and a simpler design, so these updates are our top priority. We will release the new version in March.\nBetween months seven and twelve, we will add a reporting feature that lets users create custom charts. This is our most requested feature, and we expect it to attract larger business customers. We will test it with a small group of users before the full launch.\nIn the last six months, we will begin work on an integration with popular accounting software. This depends on our partners, so the dates may change. Please remember that a roadmap is a plan, not a promise. We will review it every quarter and adjust it as we learn more from the market.","v":[["roadmap","藍圖、發展路線圖"],["release","發行、推出"],["top priority","首要優先事項"],["feature","功能"],["custom","客製化的"],["launch","上市"],["integration","整合"],["adjust","調整"]],"g":[["Customers have asked for faster loading times and a simpler design, so these updates are our top priority.","have asked 為現在完成式；faster 與 simpler 是比較級；so 表示因此。"],["This is our most requested feature, and we expect it to attract larger business customers.","most requested 是最高級，表示最受要求的功能；larger 為比較級。"],["a roadmap is a plan, not a promise.","not 用來否定後面的名詞，強調對比，意為是計畫而非承諾。"]],"s":"簡報介紹未來十八個月的產品藍圖：先改善行動應用程式，再新增報表功能，最後與會計軟體整合，並提醒藍圖會定期調整。","tr":["今天我將介紹我們未來十八個月的產品路線圖。路線圖會說明我們打算開發什麼、何時推出，以及這對客戶為什麼重要。","在最初的六個月，我們將專注於改善現有的行動應用程式。客戶要求更快的載入速度和更簡潔的設計，因此這些更新是我們的首要任務。我們將在三月推出新版本。","在第七到第十二個月，我們將新增報表功能，讓使用者能建立自訂圖表。這是需求最多的功能，我們預期它能吸引規模更大的企業客戶。在正式上線前，我們會先讓一小群使用者測試。","在最後六個月，我們將開始開發與主流會計軟體的整合。這取決於我們的合作夥伴，因此時程可能會有變動。請記住，路線圖是計畫，而不是承諾。我們每季都會檢討，並隨著對市場的了解加深而調整。"]},{"t":"Building a Resilient Supply Chain","z":"打造有韌性的供應鏈","ty":"article","lv":"B2","d":"Recent global disruptions have shown how fragile supply chains can be. A single port closure or factory shutdown can delay production for weeks. For this reason, building resilience is now a strategic priority for our company.\nOur approach has three parts. First, we are diversifying our supplier base. Instead of relying on one source for each critical component, we are qualifying at least two suppliers in different regions. This reduces the risk of a single point of failure.\nSecond, we are increasing safety stock for the parts that are hard to replace. Holding more inventory raises costs, but the expense is much smaller than the cost of a production stoppage.\nThird, we are investing in visibility. A new tracking system will show us the location of every shipment in real time, so we can react before small problems become serious. We are also running regular stress tests, in which we simulate disruptions and check how quickly we recover. These exercises help us find weaknesses before they cost us money.","v":[["disruption","中斷、混亂"],["fragile","脆弱的"],["resilience","韌性"],["diversify","多元化"],["critical component","關鍵零組件"],["single point of failure","單點故障"],["safety stock","安全庫存"],["visibility","可視性、透明度"]],"g":[["Instead of relying on one source for each critical component, we are qualifying at least two suppliers","Instead of + V-ing 表示不是…而是…；are qualifying 為現在進行式，表示正在進行的作法。"],["Holding more inventory raises costs, but the expense is much smaller than the cost of a production stoppage.","Holding more inventory 是動名詞片語作主詞；much smaller than 是比較級加強語氣。"],["we can react before small problems become serious.","before 引導時間子句，說明在問題變嚴重之前就先處理。"]],"s":"為了打造有韌性的供應鏈，公司分散供應商、增加關鍵零件的安全庫存、建立即時追蹤系統，並定期進行壓力測試。","tr":["近來的全球性動盪顯示供應鏈有多麼脆弱。一個港口關閉或一間工廠停工，就可能讓生產延遲數週。因此，建立韌性如今已成為本公司的策略重點。","我們的做法有三個部分。首先，我們正在讓供應商基礎多元化。我們不再每項關鍵零組件只依賴單一來源，而是在不同地區至少認證兩家供應商。這可降低單點失效的風險。","第二，我們正在提高難以替代零件的安全庫存。持有較多庫存會增加成本，但這筆支出遠小於生產停擺的代價。","第三，我們正投資於可視性。新的追蹤系統能即時顯示每一批貨物的位置，讓我們能在小問題演變成嚴重問題之前就採取行動。我們也定期進行壓力測試，模擬各種中斷情境，並檢視我們多快能恢復。這些演練有助於我們在弱點造成損失之前就找出來。"]},{"t":"Talent and Culture","z":"人才與企業文化","ty":"article","lv":"B1","d":"A strong strategy needs strong people. That is why talent and culture are at the center of our plan for the next five years.\nFirst, we want to attract the best people. We are improving our hiring process so that candidates receive a clear answer within two weeks. We are also building closer ties with universities and offering paid internships to promising students.\nSecond, we want to keep and develop our employees. Every person will have a personal development plan, and managers will meet with their teams each month to discuss progress and goals. We will also offer training in leadership, technology, and communication.\nFinally, we want a culture where people feel respected and trusted. We support flexible working hours, and we encourage people to share ideas without fear of criticism. When employees feel valued, they stay longer and work harder. In our experience, a positive culture is not a luxury. It is one of the most powerful competitive tools a company can have.","v":[["talent","人才"],["culture","文化"],["candidates","應徵者"],["internships","實習"],["development plan","發展計畫"],["flexible working hours","彈性工時"],["valued","受到重視的"],["competitive","有競爭力的"]],"g":[["We are improving our hiring process so that candidates receive a clear answer within two weeks.","so that 引導目的子句，說明改善流程的目的；within 表示在一段期限內。"],["we encourage people to share ideas without fear of criticism.","encourage somebody to + 原形動詞；without fear of 表示不必擔心。"],["When employees feel valued, they stay longer and work harder.","When 引導的子句說明條件或時機；longer 與 harder 為比較級，表示程度增加。"]],"s":"本文說明公司如何透過改善招募、個人發展計畫與彈性且互信的文化，吸引並留住人才，把企業文化視為競爭工具。","tr":["強大的策略需要優秀的人才。這就是為什麼人才與文化是我們未來五年計畫的核心。","首先，我們希望吸引最優秀的人才。我們正在改善招募流程，讓應徵者在兩週內得到明確的答覆。我們也在加強與大學的聯繫，並為有潛力的學生提供有薪實習。","其次，我們希望留住並培養員工。每個人都會有個人發展計畫，主管每月會與團隊面談，討論進度與目標。我們也將提供領導力、科技與溝通方面的訓練。","最後，我們希望打造一種讓人感到被尊重與信任的文化。我們支持彈性工時，並鼓勵大家毫無顧忌地分享想法，不必擔心被批評。當員工感到受重視，就會待得更久、工作更努力。就我們的經驗而言，正向的文化不是奢侈品，而是企業所能擁有的最強大競爭工具之一。"]},{"t":"Mergers and Acquisitions Basics","z":"併購基本概念","ty":"article","lv":"B2","d":"Mergers and acquisitions, often shortened to M&A, are common ways for companies to grow quickly. In a merger, two companies combine to form a new one. In an acquisition, one company buys another and takes control of it.\nCompanies pursue M&A for several reasons. They may want to enter a new market, gain new technology, remove a competitor, or achieve economies of scale. A larger company can often spread its fixed costs over more products and lower the cost of each unit.\nThe process usually begins with identifying a target. Next comes due diligence, in which the buyer carefully examines the target's finances, contracts, and legal risks. If the findings are satisfactory, the two sides negotiate a price and sign an agreement.\nHowever, the deal is only the beginning. Many acquisitions fail because of poor integration. Systems do not match, key employees leave, and cultures clash. For this reason, successful buyers plan the integration early and communicate openly with staff. A deal that looks excellent on paper still needs careful execution to create real value.","v":[["merger","合併"],["acquisition","收購"],["takes control of","取得…的控制權"],["economies of scale","規模經濟"],["fixed costs","固定成本"],["due diligence","盡職調查"],["negotiate","協商"],["integration","整合"]],"g":[["In a merger, two companies combine to form a new one.","to form 為表示結果或目的的不定詞；one 代替前面的 company，避免重複。"],["If the findings are satisfactory, the two sides negotiate a price and sign an agreement.","這是描述一般流程的條件句，兩個子句都用現在式。"],["A deal that looks excellent on paper still needs careful execution to create real value.","that looks excellent on paper 是關係子句修飾 deal；on paper 意為理論上、紙面上。"]],"s":"本文介紹併購的基本概念：合併與收購的差異、常見動機、盡職調查流程，以及許多併購因整合不佳而失敗的原因。","tr":["併購，常簡稱為 M&A，是企業快速成長的常見方式。合併是指兩家公司結合成一家新公司。收購則是一家公司買下另一家並取得控制權。","企業進行併購有幾個原因。他們可能想進入新市場、取得新技術、消除競爭對手，或達成規模經濟。規模較大的公司通常能將固定成本分攤到更多產品上，降低每單位的成本。","這個過程通常從找出目標公司開始。接下來是盡職調查，買方會仔細檢視目標公司的財務、合約與法律風險。如果調查結果令人滿意，雙方便會協商價格並簽署協議。","然而，交易只是開始。許多收購案因整合不善而失敗：系統無法相容、關鍵員工離職、文化相互衝突。因此，成功的買方會及早規劃整合，並與員工公開溝通。一筆在紙面上看起來很出色的交易，仍需要審慎執行才能創造真正的價值。"]},{"t":"Competitive Advantage Discussion","z":"競爭優勢討論","ty":"dialogue","lv":"B2","d":"Sam: Julia, a board member asked me today what our real competitive advantage is. I want to give a clear answer.\nJulia: Good question. I would say it is our speed. We develop custom solutions in half the time our rivals need.\nSam: But speed alone is easy to copy, isn't it?\nJulia: True. That is why the second part matters. Our engineers have deep knowledge of our clients' industries, and that expertise takes years to build.\nSam: What about our technology?\nJulia: We hold twelve patents, which protect our core process. However, I think the customer relationships are even more valuable.\nSam: Why do you say that?\nJulia: Because our clients stay with us for an average of nine years. They trust us, and switching to another supplier would be costly for them.\nSam: So the advantage is a combination of speed, expertise, and trust.\nJulia: Exactly. Competitors can match one of those, but matching all three is very hard.","v":[["competitive advantage","競爭優勢"],["rivals","對手"],["expertise","專業知識"],["patents","專利"],["core process","核心流程"],["customer relationships","客戶關係"],["switching","轉換"],["combination","組合"]],"g":[["But speed alone is easy to copy, isn't it?","附加問句 isn't it? 用來向對方確認或徵求同意；肯定句接否定附加問句。"],["We hold twelve patents, which protect our core process.","which 引導非限定關係子句，補充說明前面整個主句的資訊，前面有逗號。"],["Competitors can match one of those, but matching all three is very hard.","matching all three 是動名詞片語作主詞；but 表示對比。"]],"s":"兩位同事討論公司的競爭優勢，結論是速度、產業專業知識與客戶信任三者結合，才是對手難以複製的優勢。","tr":["Julia，今天有一位董事問我，我們真正的競爭優勢是什麼。我想給出明確的答案。","問得好。我會說是我們的速度。我們開發客製化解決方案所需的時間只有對手的一半。","但光是速度很容易被複製，不是嗎？","沒錯。所以第二點很重要。我們的工程師對客戶所屬的產業有深入的了解，而這種專業需要多年才能累積。","那我們的技術呢？","我們擁有十二項專利，保護著我們的核心流程。不過，我認為客戶關係更有價值。","為什麼這麼說？","因為我們的客戶平均與我們合作九年。他們信任我們，而且換到其他供應商對他們來說成本很高。","所以優勢是速度、專業與信任的結合。","沒錯。競爭對手可以追上其中一項，但要三項都做到非常困難。"]},{"t":"Annual Town Hall Message","z":"年度全員大會致詞","ty":"article","lv":"B1","d":"Good morning, everyone, and thank you for joining our annual town hall. Before I begin, I want to thank every person in this room and online. This year was not easy, but you showed great commitment.\nLet me share a few highlights. We grew revenue by twelve percent, launched two new products, and opened our office in Singapore. Most importantly, customer satisfaction reached its highest level in five years. These results belong to all of you.\nLooking ahead, our priorities are clear. We will invest more in innovation, strengthen our customer relationships, and keep our focus on safety and quality. There will be challenges, including rising costs and tougher competition. However, I am confident that we can meet them together.\nI also want to hear from you. After this speech, we will open the floor for questions, and nothing is off limits. Your ideas make this company better. Thank you for your hard work, and thank you for believing in what we are building.","v":[["town hall","全員大會"],["commitment","投入、承諾"],["highlights","亮點"],["revenue","營收"],["customer satisfaction","客戶滿意度"],["priorities","優先事項"],["open the floor","開放發言"],["off limits","禁止（討論）的"]],"g":[["This year was not easy, but you showed great commitment.","but 連接前後對比的句子；showed 是過去式，說明已經結束的一年。"],["We grew revenue by twelve percent, launched two new products, and opened our office in Singapore.","三個過去式動詞以並列結構呈現（A, B, and C），讓成就條列清楚。"],["I am confident that we can meet them together.","be confident that + 子句，表示對某事有信心；meet challenges 意為應付挑戰。"]],"s":"執行長在年度全員大會上感謝員工，分享營收成長與新據點等成果，說明未來重點，並邀請大家提問。","tr":["各位早安，謝謝大家參加我們的年度全員大會。在開始之前，我想感謝在場以及線上的每一位同仁。今年並不容易，但各位展現了高度的投入。","讓我分享幾項亮點。我們的營收成長了百分之十二，推出了兩項新產品，並開設了新加坡辦公室。最重要的是，客戶滿意度達到五年來的最高水準。這些成果屬於在座的每一位。","展望未來，我們的優先事項很明確。我們將加大創新投資，強化客戶關係，並持續重視安全與品質。我們會面臨挑戰，包括成本上升與競爭加劇。不過，我有信心我們能攜手克服。","我也想聽聽大家的意見。演講結束後，我們將開放提問，沒有任何禁忌話題。你們的想法讓這家公司變得更好。感謝大家的辛勞，也感謝大家相信我們正在打造的事業。"]},{"t":"Regional Strategy: Europe","z":"區域策略：歐洲市場","ty":"dialogue","lv":"B2","d":"Nina: Alex, I have finished the draft of our European strategy. Do you have a few minutes?\nAlex: Sure. Where do you want to start?\nNina: Germany and the Netherlands. They are our strongest markets, and we plan to deepen our presence there by opening a regional office in Frankfurt.\nAlex: What about Southern Europe?\nNina: Growth potential is high, but customers there prefer to buy through local agents. So we will sign agreements with trusted distributors in Spain and Italy.\nAlex: Are there any regulatory issues?\nNina: Yes. We must comply with new data protection rules and product safety standards. I have included a compliance plan in the report.\nAlex: And the pricing?\nNina: Prices will be in euros, adjusted by country. We will also hedge currency risk with our bank.\nAlex: Looks thorough. Let us present it to the executive team on Monday.","v":[["regional office","區域辦公室"],["deepen our presence","深耕據點"],["growth potential","成長潛力"],["local agents","當地代理商"],["distributors","經銷商"],["regulatory","法規的"],["comply with","遵守"],["hedge currency risk","對沖匯率風險"]],"g":[["They are our strongest markets, and we plan to deepen our presence there by opening a regional office in Frankfurt.","strongest 是最高級；by + V-ing 表示藉由某種方式；there 代替前面提到的地點。"],["customers there prefer to buy through local agents.","prefer to + 原形動詞表示偏好做某事。"],["We must comply with new data protection rules and product safety standards.","must 表示必須，語氣強烈，常用於法規義務；comply with 後接規範。"]],"s":"妮娜向亞歷克斯報告歐洲市場策略：在法蘭克福設區域辦公室、在南歐透過當地經銷商拓展，並處理法規遵循與匯率風險。","tr":["Alex，我已經完成歐洲策略的草稿了。你有幾分鐘時間嗎？","當然。你想從哪裡開始？","德國和荷蘭。它們是我們最強的市場，我們計畫在法蘭克福設立區域辦公室，深耕當地。","南歐呢？","成長潛力很高，但當地客戶偏好透過本地代理商購買。所以我們會與西班牙和義大利值得信賴的經銷商簽約。","有任何法規方面的問題嗎？","有。我們必須遵守新的資料保護規範和產品安全標準。我已在報告中附上合規計畫。","那定價呢？","價格將以歐元計價，並依各國情況調整。我們也會與銀行合作對匯率風險進行避險。","看起來很周全。我們週一向高階主管團隊簡報吧。"]},{"t":"Looking Ahead: Five-Year Outlook","z":"展望未來五年","ty":"article","lv":"B2","d":"Over the next five years, we expect our industry to change more than it has in the past twenty. Automation, artificial intelligence, and shifting customer expectations will reshape how products are designed, made, and sold.\nOur goal is to double revenue to two billion dollars by 2031. We plan to reach this target through three engines of growth. The first is our core business, where we will deepen relationships with existing customers. The second is international expansion, particularly in Asia and Europe. The third is new services, such as data analytics and subscription maintenance, which bring in recurring income.\nTo support this growth, we will invest in people and technology. Roughly half of our capital spending will go to automation and digital tools, while the rest will fund new facilities and research.\nWe recognize that the future is uncertain, so we will stay flexible. Each year, we will review our assumptions and adjust our plans if conditions change. A strategy is only useful if it can adapt, and our aim is to remain both ambitious and realistic.","v":[["target","目標"],["automation","自動化"],["reshape","重塑"],["engines of growth","成長引擎"],["expansion","擴張"],["recurring income","經常性收入"],["capital spending","資本支出"],["assumptions","假設"]],"g":[["we expect our industry to change more than it has in the past twenty","more than it has 是比較子句，has 後面省略 changed，並用現在完成式比較過去二十年。"],["Roughly half of our capital spending will go to automation and digital tools, while the rest will fund new facilities and research.","while 在此表示對比，連接前後兩部分的資金用途。"],["A strategy is only useful if it can adapt","only if 表示唯有在…條件下才…，強調適應力的重要性。"]],"s":"本文描述公司未來五年的展望：在自動化與人工智慧改變產業之際，以核心業務、國際擴張與新服務為成長引擎，並保持彈性調整。","tr":["未來五年，我們預期本產業的變化將超過過去二十年。自動化、人工智慧以及不斷變化的客戶期望，將重塑產品的設計、製造與銷售方式。","我們的目標是在 2031 年前將營收倍增至二十億美元。我們計畫透過三大成長引擎來達成。第一是核心業務，我們將深化與既有客戶的關係。第二是國際擴張，特別是亞洲和歐洲。第三是新服務，例如資料分析和訂閱式維護，它們能帶來經常性收入。","為了支持這項成長，我們將投資於人才與技術。大約一半的資本支出將用於自動化和數位工具，其餘則用於新設施與研究。","我們明白未來充滿不確定性，因此會保持彈性。每年我們都會檢討假設，並在情況改變時調整計畫。策略必須能夠調適才有用，我們的目標是同時保持企圖心與務實。"]}],"more":""},{"id":"meetings","en":"Meetings & Projects","zh":"會議與專案進度","ds":"專案狀態會議、季度營運檢討與跨部門協調。","lessons":[{"t":"Weekly Project Status Meeting","z":"每週專案進度會議","ty":"dialogue","lv":"B2","d":"Rachel: Good morning, everyone. Let's get started with the weekly status meeting for the new router project. Tom, can you begin with the hardware update?\nTom: Sure. We completed the second prototype last Friday. The board works well overall, but we found an overheating issue near the power module.\nRachel: How serious is it?\nTom: At full load, the temperature reaches ninety-five degrees, which is above our limit of eighty-five. We think a larger heat sink will solve it, and I've asked the mechanical team to review the design.\nRachel: Does the larger heat sink affect the schedule?\nTom: Slightly. It will add about one week, because we need to order new parts and rebuild a few units.\nRachel: Okay. Wendy, what's the status of testing?\nWendy: We've finished about sixty percent of the test plan. So far, we've found twelve defects, and eight of them are already fixed. The remaining four are minor, and none of them will block the release.\nRachel: That's good news. What about the wireless performance test?\nWendy: That's the one I'm worried about. The throughput is lower than the target in crowded environments. We need more time to analyze the data, and I'd like Tom's team to help with the tuning.\nTom: No problem. I can assign two engineers starting Monday, but they'll have to pause the heat sink work for a few days.\nRachel: Let's prioritize the wireless issue, since it's a key selling point. Tom, can your team handle the heat sink in parallel with a smaller group?\nTom: I think so, if the mechanical team gives me one engineer. I'll talk to them this afternoon.\nRachel: Great. Now, regarding the schedule, our original release date is the end of next month. With the extra week for the heat sink and the wireless tuning, are we still on track?\nWendy: It will be tight. If we find no new major issues, we can make it. But I'd recommend we add a buffer of one week.\nRachel: I agree. I'll inform the customer that the release date may move to the first week of the following month, and I'll confirm after next week's results.\nTom: That sounds reasonable. I'd rather tell them early than surprise them later.\nRachel: Exactly. Let me recap the action items. Tom, confirm the heat sink design by Wednesday. Wendy, share the wireless test data by Tuesday. I'll update the customer on Thursday.\nWendy: Got it.\nTom: Understood. I'll send my update by email as well.\nRachel: Thanks, everyone. Let's meet again next Monday at the same time.","v":[["status meeting","進度會議"],["prototype","原型機"],["overheating","過熱"],["heat sink","散熱片"],["full load","滿載"],["defect","缺陷"],["block the release","阻礙發布"],["throughput","傳輸量"],["tuning","調校"],["prioritize","優先處理"],["in parallel","並行"],["buffer","緩衝時間"],["action item","待辦事項"],["on track","照進度進行"]],"g":[["...ninety-five degrees, which is above our limit of eighty-five.","which 引導非限定關係子句，補充說明數字。"],["I'd rather tell them early than surprise them later.","would rather A than B：寧願 A 也不要 B（兩邊都用原形動詞）。"],["If we find no new major issues, we can make it.","條件句；make it：趕上、做得到。"],["Let's prioritize the wireless issue, since it's a key selling point.","Let's + 原形動詞：提議；since 說明理由。"],["Are we still on track?","on track：進度正常，專案會議常用詞。"]],"s":"專案經理 Rachel 主持進度會議。硬體遇到過熱問題，需更大散熱片，會多花約一週；測試已完成 60%，無線效能是主要風險。團隊決定優先處理無線問題，增加一週緩衝，並通知客戶發布日期可能延後，最後複述各人待辦事項。","tr":["大家早安，我們開始新路由器專案的每週進度會議。Tom，請你先報告硬體進度。","好的。我們上週五完成了第二版原型。整體來說電路板運作良好，但我們發現電源模組附近有過熱的問題。","問題有多嚴重？","在滿載時溫度會達到九十五度，超過我們設定的八十五度上限。我們認為換用更大的散熱片就能解決，我也已請機構團隊檢視設計。","更大的散熱片會影響時程嗎？","會有一點影響。大約會多出一週，因為我們需要訂購新零件並重新組裝幾台機器。","好的。Wendy，測試進度如何？","我們已完成約百分之六十的測試計畫。到目前為止共發現十二個缺陷，其中八個已經修復。其餘四個都是輕微問題，不會影響發布。","這是好消息。那無線效能測試呢？","這是我最擔心的部分。在擁擠的環境中，傳輸量低於目標值。我們需要更多時間分析資料，也希望 Tom 的團隊能協助調校。","沒問題。我可以從週一起指派兩位工程師過去，不過他們得暫停散熱片的工作幾天。","無線問題是關鍵賣點，我們就優先處理它。Tom，你的團隊能用較少的人力同步進行散熱片的工作嗎？","我想可以，前提是機構團隊能撥給我一位工程師。我今天下午會去跟他們談。","太好了。接下來談時程，我們原訂的發布日期是下個月底。加上散熱片多出的一週，以及無線調校，我們還趕得上嗎？","會很緊湊。如果沒有發現新的重大問題，我們可以趕上。但我建議多預留一週的緩衝時間。","我同意。我會通知客戶發布日期可能延到再下個月的第一週，並在下週結果出來後再確認。","聽起來很合理。我寧可提早告訴他們，也不要之後讓他們措手不及。","沒錯。讓我整理一下待辦事項。Tom，請在週三前確認散熱片設計。Wendy，請在週二前分享無線測試資料。我會在週四向客戶更新進度。","了解。","明白。我也會另外用電子郵件寄出我的進度更新。","謝謝大家。我們下週一同一時間再開會。"]},{"t":"Quarterly Business Review Highlights","z":"季度營運檢討重點","ty":"article","lv":"B2","d":"Welcome to our quarterly business review. In this session, I will summarize our performance in the last quarter, explain what went well, and discuss the areas where we need to improve.\nLet's begin with the numbers. Total revenue reached forty-two million dollars, which is eleven percent higher than the same period last year. Gross margin improved slightly, from twenty-six to twenty-seven percent, mainly because we reduced our freight costs and negotiated better prices with two key suppliers.\nBy region, North America performed the strongest, with growth of eighteen percent. Europe grew steadily at seven percent, while Asia was flat because of weaker demand in consumer electronics. Industrial and automotive customers were the main drivers of growth across all regions.\nOn the operational side, our on-time delivery rate was ninety-six percent, slightly below our target of ninety-eight. Most late shipments were caused by shortages of two specific components. We have already secured additional supply, and we expect the delivery rate to recover next quarter.\nFor customer satisfaction, our survey score was four point four out of five. Customers praised our responsiveness and technical support, but several mentioned that our order tracking system is difficult to use. We have started a project to improve it, and a new version will be available in about three months.\nLooking ahead, we have three priorities for next quarter: first, close the gap in on-time delivery; second, launch two new products; and third, expand our sales team in Europe by hiring four people. We will review progress at the next meeting.\nThank you for your attention. If you have any questions about the figures, please contact the finance team after the meeting, and we will gladly provide the details.","v":[["quarterly","每季的"],["gross margin","毛利率"],["flat","持平"],["driver","驅動因素"],["on-time delivery rate","準時交貨率"],["shortage","短缺"],["secure supply","取得供應"],["responsiveness","回應速度"],["close the gap","縮小差距"],["figures","數據"],["recover","回升"],["priority","優先事項"]],"g":[["...forty-two million dollars, which is eleven percent higher than the same period last year.","比較級前加百分比，表示高出多少。"],["...mainly because we reduced our freight costs...","mainly because：主要因為。"],["Europe grew steadily at seven percent, while Asia was flat.","while 表示對比（然而）。"],["We expect the delivery rate to recover next quarter.","expect + 受詞 + to V：預期……會……。"],["If you have any questions..., please contact the finance team.","If 子句 + 祈使句，用於結尾邀請提問。"]],"s":"這是一份季度營運檢討簡報：營收 4,200 萬美元，年增 11%，毛利率小幅提升；北美成長最強，亞洲持平；準時交貨率 96%，略低於目標；客戶滿意度 4.4 分。下一季重點是改善準時交貨、推出兩項新品、在歐洲增加四名業務。","tr":["歡迎參加我們的季度業務檢討會議。在這場會議中，我將總結上一季的表現，說明哪些方面做得好，並討論需要改進的地方。","我們先從數字開始。總營收達到四千二百萬美元，比去年同期成長百分之十一。毛利率從百分之二十六小幅提升到百分之二十七，主要是因為我們降低了運費成本，並與兩家主要供應商談到更好的價格。","按地區來看，北美表現最強，成長百分之十八。歐洲穩定成長百分之七，而亞洲因消費性電子產品需求較弱而持平。工業和汽車客戶是各地區成長的主要動力。","在營運方面，我們的準時交貨率為百分之九十六，略低於百分之九十八的目標。大部分延遲出貨是由兩種特定零件短缺所造成。我們已確保取得額外供應，預期交貨率將在下一季回升。","在客戶滿意度方面，我們的調查分數為四點四分（滿分五分）。客戶稱讚我們反應迅速、技術支援良好，但有數位客戶提到我們的訂單追蹤系統不容易使用。我們已啟動改善專案，新版本預計約三個月後上線。","展望下一季，我們有三項優先要務：第一，縮小準時交貨率的差距；第二，推出兩項新產品；第三，在歐洲招募四人以擴編業務團隊。我們將在下次會議中檢視進度。","感謝各位的聆聽。如果對這些數字有任何疑問，會後請聯絡財務團隊，我們很樂意提供詳細資料。"]},{"t":"Kick-off Meeting for a New Project","z":"新專案啟動會議","ty":"dialogue","lv":"B1","d":"Anna: Good morning, everyone. Thanks for joining the kick-off for the customer portal project.\nBen: Morning, Anna. Could you start with the project goals, please?\nAnna: Of course. We aim to launch the portal by the end of September, and the budget is fixed at two hundred thousand dollars.\nBen: That is a tight timeline. Who will be the main contact for each workstream?\nAnna: Priya will lead design, and Tom will manage development. I will act as the project sponsor.\nBen: Good. What are the biggest risks you can see right now?\nAnna: The main risk is the integration with the old billing system. We need an early test to confirm that it works.\nBen: Agreed. Shall we set up a short check-in every Monday morning so that problems come up early?\nAnna: Yes, let's do that. I will send the calendar invitations and the project charter right after this meeting.\nBen: Perfect. If anyone has questions before then, they can contact me directly.","v":[["kick-off","啟動會議"],["workstream","工作流程／工作項目"],["project sponsor","專案贊助人"],["budget is fixed","預算已固定"],["tight timeline","時程緊迫"],["integration","整合"],["check-in","定期簡短確認會議"],["project charter","專案章程"]],"g":[["We aim to launch the portal by the end of September","aim to + 原形動詞表示「目標是…」，用來說明計畫的目的與期限。"],["Shall we set up a short check-in every Monday morning so that problems come up early?","Shall we...? 用來禮貌地提出建議；so that 引導目的子句，表示「以便…」。"],["I will send the calendar invitations and the project charter right after this meeting.","will 表示說話當下做的承諾或安排；right after 表示「緊接在…之後」。"]],"s":"Anna 在新專案啟動會議中說明目標、預算、分工與主要風險，並約定每週一固定簡短確認進度。","tr":["大家早安，感謝各位參加客戶入口網站專案的啟動會議。","早安，Anna。可以請你先說明專案目標嗎？","當然。我們的目標是在九月底前上線入口網站，預算固定為二十萬美元。","時程相當緊迫。每個工作項目的主要聯絡人是誰？","Priya 負責設計，Tom 負責管理開發。我則擔任專案發起人。","好。你認為目前最大的風險是什麼？","主要風險是與舊計費系統的整合。我們需要及早測試，確認它能正常運作。","同意。我們是否可以在每週一早上安排一個簡短的進度確認，讓問題能及早浮現？","好，就這麼辦。會議結束後我會立刻寄出行事曆邀請和專案章程。","太好了。在那之前如果有任何問題，大家可以直接聯絡我。"]},{"t":"Weekly Sync with Overseas Team","z":"與海外團隊週會","ty":"dialogue","lv":"B1","d":"Mei: Hi Jack, thanks for staying late. I know it is already evening in your time zone.\nJack: No problem, Mei. It is the only slot that works for both teams, so I do not mind.\nMei: Let's begin with the status update. We finished the user interface last Friday, so we are on track.\nJack: Great news. On our side, the database migration is about two days behind schedule.\nMei: What is causing the delay?\nJack: We found some duplicate records, and cleaning them up is taking longer than expected.\nMei: I see. Do you need any support from our team?\nJack: Maybe. Could someone from your side review the data rules we are using?\nMei: Sure, I will ask Lina to look at them tomorrow and send you her comments by noon your time.\nJack: That would help a lot. I will post a summary in the shared channel after we hang up.","v":[["status update","進度更新"],["time zone","時區"],["slot","時段"],["on track","進度符合預期"],["database migration","資料庫遷移"],["behind schedule","進度落後"],["duplicate records","重複資料"],["shared channel","共用頻道"]],"g":[["It is the only slot that works for both teams, so I do not mind.","that works for both teams 是關係子句修飾 slot；so 連接結果，表示「所以…」。"],["We found some duplicate records, and cleaning them up is taking longer than expected.","動名詞 cleaning 作主詞；longer than expected 是比較級，表示比預期更久。"],["Could someone from your side review the data rules we are using?","Could ... ? 是禮貌請求；we are using 是省略關係代名詞的子句，修飾 rules。"]],"s":"Mei 與海外同事 Jack 召開週會，交換進度並討論資料庫遷移延遲的原因，同意由 Lina 協助檢查資料規則。","tr":["嗨，Jack，謝謝你留晚一點。我知道你那邊的時區已經是晚上了。","沒關係，Mei。這是兩個團隊都能配合的唯一時段，所以我不介意。","我們先從進度更新開始。我們上週五完成了使用者介面，所以進度符合預期。","太好了。我們這邊的資料庫遷移大約落後兩天。","是什麼原因造成延遲？","我們發現一些重複的紀錄，清理工作比預期花更多時間。","我明白了。你們需要我們團隊提供任何支援嗎？","也許需要。你們那邊有沒有人可以檢視我們正在使用的資料規則？","當然，我會請 Lina 明天看一下，並在你們當地時間中午前把她的意見寄給你。","那會很有幫助。通話結束後，我會在共用頻道貼出摘要。"]},{"t":"Resolving a Schedule Conflict","z":"解決時程衝突","ty":"dialogue","lv":"B2","d":"Carlos: Sarah, I have a problem. Both the marketing launch and the software release are scheduled for the fifteenth.\nSarah: I saw that yesterday. Our developers cannot finish testing before the twentieth.\nCarlos: If we move the release, the marketing campaign will lose its momentum, and we have already paid for the advertising.\nSarah: Understood. However, releasing an unstable product would damage our reputation far more than a short delay.\nCarlos: That is a fair point. Is there any way to release only the core features on the fifteenth?\nSarah: Possibly. If we postpone the reporting module, the team could deliver a stable core version on time.\nCarlos: That would work for marketing, provided that the campaign messages focus on the main features.\nSarah: Then let's propose a phased release to the steering committee. I will prepare a revised plan by Wednesday.\nCarlos: Excellent. I will adjust the campaign material in the meantime and confirm the costs with our agency.","v":[["scheduled for","排定於"],["momentum","動能／氣勢"],["unstable","不穩定的"],["reputation","聲譽"],["core features","核心功能"],["postpone","延後"],["phased release","分階段發布"],["steering committee","指導委員會"]],"g":[["If we move the release, the marketing campaign will lose its momentum","第一類條件句：if + 現在式，主要子句用 will，表示可能發生的情況與結果。"],["releasing an unstable product would damage our reputation far more than a short delay","動名詞片語作主詞；would 表示假設性的結果；far more than 強調比較差距。"],["That would work for marketing, provided that the campaign messages focus on the main features.","provided that 表示「只要…」，引導條件。"]],"s":"行銷上市與軟體發布撞期，Carlos 與 Sarah 討論後提議先發布核心功能、其餘分階段推出，並報請指導委員會核准。","tr":["Sarah，我遇到一個問題。行銷上市活動和軟體發布都排在十五日。","我昨天看到了。我們的開發人員無法在二十日前完成測試。","如果我們延後發布，行銷活動就會失去聲勢，而且廣告費我們已經付了。","了解。不過，發布不穩定的產品對我們聲譽的傷害，遠比短暫的延遲大得多。","你說得有道理。有沒有可能在十五日只發布核心功能？","有可能。如果我們把報表模組延後，團隊就能準時交付穩定的核心版本。","這對行銷來說可行，前提是活動訊息要聚焦在主要功能上。","那我們就向指導委員會提出分階段發布的建議。我會在週三前準備好修訂後的計畫。","太好了。我同時會調整活動素材，並與我們的廣告代理商確認費用。"]},{"t":"Presenting a Risk Report","z":"呈現風險報告","ty":"article","lv":"B2","d":"Every project carries risk, and a good risk report helps decision makers act before small problems become expensive ones. When you present a risk report, start with the overall picture. Tell your audience how many risks are open, how many are rated high, and whether the trend is improving or getting worse.\nNext, focus on the three or four risks that matter most. For each one, explain what could happen and what the impact would be on cost, schedule, or quality. Senior managers want to understand the consequences, not the engineering.\nThen show what you are doing about each risk. A mitigation plan should name an owner and a deadline, so that nobody has to guess who is responsible. If you need a decision or extra support, say so clearly. For example, you might ask the committee to approve a backup supplier before the end of the month.\nFinally, invite questions and confirm the next review date. A calm, structured presentation builds trust, because it shows that you have the situation under control.","v":[["risk report","風險報告"],["trend","趨勢"],["rated high","評為高風險"],["senior managers","高階主管"],["impact","影響"],["mitigation plan","風險緩解計畫"],["owner","負責人"],["backup supplier","備用供應商"]],"g":[["a good risk report helps decision makers act before small problems become expensive ones","help + 受詞 + 原形動詞（或 to 動詞）表示「幫助某人做…」；before 引導時間子句。"],["A mitigation plan should name an owner and a deadline, so that nobody has to guess who is responsible.","should 表示建議；so that 表示目的；who is responsible 為名詞子句作 guess 的受詞。"],["A calm, structured presentation builds trust, because it shows that you have the situation under control.","because 引導原因子句；that 子句作 shows 的受詞；現在完成式 have ... under control 表示已掌握狀況。"]],"s":"簡報風險報告時，先說明整體狀況，再聚焦最重要的風險、緩解計畫與負責人，並明確提出需要的決策與下次檢討日期。","tr":["每個專案都有風險，而一份好的風險報告能幫助決策者在小問題演變成昂貴的大問題之前採取行動。在提出風險報告時，先從整體概況開始。告訴聽眾目前有多少未結風險、其中有多少被評為高風險，以及趨勢是在改善還是惡化。","接著，聚焦在最重要的三、四項風險。針對每一項，說明可能發生什麼事，以及對成本、時程或品質的影響。高階主管想了解的是後果，而不是工程細節。","然後說明你針對每項風險採取了什麼對策。緩解計畫應指明負責人和期限，這樣就不會有人需要猜測誰該負責。如果你需要決策或額外支援，請明確說出來。例如，你可以請委員會在月底前核准一家備援供應商。","最後，邀請大家提問，並確認下次檢討的日期。冷靜、有條理的簡報能建立信任，因為這顯示你已掌握了狀況。"]},{"t":"Design Review Meeting","z":"設計審查會議","ty":"dialogue","lv":"B1","d":"Nina: Thanks for coming to the design review. Today we will go through the new mobile app screens.\nOmar: Great. I noticed that the checkout page has too many steps. Customers might give up before paying.\nNina: That is a good point. We tested it with five users, and two of them were confused by the address form.\nOmar: Could we combine the address and payment steps into one page?\nNina: We could, but it would make the page look crowded on small phones.\nOmar: What if we use a collapsible section for the address? Users could expand it only when they need it.\nNina: I like that idea. It keeps the page clean and still reduces the number of screens.\nOmar: Also, the buttons on the home page are quite small. They do not meet the accessibility guidelines.\nNina: You are right. I will increase the size and check the colour contrast again.\nOmar: Thanks. Let's review the updated version on Thursday, and then we can sign off the design.","v":[["design review","設計審查"],["checkout page","結帳頁面"],["give up","放棄"],["collapsible section","可收合區塊"],["crowded","擁擠的"],["accessibility guidelines","無障礙指引"],["colour contrast","色彩對比"],["sign off","正式核准"]],"g":[["Customers might give up before paying.","might 表示可能性較低的推測；before + 動名詞 paying 表示「在付款之前」。"],["What if we use a collapsible section for the address?","What if...? 用來提出假設性的建議。"],["They do not meet the accessibility guidelines.","meet 在此表示「符合（標準）」；否定句用 do not + 原形動詞。"]],"s":"設計審查會議中，Omar 指出結帳流程步驟過多與按鈕太小，Nina 同意改用可收合區塊並調整按鈕，週四再審一次。","tr":["謝謝大家參加設計檢討會議。今天我們將逐一檢視新的行動應用程式畫面。","太好了。我注意到結帳頁面的步驟太多，顧客可能會在付款前就放棄。","這個觀點很好。我們找了五位使用者測試，其中兩位對地址表單感到困惑。","我們能把地址和付款步驟合併成同一頁嗎？","可以，但這會讓頁面在小螢幕手機上看起來太擁擠。","如果地址改用可收合的區塊呢？使用者只在需要時才展開。","我喜歡這個想法。它能保持頁面簡潔，同時仍減少畫面數量。","另外，首頁的按鈕相當小，不符合無障礙設計準則。","你說得對。我會加大尺寸，並重新檢查色彩對比。","謝謝。我們週四再檢視更新後的版本，然後就可以核准這份設計。"]},{"t":"Taking and Sharing Meeting Minutes","z":"撰寫與分享會議紀錄","ty":"article","lv":"B1","d":"Meeting minutes are a written record of what was discussed and decided. Good minutes save time, because people who missed the meeting can catch up quickly, and those who attended can check what they agreed to do.\nTake notes during the meeting, but do not try to write down every word. Focus on decisions, action items, owners, and deadlines. If something is unclear, politely ask the speaker to repeat it. It is better to interrupt for a moment than to record the wrong information.\nWrite the minutes as soon as possible after the meeting, ideally within twenty-four hours, while the discussion is still fresh in your mind. Use a simple format with the date, the attendees, the main topics, and a list of actions. Short sentences and bullet points make the document easy to scan.\nBefore you share the minutes with a wider group, send a draft to the chair for approval. After that, circulate the final version by email or post it in the team folder. Remind everyone to reply if they notice any mistakes.","v":[["meeting minutes","會議紀錄"],["catch up","趕上進度"],["action items","待辦事項"],["deadline","截止日期"],["attendees","出席者"],["scan","快速瀏覽"],["chair","主席／會議主持人"],["circulate","傳閱／分發"]],"g":[["Good minutes save time, because people who missed the meeting can catch up quickly","because 引導原因；who missed the meeting 為關係子句修飾 people。"],["It is better to interrupt for a moment than to record the wrong information.","It is better to A than to B 表示「與其 B 不如 A」，A 與 B 結構需平行。"],["Write the minutes as soon as possible after the meeting, ideally within twenty-four hours","祈使句給予指示；as soon as possible 表示「儘快」；ideally 為修飾整句的副詞。"]],"s":"好的會議紀錄應聚焦於決議、待辦事項、負責人與期限，在會後儘快完成並經主持人確認後再分享給大家。","tr":["會議紀錄是對討論內容與決議的書面記錄。好的會議紀錄能節省時間，因為沒參加會議的人可以快速跟上進度，出席的人也可以確認自己同意要做的事。","會議中要做筆記，但不要試圖逐字記下。重點放在決議、待辦事項、負責人和期限。如果有不清楚的地方，請禮貌地請發言者重複一次。短暫打斷一下，總比記錄錯誤的資訊來得好。","會議結束後要盡快撰寫會議紀錄，最好在二十四小時內完成，趁討論內容仍記憶猶新。使用簡單的格式，包含日期、出席者、主要議題和行動清單。簡短的句子和條列式重點能讓文件一目了然。","在與更多人分享會議紀錄之前，先把草稿寄給主席核准。之後再以電子郵件發送最終版本，或張貼在團隊資料夾中。提醒大家如果發現任何錯誤，請回覆告知。"]},{"t":"Handling Disagreements in a Meeting","z":"會議中處理意見不合","ty":"dialogue","lv":"B2","d":"Helen: Raj, I would like to hear your concerns about the vendor proposal before we vote.\nRaj: Thanks, Helen. Frankly, I think the price is too high, and I do not see enough evidence that the quality is better.\nHelen: I understand where you are coming from. Daniel, would you like to respond?\nDaniel: Yes. I see it differently. Their support team has a strong record, and that matters when something goes wrong.\nRaj: I agree that support is important, but we could negotiate a better service agreement with our current supplier.\nHelen: Let me summarise. Raj is worried about cost, and Daniel is focused on reliability. Is that fair?\nDaniel: Yes, that is a fair summary.\nRaj: Perhaps we are not so far apart. I would support the proposal if they reduced the price by ten percent.\nHelen: Then let's ask the vendor for a revised offer and revisit the decision on Friday. Does everyone accept that?\nDaniel: Fine with me.\nRaj: Agreed.","v":[["vendor proposal","供應商提案"],["frankly","坦白說"],["evidence","證據"],["strong record","良好的過往紀錄"],["negotiate","協商"],["service agreement","服務協議"],["summarise","總結"],["revisit","重新檢視"]],"g":[["I understand where you are coming from.","where you are coming from 是名詞子句，整句用來表示理解對方的立場。"],["I would support the proposal if they reduced the price by ten percent.","第二類條件句：if + 過去式，主要子句用 would，表示假設性的條件。"],["Let me summarise.","Let me + 原形動詞 用來禮貌地表示「讓我來…」，常用於整理各方意見。"]],"s":"Helen 主持會議時引導 Raj 與 Daniel 平和表達不同意見，總結雙方立場後，決定請供應商提出降價方案，週五再討論。","tr":["Raj，在表決之前，我想聽聽你對供應商提案的疑慮。","謝謝，Helen。坦白說，我認為價格太高，而且我看不到足夠的證據顯示品質比較好。","我了解你的想法。Daniel，你想回應嗎？","好的。我的看法不同。他們的支援團隊有很好的紀錄，而這在出問題時非常重要。","我同意支援很重要，但我們可以和現有供應商協商更好的服務協議。","讓我總結一下。Raj 擔心成本，Daniel 則著重可靠性。這樣說公平嗎？","是的，這樣總結很公平。","也許我們的立場沒有那麼遠。如果他們把價格降低百分之十，我就會支持這項提案。","那我們就請供應商提出修訂後的報價，並在週五重新討論這項決定。大家都接受嗎？","我沒問題。","同意。"]},{"t":"Budget Review Meeting","z":"預算檢討會議","ty":"dialogue","lv":"B2","d":"Grace: Thanks for joining the budget review, Paul. Let's look at the numbers for the third quarter.\nPaul: Sure. We have spent about eighty-five percent of the allocated budget, but the project is only seventy percent complete.\nGrace: That means we are over budget. Where is the extra cost coming from?\nPaul: Mainly from contractor fees. We hired two extra consultants to fix the data quality problems.\nGrace: Was that approved in advance?\nPaul: Not formally, and I apologise for that. I should have raised it earlier.\nGrace: Let's focus on the solution. What is the forecast for the remaining work?\nPaul: If nothing changes, we will exceed the budget by about forty thousand dollars.\nGrace: Can we reduce that by delaying the training sessions until next quarter?\nPaul: Yes, that would save around fifteen thousand. I will also renegotiate the consultants' rates.\nGrace: Good. Please send me a revised forecast by Friday so that I can take it to finance.","v":[["budget review","預算檢討"],["allocated budget","已分配預算"],["over budget","超出預算"],["contractor fees","外包人員費用"],["approved in advance","事先核准"],["forec
