<style>
/* Layout: single-column mobile-first app; sticky top bar, card lists, fixed bottom player in lesson view */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6b7a; --line:#d8dee4;
  --accent:#0b6e6a; --accent-ink:#ffffff; --accent-soft:#d9efed;
  --b:#a8480a; --b-soft:#fbe9d8; --active:#fff3c9;
  --display:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  --body:"Inter","Noto Sans TC",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1419; --surface:#16202a; --ink:#e7edf2; --muted:#93a4b3; --line:#27343f;
    --accent:#4cc2bb; --accent-ink:#06201f; --accent-soft:#12312f;
    --b:#f0a65a; --b-soft:#3a2a17; --active:#34301a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1419; --surface:#16202a; --ink:#e7edf2; --muted:#93a4b3; --line:#27343f;
  --accent:#4cc2bb; --accent-ink:#06201f; --accent-soft:#12312f;
  --b:#f0a65a; --b-soft:#3a2a17; --active:#34301a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-bottom:40px}
.wrap.has-player{padding-bottom:120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
.crumb{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:10px 0 0;max-width:52ch}
.warn{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--b-soft);color:var(--b);font-size:14px}
.grid{display:grid;gap:12px;margin-top:20px;grid-template-columns:1fr}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.tcard{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.tcard:hover,.tcard:focus-visible{border-color:var(--accent)}
.tcard .en{font-family:var(--display);font-size:19px;font-weight:700}
.tcard .zh{font-size:15px;color:var(--accent);font-weight:500}
.tcard .ds{font-size:14px;color:var(--muted)}
.tcard .meta{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.thead{padding:22px 0 6px}
.thead h1{font-size:clamp(24px,6vw,32px)}
.thead .zh{color:var(--accent);font-weight:500;margin-top:4px}
.thead p{color:var(--muted);font-size:14px;margin:8px 0 0}
.list{display:flex;flex-direction:column;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
a.row:hover,a.row:focus-visible{background:var(--accent-soft)}
.row .n{flex:none;width:28px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-family:var(--display)}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:500;font-size:15px;line-height:1.35}
.row .z{font-size:13px;color:var(--muted)}
.row.soon{opacity:.55}
.tag{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.soon{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.ok{background:var(--accent);color:var(--accent-ink)}
.lhead{padding:20px 0 4px}
.lhead h1{font-size:clamp(22px,5.5vw,30px)}
.lhead .zh{color:var(--accent);font-weight:500;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
details.set{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.set summary{cursor:pointer;font-size:14px;font-weight:500}
.sgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:560px){.sgrid{grid-template-columns:1fr 1fr 1fr}}
.sgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.sgrid select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.lines{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.line{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:0}
.line.sp1{border-left-color:var(--b)}
.line.sp2{border-left-color:var(--muted)}
.line.active{background:var(--active);border-color:var(--accent)}
.line .who{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.line.sp1 .who{color:var(--b)}
.line.sp2 .who{color:var(--muted)}
.line .en{display:block;font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.line .zhl{display:block;margin-top:4px;font-size:15px;line-height:1.5;color:var(--muted)}
.notr .zhl{display:none}
.hide .line:not(.reveal) .en{filter:blur(7px);user-select:none}
.panel{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box h3{font-size:16px;margin-bottom:8px}
.box p{margin:0}
.vl{display:grid;grid-template-columns:1fr;gap:0;margin:0;padding:0;list-style:none}
.vl li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.vl li:first-child{border-top:0}
.vl b{font-weight:600;overflow-wrap:anywhere}
.vl span{color:var(--accent);text-align:right;flex:none;max-width:55%}
.gl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.gl em{display:block;font-style:normal;font-weight:600;overflow-wrap:anywhere}
.gl span{font-size:14px;color:var(--muted)}
.player{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.pin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.pbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.pbtn.main{width:56px;height:56px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:20px}
.pcnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.prog{max-width:760px;margin:8px auto 0;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.sec{font-size:20px;margin:28px 0 0}
.vtools{margin-top:14px}
.vsearch{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)}
.vcnt{font-size:13px;color:var(--muted);align-self:center}
.vlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.vw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.vh{display:flex;gap:12px;align-items:center}
.vt{flex:1;min-width:0}
.vword{font-family:var(--display);font-size:20px;font-weight:700;overflow-wrap:anywhere}
.vp{font-size:13px;color:var(--muted);font-style:italic}
.vzh{color:var(--accent);font-weight:500;margin-top:2px}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.spk.sm{width:34px;height:34px}
.spk:active{background:var(--accent);color:var(--accent-ink)}
.knw{flex:none;min-height:34px;padding:4px 10px;font-size:13px}
.vex{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.vex>div{min-width:0}
.vee{font-size:15.5px;line-height:1.5;overflow-wrap:anywhere}
.vez{font-size:14px;color:var(--muted);line-height:1.45}
.vmore{align-self:center;margin-top:6px}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div id="app"></div>
<script>
const TOPICS=[{"id":"supply","en":"Supply Chain & Delivery","zh":"供應鏈與交期確認","ds":"客人確認料件供應、交期變動、分批出貨與物流安排。","lessons":[{"t":"Confirming Delivery Dates for Key Components","z":"確認關鍵料件的交貨日期","ty":"dialogue","lv":"B2","d":"Sarah: Hi David, thanks for taking my call. I'm checking on the delivery status of purchase order 4582, the one for the power management chips.\nDavid: Hello Sarah, good to hear from you. Yes, I have the order in front of me. You requested fifty thousand units, with delivery by the fifteenth of next month, correct?\nSarah: That's right. Our production line is scheduled to start on the twentieth, so we really can't afford any delay.\nDavid: I understand. Let me be upfront with you. The chip supplier has told us that the wafer allocation is tight this quarter, so the lead time has stretched from ten weeks to fourteen weeks.\nSarah: Fourteen weeks? That's a big change. We were quoted ten weeks when we placed the order six weeks ago.\nDavid: I know, and I apologize for the inconvenience. The quote was based on the supplier's information at that time. Since then, demand from the automotive sector has increased sharply.\nSarah: So what does that mean for our shipment? Are you saying we won't receive anything before the twentieth?\nDavid: Not exactly. We've been working with the supplier to split the order. We can confirm twenty thousand units for the original date, and the remaining thirty thousand would arrive about three weeks later.\nSarah: A partial shipment might work, but I need to check with our planning team. Can you guarantee the first batch will arrive on time?\nDavid: I can commit to the first batch, since those units are already in our warehouse and have passed inspection. The remaining units are still in production, so that date is an estimate for now.\nSarah: Is there any chance to expedite the second batch? We would be willing to pay for air freight if that helps.\nDavid: That's a good option. Air freight could save about five days compared with sea freight. I'll ask our logistics team for a quote and send it to you by tomorrow afternoon.\nSarah: Thank you. Also, could you look into whether an alternative part is available? If there is a pin-compatible chip, we could qualify it quickly.\nDavid: Certainly. I'll check with our engineers. Please keep in mind that any alternative would need your approval and probably some testing on your side.\nSarah: Of course. Our quality team can run a sample test within a week if we receive the samples soon.\nDavid: Great. Let me summarize what we've agreed. First, we'll ship twenty thousand units on the fifteenth. Second, I'll send you an air freight quote by tomorrow. Third, I'll find out about the alternative chip and send you the datasheet by Friday.\nSarah: That sounds right. One more thing, please send me a written update every Monday until the order is complete, so I can keep my management informed.\nDavid: No problem at all. I'll send a status report each Monday morning, including the production progress and the shipping schedule.\nSarah: Perfect. I appreciate your transparency, David. It makes my job much easier when I know the risks early.\nDavid: Thank you, Sarah. We value your business, and we'll do everything we can to keep your line running.\nSarah: Then I'll wait for your email tomorrow. Have a good afternoon.\nDavid: You too. Goodbye.","v":[["lead time","交期（從下單到交貨的時間）"],["purchase order (PO)","採購單"],["wafer allocation","晶圓配額"],["expedite","加急處理"],["air freight","空運"],["partial shipment","分批出貨"],["pin-compatible","腳位相容"],["qualify (a part)","驗證料件可用"],["datasheet","規格書"],["commit to","承諾"],["transparency","透明度"],["inspection","檢驗"]],"g":[["We were quoted ten weeks when we placed the order.","被動語態 be quoted：被報價。重點是「被告知交期」，不需說明是誰報的。"],["Could you look into whether an alternative part is available?","look into（調查）+ whether 間接問句，語氣比直接問 Is there... 更禮貌。"],["I can commit to the first batch, since those units are already in our warehouse.","since 表示原因（因為），放在句中補充理由，商務溝通常用來說明承諾的根據。"],["Let me be upfront with you.","開場坦白說明壞消息的固定說法，意思是「我先直接告訴您」。"],["If there is a pin-compatible chip, we could qualify it quickly.","條件句搭配 could，表示可能但不保證，語氣較保守。"]],"s":"客戶 Sarah 詢問晶片採購單的交貨狀況。業務 David 坦白告知晶圓配額緊張，交期由十週拉長為十四週，提出分批出貨（先出兩萬顆）、評估空運加急，以及尋找腳位相容替代料件三個方案，並承諾每週一提供書面進度報告。","tr":["大衛，謝謝你接我的電話。我想確認採購單 4582 的交貨狀況，就是電源管理晶片那一張。","莎拉，你好，很高興接到你的來電。是的，我手邊正好有這張訂單。你訂了五萬個，要求下個月十五日前交貨，對嗎？","沒錯。我們的生產線預定二十日開工，所以真的承受不起任何延遲。","我了解。我就直接跟你說明吧。晶片供應商告訴我們，本季晶圓配額很吃緊，所以交期已經從十週拉長到十四週。","十四週？變動很大耶。六週前下單時，你們報給我們的是十週。","我知道，造成不便我們深感抱歉。當時的報價是根據供應商當時提供的資訊。之後，汽車產業的需求大幅攀升。","那這對我們的出貨有什麼影響？你是說二十日之前我們什麼都收不到嗎？","也不完全是。我們一直在和供應商協商拆單。我們可以確定原訂日期交付兩萬個，其餘三萬個大約會晚三週到貨。","分批出貨也許可行，但我得先和我們的規劃團隊確認。你能保證第一批會準時到嗎？","第一批我可以承諾，因為那些貨已經在我們倉庫裡，也通過檢驗了。其餘的還在生產中，所以那個日期目前只是預估。","有沒有可能加快第二批？如果有幫助，我們願意支付空運費用。","這是個好選項。空運比海運大約可以快五天。我會請物流團隊報價，明天下午前寄給你。","謝謝。另外，可以幫我查一下有沒有替代料件嗎？如果有腳位相容的晶片，我們可以很快完成認證。","當然。我會請工程師確認。請記得，任何替代料都需要你們核准，你們這邊大概也需要做一些測試。","那是當然。只要我們很快收到樣品，品質團隊可以在一週內完成樣品測試。","太好了。讓我總結一下我們的共識。第一，我們十五日出貨兩萬個。第二，我明天會寄給你空運報價。第三，我會查明替代晶片的狀況，並在週五前把資料表寄給你。","沒錯。還有一件事，請在訂單完成前，每週一給我一份書面進度更新，讓我可以向主管報告。","沒問題。我會在每週一早上寄出狀況報告，內容包括生產進度與出貨時程。","太好了。大衛，謝謝你的透明坦誠。能及早掌握風險，我的工作輕鬆多了。","謝謝你，莎拉。我們很重視你這個客戶，一定會盡全力讓你的產線持續運轉。","那我就等你明天的電子郵件了。祝你下午愉快。","你也是。再見。"]},{"t":"Weekly Supply Chain Update","z":"每週供應鏈進度報告","ty":"article","lv":"B2","d":"Good morning, everyone. Let me walk you through this week's supply chain update, focusing on three areas: component availability, logistics, and risks for the coming month.\nFirst, component availability. Most of our passive components, such as resistors and capacitors, are stable, with lead times of six to eight weeks. However, memory chips and power management ICs remain constrained. Our suppliers have told us that lead times for these items will probably stay above fourteen weeks until at least the end of the first quarter.\nTo reduce the impact, our procurement team has taken three actions. We placed longer-term purchase orders to secure capacity, we asked suppliers to share their production schedules every two weeks, and we started qualifying second sources for the five most critical parts.\nSecond, logistics. Ocean freight rates have decreased by about eight percent compared with last month, but port congestion in some regions is still causing delays of three to five days. For urgent shipments, we continue to use air freight, although this increases the cost by roughly four times. Therefore, we only recommend it when a production line is at risk of stopping.\nThird, risks. We are watching two main issues. One is the possibility of a labor strike at a major port, which could affect about fifteen percent of our inbound shipments. The other is currency fluctuation, which might change our material costs by two to three percent. We have prepared backup routes, and we are reviewing our hedging policy with the finance team.\nIn terms of customers, we recommend that the sales team communicate early and clearly. If a delay is likely, tell the customer as soon as possible, offer partial shipments if you can, and give a realistic date instead of an optimistic one. Customers value reliability more than speed.\nTo summarize, the situation is manageable, but it requires close attention. Please send any questions to me by Friday, and I will include the answers in next week's update. Thank you for your time.","v":[["passive components","被動元件（電阻、電容等）"],["constrained","供應受限的"],["procurement","採購"],["secure capacity","確保產能"],["second source","第二供應來源"],["ocean freight","海運"],["port congestion","港口壅塞"],["inbound shipment","進貨貨物"],["currency fluctuation","匯率波動"],["hedging","避險"],["backup route","備用路線"],["manageable","可掌控的"]],"g":[["Let me walk you through this week's supply chain update.","walk someone through：逐步帶某人了解，簡報開場常用。"],["...although this increases the cost by roughly four times.","although 引導讓步子句；by roughly four times 表示增加的幅度。"],["...a labor strike at a major port, which could affect about fifteen percent of our inbound shipments.","which 引導非限定關係子句，補充說明前面整件事的影響。"],["We recommend that the sales team communicate early and clearly.","recommend that + 主詞 + 原形動詞（假設語氣），不加 s。"],["Customers value reliability more than speed.","more than 比較級，用來強調相對重要性。"]],"s":"這是一段供應鏈主管的每週簡報，分三大部分：料件供應（被動元件穩定、記憶體與電源管理 IC 持續吃緊）、物流（海運運費下降但港口壅塞，空運成本約四倍）、風險（港口罷工與匯率波動）。最後建議業務盡早、清楚地向客戶溝通延遲，並給出實際可行的日期。","tr":["各位早安。讓我為大家說明本週的供應鏈更新，重點放在三個方面：零組件供應狀況、物流，以及未來一個月的風險。","首先是零組件供應狀況。我們大部分的被動元件，例如電阻和電容，供應穩定，交期為六到八週。然而，記憶體晶片和電源管理 IC 仍然吃緊。供應商告訴我們，這些品項的交期很可能會維持在十四週以上，至少持續到第一季底。","為了降低影響，我們的採購團隊採取了三項行動。我們下了較長期的採購訂單以確保產能，要求供應商每兩週分享生產排程，並開始為五項最關鍵的料件認證第二貨源。","第二是物流。海運費率比上個月下降了約百分之八，但部分地區的港口壅塞仍造成三到五天的延遲。緊急貨件我們持續使用空運，不過這會使成本增加約四倍。因此，我們只建議在產線有停擺風險時才使用。","第三是風險。我們正在關注兩個主要問題。一是主要港口可能發生罷工，這可能影響我們約百分之十五的進貨。另一個是匯率波動，可能使我們的物料成本變動百分之二到三。我們已準備好備用路線，也正與財務團隊檢討避險政策。","在客戶方面，我們建議業務團隊要及早且清楚地溝通。如果可能延遲，請盡快告知客戶，能的話提供分批出貨，並給出務實而非樂觀的日期。客戶重視可靠性勝過速度。","總結來說，情況尚在可控範圍，但需要密切關注。有任何問題請在週五前寄給我，我會把答案納入下週的更新。謝謝大家。"]},{"t":"Delay Notification to a Customer","z":"通知客戶出貨延遲","ty":"dialogue","lv":"B1","d":"Anna: Hello Mark, this is Anna from Brightline Components. I'm calling about purchase order 4521.\nMark: Hi Anna. I hope the shipment is on schedule.\nAnna: Unfortunately, it isn't. Our wafer supplier delayed the batch by one week, so we can't ship on Friday.\nMark: That's a problem. Our assembly line starts on the twentieth, and we have no spare stock.\nAnna: I understand. The new ship date is the twenty-fifth, but I can send half of the order by air to help you.\nMark: How much would the air freight cost?\nAnna: We will cover the extra cost this time, because the delay is on our side.\nMark: I appreciate that. Could you send me the revised schedule in writing today?\nAnna: Of course. I'll email it within the hour, and I'll give you an update every two days until it ships.\nMark: Thanks. Please call me right away if the date changes again.","v":[["delayed","延遲"],["purchase order","採購單"],["batch","批次"],["spare stock","備用庫存"],["ship date","出貨日期"],["air freight","空運"],["revised schedule","修訂後的時程"],["cover the extra cost","負擔額外費用"]],"g":[["Our wafer supplier delayed the batch by one week, so we can't ship on Friday.","so 引導結果子句：前面是原因（供應商延遲），後面是結果（無法出貨）。by one week 表示延遲的幅度。"],["I can send half of the order by air to help you.","can 表示能力或可行的提議；by air 表示運送方式；to help you 是表示目的的不定詞。"],["I'll give you an update every two days until it ships.","I'll 是未來承諾；every two days 表示頻率；until 引導時間子句，其中用現在式 ships 表示未來。"]],"s":"供應商通知客戶訂單因晶圓延誤而晚一週出貨，並提出部分空運與書面更新時程的補救方案。","tr":["馬克你好，我是 Brightline Components 的安娜。我打來是關於採購單 4521。","嗨，安娜。希望出貨一切按時進行。","很遺憾沒有。我們的晶圓供應商把這一批延後了一週，所以週五無法出貨。","這下麻煩了。我們的組裝線二十日開工，而且沒有備用庫存。","我了解。新的出貨日期是二十五日，不過我可以將一半的訂單用空運寄給你，幫你應急。","空運費用要多少？","這次額外的費用由我們吸收，因為延遲是我們這邊造成的。","感謝。你今天可以把修訂後的時程以書面寄給我嗎？","當然。我一小時內就用電子郵件寄給你，在出貨之前，我每兩天會向你更新一次。","謝謝。如果日期再有變動，請立刻打電話給我。"]},{"t":"Allocation and Shortage of Memory Chips","z":"記憶體晶片配貨與缺料","ty":"dialogue","lv":"B2","d":"Leo: Priya, I saw your allocation notice for the memory chips. How bad is the shortage?\nPriya: It's significant. Demand from data centers has tightened the market, so we can only supply seventy percent of your forecast this quarter.\nLeo: Seventy percent won't cover our production plan. Can you prioritize us as a long-term customer?\nPriya: We'll try. Allocation is decided by the factory based on past volumes and open commitments.\nLeo: Our commitments are firm. We placed non-cancelable orders in March.\nPriya: That helps. I'll escalate your account and ask for an additional two hundred thousand units.\nLeo: If that fails, would you accept a different density grade with the same footprint?\nPriya: Possibly, but your engineers would need to approve it first.\nLeo: I'll ask them to check the datasheet today. Please confirm the final allocation by Thursday.\nPriya: Understood. I'll call you as soon as I hear from the factory.","v":[["allocation","配貨"],["shortage","缺料"],["forecast","預測"],["prioritize","優先處理"],["non-cancelable orders","不可取消訂單"],["escalate","向上反映"],["density grade","容量等級"],["footprint","封裝尺寸"]],"g":[["Demand from data centers has tightened the market, so we can only supply seventy percent of your forecast this quarter.","現在完成式 has tightened 表示影響持續至今；so 引出結果。"],["If that fails, would you accept a different density grade with the same footprint?","第二類條件句的禮貌用法：If 子句用現在式，主句用 would，讓提議聽起來較委婉。"],["Possibly, but your engineers would need to approve it first.","would need to 以委婉語氣表達必要條件；first 強調先決步驟。"]],"s":"記憶體晶片因需求吃緊而只能配貨七成，業務人員將向上反映爭取更多數量，並討論替代規格。","tr":["普莉亞，我看到你們發的記憶體晶片配額通知了。缺貨情況有多嚴重？","相當嚴重。資料中心的需求讓市場吃緊，所以本季我們只能供應你們預測量的百分之七十。","百分之七十無法滿足我們的生產計畫。你們能把我們當成長期客戶優先處理嗎？","我們會努力。配額是由工廠根據過去的採購量和未結承諾來決定的。","我們的承諾是確定的。我們三月就下了不可取消的訂單。","這很有幫助。我會把你們的帳戶往上呈報，並爭取額外二十萬個。","如果不成，你們能接受相同封裝尺寸、不同容量等級的產品嗎？","有可能，但必須先經過你們工程師核准。","我今天就請他們查看資料表。請在週四前確認最終配額。","了解。一得到工廠的回覆，我就立刻打給你。"]},{"t":"Requesting an Updated Delivery Schedule","z":"要求更新交貨排程","ty":"dialogue","lv":"B1","d":"Sara: Hi Tom. Could you send me an updated delivery schedule for the next three months?\nTom: Sure. Is there a particular reason, Sara?\nSara: Yes. Our production plan changed last week, so some dates no longer match.\nTom: I see. Which parts are affected?\nSara: Mainly the power modules. We need the first lot earlier, around the tenth of next month.\nTom: The tenth is tight, but I can check. What quantity do you need on that date?\nSara: Two thousand pieces. The rest can stay on the original dates.\nTom: Okay. I'll confirm with our planning team and send a table with every delivery date.\nSara: Please include the quantity for each line item and the carrier name.\nTom: No problem. You'll have it by tomorrow afternoon.\nSara: Thanks, Tom. That will help us plan our incoming material.\nTom: Understood. I'll also check with the warehouse team so the shipping dates are realistic.","v":[["delivery schedule","交貨排程"],["production plan","生產計畫"],["power module","電源模組"],["lot","批次"],["quantity","數量"],["line item","訂單項目"],["carrier","承運商"],["planning team","計畫部門"]],"g":[["Could you send me an updated delivery schedule for the next three months?","Could you 是禮貌請求句型；updated 是過去分詞當形容詞，表示「更新過的」。"],["Our production plan changed last week, so some dates no longer match.","no longer 表示「不再」，用於說明情況已改變。"],["The tenth is tight, but I can check.","but 表示轉折；先指出困難，再說明願意嘗試，是常見的商務回應方式。"]],"s":"客戶因生產計畫改變，要求供應商更新未來三個月的交貨排程，並提前部分電源模組的交期。","tr":["嗨，湯姆。可以寄給我未來三個月更新後的交貨時程嗎？","當然。莎拉，有什麼特別的原因嗎？","有的。我們的生產計畫上週有變動，所以有些日期已經對不上了。","我明白了。哪些料件受到影響？","主要是電源模組。我們需要第一批提早，大約在下個月十日。","十日很緊，但我可以查查看。那天你需要多少數量？","兩千個。其餘的可以維持原訂日期。","好的。我會和我們的規劃團隊確認，然後寄給你一份列出每個交貨日期的表格。","請列出每個品項的數量和承運商名稱。","沒問題。明天下午前你就會收到。","謝謝，湯姆。這會幫助我們規劃進料。","了解。我也會和倉庫團隊確認，讓出貨日期切合實際。"]},{"t":"Expediting an Urgent Order","z":"急單加速處理","ty":"dialogue","lv":"B2","d":"Nina: David, we have a line-down risk. Our customer needs two hundred controllers by Monday.\nDavid: That's very short notice. The standard lead time is three weeks.\nNina: I know. Is there any way to expedite the order?\nDavid: We can pull the job forward and run it on a second shift, but there is a rush fee of fifteen percent.\nNina: That's acceptable if you can guarantee delivery on Monday.\nDavid: I can guarantee shipment on Saturday morning. Delivery depends on the courier.\nNina: Then please use overnight express, and we'll pay the freight.\nDavid: Good. I'll need a revised purchase order showing the rush fee before we start.\nNina: I'll send it in ten minutes. Can you also share the tracking number once it ships?\nDavid: Absolutely. You'll get it as soon as the truck leaves.\nNina: Thank you, David. I really appreciate your help.","v":[["line-down risk","停線風險"],["lead time","交期"],["expedite","加速處理"],["pull the job forward","提前安排工單"],["second shift","第二班"],["rush fee","急件費"],["overnight express","隔夜快遞"],["tracking number","追蹤編號"]],"g":[["Is there any way to expedite the order?","Is there any way to + 動詞 是詢問可能性的禮貌說法。"],["I can guarantee shipment on Saturday morning.","guarantee 後接名詞，表示保證某事；可明確承諾的是出貨而非送達。"],["I'll need a revised purchase order showing the rush fee before we start.","showing 是現在分詞片語，修飾 purchase order；before we start 引導時間子句。"]],"s":"客戶急需訂單，供應商同意加班並收取急件費，保證週六出貨，並請客戶先提供修改後的採購單。","tr":["大衛，我們有產線停擺的風險。我們的客戶週一前需要兩百個控制器。","時間太緊迫了。標準交期是三週。","我知道。有沒有辦法加急處理這張訂單？","我們可以把這個工單提前，並安排第二班生產，不過要收百分之十五的急件費。","如果你能保證週一交貨，那可以接受。","我可以保證週六早上出貨。送達時間要看快遞業者。","那請用隔夜快遞，運費由我們支付。","好。開工前，我需要一份標示急件費的修訂採購單。","我十分鐘內寄給你。出貨後可以也請你提供追蹤號碼嗎？","當然。卡車一離開，你就會收到。","謝謝你，大衛。真的很感謝你的幫忙。"]},{"t":"Understanding Incoterms: FOB vs. CIF","z":"貿易條件 FOB 與 CIF","ty":"article","lv":"B2","d":"Incoterms are standard trade terms that define who pays for transport, insurance, and risk during an international shipment. Two terms that buyers and sellers discuss very often are FOB and CIF.\nUnder FOB, or Free On Board, the seller delivers the goods onto the ship at the port of departure. From that moment, the buyer is responsible for the freight, the insurance, and any damage or loss. This gives the buyer more control, because the buyer can choose the carrier and negotiate the shipping rate.\nUnder CIF, which stands for Cost, Insurance and Freight, the seller arranges and pays for transport and minimum insurance to the destination port. However, the risk still passes to the buyer once the goods are loaded on the ship. Many buyers forget this detail.\nWhen you receive a quotation, always check which term is used. A low unit price with FOB may become more expensive than a CIF price once you add freight and insurance. Clear terms prevent disputes and unexpected costs.","v":[["Incoterms","國貿條規"],["FOB","船上交貨"],["CIF","成本、保險費加運費"],["freight","運費"],["insurance","保險"],["port of departure","出發港"],["carrier","承運商"],["quotation","報價單"]],"g":[["From that moment, the buyer is responsible for the freight, the insurance, and any damage or loss.","be responsible for + 名詞 表示負責；三個並列名詞用逗號與 and 連接。"],["However, the risk still passes to the buyer once the goods are loaded on the ship.","once 引導時間子句，意為「一旦」；goods are loaded 為被動語態。"],["A low unit price with FOB may become more expensive than a CIF price once you add freight and insurance.","may 表示可能性；more expensive than 為比較級。"]],"s":"本文說明 FOB 與 CIF 的差異：FOB 由買方負責出港後的運費與風險，CIF 賣方付運費與保險但風險仍在裝船後轉移，報價時要看清楚條件。","tr":["國貿條規（Incoterms）是標準的貿易條件，用來界定國際運送過程中，由誰負擔運輸、保險與風險。買賣雙方最常討論的兩個條件是 FOB 和 CIF。","在 FOB（船上交貨）條件下，賣方在啟運港將貨物交到船上。從那一刻起，運費、保險以及任何損壞或遺失都由買方負責。這讓買方有更多掌控權，因為買方可以選擇承運人並協商運費。","在 CIF（成本、保險加運費）條件下，賣方安排並支付到目的港的運輸及最低限度的保險。然而，貨物一裝上船，風險仍然轉移給買方。許多買家都忘了這個細節。","收到報價時，一定要確認使用的是哪一種條件。加上運費和保險之後，FOB 的低單價可能比 CIF 的價格更貴。條件明確可以避免爭議和意外成本。"]},{"t":"Customs Clearance Delays","z":"清關延誤","ty":"article","lv":"B2","d":"Customs clearance is the process of getting goods approved to enter or leave a country. When it goes well, nobody notices. When it goes wrong, a shipment can sit at the port for days.\nThe most common causes of delay are incorrect paperwork. A wrong tariff code, a missing certificate of origin, or a commercial invoice that does not match the packing list can all trigger an inspection. In some cases, customs officers also request extra documents to confirm the value of the goods.\nTo reduce the risk, companies should prepare documents early and send them to the broker before the cargo arrives. It also helps to review the product codes every year, because regulations change. If a shipment is held, the broker should contact customs immediately and keep the customer informed.\nDelays can lead to storage charges and late delivery penalties. For this reason, many suppliers add a few extra days of buffer when they quote lead times for international orders.","v":[["customs clearance","清關"],["tariff code","關稅稅則號列"],["certificate of origin","原產地證明"],["commercial invoice","商業發票"],["packing list","裝箱單"],["broker","報關行"],["storage charges","倉儲費"],["buffer","緩衝時間"]],"g":[["When it goes well, nobody notices.","When 子句用現在式表示一般情況；nobody 搭配單數動詞 notices。"],["A wrong tariff code, a missing certificate of origin, or a commercial invoice that does not match the packing list can all trigger an inspection.","三個並列名詞作主詞；that 引導關係子句修飾 invoice；can trigger 表示可能造成的結果。"],["It also helps to review the product codes every year, because regulations change.","It helps to + 動詞 是常見句型；because 引導原因。"]],"s":"清關延誤多半來自文件錯誤，公司應提早備妥文件、定期檢查稅則號列，並在報價交期時預留緩衝天數。","tr":["清關是讓貨物獲准進口或出口的程序。順利時沒有人會注意到；出問題時，貨物可能在港口滯留好幾天。","最常見的延遲原因是文件不正確。稅則號列錯誤、缺少原產地證明，或商業發票與裝箱單不符，都可能引發查驗。在某些情況下，海關人員還會要求提供額外文件，以確認貨物的價值。","為了降低風險，公司應該提早準備文件，並在貨物抵達前送交報關行。每年檢視產品代碼也有幫助，因為法規會改變。如果貨物被扣留，報關行應立即與海關聯繫，並讓客戶隨時掌握情況。","延遲可能導致倉儲費用和延誤交貨的罰款。因此，許多供應商在報國際訂單的交期時，會多加幾天的緩衝。"]},{"t":"Safety Stock and Inventory Planning","z":"安全庫存與庫存規劃","ty":"article","lv":"B1","d":"Safety stock is extra inventory that a company keeps to protect itself from uncertainty. It acts like a cushion when supply is late or when customer demand is higher than expected.\nTo plan safety stock, planners look at three things. First, how long the lead time is. Second, how much the lead time changes from one order to the next. Third, how unstable the demand forecast is. A supplier with a lead time of twelve weeks and frequent delays needs a larger buffer than a local supplier that delivers in three days.\nHowever, more stock is not always better. Inventory ties up cash, takes warehouse space, and can become obsolete if a product design changes. The goal is to find a balance between service level and cost.\nMany companies review safety stock every quarter. They compare actual usage with the forecast and adjust the levels for each part. Good communication with suppliers also helps, because shared forecasts reduce surprises.","v":[["safety stock","安全庫存"],["inventory","庫存"],["cushion","緩衝"],["demand forecast","需求預測"],["planner","生產計畫人員"],["obsolete","過時、呆滯"],["service level","服務水準"],["warehouse space","倉庫空間"]],"g":[["It acts like a cushion when supply is late or when customer demand is higher than expected.","when 引導兩個並列時間子句；higher than expected 為省略主詞與 is 的比較結構。"],["A supplier with a lead time of twelve weeks and frequent delays needs a larger buffer than a local supplier that delivers in three days.","larger ... than 為比較級；that 引導關係子句修飾 local supplier。"],["However, more stock is not always better.","not always 表示部分否定，意思是「不一定」。"]],"s":"安全庫存可緩衝供應與需求的不確定性，但庫存過多會占用資金與空間，因此要定期檢討並與供應商分享預測。","tr":["安全庫存是公司為了防範不確定性而額外持有的存貨。當供貨延遲或客戶需求高於預期時，它就像一個緩衝墊。","規劃安全庫存時，規劃人員會看三件事。第一，交期有多長。第二，每張訂單之間交期的變動有多大。第三，需求預測有多不穩定。交期十二週且經常延遲的供應商，需要的緩衝比三天就能送達的本地供應商更大。","然而，庫存多並不一定比較好。存貨會占用現金、占用倉儲空間，而且產品設計一旦改變，還可能變成呆滯料。目標是在服務水準與成本之間取得平衡。","許多公司每季檢討一次安全庫存。他們將實際用量與預測相比較，並調整每個料件的水位。與供應商保持良好溝通也有幫助，因為共享預測可以減少意外。"]},{"t":"Forecast Changes from the Customer","z":"客戶預測變動","ty":"dialogue","lv":"B2","d":"Karen: Hi Ben, I'm calling because our customer revised the forecast again. Demand for the sensor is up forty percent next quarter.\nBen: That's a big jump. Is this a firm increase, or just an estimate?\nKaren: They say it's firm, but they haven't issued purchase orders yet.\nBen: Without orders, I can't commit capacity. Our raw material needs long lead times.\nKaren: I understand. What if I give you a letter of intent this week?\nBen: That would help. If you also share a weekly rolling forecast, I can order materials in advance.\nKaren: Sure. What is the maximum quantity you can support by the end of March?\nBen: Around eighteen thousand units without expediting, but I need confirmation by Friday.\nKaren: I'll push the customer for a decision. Last time they changed the numbers twice in one month.\nBen: That's why I'd like a written commitment. It protects both of us.","v":[["forecast","預測"],["firm increase","確定的增量"],["commit capacity","承諾產能"],["raw material","原物料"],["letter of intent","意向書"],["rolling forecast","滾動式預測"],["in advance","提前"],["written commitment","書面承諾"]],"g":[["Without orders, I can't commit capacity.","Without + 名詞 表示「如果沒有」，暗示條件。"],["What if I give you a letter of intent this week?","What if + 現在式 用來提出假設性的建議。"],["Last time they changed the numbers twice in one month.","changed 為過去式，搭配 last time 表示過去的一次情況；twice 表示次數。"]],"s":"客戶大幅上修預測但尚未下單，供應商要求意向書與滾動預測，才能提前備料並確認產能。","tr":["嗨，班，我打來是因為我們的客戶又修改了預測。下一季感測器的需求增加了百分之四十。","這個跳升很大。這是確定的增加，還是只是預估？","他們說是確定的，但還沒有開出採購單。","沒有訂單，我無法承諾產能。我們的原物料需要很長的交期。","我了解。如果我這週給你一份意向書呢？","那會有幫助。如果你還能分享每週滾動預測，我就可以提前訂購物料。","沒問題。到三月底為止，你最多能支援多少數量？","在不加急的情況下大約一萬八千個，但我需要在週五前得到確認。","我會催客戶做決定。上次他們一個月內改了兩次數字。","所以我才希望有書面承諾。這對我們雙方都有保障。"]},{"t":"Second-Source Qualification","z":"第二供應商驗證","ty":"dialogue","lv":"B2","d":"Julia: Hello Marco. As we discussed, we would like to qualify a second source for the connector.\nMarco: That's a smart move. Which part number are you looking at?\nJulia: The CX-200. Right now we depend on one supplier, and the recent delays made us nervous.\nMarco: We can offer a pin-compatible alternative. I can send samples next week.\nJulia: Great. Our engineers will test the fit, the electrical performance, and the reliability under heat.\nMarco: How long does your qualification usually take?\nJulia: About eight weeks, if the first sample lot passes. After that, we run a pilot build.\nMarco: Then we should also discuss pricing and minimum order quantities early.\nJulia: Agreed. Can you share the quality certificates and the failure rate data?\nMarco: Yes, I'll attach them to my email this afternoon along with the sample request form.","v":[["second source","第二供應來源"],["qualify","驗證、認證"],["connector","連接器"],["pin-compatible","腳位相容"],["reliability","可靠度"],["sample lot","樣品批"],["pilot build","試產"],["failure rate","故障率"]],"g":[["Right now we depend on one supplier, and the recent delays made us nervous.","depend on 後接名詞；made us nervous 為使役結構 make + 受詞 + 形容詞。"],["About eight weeks, if the first sample lot passes.","if 引導條件子句，用現在式 passes 表示未來可能發生的事。"],["Then we should also discuss pricing and minimum order quantities early.","should 表示建議；early 為副詞，說明應提早討論。"]],"s":"客戶因單一供應來源風險，打算驗證第二供應商的連接器，雙方討論樣品、測試期間與品質資料。","tr":["哈囉，Marco。如同我們之前討論的，我們想為這款連接器認證第二供應來源。","這是明智之舉。你們在看哪一個料號？","CX-200。目前我們只依賴一家供應商，最近的交期延遲讓我們很不安。","我們可以提供針腳相容的替代品。我下週就能寄樣品。","太好了。我們的工程師會測試配合度、電氣性能，以及高溫下的可靠度。","你們的認證流程通常需要多久？","如果第一批樣品通過，大約八週。之後我們會進行試產。","那我們也應該及早討論價格和最小訂購量。","同意。你可以提供品質證書和故障率數據嗎？","可以，我今天下午會把它們連同樣品申請表一起附在電子郵件中。"]},{"t":"End-of-Life Notice for a Component","z":"料件停產通知","ty":"dialogue","lv":"B2","d":"Owen: Good morning, Lina. I'm sorry to share bad news. The manufacturer has issued an end-of-life notice for the MX-77 controller.\nLina: That's concerning. When is the last time we can place an order?\nOwen: The last-time-buy date is the thirty-first of January, and the final shipment is in June.\nLina: Is there a recommended replacement?\nOwen: Yes, the MX-90. It has a similar function, but the software needs a small update.\nLina: We would need to retest it, which could take three months.\nOwen: In that case, you may want to place a last-time buy to cover your demand until the new design is ready.\nLina: How many units should we buy? Our annual usage is about fifty thousand.\nOwen: I'd suggest at least eighteen months of supply, but check your forecast carefully.\nLina: I'll review it with finance and let you know by Friday.","v":[["end-of-life notice","停產通知"],["last-time buy","最後購買"],["replacement","替代品"],["controller","控制器"],["retest","重新測試"],["annual usage","年用量"],["demand","需求"],["supply","供應量"]],"g":[["The manufacturer has issued an end-of-life notice for the MX-77 controller.","現在完成式表示剛發生且與現在有關的事；issue a notice 是常用搭配。"],["In that case, you may want to place a last-time buy to cover your demand until the new design is ready.","you may want to 是委婉建議；to cover 表示目的。"],["I'd suggest at least eighteen months of supply, but check your forecast carefully.","suggest 後可接名詞；I'd 是 I would 的縮寫，使語氣較客氣。"]],"s":"原廠發出控制器停產通知，業務建議客戶評估最後購買量，並測試新型號作為替代品。","tr":["早安，Lina。很抱歉要告訴你一個壞消息。製造商已經發出MX-77控制器的停產通知。","這令人擔憂。我們最後可以下單的時間是什麼時候？","最後購買日期是一月三十一日，最後一批出貨在六月。","有建議的替代品嗎？","有的，MX-90。功能類似，但軟體需要做小幅更新。","我們需要重新測試，這可能要花三個月。","那樣的話，你們或許應該進行最後一次採購，以滿足新設計完成前的需求。","我們該買多少？我們的年用量大約是五萬件。","我建議至少準備十八個月的供應量，但請仔細檢視你們的預測。","我會與財務部門討論，週五前回覆你。"]},{"t":"Splitting a Shipment Across Two Lots","z":"拆批出貨安排","ty":"dialogue","lv":"B1","d":"Emma: Hi Jack, we have a question about the order of ten thousand resistors.\nJack: Sure, Emma. What do you need?\nEmma: Could you split the shipment into two lots? We only have space for half at our warehouse right now.\nJack: Yes, that's possible. How would you like to divide them?\nEmma: Five thousand pieces this month, and five thousand pieces at the start of next month.\nJack: Okay. I'll issue two invoices and two packing lists, one for each lot.\nEmma: Please make sure each lot has a separate lot number on the label.\nJack: Of course. Is there any extra charge for the second delivery?\nEmma: We'll pay the second freight cost. Is that all right with you?\nJack: That's fine. I'll update the order and confirm the dates by email today.\nEmma: Thank you. That will solve our storage problem.","v":[["split the shipment","拆批出貨"],["lot","批次"],["resistor","電阻"],["warehouse","倉庫"],["invoice","發票"],["packing list","裝箱單"],["lot number","批號"],["freight cost","運費"]],"g":[["Could you split the shipment into two lots?","split ... into 表示把某物分成幾份；Could you 是禮貌請求。"],["How would you like to divide them?","would like to 是禮貌詢問對方偏好的說法。"],["Please make sure each lot has a separate lot number on the label.","make sure 後接子句，表示確保；each 後接單數名詞。"]],"s":"客戶因倉庫空間有限，請供應商把一萬顆電阻分兩批出貨，並要求每批有獨立發票與批號。","tr":["嗨，Jack，我們對一萬顆電阻的訂單有個問題。","當然，Emma。你需要什麼？","可以把出貨拆成兩批嗎？我們倉庫目前只有一半的空間。","可以，沒問題。你想怎麼分？","這個月五千顆，下個月初再五千顆。","好的。我會開立兩張發票和兩份裝箱單，每批各一份。","請確保每一批在標籤上都有各自的批號。","當然。第二次送貨需要額外收費嗎？","我們會支付第二次的運費。這樣你們可以接受嗎？","沒問題。我會更新訂單，並在今天透過電子郵件確認日期。","謝謝。這樣就解決我們的儲存問題了。"]},{"t":"Supplier Capacity Review Call","z":"供應商產能檢討會議","ty":"dialogue","lv":"B2","d":"Grace: Thanks for joining the call, Victor. I'd like to review your capacity for the coming half year.\nVictor: Of course. Our current utilization is about eighty-five percent, so we still have some room.\nGrace: Our forecast will grow by thirty percent in the third quarter. Can you handle that?\nVictor: Probably, but it depends on the equipment. We are installing a new line in August.\nGrace: Will the new line be qualified by then?\nVictor: We expect to finish the trial runs by the end of August, which is just in time.\nGrace: What are the main bottlenecks right now?\nVictor: Testing is the constraint. We're hiring two extra technicians to solve that.\nGrace: Good. Could you send a monthly capacity report so we can see any risks early?\nVictor: Absolutely. I'll send the first one on the fifth of next month.\nGrace: Thanks, Victor. That gives us confidence for the next quarter.","v":[["capacity","產能"],["utilization","產能利用率"],["room","餘裕"],["equipment","設備"],["trial run","試運轉"],["bottleneck","瓶頸"],["constraint","限制因素"],["capacity report","產能報告"]],"g":[["Our current utilization is about eighty-five percent, so we still have some room.","still 表示「仍然」；some room 為不可數名詞用法，指還有餘裕。"],["We expect to finish the trial runs by the end of August, which is just in time.","which 指前面整個句子的內容；by 表示最遲期限。"],["Could you send a monthly capacity report so we can see any risks early?","so 在此表示目的，意為「以便」。"]],"s":"客戶與供應商檢討未來半年的產能，供應商說明新產線時程與測試瓶頸，並同意每月提供產能報告。","tr":["謝謝你加入這場通話，Victor。我想檢視一下你們未來半年的產能。","當然。我們目前的稼動率約為百分之八十五，所以還有一些空間。","我們的預測在第三季會成長百分之三十。你們應付得來嗎？","應該可以，但要看設備而定。我們八月會安裝一條新產線。","到時候新產線能通過認證嗎？","我們預計八月底完成試產，時間剛好趕上。","目前主要的瓶頸是什麼？","測試是限制因素。我們正在多聘兩名技術人員來解決。","很好。你能每月寄一份產能報告嗎？這樣我們可以及早發現風險。","當然。我會在下個月五日寄出第一份。","謝謝，Victor。這讓我們對下一季更有信心。"]},{"t":"Confirming Packing and Labeling Requirements","z":"確認包裝與標籤要求","ty":"dialogue","lv":"B1","d":"Chris: Hi Mei, I'm reviewing the packing requirements for our next order. Do you have a minute?\nMei: Sure, Chris. Which items are you worried about?\nChris: The sensors. They must be in anti-static bags and then packed in boxes of fifty.\nMei: Understood. Do you want the customer part number on every bag?\nChris: Yes, and also a barcode with the lot number and the date code on each carton.\nMei: No problem. What about the outer cartons and the pallets?\nChris: Please put our purchase order number on the outside, and mark the weight clearly.\nMei: Okay. I'll also add a moisture indicator card inside each bag.\nChris: Perfect. Last time, the labels were hard to read, so please use a larger font.\nMei: I'll send you a label sample for approval before we pack.\nChris: Great. We will approve it quickly so your team can start packing on time.","v":[["packing requirements","包裝要求"],["anti-static bag","防靜電袋"],["barcode","條碼"],["date code","日期碼"],["carton","紙箱"],["pallet","棧板"],["moisture indicator","濕度指示卡"],["label","標籤"]],"g":[["They must be in anti-static bags and then packed in boxes of fifty.","must 表示必要的規定；packed 是被動語態，省略 be。"],["Please put our purchase order number on the outside, and mark the weight clearly.","Please 加原形動詞 構成禮貌的指示；clearly 為副詞。"],["I'll send you a label sample for approval before we pack.","for approval 表示目的；before 後的時間子句用現在式。"]],"s":"客戶與供應商確認感測器的防靜電包裝、條碼標籤與外箱標示要求，並先以標籤樣張核准。","tr":["嗨，Mei，我正在檢視我們下一張訂單的包裝要求。你有空嗎？","當然，Chris。你擔心哪些品項？","感測器。它們必須裝在防靜電袋中，然後以每箱五十個包裝。","了解。你要在每個袋子上都標示客戶料號嗎？","要，而且每個外箱上還要有含批號和日期碼的條碼。","沒問題。那外箱和棧板呢？","請在外側標示我們的採購單號碼，並清楚標註重量。","好的。我也會在每個袋子內放一張濕度指示卡。","太好了。上次的標籤很難閱讀，所以請使用較大的字體。","包裝前我會先寄標籤樣本給你核准。","太棒了。我們會盡快核准，讓你們團隊能準時開始包裝。"]},{"t":"Tracking a Shipment in Transit","z":"在途貨物追蹤","ty":"dialogue","lv":"B1","d":"Paul: Hello Alice, I'm checking on shipment 8830, which should be in transit. The tracking page hasn't changed since Tuesday.\nAlice: Let me look. It says the container arrived at the port of Rotterdam on Tuesday.\nPaul: Then why is it still showing the same status?\nAlice: It's waiting for a berth. The port is very busy this week.\nPaul: Do you know when it will be unloaded?\nAlice: The forwarder says Friday, and customs clearance should take one more day.\nPaul: So we might receive the goods on Monday?\nAlice: Yes, if there are no inspections. The truck is booked for Monday morning.\nPaul: Please send me the container number and the bill of lading, so I can follow it myself.\nAlice: I'll email both documents in a few minutes.\nPaul: Thanks. Please warn me if the customs office asks for more documents.","v":[["tracking page","追蹤頁面"],["container","貨櫃"],["status","狀態"],["berth","泊位"],["unloaded","卸貨"],["forwarder","貨運承攬業者"],["bill of lading","提單"],["in transit","在途"]],"g":[["The tracking page hasn't changed since Tuesday.","現在完成式否定 hasn't changed 搭配 since 加時間點，表示從過去到現在沒有變化。"],["Yes, if there are no inspections.","if 引導條件子句，用現在式 are 表示未來可能的情況。"],["Please send me the container number and the bill of lading, so I can follow it myself.","so 在此表示目的；myself 為反身代名詞，強調自己做。"]],"s":"客戶詢問在途貨物久未更新，供應商說明貨櫃正等候泊位，預計週一到貨，並提供貨櫃號碼與提單。","tr":["哈囉，Alice，我在查詢8830號貨件，它應該在運送途中。追蹤頁面從週二以來都沒有更新。","我來看看。上面顯示貨櫃週二已抵達鹿特丹港。","那為什麼狀態還是一樣？","它在等泊位。這個星期港口非常繁忙。","你知道什麼時候會卸貨嗎？","貨運承攬商說是週五，通關應該還要再一天。","所以我們可能週一收到貨？","對，如果沒有查驗的話。卡車已訂好週一早上。","請把貨櫃號碼和提單寄給我，這樣我可以自己追蹤。","我幾分鐘後就會把兩份文件寄給你。","謝謝。如果海關要求更多文件，請提醒我。"]},{"t":"Rescheduling a Purchase Order","z":"採購單交期改期","ty":"dialogue","lv":"B2","d":"Diana: Hi Ken, I'm afraid we have to reschedule purchase order 7712. Our customer postponed their launch.\nKen: By how much do you want to move it?\nDiana: We'd like to push the delivery from the fifteenth of March to the end of April.\nKen: That's six weeks. The material is already allocated, and production has started on half of the quantity.\nDiana: Could you hold the finished goods in your warehouse?\nKen: We can store them for two weeks free of charge. After that, there is a storage fee.\nDiana: That seems reasonable. What about the unstarted part?\nKen: I can delay it, but I need a written change request. Also, the price might change if the material cost goes up.\nDiana: I understand. I'll issue the change request today and mention the price condition.\nKen: Thanks. Once I get it, I'll confirm the new dates within one day.","v":[["reschedule","重新安排時間"],["postpone","延後"],["finished goods","成品"],["free of charge","免費"],["storage fee","倉儲費"],["change request","變更申請"],["allocated","已分配"],["material cost","材料成本"]],"g":[["Our customer postponed their launch.","postpone 後接名詞，過去式 postponed 表示已發生的決定。"],["We can store them for two weeks free of charge.","for two weeks 表示期間；free of charge 為固定用語。"],["Once I get it, I'll confirm the new dates within one day.","Once 子句用現在式表示未來；within 表示在某段時間之內。"]],"s":"客戶因產品上市延後而要求採購單改期，供應商同意免費保管兩週，並要求書面變更申請。","tr":["嗨，Ken，恐怕我們得重新安排採購單7712。我們的客戶延後了產品上市。","你們想延後多久？","我們想把交貨從三月十五日推遲到四月底。","那是六週。物料已經分配好了，而且一半的數量已經開始生產。","你們可以把成品存放在你們的倉庫嗎？","我們可以免費存放兩週。之後會收取倉儲費。","這聽起來合理。那尚未開始的部分呢？","我可以延後，但我需要書面的變更申請。另外，如果材料成本上漲，價格可能會改變。","我了解。我今天會提出變更申請，並註明價格條件。","謝謝。一收到，我會在一天內確認新的日期。"]},{"t":"Supply Risk Briefing for Management","z":"向管理層簡報供應風險","ty":"article","lv":"B2","d":"Good morning. This briefing covers the main supply risks for the next two quarters and the actions we recommend.\nFirst, the memory chips. Our supplier has placed us on allocation, and we expect to receive only eighty percent of the volume we ordered. This could delay two product lines if we do nothing. We are talking to a second source and have asked for a higher priority from the current one.\nSecond, logistics. Ocean freight rates have increased by twenty percent, and port congestion adds about one week to every shipment. To reduce the impact, we propose moving some urgent items to air freight and booking containers earlier. Third, one connector supplier has a financial warning. We are building a safety stock for three months and starting a qualification of an alternative.\nIn summary, the risks are manageable, but we need approval for additional inventory spending. We will report progress every month.","v":[["supply risk","供應風險"],["briefing","簡報"],["allocation","配貨"],["second source","第二供應來源"],["ocean freight","海運"],["port congestion","港口壅塞"],["safety stock","安全庫存"],["qualification","驗證"]],"g":[["This could delay two product lines if we do nothing.","could 表示可能的結果；if we do nothing 為條件子句。"],["To reduce the impact, we propose moving some urgent items to air freight and booking containers earlier.","To reduce 表示目的；propose 後接動名詞 moving。"],["In summary, the risks are manageable, but we need approval for additional inventory spending.","In summary 為總結用語；but 連接對比的兩個子句。"]],"s":"向管理層簡報未來兩季的供應風險，包括記憶體缺料、海運與港口壅塞、以及連接器供應商財務警訊，並請求增加庫存預算。","tr":["早安。這份簡報涵蓋未來兩季的主要供應風險，以及我們建議的行動。","首先是記憶體晶片。我們的供應商已將我們列入配額分配，我們預計只能收到所訂數量的百分之八十。如果我們什麼都不做，這可能會延誤兩條產品線。我們正在與第二供應來源洽談，並要求現有供應商給予更高的優先順序。","第二是物流。海運運費上漲了百分之二十，港口壅塞使每批貨增加約一週時間。為了降低影響，我們建議將部分緊急品項改為空運，並提早訂艙。第三，有一家連接器供應商發出財務警訊。我們正在建立三個月的安全庫存，並開始認證替代供應商。","總結來說，這些風險是可以控管的，但我們需要核准額外的庫存支出。我們每個月都會報告進度。"]},{"t":"Consignment and VMI Programs","z":"寄售與供應商管理庫存","ty":"article","lv":"B2","d":"Consignment and vendor-managed inventory, or VMI, are two programs that help customers keep production running without holding large amounts of stock.\nIn a consignment program, the supplier places parts at the customer's site, but the supplier still owns them. The customer pays only when the parts are used. This reduces the customer's cash tied up in inventory, and parts are always close to the line.\nIn a VMI program, the supplier monitors the customer's inventory levels and decides when to replenish. The customer shares daily consumption data, and both sides agree on minimum and maximum levels. This lets the supplier plan production more smoothly and reduces rush orders.\nThese programs need trust and clear rules. Companies should define who is responsible for damaged or obsolete stock, how often they count the inventory, and how to handle forecast changes. When managed well, both programs lower costs and improve delivery reliability for everyone.","v":[["consignment","寄售"],["vendor-managed inventory","供應商管理庫存"],["replenish","補貨"],["consumption data","消耗資料"],["minimum and maximum levels","最低與最高庫存量"],["inventory levels","庫存水位"],["rush order","急單"],["obsolete stock","呆滯庫存"]],"g":[["The customer pays only when the parts are used.","only when 表示唯一條件；parts are used 為被動語態。"],["This lets the supplier plan production more smoothly and reduces rush orders.","let + 受詞 + 原形動詞 表示讓某人做某事；smoothly 為副詞。"],["When managed well, both programs lower costs and improve delivery reliability for everyone.","When managed well 是省略 they are 的被動分詞結構。"]],"s":"本文介紹寄售與 VMI 兩種庫存合作模式，供應商持有或管理庫存以減少客戶資金壓力，但雙方需先訂好責任與規則。","tr":["寄售和供應商管理庫存（VMI）是兩種幫助客戶在不持有大量庫存的情況下維持生產運作的方案。","在寄售方案中，供應商把零件放在客戶的場地，但所有權仍屬於供應商。客戶只在使用零件時才付款。這減少了客戶被庫存占用的資金，而且零件總是靠近產線。","在VMI方案中，供應商監控客戶的庫存水位，並決定何時補貨。客戶分享每日消耗數據，雙方同意最低與最高水位。這讓供應商能更平穩地規劃生產，並減少急單。","這些方案需要信任和明確的規則。企業應該界定誰負責損壞或過時的庫存、多久盤點一次庫存，以及如何處理預測變動。管理得當時，兩種方案都能降低成本，並提升所有人的交貨可靠度。"]},{"t":"Year-End Allocation Planning","z":"年底配貨規劃","ty":"article","lv":"B1","d":"At the end of each year, suppliers and customers meet to plan the allocation of products for the next year. This is especially important for parts that are in short supply.\nFirst, the customer shares a forecast for each month, with the expected volume and the target delivery dates. The supplier then compares it with its production capacity and raw material supply. If there is a gap, they discuss options such as moving some volume to earlier months or accepting a different product version.\nSecond, both sides agree on the commitment. The customer promises to buy a minimum quantity, and the supplier promises to reserve the capacity. Many contracts also include a flexible range, for example plus or minus twenty percent.\nFinally, they set a review schedule, usually every quarter. If the market changes, they can adjust the plan together. Early and honest communication helps both companies avoid surprises and keep their customers happy.","v":[["allocation","配貨"],["in short supply","供不應求"],["target delivery date","目標交貨日"],["production capacity","生產產能"],["gap","缺口"],["commitment","承諾"],["reserve","預留"],["flexible range","彈性範圍"]],"g":[["This is especially important for parts that are in short supply.","especially 用來強調；that 引導關係子句修飾 parts。"],["The customer promises to buy a minimum quantity, and the supplier promises to reserve the capacity.","promise to + 原形動詞 表示承諾；and 連接兩個平行子句。"],["If the market changes, they can adjust the plan together.","If 子句用現在式，主句用 can 表示可能的行動。"]],"s":"年底時供應商與客戶會依預測與產能規劃來年配貨，確認最低採購量與保留產能，並定期檢討調整。","tr":["每年年底，供應商與客戶會會面，規劃下一年度的產品分配。這對供應短缺的零件尤其重要。","首先，客戶分享每個月的預測，包括預期數量和目標交貨日期。然後供應商將其與自身的產能和原物料供應相比對。如果有落差，他們會討論各種選項，例如將部分數量移到較早的月份，或接受不同的產品版本。","其次，雙方同意承諾內容。客戶承諾購買最低數量，供應商承諾保留產能。許多合約也包含彈性範圍，例如正負百分之二十。","最後，他們訂定檢討時程，通常是每季一次。如果市場改變，他們可以共同調整計畫。及早且坦誠的溝通有助於兩家公司避免意外，並讓客戶保持滿意。"]}],"more":""},{"id":"pricing","en":"Pricing & Negotiation","zh":"報價與議價討論","ds":"客人與公司談單價、數量折扣、付款條件與合約。","lessons":[{"t":"Negotiating a Volume Discount","z":"洽談數量折扣","ty":"dialogue","lv":"B2","d":"Mark: Linda, thanks for sending the quotation. I've reviewed it with my team, and frankly, the unit price is higher than we expected.\nLinda: I appreciate your honesty, Mark. May I ask what price you had in mind?\nMark: Based on our budget, we were hoping for around twelve dollars per unit. Your quote is fourteen fifty.\nLinda: I see. Twelve dollars is a significant gap. Let me explain how we arrived at the number. The price includes the upgraded sensor, an extended warranty, and free firmware updates for three years.\nMark: Those are useful, but we're not sure we need all of them. Is it possible to remove the extended warranty and lower the price?\nLinda: Yes, we can unbundle the warranty. That would bring the price down to thirteen eighty. Still, I'd like to understand your volume first. How many units are you planning to order this year?\nMark: Our forecast is about eighty thousand units, but it depends on how the product sells. If it goes well, it could reach one hundred and twenty thousand.\nLinda: That's helpful. At eighty thousand units, I can offer a tiered discount. For orders above fifty thousand, the price becomes thirteen twenty, and above one hundred thousand, it drops to twelve eighty.\nMark: Thirteen twenty is better, but still above our target. Our current supplier has offered twelve fifty, although their delivery record is not as good as yours.\nLinda: I understand, and I don't want you to choose us only because of price. Our on-time delivery rate was ninety-eight percent last year, and our defect rate is below fifty parts per million. That reliability has real value for your production.\nMark: That's true, and it's the main reason we're still talking to you. But I need to justify the premium to my management.\nLinda: Let me suggest a compromise. If you commit to a twelve-month contract with a minimum of seventy thousand units, I can go down to twelve ninety, and we'll lock the price for the whole year.\nMark: A fixed price for twelve months is attractive, because material costs have been unstable. What about payment terms? Right now we pay in thirty days.\nLinda: Normally we ask for net thirty, but for a long-term contract, I could extend it to net forty-five. That helps your cash flow.\nMark: That would be a plus. Could you also include free shipping to our warehouse?\nLinda: I can't offer free shipping on top of the lower price, but I can split the freight cost with you. Would that be acceptable?\nMark: Splitting the freight is reasonable. If you can get the price to twelve eighty, I think I can get approval today.\nLinda: Twelve eighty is the lowest I can go, and I'd need a signed contract by the end of this month. Is that workable?\nMark: I believe so. Let me confirm with my director and come back to you by Thursday.\nLinda: Wonderful. I'll prepare a revised quotation with all the terms we discussed, so you have everything in writing.\nMark: Thanks, Linda. It's been a productive conversation.\nLinda: I agree. I'm confident we can reach a deal that works for both sides.","v":[["quotation","報價單"],["unit price","單價"],["unbundle","拆分（原本綁在一起的項目）"],["tiered discount","階梯式折扣"],["forecast","預測量"],["premium","溢價"],["compromise","折衷方案"],["lock the price","鎖定價格"],["payment terms","付款條件"],["net thirty","收到發票後 30 天付款"],["defect rate","不良率"],["parts per million (ppm)","百萬分之一"]],"g":[["If you commit to a twelve-month contract, I can go down to twelve ninety.","第一類條件句：If + 現在式, 主詞 + can/will。談判中用來「有條件地讓步」。"],["I'd like to understand your volume first.","I'd like to = I would like to，比 I want to 禮貌。"],["...although their delivery record is not as good as yours.","not as + 形容詞 + as：不如……；although 引導讓步。"],["Is it possible to remove the extended warranty?","Is it possible to...? 是委婉提出請求的常用句型。"],["I'd need a signed contract by the end of this month.","by + 時間點：在……之前（期限）。"]],"s":"買方 Mark 認為單價偏高，賣方 Linda 說明價格組成後提出拆分保固、階梯式折扣，最後以「十二個月合約、最低七萬顆、鎖價一年」換取每顆 12.80 美元，並延長付款條件至 net 45、運費對分。Mark 需向主管確認後回覆。","tr":["琳達，謝謝你寄來報價單。我和團隊討論過了，坦白說，單價比我們預期的高。","馬克，謝謝你的坦誠。請問你心中的價格是多少？","依我們的預算，希望每件大約十二美元。你們的報價是十四點五美元。","了解。十二美元的差距相當大。讓我說明一下這個價格是怎麼來的。這個價格包含升級版感測器、延長保固，以及三年免費韌體更新。","這些都很實用，但我們不確定是否全部都需要。可以拿掉延長保固並降低價格嗎？","可以，我們可以把保固拆分出來，這樣價格會降到十三點八美元。不過，我想先了解你們的採購量。今年預計訂購多少件？","我們的預估約八萬件，但要看產品的銷售狀況。如果賣得好，可能會達到十二萬件。","這很有幫助。以八萬件來說，我可以提供階梯式折扣。訂單超過五萬件，價格是十三點二美元；超過十萬件，則降到十二點八美元。","十三點二美元比較好，但仍高於我們的目標。我們現有的供應商報價是十二點五美元，不過他們的交貨紀錄不如你們。","我明白，而且我不希望你只因為價格而選擇我們。我們去年的準時交貨率是百分之九十八，不良率低於百萬分之五十。這樣的可靠度對你們的生產有實質價值。","沒錯，這也是我們仍在和你們洽談的主要原因。但我需要向管理階層說明為何要多付這筆溢價。","我提出一個折衷方案。如果你們簽下十二個月的合約，最低採購量七萬件，我可以降到十二點九美元，而且全年鎖定這個價格。","十二個月的固定價格很有吸引力，因為原物料成本一直不穩定。那付款條件呢？目前我們是三十天付款。","通常我們要求月結三十天，但如果是長期合約，我可以延長到月結四十五天。這對你們的現金流有幫助。","那會是加分。你們也能提供免費運送到我們倉庫嗎？","在較低的價格之上，我無法再提供免運，但我可以和你們分攤運費。這樣可以接受嗎？","分攤運費很合理。如果你能把價格降到十二點八美元，我想今天就能取得核准。","十二點八美元是我能給的最低價，而且我需要在本月底前收到簽署好的合約。這樣可行嗎？","我想可以。我和主管確認後，週四前回覆你。","太好了。我會準備一份包含我們所討論所有條件的修訂報價單，讓你有完整的書面資料。","謝謝你，琳達。這是一場很有成效的對話。","我同意。我有信心我們能達成對雙方都有利的協議。"]},{"t":"How to Prepare for a Price Negotiation","z":"如何準備價格談判","ty":"article","lv":"B2","d":"Many people think a negotiation is won during the meeting, but in reality, it is usually won before the meeting begins. Good preparation gives you confidence, and confidence helps you stay calm when the other side applies pressure.\nThe first step is to know your numbers. Calculate your cost, your target price, and your walk-away price, which is the lowest price you can accept. If you do not know your limit, you may agree to a deal that damages your profit.\nThe second step is to understand the other side. What does the customer really care about? Some buyers focus only on price, but many also care about quality, delivery, technical support, and long-term stability. When you understand their priorities, you can trade what is cheap for you to give for what is valuable for them.\nThe third step is to prepare options. Instead of saying yes or no to a single price, offer packages. For example, you might offer a lower price for a larger volume, a longer contract, or faster payment. This approach changes the conversation from a fight about one number into a search for a solution.\nDuring the meeting, listen more than you speak. Ask open questions such as, what is most important for your project this year? Then pause and wait. Silence can feel uncomfortable, but it often encourages the other person to reveal useful information.\nWhen the customer asks for a discount, avoid giving it immediately. A quick concession teaches the customer that the first price was not real. Instead, say, I can look at that if we can agree on volume and timing. Always connect a concession to something in return.\nFinally, confirm everything in writing. After the meeting, send a short email that summarizes the price, quantity, delivery date, and payment terms. This protects both sides and avoids misunderstandings later. A good negotiation ends with both parties feeling that the deal is fair.","v":[["negotiation","談判"],["walk-away price","底線價格"],["target price","目標價"],["priorities","優先事項"],["trade A for B","用 A 交換 B"],["package","組合方案"],["concession","讓步"],["open question","開放式問題"],["in return","作為交換"],["misunderstanding","誤會"],["apply pressure","施加壓力"],["reveal","透露"]],"g":[["Instead of saying yes or no to a single price, offer packages.","instead of + V-ing：不要……而是……。"],["If you do not know your limit, you may agree to a deal that damages your profit.","條件句 + may，表示「可能會」造成不良結果。"],["...your walk-away price, which is the lowest price you can accept.","which 非限定關係子句，用來解釋前面的名詞。"],["A quick concession teaches the customer that the first price was not real.","teach someone that + 子句：讓某人學到……。"],["Listen more than you speak.","more than 比較兩個動作，強調多聽少說。"]],"s":"這篇文章教導如何準備價格談判：先掌握自己的成本、目標價與底線價；了解對方真正在意的事；準備組合方案而非只談單一價格；會中多聽少說；不要立即讓步，且讓步要換取回報；最後以書面確認所有條款。","tr":["許多人認為談判是在會議中贏得的，但實際上，通常在會議開始之前就已經決定勝負。充分的準備帶給你信心，而信心能讓你在對方施壓時保持冷靜。","第一步是掌握你的數字。計算你的成本、目標價格和底線價格，也就是你能接受的最低價格。如果不知道自己的底線，你可能會答應一筆損害利潤的交易。","第二步是了解對方。客戶真正在意的是什麼？有些買家只關注價格，但許多人也在意品質、交期、技術支援和長期穩定性。當你了解他們的優先順序，就能用對你成本低的讓步，去換取對他們有價值的東西。","第三步是準備多種方案。與其對單一價格回答好或不好，不如提供組合方案。例如，你可以針對更大的採購量、更長的合約或更快的付款提供較低的價格。這種做法能把對話從為一個數字爭執，轉變為共同尋找解決方案。","會議期間，多聽少說。提出開放式問題，例如：今年對你們的專案來說，最重要的是什麼？然後停頓並等待。沉默可能令人不自在，但往往能促使對方透露有用的資訊。","當客戶要求折扣時，避免立刻答應。迅速讓步會讓客戶覺得最初的價格並不是真的。相反地，你可以說：如果我們能就數量和時程達成共識，我可以考慮。讓步時務必要求某種回報。","最後，一切都要以書面確認。會後寄一封簡短的電子郵件，摘要價格、數量、交貨日期和付款條件。這能保護雙方，也避免日後產生誤解。一場好的談判，會讓雙方都覺得這筆交易公平。"]},{"t":"Responding to a Request for Quotation","z":"回覆詢價單 RFQ","ty":"dialogue","lv":"B1","d":"Anna: Hi Mark, thanks for sending the request for quotation. I have reviewed the specifications.\nMark: Great. Can you give us a price for 5,000 units?\nAnna: Yes. The unit price is 12 dollars, based on a minimum order quantity of 5,000 pieces.\nMark: Does that price include packaging and shipping?\nAnna: Packaging is included. Shipping is quoted separately, because it depends on the destination.\nMark: Understood. How long is the quotation valid?\nAnna: It is valid for 30 days. After that, we may need to adjust the price.\nMark: And what is the lead time?\nAnna: Production takes four weeks from the date we receive your purchase order. I will send the formal quotation by email this afternoon.\nMark: Perfect. Could you add a breakdown so I can share it with our buyer?\nAnna: Of course. I will include material, labor, and packaging costs, so everything is clear.","v":[["request for quotation","詢價單 (RFQ)"],["specifications","規格"],["unit price","單價"],["minimum order quantity","最低訂購量"],["quoted separately","另外報價"],["valid","有效的"],["lead time","交期"],["purchase order","採購單"]],"g":[["Shipping is quoted separately, because it depends on the destination.","because 引導原因子句，說明為何運費要另外報價；quoted 是過去分詞，構成被動語態 is quoted。"],["It is valid for 30 days.","be valid for + 一段期間，用來說明報價的有效期限。"],["Could you add a breakdown so I can share it with our buyer?","Could you...? 是禮貌請求；so I can... 表示目的，意思是「以便我可以……」。"]],"s":"Anna 回覆 Mark 的詢價，說明單價、最低訂購量、報價有效期與交期，並答應附上成本明細。","tr":["嗨，馬克，謝謝你寄來詢價單。我已經看過規格了。","太好了。你能報五千件的價格嗎？","可以。單價是十二美元，以最低訂購量五千件為基準。","這個價格包含包裝和運費嗎？","包裝已包含在內。運費另外報價，因為要看目的地。","了解。報價的有效期限是多久？","有效期限為三十天。之後我們可能需要調整價格。","那交期是多久？","從收到你們採購單之日起，生產需要四週。我今天下午會用電子郵件寄出正式報價單。","太好了。你可以附上明細嗎？我想轉給我們的採購人員。","當然。我會列出材料、人工和包裝成本，讓一切清清楚楚。"]},{"t":"Explaining a Price Increase","z":"說明漲價原因","ty":"dialogue","lv":"B2","d":"Laura: Tom, I wanted to speak with you before you see the new price list.\nTom: Is it going up again?\nLaura: Unfortunately, yes. We are raising prices by six percent starting in January.\nTom: Six percent is significant. What is driving it?\nLaura: Mainly higher labor costs and a sharp rise in energy prices. We have absorbed those increases for over a year.\nTom: I understand, but my customers will not accept a big jump.\nLaura: I hear you. That is why we are giving you a three-month grace period at the current price.\nTom: That helps. Can we also lock the price for the rest of next year?\nLaura: If you commit to your forecast volume, I can offer a fixed price until December.\nTom: Let me check with my team. I appreciate you being upfront about this.","v":[["price list","價目表"],["going up","上漲"],["significant","顯著的"],["labor costs","人力成本"],["absorbed","吸收（成本）"],["grace period","寬限期"],["lock the price","鎖定價格"],["forecast volume","預測數量"]],"g":[["We have absorbed those increases for over a year.","現在完成式 have absorbed 搭配 for + 時間，表示從過去持續到現在的狀況。"],["If you commit to your forecast volume, I can offer a fixed price until December.","if 條件句：條件成立時就能提供固定價格，是談判中常見的有條件提議。"],["I appreciate you being upfront about this.","appreciate + 動名詞，表示感謝對方坦率直接。"]],"s":"Laura 向 Tom 說明明年一月起漲價六%的原因，並提供三個月寬限期與有條件的固定價格。","tr":["湯姆，我想在你看到新價目表之前先和你談一談。","又要漲價了嗎？","很遺憾，是的。我們從一月起將價格調漲百分之六。","百分之六幅度不小。主要原因是什麼？","主要是人工成本上升，以及能源價格大幅上漲。這些漲幅我們已經吸收了一年多。","我了解，但我的客戶不會接受大幅跳漲。","我明白。所以我們給你三個月的緩衝期，仍按現行價格計算。","這很有幫助。我們也能把價格鎖定到明年剩下的時間嗎？","如果你承諾預估的採購量，我可以提供固定價格到十二月。","讓我和我的團隊確認一下。感謝你事先坦白告知。"]},{"t":"Cost Breakdown Discussion","z":"成本結構說明","ty":"article","lv":"B2","d":"When a customer asks why your price is high, a clear cost breakdown is your best tool. It shows the buyer where the money goes and builds trust.\nA typical breakdown has four parts. Direct materials usually make up the largest share, often between forty and sixty percent of the total. Labor comes next, followed by overhead, which includes rent, equipment, and utilities. Finally, there is the profit margin, which keeps the business healthy.\nMany sales teams worry that sharing these numbers weakens their position. In practice, the opposite is often true. If the buyer can see that materials have become more expensive, it is harder to argue that your quote is unreasonable. However, you do not have to reveal everything. You can group costs into broad categories and keep your exact margin private.\nFinally, use the breakdown to start a conversation, not to defend yourself. Ask which items the buyer would like to adjust. Perhaps a simpler package or a different material could reduce the cost without hurting quality.","v":[["cost breakdown","成本明細"],["direct materials","直接材料"],["labor","人工"],["overhead","間接費用"],["utilities","水電等公用費用"],["profit margin","利潤率"],["quote","報價"],["reasonable","合理的"]],"g":[["Direct materials usually make up the largest share, often between forty and sixty percent of the total.","make up 表示「構成、占」；the largest share 是最高級，用來指占比最大的部分。"],["If the buyer can see that materials have become more expensive, it is harder to argue that your quote is unreasonable.","if 子句搭配比較級 harder，表示在某條件下更難提出反駁。"],["you do not have to reveal everything.","do not have to 表示「不必」，不同於 must not（禁止）。"]],"s":"本文說明如何用成本明細向客戶解釋價格，既建立信任，也能引導對方討論可調整的項目，同時保留自己的利潤資訊。","tr":["當客戶問你的價格為什麼偏高時，清楚的成本明細是你最好的工具。它讓買家知道錢花在哪裡，並建立信任。","典型的成本明細有四個部分。直接材料通常占最大比例，往往占總額的百分之四十到六十。其次是人工，再來是間接費用，包括租金、設備和水電。最後是維持企業健康營運的利潤率。","許多業務團隊擔心公開這些數字會削弱自己的立場。實際上，情況往往相反。如果買家看得出材料變貴了，就更難主張你的報價不合理。不過，你不必透露所有細節。你可以把成本歸為幾個大類，並保留確切的利潤率不公開。","最後，要用成本明細來開啟對話，而不是為自己辯護。詢問買家想調整哪些項目。也許更簡單的包裝或不同的材料，可以在不損及品質的情況下降低成本。"]},{"t":"Matching a Competitor's Price","z":"因應競爭對手報價","ty":"dialogue","lv":"B2","d":"Chris: Priya, I have to be honest. Another supplier quoted us eight percent less.\nPriya: Thanks for telling me. Can I ask if the specifications are exactly the same?\nChris: Mostly, yes. Their delivery time is a bit longer, though.\nPriya: That is useful to know. We offer two-week delivery and a full quality guarantee.\nChris: I know, and we value that. But eight percent is a big gap.\nPriya: I do not want to lose your business over price. What would it take to keep this order?\nChris: If you could come within three percent, I would stay with you.\nPriya: I cannot match their price completely, but I can reduce ours by four percent if you increase the order to 10,000 units.\nChris: Four percent on a larger volume. That could work.\nPriya: Great. Let me confirm the numbers with my manager and send a revised quotation today.","v":[["quoted","報價"],["supplier","供應商"],["delivery time","交貨時間"],["quality guarantee","品質保證"],["gap","差距"],["match","（價格）比照"],["order","訂單"],["revised quotation","修訂報價單"]],"g":[["Another supplier quoted us eight percent less.","quoted 是過去式，後面接 us（間接受詞）和報價內容；less 表示更低。"],["If you could come within three percent, I would stay with you.","這是假設語氣（第二類條件句）：if + could，主要子句用 would，語氣委婉。"],["I cannot match their price completely, but I can reduce ours by four percent if you increase the order to 10,000 units.","reduce by + 數字表示降低的幅度；ours 是所有格代名詞，代替 our price。"]],"s":"Chris 說另一家供應商報價低八%，Priya 提出在訂單量增加到一萬件時降價四%作為回應。","tr":["普莉亞，我必須坦白說。另一家供應商的報價比你們低了百分之八。","謝謝你告訴我。我可以問一下規格是否完全相同嗎？","大致相同。不過他們的交貨時間稍長一些。","這點很值得知道。我們提供兩週交貨和完整的品質保證。","我知道，我們也很重視這一點。但百分之八的差距很大。","我不想因為價格而失去你們的生意。要怎麼做才能留住這筆訂單？","如果你能把差距縮小到百分之三以內，我就會繼續和你們合作。","我無法完全比照他們的價格，但如果你把訂單增加到一萬件，我可以降價百分之四。","更大訂購量換百分之四的降幅，這樣可行。","太好了。我和經理確認數字後，今天就寄修訂報價單給你。"]},{"t":"Long-Term Agreement Negotiation","z":"長約談判","ty":"dialogue","lv":"B2","d":"Nina: Thanks for meeting, Omar. We would like to discuss a three-year supply agreement.\nOmar: That sounds good. What volume are you thinking about?\nNina: Around 120,000 units per year, with deliveries every quarter.\nOmar: With that commitment, I can offer a fixed unit price for the first year.\nNina: What about years two and three?\nOmar: We would review the price annually, linked to a raw material index.\nNina: Could we cap any increase at three percent per year?\nOmar: A cap is difficult for us, but I could agree to four percent.\nNina: Let us meet in the middle at three and a half percent. In return, we will give you a minimum purchase guarantee.\nOmar: That is fair. I will ask our legal team to draft the agreement and send it to you by Friday, so we can move quickly.","v":[["supply agreement","供貨合約"],["commitment","承諾"],["fixed unit price","固定單價"],["annually","每年"],["raw material index","原物料指數"],["cap","設定上限"],["meet in the middle","各讓一步"],["draft","起草"]],"g":[["We would review the price annually, linked to a raw material index.","linked to 是過去分詞片語，修飾前面的動作，說明調價依據。"],["Could we cap any increase at three percent per year?","Could we...? 是禮貌提議；cap ... at 表示把上限設在某個數字。"],["In return, we will give you a minimum purchase guarantee.","In return 表示「作為交換」，常用來引出談判中的對等條件。"]],"s":"Nina 與 Omar 洽談三年供貨合約，雙方就第二、三年的調價上限各讓一步，並以最低採購保證作為交換。","tr":["謝謝你撥空見面，歐瑪。我們想討論一份為期三年的供貨協議。","聽起來不錯。你們考慮的採購量是多少？","每年大約十二萬件，每季交貨一次。","有了這樣的承諾，我可以提供第一年的固定單價。","第二年和第三年呢？","我們會每年檢討價格，並與原物料指數連動。","我們能把每年的漲幅上限設在百分之三嗎？","設上限對我們來說有困難，但我可以同意百分之四。","我們折衷一下，訂在百分之三點五。作為交換，我們會給你們最低採購量保證。","這很公平。我會請法務團隊起草協議，並在週五前寄給你，這樣我們就能加快進度。"]},{"t":"Currency and Exchange Rate Clauses","z":"匯率條款","ty":"article","lv":"B2","d":"International contracts often involve two currencies, so exchange rate clauses are important. Without one, a sudden change in the market can turn a profitable deal into a loss.\nThe simplest option is to fix the price in one currency, such as US dollars. This is easy to understand, but one party carries all of the risk. If the buyer works in euros and the dollar strengthens, their costs rise immediately.\nA fairer approach is to share the risk. Many contracts set a base exchange rate on the signing date. If the rate moves by more than a certain percentage, usually three to five percent, the price is adjusted. Some companies split the difference, so each side absorbs half of the movement.\nWhen you negotiate this clause, define everything clearly. Which source will you use for the rate? On what date will it be checked? How often will it be reviewed? Clear answers now will prevent disagreements later and protect both parties from unpleasant surprises.","v":[["exchange rate","匯率"],["clause","條款"],["profitable","有利潤的"],["carries all of the risk","承擔所有風險"],["strengthens","升值"],["base exchange rate","基準匯率"],["signing date","簽約日"],["split the difference","折衷、平分差額"]],"g":[["If the buyer works in euros and the dollar strengthens, their costs rise immediately.","if 條件句使用現在簡單式，表示一般性的事實或可能發生的情況。"],["Some companies split the difference, so each side absorbs half of the movement.","so 連接結果；split the difference 是慣用語，指雙方平分差額。"],["Clear answers now will prevent disagreements later and protect both parties from unpleasant surprises.","protect ... from 表示保護免於；now 與 later 形成時間對比。"]],"s":"本文介紹合約中的匯率條款，比較固定單一幣別與共同分擔風險的做法，並提醒要清楚定義匯率來源、日期與檢討頻率。","tr":["國際合約往往涉及兩種貨幣，因此匯率條款很重要。沒有這項條款，市場突然變動就可能讓原本獲利的交易變成虧損。","最簡單的做法是以單一貨幣，例如美元，來固定價格。這很容易理解，但風險全由一方承擔。如果買方使用歐元，而美元走強，他們的成本會立即上升。","較公平的做法是分擔風險。許多合約會在簽約日設定一個基準匯率。如果匯率變動超過某個百分比，通常是百分之三到五，價格就會調整。有些公司會對半分攤，讓雙方各自承擔一半的波動。","在協商這項條款時，所有內容都要定義清楚。匯率要採用哪個來源？在哪一天查核？多久檢討一次？現在把答案講清楚，能避免日後的爭議，並保護雙方免於不愉快的意外。"]},{"t":"Discussing Payment Terms","z":"討論付款條件","ty":"dialogue","lv":"B1","d":"Sam: Maria, before we sign, I would like to talk about payment terms.\nMaria: Sure. Our standard is thirty percent deposit and the balance before shipment.\nSam: That is a bit tight for us. Could we do net 60 instead?\nMaria: Net 60 is too long for a new customer. How about net 30 after delivery?\nSam: Net 30 is better, but our finance team usually pays on the fifteenth of the month after the invoice date.\nMaria: So that would be around forty-five days in practice?\nSam: Exactly. We have never paid late with our other suppliers.\nMaria: I believe you. For the first order, I will need a ten percent deposit.\nSam: That is acceptable. And what about a discount for early payment?\nMaria: We offer two percent if you pay within ten days. I will add that to the contract.","v":[["payment terms","付款條件"],["deposit","訂金"],["balance","尾款"],["net 60","月結／發票後 60 天付款"],["invoice date","發票日期"],["in practice","實際上"],["discount for early payment","提早付款折扣"],["contract","合約"]],"g":[["Could we do net 60 instead?","Could we...? 用來禮貌地提出替代方案；instead 表示「改為」。"],["We have never paid late with our other suppliers.","現在完成式搭配 never，說明到目前為止的經驗。"],["We offer two percent if you pay within ten days.","within + 一段時間表示「在……之內」，常用於付款期限。"]],"s":"Sam 與 Maria 討論訂金、尾款與付款天數，最後同意首單收十%訂金，並加入十天內付款可折二%的條款。","tr":["瑪麗亞，在簽約之前，我想談談付款條件。","好的。我們的標準是三成訂金，餘款在出貨前付清。","這對我們來說有點吃緊。我們可以改成月結六十天嗎？","對新客戶來說，月結六十天太長了。交貨後月結三十天如何？","月結三十天比較好，但我們財務部門通常在發票日期之後的下個月十五日付款。","所以實際上大約是四十五天？","沒錯。我們和其他供應商從來沒有延遲付款過。","我相信你。第一筆訂單我需要收取百分之十的訂金。","可以接受。那提早付款有折扣嗎？","如果在十天內付款，我們提供百分之二的折扣。我會把這一點加進合約。"]},{"t":"Rebates and Volume Incentives","z":"回饋金與數量獎勵","ty":"article","lv":"B2","d":"Rebates and volume incentives are popular tools for rewarding loyal customers. Instead of lowering the price on every order, a supplier returns part of the money after the customer reaches an agreed target.\nFor example, a distributor might receive a two percent rebate once annual purchases pass 500,000 dollars, and a four percent rebate above one million. This encourages the buyer to concentrate purchases with one supplier, which helps both sides plan ahead.\nThere are some points to watch. First, the contract should state how the target is measured, for example by value or by quantity. Second, it must explain when the rebate is paid and whether it is a credit note or a bank transfer. Third, you should decide what happens if the customer misses the target by a small margin.\nFrom the seller's perspective, rebates protect the list price while still giving buyers a reward. From the buyer's perspective, a well-designed scheme can lower the real cost significantly, but only if the targets are realistic.","v":[["rebate","回饋金"],["volume incentive","數量獎勵"],["target","目標"],["distributor","經銷商"],["annual purchases","年度採購額"],["credit note","貸項通知單"],["list price","牌價"],["realistic","實際可行的"]],"g":[["Instead of lowering the price on every order, a supplier returns part of the money after the customer reaches an agreed target.","Instead of + 動名詞表示「而不是做……」；agreed 是過去分詞當形容詞，修飾 target。"],["This encourages the buyer to concentrate purchases with one supplier, which helps both sides plan ahead.","which 引導非限定關係子句，補充說明前面整件事；help + 受詞 + 原形動詞。"],["you should decide what happens if the customer misses the target by a small margin.","what happens... 是名詞子句，當 decide 的受詞；by a small margin 表示差距很小。"]],"s":"本文說明回饋金與數量獎勵如何運作，並提醒合約要寫清楚計算方式、支付時間與未達標時的處理。","tr":["回饋金和量大獎勵是回饋忠實客戶的常用工具。供應商不是降低每筆訂單的價格，而是在客戶達到約定目標後，退還一部分款項。","例如，經銷商的年度採購額一旦超過五十萬美元，可以獲得百分之二的回饋金；超過一百萬美元，則可獲得百分之四。這能鼓勵買家把採購集中在一家供應商，對雙方的規劃都有幫助。","有幾個重點需要留意。首先，合約應載明目標如何衡量，例如以金額或數量計算。其次，必須說明回饋金何時支付，以及是以貸項通知單還是銀行轉帳方式給付。第三，你應該決定客戶若以些微差距未達目標時該如何處理。","從賣方的角度來看，回饋金能保住標價，同時仍給買家獎勵。從買方的角度來看，設計良好的方案可以大幅降低實際成本，但前提是目標必須切合實際。"]},{"t":"Negotiating Tooling and NRE Costs","z":"模具與開發費用談判","ty":"dialogue","lv":"B2","d":"Ethan: Hannah, the tooling quote came in at 40,000 dollars. That is higher than we expected.\nHannah: I understand. The mold is complex, and it needs hardened steel to last for a million shots.\nEthan: Could we spread the cost over the first orders instead of paying upfront?\nHannah: We can amortize part of it. I would suggest you pay fifty percent now and add a small charge to each unit.\nEthan: How much per unit?\nHannah: About ten cents, until the remaining 20,000 dollars is recovered.\nEthan: And who owns the tool once it is paid for?\nHannah: You do. We will keep it at our factory for maintenance, but it will be labeled with your name.\nEthan: What about the engineering fee for the design changes?\nHannah: That one-time NRE charge is 6,000 dollars. If the order exceeds 50,000 units, I can waive it.","v":[["tooling","模具／治具"],["mold","模具"],["upfront","預先"],["amortize","分攤"],["maintenance","維護"],["engineering fee","工程費"],["NRE charge","一次性開發費"],["waive","免除"]],"g":[["Could we spread the cost over the first orders instead of paying upfront?","spread ... over 表示把費用分攤到一段期間；instead of + 動名詞表示「而不是」。"],["it will be labeled with your name.","will be + 過去分詞是未來被動語態，說明之後會如何處理。"],["If the order exceeds 50,000 units, I can waive it.","if 條件句：條件達成時，賣方就可以免除費用。"]],"s":"Ethan 與 Hannah 討論四萬美元的模具費，同意先付一半、其餘分攤到單價，並在大單時免除一次性開發費。","tr":["Hannah，模具報價是 40,000 美元，比我們預期的高。","我了解。這個模具很複雜，需要用硬化鋼才能撐到一百萬次射出。","我們可以把費用分攤到前幾張訂單，而不是一次先付清嗎？","我們可以分攤一部分。我建議您現在先付百分之五十，再在每個單位上加收少許費用。","每個單位多少錢？","大約十美分，直到收回剩下的 20,000 美元為止。","那模具付清之後，所有權歸誰？","歸您所有。我們會把它放在我們工廠進行維護，但會標示您的名稱。","那設計變更的工程費用呢？","那筆一次性的 NRE 費用是 6,000 美元。如果訂單超過 50,000 個，我可以幫您免除。"]},{"t":"Saying No Politely in a Negotiation","z":"談判中禮貌拒絕","ty":"dialogue","lv":"B2","d":"Julia: Dan, I have reviewed your request for a twenty percent discount.\nDan: And what did you decide?\nJulia: I am afraid I cannot go that far. Our margins are already very thin on this product.\nDan: That is disappointing. Our budget is fixed.\nJulia: I understand your position, and I would like to find a solution that works for both of us.\nDan: Then what can you offer?\nJulia: I cannot change the unit price, but I can offer free delivery and an extended warranty.\nDan: That is not quite what I hoped for.\nJulia: I know. Another option is a smaller specification with a lower cost. Would you like me to prepare a quote for that?\nDan: Yes, please. That might be worth considering.\nJulia: Perfect. I will send it tomorrow morning, and we can talk again after you review it.","v":[["discount","折扣"],["margin","利潤"],["thin","（利潤）微薄"],["budget","預算"],["position","立場"],["unit price","單價"],["extended warranty","延長保固"],["specification","規格"]],"g":[["I am afraid I cannot go that far.","I am afraid 是委婉說法，用來禮貌地表達壞消息或拒絕。"],["I would like to find a solution that works for both of us.","that 引導限定關係子句，說明是哪一種解決方案；would like to 語氣禮貌。"],["Would you like me to prepare a quote for that?","Would you like me to + 原形動詞，用來禮貌地提出要幫對方做事。"]],"s":"Julia 禮貌拒絕二十%折扣的要求，改為提出免運費、延長保固或較低規格的替代方案。","tr":["Dan，我已經看過您要求打八折的請求了。","那您的決定是什麼？","恐怕我無法讓到那個程度。這項產品我們的利潤本來就已經很薄了。","真令人失望。我們的預算是固定的。","我了解您的立場，也希望能找到對雙方都可行的解決方案。","那您能提供什麼？","我無法調整單價，但可以提供免運費和延長保固。","這和我原本期望的不太一樣。","我明白。另一個選擇是規格小一點、成本較低的版本。需要我準備那個版本的報價嗎？","好的，麻煩你。那或許值得考慮。","太好了。我明天早上寄給您，您看過之後我們再談。"]},{"t":"Closing the Deal","z":"談成交易","ty":"dialogue","lv":"B1","d":"Victor: Elena, I think we are close. Let me summarize what we have agreed.\nElena: Please do.\nVictor: The unit price is 8.50 dollars for 20,000 pieces, delivered in two shipments.\nElena: Correct. And payment is net 45 days from the invoice date.\nVictor: Yes. We also agreed that you will cover the cost of the first set of samples.\nElena: That is right. Is there anything still open?\nVictor: Just the delivery date. Can you confirm that the first shipment will arrive by March tenth?\nElena: Yes, we can commit to that, as long as we receive the purchase order by the end of this week.\nVictor: That is no problem. I will send it on Friday.\nElena: Wonderful. I will prepare the contract today, and we can sign it on Monday.\nVictor: Great. I am looking forward to working with you.","v
