ate to all department heads.","我會每週寄出最新進度給各部門主管。"]]},{"w":"briefing","p":"n.","z":"簡報會、情況說明","c":"會議與管理","ex":[["The CEO will hold a briefing on the merger tomorrow.","執行長明天將召開合併案的說明會。"],["We received a short briefing before the client visit.","客戶來訪前，我們聽了一場簡短的說明。"]]},{"w":"memo","p":"n.","z":"備忘錄","c":"會議與管理","ex":[["The manager sent a memo about the new dress code.","經理發出一份關於新服裝規定的備忘錄。"],["Please read the memo and sign it by Friday.","請閱讀這份備忘錄並在週五前簽名。"]]},{"w":"circular","p":"n.","z":"通告、傳閱文件","c":"會議與管理","ex":[["A circular was sent to all staff about the office closure.","一份關於辦公室關閉的通告發給了全體員工。"],["Please read the circular and pass it on.","請閱讀這份通告並傳閱下去。"]]},{"w":"correspondence","p":"n.","z":"往來信件、通信","c":"會議與管理","ex":[["All correspondence with clients must be saved in the system.","所有與客戶的往來信件都必須存入系統。"],["I am behind on my email correspondence this week.","我這週的電子郵件往來進度落後了。"]]},{"w":"attachment","p":"n.","z":"附件","c":"會議與管理","ex":[["Please find the contract attached to this email as an attachment.","請見本電子郵件附件中的合約。"],["The attachment is too large to send by email.","這個附件太大，無法用電子郵件寄出。"]]},{"w":"cc","p":"v.","z":"副本抄送","c":"會議與管理","ex":[["Please cc your supervisor on all emails to the client.","寄給客戶的所有郵件請副本抄送你的主管。"],["I forgot to cc the finance team on the message.","我忘了把財務團隊加入副本。"]]},{"w":"forward","p":"v.","z":"轉寄","c":"會議與管理","ex":[["I will forward you the email from the supplier.","我會把供應商的郵件轉寄給你。"],["Could you forward this invoice to the accounting department?","你可以把這張發票轉寄給會計部門嗎？"]]},{"w":"acknowledge","p":"v.","z":"確認收到、承認","c":"會議與管理","ex":[["Please acknowledge receipt of this email as soon as possible.","請盡快回覆確認收到這封郵件。"],["The company acknowledged the error and apologized to customers.","公司承認錯誤並向顧客道歉。"]]},{"w":"inquire","p":"v.","z":"詢問","c":"會議與管理","ex":[["I am writing to inquire about the status of my application.","我寫信是想詢問我的申請進度。"],["Several customers inquired about the new product line.","數位顧客詢問了新產品系列。"]]},{"w":"enclose","p":"v.","z":"隨函附上","c":"會議與管理","ex":[["I have enclosed a copy of the signed agreement.","我隨函附上一份已簽署的協議副本。"],["Please find enclosed our latest price list and a copy of the catalog.","隨函附上我們最新的價目表。"]]},{"w":"regarding","p":"prep.","z":"關於","c":"會議與管理","ex":[["I am writing regarding the delay in your shipment.","我來信是關於您的貨物延誤一事。"],["We have no questions regarding the proposed schedule.","關於提議的時程，我們沒有疑問。"]]},{"w":"apologize","p":"v.","z":"道歉","c":"會議與管理","ex":[["We apologize for the inconvenience caused by the late delivery.","對於延遲送貨造成的不便，我們深表歉意。"],["He apologized to the client for missing the meeting.","他為缺席會議向客戶道歉。"]]},{"w":"confirm","p":"v.","z":"確認","c":"會議與管理","ex":[["Could you confirm the time of tomorrow's meeting?","你可以確認明天會議的時間嗎？"],["The hotel confirmed our reservation for three nights.","飯店確認了我們三晚的訂房。"]]},{"w":"approve","p":"v.","z":"核准、批准","c":"會議與管理","ex":[["The director must approve every expense above one thousand dollars.","超過一千美元的每筆開銷都必須由主任核准。"],["The board approved the plan without any changes.","董事會原封不動地通過了這項計畫。"]]},{"w":"authorize","p":"v.","z":"授權、批准","c":"會議與管理","ex":[["Only the manager can authorize a refund over five hundred dollars.","只有經理能批准超過五百美元的退款。"],["She authorized the team to sign the contract on her behalf.","她授權團隊代她簽署合約。"]]},{"w":"sign off","p":"phr.","z":"正式批准、簽核","c":"會議與管理","ex":[["The director needs to sign off on the budget first.","主任必須先簽核預算。"],["Legal has already signed off on the contract.","法務部已經簽核了這份合約。"]]},{"w":"reject","p":"v.","z":"拒絕、駁回","c":"會議與管理","ex":[["The committee rejected the proposal because it was too expensive.","委員會因為提案太貴而駁回。"],["His request for extra leave was rejected by the department head.","他申請額外休假的要求被駁回了。"]]},{"w":"revise","p":"v.","z":"修訂、修改","c":"會議與管理","ex":[["Please revise the schedule and send it back to me.","請修改時程表並寄回給我。"],["We revised the budget after the supplier raised prices.","供應商漲價後，我們修訂了預算。"]]},{"w":"draft","p":"n.","z":"草稿","c":"會議與管理","ex":[["I have attached the first draft of the report.","我已附上報告的初稿。"],["Please review the draft and send me your comments.","請審閱草稿並把意見寄給我。"]]},{"w":"proofread","p":"v.","z":"校對","c":"會議與管理","ex":[["Always proofread your emails before sending them to clients.","寄給客戶前，務必校對你的電子郵件。"],["Could you proofread this contract for any typing errors?","你可以幫忙校對這份合約有沒有打字錯誤嗎？"]]},{"w":"template","p":"n.","z":"範本","c":"會議與管理","ex":[["Use the company template when you write a business letter.","寫商業信函時請使用公司範本。"],["We created a template for the weekly status report.","我們為每週狀況報告製作了一個範本。"]]},{"w":"protocol","p":"n.","z":"規範、慣例","c":"會議與管理","ex":[["Please follow the company protocol when dealing with complaints.","處理客訴時請遵循公司規範。"],["Business protocol varies a great deal from country to country.","商業禮儀慣例因國家而異。"]]},{"w":"confidential","p":"adj.","z":"機密的","c":"會議與管理","ex":[["This document is confidential and must not be shared.","這份文件是機密，不可外流。"],["Salary information is strictly confidential in our company.","在我們公司，薪資資訊是嚴格保密的。"]]},{"w":"transparent","p":"adj.","z":"透明的、公開的","c":"會議與管理","ex":[["Management should be transparent about the reasons for layoffs.","管理階層應公開說明裁員的原因。"],["We want a transparent process for choosing suppliers.","我們希望挑選供應商的流程公開透明。"]]},{"w":"initiative","p":"n.","z":"主動性、新措施","c":"會議與管理","ex":[["She showed great initiative by organizing the training herself.","她自己安排培訓，展現出很強的主動性。"],["The company launched a new initiative to reduce waste.","公司推出了一項減少浪費的新措施。"]]},{"w":"pending","p":"adj.","z":"待處理的、懸而未決的","c":"會議與管理","ex":[["Several urgent requests are still pending with the legal department.","有幾項緊急申請仍在法務部門待處理。"],["The decision is pending until the board meets next week.","這項決定要等董事會下週開會後才會定案。"]]},{"w":"bandwidth","p":"n.","z":"工作餘裕、承載量","c":"會議與管理","ex":[["I do not have the bandwidth to take on another project right now.","我現在沒有餘力再接另一個專案。"],["The team lacks the bandwidth to handle all these requests.","團隊沒有足夠的人力處理這麼多要求。"]]},{"w":"buy-in","p":"n.","z":"支持、認同","c":"會議與管理","ex":[["We need buy-in from senior management before we start the project.","開始專案前，我們需要高階主管的支持。"],["Getting buy-in from staff made the change much smoother.","取得員工的認同讓這項改變順利許多。"]]},{"w":"wrap up","p":"phr.","z":"結束、完成","c":"會議與管理","ex":[["Let's wrap up the meeting and send out the notes today.","我們結束會議，今天就把筆記寄出去。"],["We hope to wrap up the negotiations by the end of the week.","我們希望在本週結束前完成談判。"]]},{"w":"kickoff","p":"n.","z":"啟動會議、開工","c":"會議與管理","ex":[["We will hold the project kickoff on Monday morning in the main conference room.","我們將於週一早上在大會議室舉行專案啟動會議。"],["The kickoff gave every team a clear picture of the goals and schedule.","啟動會議讓每個團隊都清楚了解目標與時程。"]]},{"w":"takeaway","p":"n.","z":"重點結論、收穫","c":"會議與管理","ex":[["The main takeaway from today's meeting is that we need more data before deciding.","今天會議的主要結論是我們在決定前需要更多數據。"],["Please send me your key takeaway from the training session by Friday.","請在週五前把你從培訓中的主要收穫寄給我。"]]},{"w":"mandate","p":"n.","z":"授權、職權範圍","c":"會議與管理","ex":[["The committee has a clear mandate to review all supplier contracts this year.","委員會獲得明確授權，要在今年審查所有供應商合約。"],["Our mandate is to cut costs without reducing product quality.","我們的職責是在不降低產品品質下削減成本。"]]},{"w":"empower","p":"v.","z":"賦權、授權","c":"會議與管理","ex":[["Good managers empower their staff to make decisions without constant approval.","好的主管會賦權員工，讓他們不必一直等待批准就能做決定。"],["We want to empower frontline employees to solve customer problems quickly.","我們希望賦權第一線員工，快速解決客戶問題。"]]},{"w":"micromanage","p":"v.","z":"過度干涉、事事管控","c":"會議與管理","ex":[["It is hard to do creative work when your boss tries to micromanage everything.","當老闆事事過度干涉時，很難做出有創意的工作。"],["New managers often micromanage because they do not yet trust their team.","新任主管常因還不信任團隊而過度管控。"]]},{"w":"oversight","p":"n.","z":"監督、疏忽","c":"會議與管理","ex":[["The project needs stronger oversight from senior management to stay on budget.","這個專案需要高階主管更強的監督，才能控制在預算內。"],["The error was an oversight, and we have already corrected the report.","這個錯誤是疏忽所致，我們已更正報告。"]]},{"w":"ad hoc","p":"adj.","z":"臨時的、特別的","c":"會議與管理","ex":[["We formed an ad hoc team to handle the sudden customer complaints.","我們成立了臨時小組來處理突然增加的客訴。"],["Ad hoc meetings waste time when nobody prepares an agenda beforehand.","如果事先沒人準備議程，臨時會議只會浪費時間。"]]},{"w":"steering committee","p":"n.","z":"指導委員會","c":"會議與管理","ex":[["The steering committee meets monthly to review progress on the merger.","指導委員會每月開會，審查合併案的進度。"],["Our proposal must be approved by the steering committee before work begins.","我們的提案必須先經指導委員會核准才能動工。"]]},{"w":"workflow","p":"n.","z":"工作流程","c":"會議與管理","ex":[["The new software will simplify our workflow and reduce repetitive manual tasks.","新軟體將簡化我們的工作流程，並減少重複的手動作業。"],["A clear workflow helps new employees understand who approves each step.","清楚的工作流程能幫助新進員工了解每個步驟由誰核准。"]]},{"w":"debrief","p":"v.","z":"事後檢討、聽取匯報","c":"會議與管理","ex":[["After the trade show, we will debrief the whole sales team on Monday.","展覽結束後，我們週一會向整個業務團隊進行事後檢討。"],["The manager asked each member to debrief her on the client visit.","經理要求每位成員向她匯報拜訪客戶的情形。"]]},{"w":"reiterate","p":"v.","z":"重申","c":"會議與管理","ex":[["Let me reiterate that the deadline for this report cannot be moved.","容我重申，這份報告的期限無法更動。"],["I would like to reiterate our commitment to delivering on time.","我想重申我們準時交貨的承諾。"]]},{"w":"constructive","p":"adj.","z":"建設性的","c":"會議與管理","ex":[["We appreciate your constructive feedback on the draft proposal.","我們感謝你對提案草稿提出的建設性意見。"],["A constructive discussion helped both sides find a practical solution.","一場有建設性的討論幫助雙方找到可行的解決方案。"]]},{"w":"interim","p":"adj.","z":"暫時的、代理的","c":"會議與管理","ex":[["She will serve as interim manager until a permanent replacement is hired.","在聘到正式接任者之前，她將擔任代理經理。"],["We reached an interim agreement while the final terms are still being negotiated.","在最終條款仍在協商時，我們達成了暫時性協議。"]]},{"w":"discretion","p":"n.","z":"裁量權、謹慎","c":"會議與管理","ex":[["Managers have the discretion to approve small expenses without asking finance.","主管有裁量權，可不經財務部就核准小額支出。"],["Please handle this sensitive matter with discretion and tell no one outside the team.","請謹慎處理這件敏感的事，不要告訴團隊以外的人。"]]},{"w":"ownership","p":"n.","z":"責任歸屬、當責、所有權","c":"會議與管理","ex":[["We expect every team member to take ownership of their own tasks.","我們期望每位團隊成員對自己的任務負起責任。"],["Clear ownership of each deliverable prevents confusion and missed deadlines.","明確指定每項交付成果的負責人，能避免混亂與誤期。"]]},{"w":"sync","p":"v.","z":"同步、對齊進度","c":"會議與管理","ex":[["Let's sync tomorrow morning to make sure everyone has the latest figures.","我們明早對一下進度，確保大家都拿到最新數字。"],["The engineering and marketing teams sync every Thursday about upcoming launches.","工程與行銷團隊每週四會針對即將上市的產品對齊進度。"]]},{"w":"hire","p":"v.","z":"聘僱、雇用","c":"會議與管理","ex":[["We plan to hire five new engineers before the end of the quarter.","我們計劃在本季結束前聘僱五名新工程師。"],["It takes about two months to hire a qualified senior accountant.","要聘到一位合格的資深會計約需兩個月。"]]},{"w":"layoff","p":"n.","z":"裁員、資遣","c":"會議與管理","ex":[["The company announced a layoff affecting about ten percent of its workforce.","公司宣布裁員，影響約一成的員工。"],["Poor sales led to a layoff in the manufacturing division.","銷售不佳導致製造部門裁員。"]]},{"w":"upskill","p":"v.","z":"提升技能","c":"會議與管理","ex":[["The company offers courses to upskill employees in data analysis.","公司提供課程，讓員工提升資料分析技能。"],["We need to upskill our sales staff before introducing the new product line.","在推出新產品線之前，我們必須提升業務人員的技能。"]]},{"w":"grievance","p":"n.","z":"申訴、不滿","c":"會議與管理","ex":[["Any employee with a grievance can file a complaint with the HR department.","任何有申訴的員工都可向人資部門提出投訴。"],["The union raised a grievance about unpaid overtime at the factory.","工會針對工廠未支付加班費提出申訴。"]]},{"w":"succession plan","p":"n.","z":"接班計畫","c":"會議與管理","ex":[["Every large firm needs a succession plan for its key executives.","每家大型公司都需要為關鍵主管制定接班計畫。"],["The board approved a succession plan before the CEO announced her retirement.","在執行長宣布退休前，董事會已通過接班計畫。"]]},{"w":"negotiate","p":"v.","z":"談判、協商","c":"業務與客戶","ex":[["We need to negotiate the delivery terms before signing the contract.","我們必須在簽約前協商交貨條件。"],["She negotiated a ten percent discount for bulk purchases.","她為大量採購談到了九折優惠。"]]},{"w":"negotiation","p":"n.","z":"談判、協商","c":"業務與客戶","ex":[["The negotiation lasted three days before both sides reached an agreement.","談判持續了三天，雙方才達成協議。"],["Price negotiation is the hardest part of this deal.","價格談判是這筆交易最困難的部分。"]]},{"w":"bargain","p":"n.","z":"划算的交易、特價品","c":"業務與客戶","ex":[["At that price, the software license is a real bargain.","以那個價格來看，這套軟體授權真的很划算。"],["Customers love hunting for a bargain during the anniversary sale.","顧客喜歡在週年慶期間尋找特價商品。"]]},{"w":"concession","p":"n.","z":"讓步、優惠","c":"業務與客戶","ex":[["We made a concession on price to win the long-term contract.","為了贏得長期合約，我們在價格上讓步。"],["The supplier refused to make any further concessions.","供應商拒絕再做任何讓步。"]]},{"w":"counteroffer","p":"n.","z":"還價、反要約","c":"業務與客戶","ex":[["They rejected our proposal and sent a counteroffer the next morning.","他們拒絕了我們的提案，隔天早上寄來還價。"],["Our manager is preparing a counteroffer with a shorter payment period.","我們經理正在準備付款期限較短的還價方案。"]]},{"w":"leverage","p":"n.","z":"談判籌碼、影響力","c":"業務與客戶","ex":[["Our large order volume gives us leverage in price talks.","我們的大量訂單讓我們在價格談判中握有籌碼。"],["Without any leverage, the small vendor had to accept the terms.","沒有任何籌碼，這家小廠商只能接受條件。"]]},{"w":"deadlock","p":"n.","z":"僵局","c":"業務與客戶","ex":[["The talks reached a deadlock over the exclusivity clause.","談判在排他條款上陷入僵局。"],["A neutral mediator helped break the deadlock between the two firms.","中立的調解人協助打破了兩家公司之間的僵局。"]]},{"w":"compromise","p":"n.","z":"妥協、折衷方案","c":"業務與客戶","ex":[["After hours of discussion, we reached a compromise on the schedule.","經過數小時討論，我們在時程上達成折衷。"],["Neither party was willing to accept a compromise.","雙方都不願接受妥協。"]]},{"w":"quotation","p":"n.","z":"報價單","c":"業務與客戶","ex":[["Could you send me a quotation for five hundred units?","可以寄給我五百件的報價單嗎？"],["The quotation is valid for thirty days from the date of issue.","這份報價單自開立日起三十天內有效。"]]},{"w":"discount","p":"n.","z":"折扣","c":"業務與客戶","ex":[["We offer a fifteen percent discount for early payment.","提早付款我們提供八五折優惠。"],["Regular customers receive a special discount w landing page doubled our conversion rate.","新的登陸頁讓我們的轉換率翻倍。"],["A low conversion rate means visitors are not becoming buyers.","轉換率低表示訪客沒有變成買家。"]]},{"w":"touchpoint","p":"n.","z":"接觸點、客戶接觸環節","c":"業務與客戶","ex":[["Every touchpoint with the customer shapes how they see our brand.","與客戶的每個接觸點都會影響他們對我們品牌的看法。"],["We mapped each touchpoint from the first ad to the after-sales call.","我們繪製了從第一則廣告到售後電話的每個接觸點。"]]},{"w":"lead generation","p":"n.","z":"開發潛在客戶","c":"業務與客戶","ex":[["Our lead generation campaign brought in two hundred new contacts this month.","我們的開發潛在客戶活動這個月帶來了兩百位新聯絡人。"],["Webinars are an effective lead generation tool for software companies.","網路研討會對軟體公司而言是有效的開發潛在客戶工具。"]]},{"w":"tagline","p":"n.","z":"廣告標語","c":"業務與客戶","ex":[["The new tagline is short, simple, and easy for customers to remember.","新的廣告標語簡短、簡單，客戶容易記住。"],["We tested three versions of the tagline before choosing the final one.","我們測試了三個版本的廣告標語，才選出最終版本。"]]},{"w":"bundle","p":"n.","z":"組合包、套裝","c":"業務與客戶","ex":[["We offer a software bundle that includes training and one year of support.","我們提供含培訓與一年支援的軟體套裝組合。"],["Customers who buy the bundle save about twenty percent compared with separate items.","購買組合包的客戶比單買節省約兩成。"]]},{"w":"market research","p":"n.","z":"市場調查","c":"業務與客戶","ex":[["Market research showed that young consumers prefer eco-friendly packaging.","市場調查顯示，年輕消費者偏好環保包裝。"],["We hired an agency to carry out market research before entering Japan.","我們在進入日本市場前聘請機構進行市場調查。"]]},{"w":"outperform","p":"v.","z":"表現優於、勝過","c":"業務與客戶","ex":[["Our new model continues to outperform rival products in independent tests.","我們的新機型在獨立測試中持續勝過競爭產品。"],["The sales team managed to outperform its target by fifteen percent.","業務團隊的成績超越目標達百分之十五。"]]},{"w":"consumer","p":"n.","z":"消費者","c":"業務與客戶","ex":[["Consumer confidence has risen, so retailers expect strong holiday sales.","消費者信心上升，因此零售商預期假期銷售強勁。"],["We design every product with the average consumer in mind.","我們設計每項產品時都以一般消費者為出發點。"]]},{"w":"bestseller","p":"n.","z":"暢銷商品","c":"業務與客戶","ex":[["This handbag has been our bestseller for three years in a row.","這款手提包連續三年都是我們的暢銷商品。"],["A bestseller on the shelf can attract customers to other products too.","貨架上的暢銷商品也能吸引客人購買其他產品。"]]},{"w":"e-commerce","p":"n.","z":"電子商務","c":"業務與客戶","ex":[["E-commerce now accounts for nearly half of our total retail revenue.","電子商務目前占我們零售總營收將近一半。"],["Many small shops moved to e-commerce platforms during the pandemic.","許多小店在疫情期間轉往電子商務平台。"]]},{"w":"markdown","p":"n.","z":"降價、折價","c":"業務與客戶","ex":[["The store took a thirty percent markdown on all winter coats.","這家店把所有冬季外套降價三成。"],["A deep markdown can clear old stock but also hurts the profit margin.","大幅降價能清掉舊庫存，但也會損害利潤率。"]]},{"w":"volume discount","p":"n.","z":"大量購買折扣","c":"業務與客戶","ex":[["We offer a volume discount for orders above one thousand units.","訂購超過一千件，我們提供大量購買折扣。"],["The supplier gave us a volume discount after we doubled our order.","在我們把訂單加倍後，供應商給了我們量大折扣。"]]},{"w":"cater to","p":"phr.","z":"迎合、滿足需求","c":"業務與客戶","ex":[["Our hotel is designed to cater to business travelers who need fast Wi-Fi.","我們的飯店專為需要高速網路的商務旅客設計。"],["The company must cater to both local and overseas customers.","公司必須同時滿足本地與海外客戶的需求。"]]},{"w":"customer base","p":"n.","z":"客戶群","c":"業務與客戶","ex":[["Our customer base has grown steadily since we launched the mobile app.","自從推出行動應用程式後，我們的客戶群穩定成長。"],["Losing a major client would shrink our customer base significantly.","失去一位大客戶會使我們的客戶群大幅縮小。"]]},{"w":"brand ambassador","p":"n.","z":"品牌大使","c":"業務與客戶","ex":[["The famous singer was chosen as our brand ambassador for Asia.","那位知名歌手獲選為我們的亞洲品牌大使。"],["A good brand ambassador builds trust with younger customers.","好的品牌大使能與年輕客戶建立信任。"]]},{"w":"flat rate","p":"n.","z":"統一費率、固定費率","c":"業務與客戶","ex":[["We charge a flat rate for delivery anywhere in Taiwan.","我們在台灣任何地方的運費都收統一費率。"],["The consultant offered a flat rate instead of billing by the hour.","顧問提出固定費率，而不是按小時計費。"]]},{"w":"budget","p":"n.","z":"預算","c":"財務與合約","ex":[["The marketing budget for next year has been cut by ten percent.","明年的行銷預算已被削減百分之十。"],["We must stay within budget or the project will be cancelled.","我們必須控制在預算內,否則專案會被取消。"]]},{"w":"overhead","p":"n.","z":"間接費用、管銷費用","c":"財務與合約","ex":[["We reduced overhead by moving to a smaller office.","我們搬到較小的辦公室以降低間接費用。"],["High overhead makes it hard for small firms to compete on price.","高額的間接費用讓小公司很難在價格上競爭。"]]},{"w":"liability","p":"n.","z":"負債、法律責任","c":"財務與合約","ex":[["The company's total liabilities exceeded its assets last year.","公司去年的總負債超過了資產。"],["The contract limits our liability to the value of the order.","合約將我們的責任限制在訂單金額內。"]]},{"w":"asset","p":"n.","z":"資產","c":"財務與合約","ex":[["The factory is the company's most valuable asset.","這間工廠是公司最有價值的資產。"],["Intangible assets such as patents are listed separately on the balance sheet.","專利等無形資產在資產負債表上單獨列示。"]]},{"w":"balance sheet","p":"phr.","z":"資產負債表","c":"財務與合約","ex":[["The auditor reviewed the balance sheet line by line.","審計人員逐項檢視了資產負債表。"],["A strong balance sheet helps us borrow money at lower rates.","穩健的資產負債表讓我們能以較低利率借款。"]]},{"w":"cash flow","p":"phr.","z":"現金流量","c":"財務與合約","ex":[["Late payments from clients have hurt our cash flow.","客戶延遲付款損害了我們的現金流。"],["Positive cash flow is essential for a growing startup.","正向現金流對成長中的新創公司至關重要。"]]},{"w":"audit","p":"n.","z":"審計、查帳","c":"財務與合約","ex":[["The annual audit found no major errors in our financial records.","年度審計未發現我們財務紀錄有重大錯誤。"],["An external audit will be carried out in January.","外部審計將在一月進行。"]]},{"w":"depreciation","p":"n.","z":"折舊","c":"財務與合約","ex":[["Depreciation on the new machinery is calculated over ten years.","新機器的折舊以十年計算。"],["We recorded a large depreciation expense this quarter.","我們本季認列了一筆大額折舊費用。"]]},{"w":"amortize","p":"v.","z":"攤銷、分期償還","c":"財務與合約","ex":[["The cost of the software license will be amortized over five years.","軟體授權費用將分五年攤銷。"],["The loan is amortized in equal monthly payments.","這筆貸款以每月等額方式分期償還。"]]},{"w":"accrue","p":"v.","z":"累積、應計","c":"財務與合約","ex":[["Interest will accrue on the unpaid balance every month.","未付餘額每月都會累計利息。"],["Holiday pay continues to accrue while employees are on leave.","員工休假期間假期薪資仍持續累計。"]]},{"w":"expenditure","p":"n.","z":"支出、開銷","c":"財務與合約","ex":[["Government expenditure on infrastructure rose sharply last year.","政府去年在基礎建設上的支出大幅增加。"],["We need tighter control over capital expenditure.","我們需要更嚴格地控管資本支出。"]]},{"w":"reimburse","p":"v.","z":"補償、核銷(費用)","c":"財務與合約","ex":[["The company will reimburse you for travel expenses within two weeks.","公司會在兩週內核銷您的差旅費用。"],["Employees must submit receipts before they can be reimbursed.","員工必須提交收據才能獲得核銷。"]]},{"w":"payroll","p":"n.","z":"薪資單、薪資總額","c":"財務與合約","ex":[["The payroll department processes salaries on the 25th of each month.","薪資部門每月二十五日處理薪資。"],["Our payroll has doubled since we opened the new branch.","自從開設新分公司後,我們的薪資支出已增加一倍。"]]},{"w":"tax deduction","p":"phr.","z":"稅額扣除、可抵稅項目","c":"財務與合約","ex":[["Charitable donations may qualify for a tax deduction.","慈善捐款可能符合稅額扣除資格。"],["You can claim a tax deduction for your home office.","您可以就家庭辦公室申請稅額扣除。"]]},{"w":"withholding tax","p":"phr.","z":"扣繳稅款","c":"財務與合約","ex":[["A withholding tax of twenty percent applies to foreign royalties.","外國權利金適用百分之二十的扣繳稅款。"],["The withholding tax is deducted before the payment reaches you.","扣繳稅款在款項到您手上之前就已扣除。"]]},{"w":"tariff","p":"n.","z":"關稅、價目表","c":"財務與合約","ex":[["New tariffs on steel have raised our production costs.","鋼鐵新關稅提高了我們的生產成本。"],["The hotel posted its tariff at the reception desk.","飯店在櫃檯公布了價目表。"]]},{"w":"surcharge","p":"n.","z":"附加費","c":"財務與合約","ex":[["A fuel surcharge will be added to all shipments this month.","本月所有貨運都會加收燃油附加費。"],["There is a surcharge for payments made by credit card.","使用信用卡付款需加收附加費。"]]},{"w":"price list","p":"phr.","z":"價目表","c":"財務與合約","ex":[["The updated price list will take effect on January 1.","更新後的價目表將於一月一日生效。"],["Please send me your latest price list and catalog.","請寄給我你們最新的價目表和型錄。"]]},{"w":"unit price","p":"phr.","z":"單價","c":"財務與合約","ex":[["The unit price drops as the order quantity increases.","訂購數量增加時單價會下降。"],["Please confirm the unit price before we place the order.","下單前請確認單價。"]]},{"w":"competitive pricing","p":"phr.","z":"具競爭力的定價","c":"財務與合約","ex":[["We pride ourselves on competitive pricing without sacrificing quality.","我們以不犧牲品質的競爭性定價為傲。"],["Competitive pricing helped us win the contract.","具競爭力的定價幫助我們贏得了合約。"]]},{"w":"payment terms","p":"phr.","z":"付款條件","c":"財務與合約","ex":[["Our standard payment terms are net thirty days.","我們的標準付款條件是三十天內付清。"],["They asked to extend the payment terms to sixty days.","他們要求把付款條件延長到六十天。"]]},{"w":"deposit","p":"n.","z":"訂金、押金、存款","c":"財務與合約","ex":[["A thirty percent deposit is required to confirm your order.","需支付百分之三十的訂金才能確認訂單。"],["The deposit is refundable if you cancel within seven days.","若在七天內取消,訂金可退還。"]]},{"w":"installment","p":"n.","z":"分期付款的一期","c":"財務與合約","ex":[["You can pay the fee in three monthly installments.","您可以分三個月分期支付這筆費用。"],["The final installment is due at the end of June.","最後一期款項在六月底到期。"]]},{"w":"overdue","p":"adj.","z":"逾期的、過期未付的","c":"財務與合約","ex":[["Your account is thirty days overdue, so please pay immediately.","您的帳款已逾期三十天,請立即付款。"],["We sent a reminder about the overdue invoice twice.","我們已就逾期發票發出兩次提醒。"]]},{"w":"outstanding","p":"adj.","z":"未付清的、未結的","c":"財務與合約","ex":[["There is still an outstanding balance of five thousand dollars.","還有五千元的未付餘額。"],["Please settle all outstanding invoices before the audit.","請在審計前結清所有未付發票。"]]},{"w":"default","p":"v.","z":"違約、不履行","c":"財務與合約","ex":[["The borrower defaulted on the loan after losing his main client.","借款人失去主要客戶後,貸款違約了。"],["If the buyer defaults, the seller may terminate the agreement.","如果買方違約,賣方可終止協議。"]]},{"w":"collateral","p":"n.","z":"擔保品、抵押品","c":"財務與合約","ex":[["The bank asked for property as collateral for the loan.","銀行要求以房地產作為貸款的擔保品。"],["Without collateral, small firms find it hard to get credit.","沒有擔保品,小型企業很難取得信貸。"]]},{"w":"credit rating","p":"phr.","z":"信用評等","c":"財務與合約","ex":[["A poor credit rating makes it expensive to borrow money.","信用評等不佳會讓借款成本變高。"],["The agency lowered the company's credit rating last week.","評等機構上週調降了該公司的信用評等。"]]},{"w":"interest rate","p":"phr.","z":"利率","c":"財務與合約","ex":[["The central bank raised the interest rate by a quarter point.","央行把利率調升了四分之一個百分點。"],["A lower interest rate would make the loan more affordable.","較低的利率會讓這筆貸款更負擔得起。"]]},{"w":"equity","p":"n.","z":"股權、權益","c":"財務與合約","ex":[["The founders kept fifty-one percent of the equity in the company.","創辦人保留了公司百分之五十一的股權。"],["Return on equity is an important measure for investors.","股東權益報酬率對投資人而言是重要指標。"]]},{"w":"dividend","p":"n.","z":"股利、股息","c":"財務與合約","ex":[["The board approved a dividend of two dollars per share.","董事會通過每股兩美元的股利。"],["The company has paid a dividend every year since 1990.","該公司自一九九〇年起每年都發放股利。"]]},{"w":"shareholder","p":"n.","z":"股東","c":"財務與合約","ex":[["Every shareholder is invited to the annual general meeting.","每位股東都受邀參加年度股東大會。"],["Major shareholders voted against the merger proposal.","大股東投票反對合併案。"]]},{"w":"stake","p":"n.","z":"持股、利害關係","c":"財務與合約","ex":[["The investor bought a twenty percent stake in the startup.","這位投資人買下了該新創公司百分之二十的股份。"],["All stakeholders have a stake in the project's success.","所有利害關係人都與專案的成功息息相關。"]]},{"w":"valuation","p":"n.","z":"估值、評價","c":"財務與合約","ex":[["The startup's valuation doubled after the latest funding round.","在最新一輪募資後,這家新創公司的估值翻了一倍。"],["An independent valuation of the property is required.","這處房產需要獨立的估價。"]]},{"w":"merger","p":"n.","z":"合併","c":"財務與合約","ex":[["The merger of the two banks created the largest lender in the region.","兩家銀行合併後成為該地區最大的貸款機構。"],["Regulators must approve the merger before it can proceed.","主管機關必須先核准合併案才能進行。"]]},{"w":"acquisition","p":"n.","z":"收購、併購","c":"財務與合約","ex":[["The acquisition of the rival firm was completed in June.","對競爭對手的收購在六月完成。"],["Our growth strategy relies heavily on acquisition.","我們的成長策略很大程度仰賴併購。"]]},{"w":"due diligence","p":"phr.","z":"盡職調查","c":"財務與合約","ex":[["The buyer carried out due diligence before signing the deal.","買方在簽約前進行了盡職調查。"],["Thorough due diligence revealed several hidden debts.","徹底的盡職調查揭露了幾筆隱藏債務。"]]},{"w":"bankruptcy","p":"n.","z":"破產","c":"財務與合約","ex":[["The retailer filed for bankruptcy after years of losses.","這家零售商在連年虧損後申請破產。"],["Rising debt pushed the firm to the edge of bankruptcy.","不斷攀升的債務將公司推向破產邊緣。"]]},{"w":"insolvent","p":"adj.","z":"無力償債的","c":"財務與合約","ex":[["The company became insolvent when its main customer went under.","主要客戶倒閉後,這家公司變得無力償債。"],["Trading while insolvent is illegal in many countries.","在無力償債時繼續營業在許多國家是違法的。"]]},{"w":"write off","p":"phr.v.","z":"註銷、沖銷(呆帳)","c":"財務與合約","ex":[["The bank had to write off millions in bad loans.","銀行不得不註銷數百萬元的呆帳。"],["We decided to write off the old inventory as a loss.","我們決定把舊庫存列為損失沖銷。"]]},{"w":"bottom line","p":"phr.","z":"最終獲利、底線","c":"財務與合約","ex":[["These cost-cutting measures will improve our bottom line.","這些削減成本的措施將改善我們的最終獲利。"],["At the end of the day, the bottom line is what matters.","歸根究柢,最終的獲利才是重點。"]]},{"w":"return on investment","p":"phr.","z":"投資報酬率","c":"財務與合約","ex":[["The campaign delivered a strong return on investment.","這次行銷活動帶來了很高的投資報酬率。"],["Investors expect a clear return on investment within three years.","投資人期望在三年內看到明確的投資報酬。"]]},{"w":"fiscal year","p":"phr.","z":"會計年度","c":"財務與合約","ex":[["Our fiscal year ends on June 30 rather than December 31.","我們的會計年度在六月三十日而非十二月三十一日結束。"],["Profits rose sharply in the last fiscal year.","上一個會計年度的獲利大幅成長。"]]},{"w":"quarterly","p":"adj.","z":"每季的","c":"財務與合約","ex":[["The company will release its quarterly earnings next Tuesday.","公司將在下週二公布季度財報。"],["We hold a quarterly review to track progress against targets.","我們每季召開檢討會議以追蹤目標進度。"]]},{"w":"financial statement","p":"phr.","z":"財務報表","c":"財務與合約","ex":[["All listed companies must publish audited financial statements.","所有上市公司都必須公布經審計的財務報表。"],["The accountant is preparing the financial statement for the board.","會計師正在為董事會準備財務報表。"]]},{"w":"ledger","p":"n.","z":"分類帳、總帳","c":"財務與合約","ex":[["Every transaction is recorded in the general ledger.","每筆交易都記錄在總帳中。"],["The error was found when we checked the ledger against the bank statement.","我們把總帳與銀行對帳單核對時發現了這個錯誤。"]]},{"w":"reconcile","p":"v.","z":"核對、調節(帳目)","c":"財務與合約","ex":[["The accountant must reconcile the bank statement with our records.","會計必須把銀行對帳單與我們的紀錄核對。"],["It took days to reconcile the differences between the two reports.","花了好幾天才調節兩份報告之間的差異。"]]},{"w":"petty cash","p":"phr.","z":"零用金","c":"財務與合約","ex":[["Small purchases are paid for from petty cash.","小額採購以零用金支付。"],["The office manager keeps a record of all petty cash spending.","辦公室經理記錄所有零用金的支出。"]]},{"w":"expense report","p":"phr.","z":"費用報告、報帳單","c":"財務與合約","ex":[["Please submit your expense report by Friday afternoon.","請在週五下午前提交您的費用報告。"],["My expense report was rejected because a receipt was missing.","我的報帳單因為缺少一張收據而被退回。"]]},{"w":"cost-cutting","p":"n.","z":"削減成本","c":"財務與合約","ex":[["Cost-cutting measures included freezing hiring and reducing travel.","削減成本的措施包括凍結招募與減少出差。"],["Management announced a major cost-cutting program last week.","管理層上週宣布了一項大規模的削減成本計畫。"]]},{"w":"subsidy","p":"n.","z":"補助、補貼","c":"財務與合約","ex":[["The government offers a subsidy to firms that install solar panels.","政府對安裝太陽能板的企業提供補助。"],["Farmers depend on the subsidy to cover rising costs.","農民仰賴補助來應付不斷上漲的成本。"]]},{"w":"liquidity","p":"n.","z":"流動性、資金週轉能力","c":"財務與合約","ex":[["The company faced a liquidity crisis when sales suddenly dropped.","銷售突然下滑時,公司面臨資金週轉危機。"],["Strong liquidity allows us to pay suppliers on time.","充裕的流動性讓我們能準時付款給供應商。"]]},{"w":"hedge","p":"v.","z":"避險、對沖","c":"財務與合約","ex":[["Exporters often hedge against currency risk using forward contracts.","出口商經常利用遠期合約來規避匯率風險。"],["The fund bought gold to hedge its portfolio.","該基金買進黃金來為投資組合避險。"]]},{"w":"exchange rate","p":"phr.","z":"匯率","c":"財務與合約","ex":[["A weaker exchange rate makes our exports cheaper abroad.","較弱的匯率讓我們的出口品在國外更便宜。"],["Changes in the exchange rate affected our profits this quarter.","匯率變動影響了我們本季的獲利。"]]},{"w":"amendment","p":"n.","z":"修訂、修正條款","c":"財務與合約","ex":[["Both sides agreed to an amendment extending the deadline.","雙方同意以修訂條款延長期限。"],["Any amendment must be made in writing and signed.","任何修訂都必須以書面形式作成並簽署。"]]},{"w":"addendum","p":"n.","z":"附錄、補充條款","c":"財務與合約","ex":[["The addendum lists additional services not covered in the main contract.","附錄列出了主合約未涵蓋的額外服務。"],["We attached an addendum to the original agreement.","我們在原協議上附加了一份補充條款。"]]},{"w":"counterparty","p":"n.","z":"交易對手","c":"財務與合約","ex":[["We must check the creditworthiness of every counterparty.","我們必須查核每個交易對手的信用狀況。"],["The counterparty failed to deliver the goods on time.","交易對手未能準時交貨。"]]},{"w":"breach","p":"n.","z":"違反、違約","c":"財務與合約","ex":[["Late delivery is a breach of contract.","延遲交貨構成違約。"],["The company sued its partner for breach of the confidentiality agreement.","公司因合作夥伴違反保密協議而對其提告。"]]},{"w":"expire","p":"v.","z":"到期、失效","c":"財務與合約","ex":[["The warranty will expire one year after the purchase date.","保固將在購買日期一年後到期。"],["Our lease expires at the end of December.","我們的租約在十二月底到期。"]]},{"w":"void","p":"adj.","z":"無效的","c":"財務與合約","ex":[["Any clause that violates the law is void.","任何違反法律的條款均屬無效。"],["The agreement was declared void by the court.","該協議被法院宣告無效。"]]},{"w":"binding","p":"adj.","z":"有約束力的","c":"財務與合約","ex":[["The letter of intent is not legally binding.","這份意向書不具法律約束力。"],["Both sides signed a binding agreement yesterday.","雙方昨天簽署了一份具約束力的協議。"]]},{"w":"enforce","p":"v.","z":"執行、強制實施","c":"財務與合約","ex":[["It is difficult to enforce a contract across national borders.","跨國境執行合約很困難。"],["The authorities will enforce the new safety rules next year.","主管機關明年將強制實施新的安全規定。"]]},{"w":"jurisdiction","p":"n.","z":"管轄權、司法管轄區","c":"財務與合約","ex":[["Any dispute falls under the jurisdiction of the Taipei District Court.","任何爭議均由台北地方法院管轄。"],["The company operates in several jurisdictions with different tax laws.","該公司在數個稅法各異的司法管轄區營運。"]]},{"w":"governing law","p":"phr.","z":"準據法","c":"財務與合約","ex":[["The governing law of this contract is the law of Taiwan.","本合約的準據法為台灣法律。"],["We negotiated over which governing law should apply.","我們就應適用哪一個準據法進行了協商。"]]},{"w":"arbitration","p":"n.","z":"仲裁","c":"財務與合約","ex":[["The dispute was settled through arbitration instead of court.","這起爭議透過仲裁而非法院解決。"],["The contract requires binding arbitration in Singapore.","合約要求在新加坡進行具約束力的仲裁。"]]},{"w":"dispute","p":"n.","z":"爭議、糾紛","c":"財務與合約","ex":[["The two firms are in a dispute over unpaid royalties.","這兩家公司因未付的權利金而陷入糾紛。"],["We hope to resolve the dispute without going to court.","我們希望不經訴訟解決這場爭議。"]]},{"w":"lawsuit","p":"n.","z":"訴訟","c":"財務與合約","ex":[["The customer filed a lawsuit against the company over faulty products.","客戶因瑕疵產品對該公司提起訴訟。"],["The lawsuit dragged on for nearly four years.","這場訴訟拖了將近四年。"]]},{"w":"settlement","p":"n.","z":"和解、結算","c":"財務與合約","ex":[["The two companies reached a settlement before the trial began.","兩家公司在開庭前達成和解。"],["The settlement of invoices usually takes about two weeks.","發票的結清通常需要約兩週。"]]},{"w":"damages","p":"n.","z":"損害賠償金","c":"財務與合約","ex":[["The court awarded damages of two million dollars to the plaintiff.","法院判給原告兩百萬美元的損害賠償。"],["The buyer is entitled to claim damages for late delivery.","買方有權就延遲交貨請求損害賠償。"]]},{"w":"indemnify","p":"v.","z":"賠償、使免受損失","c":"財務與合約","ex":[["The supplier agreed to indemnify us against any patent claims.","供應商同意就任何專利索賠補償我們的損失。"],["The clause requires the seller to indemnify the buyer for losses.","該條款要求賣方補償買方的損失。"]]},{"w":"confidentiality","p":"n.","z":"保密性","c":"財務與合約","ex":[["The staff signed a confidentiality agreement on their first day.","員工在第一天就簽署了保密協議。"],["Confidentiality is vital when handling customer financial data.","處理客戶財務資料時,保密至關重要。"]]},{"w":"non-disclosure agreement","p":"phr.","z":"保密協議","c":"財務與合約","ex":[["Please sign a non-disclosure agreement before we share the designs.","在我們分享設計圖之前,請先簽署保密協議。"],["The non-disclosure agreement lasts for five years after the project ends.","保密協議在專案結束後仍持續五年。"]]},{"w":"intellectual property","p":"phr.","z":"智慧財產權","c":"財務與合約","ex":[["The firm invests heavily in protecting its intellectual property.","該公司投入大量資源保護其智慧財產權。"],["Who owns the intellectual property created during the project?","專案期間產生的智慧財產權歸誰所有?"]]},{"w":"trademark","p":"n.","z":"商標","c":"財務與合約","ex":[["We registered the trademark in more than thirty countries.","我們已在三十多個國家註冊了該商標。"],["Using a competitor's trademark without permission is illegal.","未經許可使用競爭對手的商標是違法的。"]]},{"w":"patent","p":"n.","z":"專利","c":"財務與合約","ex":[["The company holds a patent on the new battery technology.","該公司持有這項新電池技術的專利。"],["Their patent on the design will expire in 2030.","他們對該設計的專利將於二〇三〇年到期。"]]},{"w":"royalty","p":"n.","z":"權利金、版稅","c":"財務與合約","ex":[["The author receives a ten percent royalty on every copy sold.","作者每賣出一本可獲得百分之十的版稅。"],["We pay a royalty to the inventor for using his technology.","我們因使用發明人的技術而支付權利金。"]]},{"w":"license","p":"n.","z":"授權、執照","c":"財務與合約","ex":[["The software license allows installation on up to five computers.","這份軟體授權允許安裝在最多五台電腦上。"],["You need a license to export these products.","出口這些產品需要許可證。"]]},{"w":"compliance","p":"n.","z":"法規遵循、合規","c":"財務與合約","ex":[["Our compliance team checks that all sales follow the law.","我們的法遵團隊負責確認所有銷售都符合法規。"],["Non-compliance with the regulations may result in heavy fines.","不遵守法規可能導致重罰。"]]},{"w":"regulation","p":"n.","z":"法規、規定","c":"財務與合約","ex":[["New financial regulations require banks to hold more capital.","新的金融法規要求銀行持有更多資本。"],["The regulation takes effect at the start of next year.","這項法規將於明年初生效。"]]},{"w":"liable","p":"adj.","z":"負有法律責任的","c":"財務與合約","ex":[["The manufacturer is liable for any damage caused by defects.","製造商須對瑕疵造成的任何損害負責。"],["You may be held liable if you fail to report the loss.","如果您未通報損失,可能需負法律責任。"]]},{"w":"guarantee","p":"n.","z":"保證、擔保","c":"財務與合約","ex":[["The bank required a personal guarantee from the owner.","銀行要求負責人提供個人擔保。"],["We offer a money-back guarantee on all products.","我們對所有產品提供退款保證。"]]},{"w":"fine print","p":"phr.","z":"細則、小字條款","c":"財務與合約","ex":[["Always read the fine print before you sign a contract.","簽約前務必閱讀細則。"],["The fine print says the fee increases after the first year.","細則寫明第一年之後費用會調漲。"]]},{"w":"force majeure","p":"phr.","z":"不可抗力","c":"財務與合約","ex":[["The delay was excused under the force majeure clause.","這次延誤依不可抗力條款獲得免責。"],["Typhoons and earthquakes are classified as force majeure events.","颱風與地震被歸類為不可抗力事件。"]]},{"w":"notarize","p":"v.","z":"公證","c":"財務與合約","ex":[["The agreement must be notarized before it can be registered.","這份協議必須先經公證才能登記。"],["We had the power of attorney notarized at the local office.","我們在當地事務所把委託書辦了公證。"]]},{"w":"power of attorney","p":"phr.","z":"委託書、授權書","c":"財務與合約","ex":[["She signed a power of attorney so her lawyer could act for her.","她簽署了授權書,讓律師可以代表她行事。"],["A power of attorney is required to sign on the owner's behalf.","代表所有人簽署需要授權書。"]]},{"w":"procurement","p":"n.","z":"採購","c":"財務與合約","ex":[["The procurement team compares at least three suppliers for every purchase.","採購團隊每次採購都會比較至少三家供應商。"],["Procurement costs fell after we centralized ordering.","集中下單之後,採購成本下降了。"]]},{"w":"overdraft","p":"n.","z":"透支","c":"財務與合約","ex":[["The firm relies on a bank overdraft to cover short-term needs.","這家公司靠銀行透支來支應短期需求。"],["An overdraft fee was charged to our account.","我們的帳戶被收取了透支費。"]]},{"w":"securities","p":"n.","z":"有價證券","c":"財務與合約","ex":[["The fund invests mainly in government securities.","該基金主要投資政府有價證券。"],["Securities regulators are investigating several suspicious trades made last week.","證券主管機關正在調查上週的幾筆可疑交易。"]]},{"w":"indemnity","p":"n.","z":"賠償、補償金","c":"財務與合約","ex":[["The insurance policy provides indemnity against fire damage.","這份保單提供火災損失的補償。"],["The seller gave the buyer an indemnity for any hidden defects.","賣方就任何隱藏瑕疵向買方提供賠償保證。"]]},{"w":"profitability","p":"n.","z":"獲利能力","c":"財務與合約","ex":[["The report compares the profitability of our three main product lines.","這份報告比較我們三大產品線的獲利能力。"],["Rising material costs have reduced profitability across the whole industry.","原料成本上升降低了整個產業的獲利能力。"]]},{"w":"receivable","p":"n.","z":"應收帳款","c":"財務與合約","ex":[["Accounts receivable rose sharply because several clients paid late.","因為幾位客戶延遲付款，應收帳款大幅增加。"],["The finance team is chasing every overdue receivable this week.","財務團隊本週正在追討每一筆逾期應收帳款。"]]},{"w":"payable","p":"n.","z":"應付帳款","c":"財務與合約","ex":[["We reduced accounts payable by settling invoices earlier than usual.","我們提早結清發票，減少了應付帳款。"],["The payable to our main supplier is due at the end of the month.","欠主要供應商的應付款項在月底到期。"]]},{"w":"venture capital","p":"n.","z":"創業投資、風險投資","c":"財務與合約","ex":[["The start-up raised five million dollars in venture capital last year.","這家新創公司去年募得五百萬美元創投資金。"],["Venture capital firms look for companies that can grow very quickly.","創投公司尋找能快速成長的公司。"]]},{"w":"investor","p":"n.","z":"投資人","c":"財務與合約","ex":[["Investors were pleased with the strong quarterly results.","投資人對強勁的季度業績感到滿意。"],["We are preparing a presentation for potential investors next week.","我們正在為下週的潛在投資人準備簡報。"]]},{"w":"portfolio","p":"n.","z":"投資組合、作品集","c":"財務與合約","ex":[["The fund keeps a diverse portfolio of stocks and bonds.","這檔基金持有多元的股票與債券投資組合。"],["Our design agency will share its portfolio of past projects with you.","我們的設計公司會與您分享過往專案的作品集。"]]},{"w":"variance","p":"n.","z":"差異、變異數","c":"財務與合約","ex":[["The report explains the variance between planned and actual spending.","報告說明了計畫支出與實際支出之間的差異。"],["A large variance in monthly costs makes budgeting difficult.","每月成本差異過大使預算編列變得困難。"]]},{"w":"bookkeeping","p":"n.","z":"記帳、簿記","c":"財務與合約","ex":[["Accurate bookkeeping is essential for a small business to pass an audit.","準確的記帳對小企業通過稽核至關重要。"],["She does the bookkeeping for several local shops every weekend.","她每個週末替幾家當地商店記帳。"]]},{"w":"gross profit","p":"n.","z":"毛利","c":"財務與合約","ex":[["Gross profit increased because we negotiated lower prices with suppliers.","因為與供應商談到較低價格，毛利增加了。"],["Gross profit is revenue minus the direct cost of producing goods.","毛利是營收減去生產商品的直接成本。"]]},{"w":"operating cost","p":"n.","z":"營運成本","c":"財務與合約","ex":[["Higher electricity prices pushed up our operating cost this year.","電價上漲使我們今年的營運成本增加。"],["Moving to a smaller office will lower our operating cost significantly.","搬到較小的辦公室將大幅降低我們的營運成本。"]]},{"w":"fixed cost","p":"n.","z":"固定成本","c":"財務與合約","ex":[["Rent and salaries are fixed costs that must be paid regardless of sales.","租金與薪資是不論銷售如何都必須支付的固定成本。"],["Our fixed cost is high, so we need steady sales to break even.","我們的固定成本很高，所以需要穩定銷售才能損益兩平。"]]},{"w":"cost overrun","p":"n.","z":"成本超支","c":"財務與合約","ex":[["A cost overrun of twenty percent forced the team to redesign the project.","百分之二十的成本超支迫使團隊重新設計專案。"],["Poor planning is the most common cause of a cost overrun.","規劃不佳是成本超支最常見的原因。"]]},{"w":"inflation","p":"n.","z":"通貨膨脹","c":"財務與合約","ex":[["Inflation has raised the price of raw materials by ten percent.","通貨膨脹使原物料價格上漲了百分之十。"],["Many firms adjust their prices every year to keep up with inflation.","許多公司每年調整價格以跟上通貨膨脹。"]]},{"w":"recession","p":"n.","z":"經濟衰退","c":"財務與合約","ex":[["Many companies froze hiring when the recession began.","經濟衰退開始時，許多公司凍結了招聘。"],["Demand for luxury goods usually falls during a recession.","經濟衰退期間，奢侈品的需求通常會下降。"]]},{"w":"loan","p":"n.","z":"貸款","c":"財務與合約","ex":[["The bank approved a loan to help the factory buy new machines.","銀行核准了一筆貸款，協助工廠購買新機器。"],["We must repay the loan within five years at a fixed interest rate.","我們必須在五年內以固定利率還清這筆貸款。"]]},{"w":"creditor","p":"n.","z":"債權人","c":"財務與合約","ex":[["The company agreed to pay its creditors in monthly installments.","公司同意以每月分期方式償還債權人。"],["Creditors have the right to claim assets if the firm goes bankrupt.","如果公司破產，債權人有權求償資產。"]]},{"w":"waive","p":"v.","z":"免除、放棄","c":"財務與合約","ex":[["The bank agreed to waive the late fee because of the system error.","因為系統錯誤，銀行同意免除滯納金。"],["Both parties may waive their right to appeal in the contract.","雙方可在合約中放棄上訴的權利。"]]},{"w":"stipulate","p":"v.","z":"約定、規定","c":"財務與合約","ex":[["The contract stipulates that payment must be made within thirty days.","合約規定款項必須在三十天內支付。"],["The agreement does not stipulate who will cover the shipping costs.","協議中並未約定由誰負擔運費。"]]},{"w":"supersede","p":"v.","z":"取代、替代","c":"財務與合約","ex":[["This new agreement will supersede all earlier verbal arrangements.","這份新協議將取代所有先前的口頭約定。"],["The updated policy supersedes the version issued in January.","更新後的政策取代了一月發布的版本。"]]},{"w":"obligation","p":"n.","z":"義務、責任","c":"財務與合約","ex":[["The seller has a legal obligation to deliver goods that match the description.","賣方有法律義務交付與描述相符的商品。"],["We will meet our payment obligation as soon as the invoice arrives.","發票一到，我們就會履行付款義務。"]]},{"w":"non-compete","p":"adj.","z":"競業禁止的","c":"財務與合約","ex":[["She signed a non-compete agreement that bars her from joining rivals for a year.","她簽了競業禁止協議，一年內不得加入競爭對手。"],["A non-compete clause protects the company's trade secrets.","競業禁止條款保護公司的商業機密。"]]},{"w":"lump sum","p":"n.","z":"一次付清的金額","c":"財務與合約","ex":[["The client paid the full fee as a lump sum at signing.","客戶在簽約時一次付清全部費用。"],["Employees may choose to receive a lump sum instead of monthly payments.","員工可選擇一次領取總額，而非按月領取。"]]},{"w":"supply chain","p":"n.","z":"供應鏈","c":"供應鏈與製造","ex":[["Our supply chain was disrupted by the port strike last month.","上個月的港口罷工擾亂了我們的供應鏈。"],["Diversifying the supply chain reduces the risk of single-source failure.","分散供應鏈可降低單一來源失靈的風險。"]]},{"w":"logistics","p":"n.","z":"物流、後勤","c":"供應鏈與製造","ex":[["Logistics costs rose sharply because of higher fuel prices.","由於油價上漲，物流成本大幅增加。"],["She manages logistics for all of our overseas shipments.","她負責管理我們所有海外出貨的物流。"]]},{"w":"manufacturing","p":"n.","z":"製造業、製造","c":"供應鏈與製造","ex":[["Manufacturing has moved from Taiwan to Southeast Asia for some products.","部分產品的製造已從台灣轉移到東南亞。"],["The company invested heavily in advanced manufacturing technology.","公司大舉投資先進的製造技術。"]]},{"w":"assembly line","p":"n.","z":"組裝線、生產線","c":"供應鏈與製造","ex":[["Workers on the assembly line check each unit before it moves on.","生產線上的工人在每個單位送往下一站前都會檢查。"],["We added a second assembly line to meet the holiday demand.","為了因應假期需求，我們增設了第二條組裝線。"]]},{"w":"raw material","p":"n.","z":"原物料","c":"供應鏈與製造","ex":[["The price of raw material has doubled since last year.","原物料的價格自去年以來已翻倍。"],["We source raw materials from three different countries.","我們從三個不同的國家採購原物料。"]]},{"w":"vendor","p":"n.","z":"供應商、廠商","c":"供應鏈與製造","ex":[["Every vendor must pass a security review before we sign a contract.","每家廠商在簽約前都必須通過安全審查。"],["The vendor offered a discount for orders placed in bulk.","廠商為大量下單提供了折扣。"]]},{"w":"stockout","p":"n.","z":"缺貨","c":"供應鏈與製造","ex":[["A stockout of our best seller cost us thousands in lost sales.","熱銷商品缺貨使我們損失了數千元的銷售額。"],["Better forecasting should prevent a stockout during the peak season.","更準確的預測應能避免旺季期間缺貨。"]]},{"w":"warehouse","p":"n.","z":"倉庫","c":"供應鏈與製造","ex":[["The warehouse ships about two thousand parcels every day.","這間倉庫每天出貨約兩千個包裹。"],["We plan to lease a larger warehouse near the airport.","我們計劃在機場附近租一間更大的倉庫。"]]},{"w":"shipment","p":"n.","z":"出貨、貨物","c":"供應鏈與製造","ex":[["The shipment arrived at the port three days behind schedule.","這批貨比預定時間晚了三天抵達港口。"],["Please confirm the shipment details before the truck leaves.","請在卡車出發前確認出貨明細。"]]},{"w":"freight","p":"n.","z":"貨運、運費","c":"供應鏈與製造","ex":[["Air freight is faster but much more expensive than sea freight.","空運比海運快，但貴很多。"],["The freight charges were not included in the original quote.","原始報價並未包含運費。"]]},{"w":"consignment","p":"n.","z":"寄售、託運貨物","c":"供應鏈與製造","ex":[["The retailer sells our products on consignment and pays after each sale.","零售商以寄售方式販售我們的產品，賣出後才付款。"],["The consignment was held at customs for inspection.","這批託運貨物被海關扣留檢查。"]]},{"w":"customs clearance","p":"n.","z":"通關","c":"供應鏈與製造","ex":[["Customs clearance usually takes one to two days.","通關通常需要一到兩天。"],["Delays in customs clearance affected our delivery date.","通關延誤影響了我們的交貨日期。"]]},{"w":"bill of lading","p":"n.","z":"提單","c":"供應鏈與製造","ex":[["The bill of lading must accompany the cargo throughout the journey.","提單必須在運送全程隨貨附上。"],["The bank requires an original bill of lading before releasing payment.","銀行要求先提供正本提單才會付款。"]]},{"w":"incoterms","p":"n.","z":"國貿條規","c":"供應鏈與製造","ex":[["Incoterms define who pays for shipping and insurance in a deal.","國貿條規界定交易中誰負責運費與保險。"],["We agreed on FOB under the Incoterms for this order.","依據國貿條規，我們同意這筆訂單採用 FOB。"]]},{"w":"fulfillment","p":"n.","z":"訂單履行、出貨處理","c":"供應鏈與製造","ex":[["Order fulfillment takes less than 24 hours for domestic customers.","國內客戶的訂單處理不到二十四小時。"],["We outsourced fulfillment to a third-party logistics provider.","我們把出貨處理外包給第三方物流業者。"]]},{"w":"throughput","p":"n.","z":"產能、處理量","c":"供應鏈與製造","ex":[["The new packaging equipment increased our throughput by fifteen percent.","新設備使產能提升了百分之十五。"],["Throughput drops sharply whenever the line stops for routine maintenance.","每當生產線停機做例行維修，產出量就會大幅下降。"]]},{"w":"capacity","p":"n.","z":"產能、容量","c":"供應鏈與製造","ex":[["The factory is running at full capacity until December.","這間工廠到十二月都是滿載生產。"],["We lack the capacity to take on another large order.","我們沒有產能再接另一筆大訂單。"]]},{"w":"subcontractor","p":"n.","z":"分包商、下游承包商","c":"供應鏈與製造","ex":[["The subcontractor failed to meet the quality standard.","分包商未能達到品質標準。"],["We rely on several subcontractors for specialized components.","我們仰賴數家分包商提供專門的零組件。"]]},{"w":"offshoring","p":"n.","z":"離岸外包、海外設廠","c":"供應鏈與製造","ex":[["Offshoring helped the company cut labor costs significantly.","離岸外包幫助公司大幅降低人力成本。"],["Rising wages in Asia have slowed the trend of offshoring.","亞洲薪資上漲使離岸外包的趨勢趨緩。"]]},{"w":"reshoring","p":"n.","z":"產業回流","c":"供應鏈與製造","ex":[["Reshoring has become popular after the pandemic exposed supply risks.","疫情暴露供應風險後，產業回流變得盛行。"],["Government subsidies are encouraging reshoring of chip manufacturing.","政府補助正在鼓勵晶片製造回流。"]]},{"w":"just-in-time","p":"adj.","z":"及時生產的、準時制的","c":"供應鏈與製造","ex":[["Just-in-time delivery keeps our warehouse costs very low.","準時制交貨讓我們的倉儲成本非常低。"],["The just-in-time system fails when a supplier is late.","只要供應商延誤，準時制系統就會失靈。"]]},{"w":"lean manufacturing","p":"n.","z":"精實生產","c":"供應鏈與製造","ex":[["Lean manufacturing focuses on eliminating waste in every step.","精實生產著重於消除每個步驟中的浪費。"],["The plant adopted lean manufacturing and cut defects by half.","這間工廠採用精實生產，瑕疵減少了一半。"]]},{"w":"quality control","p":"n.","z":"品質管制","c":"供應鏈與製造","ex":[["Quality control rejected a batch because of surface scratches.","品質管制因表面刮痕而退回了一批貨。"],["Our quality control team inspects samples from every shift.","我們的品管團隊會檢查每個班次的抽樣。"]]},{"w":"quality assurance","p":"n.","z":"品質保證","c":"供應鏈與製造","ex":[["Quality assurance begins at the design stage, not at the end.","品質保證從設計階段就開始，而不是在最後。"],["She leads quality assurance for the entire product line.","她負責整個產品線的品質保證。"]]},{"w":"defect","p":"n.","z":"瑕疵、缺陷","c":"供應鏈與製造","ex":[["Each defect is logged and traced back to its source.","每個瑕疵都會被記錄並追溯到來源。"],["A small defect in the battery led to a major recall.","電池的一個小瑕疵導致了大規模召回。"]]},{"w":"defective","p":"adj.","z":"有瑕疵的、故障的","c":"供應鏈與製造","ex":[["We will replace any defective units free of charge.","我們會免費更換任何有瑕疵的商品。"],["The customer returned a defective charger last week.","客戶上週退回了一個有瑕疵的充電器。"]]},{"w":"tolerance","p":"n.","z":"公差、容許誤差","c":"供應鏈與製造","ex":[["The part must be made within a tolerance of 0.01 millimeters.","這個零件的製造公差必須在0.01毫米以內。"],["Tight tolerances make the machining process more expensive.","嚴格的公差使加工過程成本更高。"]]},{"w":"specification","p":"n.","z":"規格","c":"供應鏈與製造","ex":[["The product did not meet the specification in the contract.","該產品不符合合約中的規格。"],["Please send us the full technical specification by Friday.","請在週五前把完整的技術規格寄給我們。"]]},{"w":"certification","p":"n.","z":"認證","c":"供應鏈與製造","ex":[["ISO certification is required to bid on this contract.","投標這份合約需要 ISO 認證。"],["The factory is waiting for certification from the safety agency.","這間工廠正在等待安全機構的認證。"]]},{"w":"traceability","p":"n.","z":"可追溯性","c":"供應鏈與製造","ex":[["Traceability lets us locate the exact batch of faulty material.","可追溯性讓我們能找出有問題原料的確切批次。"],["Customers now demand full traceability of food ingredients.","客戶現在要求食品原料完全可追溯。"]]},{"w":"batch","p":"n.","z":"批次、一批","c":"供應鏈與製造","ex":[["Each batch is tested before it leaves the factory.","每一批貨在離開工廠前都會經過測試。"],["The whole batch was recalled after a contamination scare.","在發生污染疑慮後，整批產品都被召回。"]]},{"w":"recall","p":"n.","z":"召回","c":"供應鏈與製造","ex":[["The company announced a recall of two million vehicles.","公司宣布召回兩百萬輛車。"],["A product recall can seriously damage a brand's reputation.","產品召回可能嚴重損害品牌聲譽。"]]},{"w":"root cause","p":"n.","z":"根本原因","c":"供應鏈與製造","ex":[["We need to find the root cause rather than treat symptoms.","我們需要找出根本原因，而不是只處理表面症狀。"],["The root cause of the delay was a missing customs document.","延誤的根本原因是缺少一份報關文件。"]]},{"w":"corrective action","p":"n.","z":"矯正措施","c":"供應鏈與製造","ex":[["The supplier submitted a corrective action plan within a week.","供應商在一週內提交了矯正措施計畫。"],["Corrective action was taken immediately after the failed inspection.","檢驗未通過後立即採取了矯正措施。"]]},{"w":"continuous improvement","p":"n.","z":"持續改善","c":"供應鏈與製造","ex":[["Continuous improvement is part of our daily factory routine.","持續改善是我們日常工廠作業的一部分。"],["The team meets weekly to discuss continuous improvement ideas.","團隊每週開會討論持續改善的點子。"]]},{"w":"yield","p":"n.","z":"良率、產出","c":"供應鏈與製造","ex":[["The chip yield improved from seventy to eighty-five percent.","晶片良率從百分之七十提升到八十五。"],["Low yield is making each unit far more expensive to produce.","低良率使每個單位的生產成本高出許多。"]]},{"w":"scrap","p":"n.","z":"廢料、報廢品","c":"供應鏈與製造","ex":[["Reducing scrap saves both materials and disposal fees.","減少廢料能同時節省原料與處理費用。"],["About three percent of the output ends up as scrap.","約百分之三的產出最後成為報廢品。"]]},{"w":"downtime","p":"n.","z":"停機時間","c":"供應鏈與製造","ex":[["Unplanned downtime costs us thousands of dollars per hour.","非預期的停機每小時讓我們損失數千元。"],["Regular maintenance helps minimize downtime on the production line.","定期維護有助於將生產線的停機時間降到最低。"]]},{"w":"preventive maintenance","p":"n.","z":"預防性維護","c":"供應鏈與製造","ex":[["Preventive maintenance is scheduled for every machine once every three months.","預防性維護每三個月排定一次。"],["Skipping preventive maintenance last year led to a very costly machine failure.","去年省略預防性維護導致了代價高昂的機器故障。"]]},{"w":"prototype","p":"n.","z":"原型、試作品","c":"供應鏈與製造","ex":[["The engineers built a working prototype in just six weeks.","工程師在短短六週內做出了可運作的原型。"],["We will test the prototype with a small group of customers.","我們會讓一小群客戶測試這個原型。"]]},{"w":"mass production","p":"n.","z":"大量生產","c":"供應鏈與製造","ex":[["Mass production begins once the design is approved.","設計核准後就會開始大量生產。"],["Mass production lowered the unit cost dramatically for our entire product range.","大量生產使我們整個產品系列的單位成本大幅下降。"]]},{"w":"economies of scale","p":"n.","z":"規模經濟","c":"供應鏈與製造","ex":[["Larger factories usually benefit from economies of scale in purchasing.","規模較大的工廠能受益於規模經濟。"],["Economies of scale let us offer much lower prices than smaller rivals.","規模經濟讓我們能提供比小型對手更低的價格。"]]},{"w":"bill of materials","p":"n.","z":"物料清單","c":"供應鏈與製造","ex":[["The bill of materials lists every component in the product.","物料清單列出產品中的每一個零組件。"],["An error in the bill of materials caused a purchasing mistake.","物料清單中的錯誤造成了採購失誤。"]]},{"w":"purchase order","p":"n.","z":"採購單","c":"供應鏈與製造","ex":[["We issued a purchase order for five hundred units yesterday.","我們昨天開出了五百個單位的採購單。"],["The supplier will not ship without a signed purchase order.","沒有簽署的採購單，供應商不會出貨。"]]},{"w":"request for quotation","p":"n.","z":"詢價單","c":"供應鏈與製造","ex":[["We sent a request for quotation to five potential suppliers.","我們向五家潛在供應商寄出了詢價單。"],["Each request for quotation must include clear technical requirements.","每份詢價單都必須包含明確的技術需求。"]]},{"w":"sourcing","p":"n.","z":"採購來源開發、貨源","c":"供應鏈與製造","ex":[["Strategic sourcing can reduce total costs over several years.","策略性採購可在數年間降低總成本。"],["Our sourcing team is exploring suppliers in Vietnam.","我們的採購團隊正在尋找越南的供應商。"]]},{"w":"single source","p":"n.","z":"單一供應來源","c":"供應鏈與製造","ex":[["Depending on a single source is a serious supply risk.","依賴單一供應來源是嚴重的供應風險。"],["Components from a single source gave the supplier too much power.","來自單一供應來源的零件讓供應商擁有過大的議價力。"]]},{"w":"bulk","p":"n.","z":"大量、散裝","c":"供應鏈與製造","ex":[["Buying in bulk lowers the price per unit.","大量採購可降低單價。"],["The bulk of our orders ships from the main warehouse.","我們大部分的訂單都從主倉庫出貨。"]]},{"w":"unit cost","p":"n.","z":"單位成本","c":"供應鏈與製造","ex":[["The unit cost fell after we switched to a cheaper material.","改用較便宜的材料後，單位成本下降了。"],["We must keep the unit cost below five dollars to stay profitable.","我們必須把單位成本控制在五美元以下才能獲利。"]]},{"w":"landed cost","p":"n.","z":"到岸成本","c":"供應鏈與製造","ex":[["The landed cost includes freight, insurance, and import duties.","到岸成本包含運費、保險與進口關稅。"],["Always compare the landed cost, not just the factory price.","比較時一定要看到岸成本，而不只是出廠價。"]]},{"w":"import duty","p":"n.","z":"進口稅","c":"供應鏈與製造","ex":[["The import duty depends on the product category and origin.","進口稅取決於產品類別與原產地。"],["We pay import duty when the goods enter the country.","貨物入境時我們要繳納進口稅。"]]},{"w":"trade barrier","p":"n.","z":"貿易障礙","c":"供應鏈與製造","ex":[["Trade barriers make it harder for small firms to export.","貿易障礙使小型企業更難出口。"],["The agreement aims to remove trade barriers between the two regions.","該協定旨在消除兩地區之間的貿易障礙。"]]},{"w":"container","p":"n.","z":"貨櫃","c":"供應鏈與製造","ex":[["A single container can hold about twenty thousand units.","一個貨櫃大約可裝兩萬個單位。"],["Container prices spiked as demand for shipping surged.","隨著航運需求激增，貨櫃價格飆升。"]]},{"w":"cargo","p":"n.","z":"貨物、貨運","c":"供應鏈與製造","ex":[["The cargo was insured against loss and damage at sea.","這批貨物已投保海上遺失與損壞險。"],["Air cargo space is limited during the holiday season.","假期旺季時空運貨艙位有限。"]]},{"w":"carrier","p":"n.","z":"運輸業者、承運人","c":"供應鏈與製造","ex":[["We switched to a cheaper carrier for domestic deliveries.","我們改用較便宜的運輸業者來送國內貨件。"],["The carrier guarantees delivery within five business days.","承運人保證在五個工作天內送達。"]]},{"w":"forwarder","p":"n.","z":"貨運承攬業者","c":"供應鏈與製造","ex":[["Our forwarder handles all the paperwork for export shipments.","我們的貨運承攬業者負責所有出口貨件的文件作業。"],["Ask the forwarder for a quote on door-to-door delivery.","請向貨運承攬業者詢問到府配送的報價。"]]},{"w":"third-party logistics","p":"n.","z":"第三方物流","c":"供應鏈與製造","ex":[["Third-party logistics providers manage storage and delivery for us.","第三方物流業者為我們管理倉儲與配送。"],["Using third-party logistics saved us from building a new warehouse.","使用第三方物流讓我們不必興建新倉庫。"]]},{"w":"last mile","p":"n.","z":"最後一哩路","c":"供應鏈與製造","ex":[["The last mile is the most expensive part of delivery.","最後一哩路是配送中成本最高的部分。"],["Drones may solve last mile problems in rural areas.","無人機或許能解決偏遠地區的最後一哩路問題。"]]},{"w":"demand forecast","p":"n.","z":"需求預測","c":"供應鏈與製造","ex":[["An accurate demand forecast helps us avoid overstocking.","準確的需求預測有助於我們避免囤貨過多。"],["The demand forecast was revised after the sales report came out.","銷售報告出爐後，需求預測做了修正。"]]},{"w":"safety stock","p":"n.","z":"安全庫存","c":"供應鏈與製造","ex":[["We keep safety stock to cover sudden spikes in demand.","我們保留安全庫存以因應需求突然暴增。"],["Raising safety stock protects us but increases holding costs.","提高安全庫存能保護我們，但會增加持有成本。"]]},{"w":"reorder point","p":"n.","z":"再訂購點","c":"供應鏈與製造","ex":[["The system sends an alert when stock hits the reorder point.","庫存達到再訂購點時，系統會發出警示。"],["Setting the reorder point too low can cause shortages.","把再訂購點設得太低可能造成缺貨。"]]},{"w":"stock keeping unit","p":"n.","z":"庫存單位、品項","c":"供應鏈與製造","ex":[["Each stock keeping unit has its own barcode and storage location.","每個庫存品項都有自己的條碼與儲位。"],["We reduced the number of stock keeping units to simplify operations.","我們減少了品項數量以簡化作業。"]]},{"w":"barcode","p":"n.","z":"條碼","c":"供應鏈與製造","ex":[["Staff scan the barcode on each box as it enters the warehouse.","員工在每個箱子入庫時掃描條碼。"],["A damaged barcode can slow down the whole sorting process.","損壞的條碼可能拖慢整個分揀流程。"]]},{"w":"pallet","p":"n.","z":"棧板","c":"供應鏈與製造","ex":[["Each pallet carries forty cartons of finished goods.","每個棧板載有四十箱成品。"],["The forklift moved the pallet to loading dock three.","堆高機把棧板移到三號裝卸碼頭。"]]},{"w":"dispatch","p":"v.","z":"派送、發送","c":"供應鏈與製造","ex":[["We dispatch all orders within one business day.","我們在一個工作天內派送所有訂單。"],["The driver was dispatched to pick up the urgent shipment.","司機被派去取緊急貨件。"]]},{"w":"tracking number","p":"n.","z":"追蹤編號","c":"供應鏈與製造","ex":[["Please enter your tracking number to see where the parcel is.","請輸入您的追蹤編號以查看包裹位置。"],["The tracking number was emailed to the customer after dispatch.","追蹤編號在出貨後已寄到客戶的電子郵件。"]]},{"w":"proof of delivery","p":"n.","z":"送達證明","c":"供應鏈與製造","ex":[["The driver must obtain proof of delivery from the recipient.","司機必須取得收件人的送達證明。"],["Payment is released once we receive proof of delivery.","收到送達證明後才會放款。"]]},{"w":"lead supplier","p":"n.","z":"主要供應商","c":"供應鏈與製造","ex":[["Our lead supplier has served us for over ten years.","我們的主要供應商已服務我們超過十年。"],["We asked the lead supplier to share its cost breakdown.","我們請主要供應商提供成本明細。"]]},{"w":"disruption","p":"n.","z":"中斷、擾亂","c":"供應鏈與製造","ex":[["A major disruption at the port delayed hundreds of shipments.","港口的重大中斷使數百批貨延誤。"],["Companies are building resilience against supply chain disruption.","各公司正在增強對供應鏈中斷的韌性。"]]},{"w":"resilience","p":"n.","z":"韌性、復原力","c":"供應鏈與製造","ex":[["Supply chain resilience became a top priority after the pandemic.","疫情後，供應鏈韌性成為首要任務。"],["Holding extra stock adds resilience but also raises costs.","多備庫存能增加韌性，但也會提高成本。"]]},{"w":"shortage","p":"n.","z":"短缺","c":"供應鏈與製造","ex":[["A chip shortage forced carmakers to cut production.","晶片短缺迫使汽車製造商減產。"],["The labor shortage in logistics is pushing wages higher.","物流業的人力短缺正推升薪資。"]]},{"w":"delay","p":"n.","z":"延誤","c":"供應鏈與製造","ex":[["We apologize for the delay in processing your order.","對於您的訂單處理延誤，我們深表歉意。"],["Weather caused a two-day delay at the shipping terminal.","天氣造成航運碼頭延誤兩天。"]]},{"w":"expedite","p":"v.","z":"加快處理、催貨","c":"供應鏈與製造","ex":[["Can you expedite this order so that it arrives before the launch?","你們能加急處理這筆訂單，讓它在上市前送到嗎？"],["We paid an extra fee to expedite customs clearance.","我們多付費用以加快通關。"]]},{"w":"on schedule","p":"phr.","z":"按照進度、準時","c":"供應鏈與製造","ex":[["The project is on schedule and within budget.","專案進度符合預期且未超出預算。"],["All shipments arrived on schedule despite the bad weather.","儘管天氣不佳，所有貨件都準時抵達。"]]},{"w":"delivery date","p":"n.","z":"交貨日期","c":"供應鏈與製造","ex":[["The confirmed delivery date is the fifteenth of March.","確認的交貨日期是三月十五日。"],["Please let us know if the delivery date changes.","如果交貨日期有變，請通知我們。"]]},{"w":"production schedule","p":"n.","z":"生產排程","c":"供應鏈與製造","ex":[["The rush order disrupted our production schedule for the week.","急單打亂了我們本週的生產排程。"],["We updated the production schedule to include night shifts.","我們更新了生產排程，加入夜班。"]]},{"w":"workforce","p":"n.","z":"勞動力、員工總數","c":"供應鏈與製造","ex":[["The factory has a workforce of about eight hundred people.","這間工廠約有八百名員工。"],["Automation is changing the skills our workforce needs.","自動化正在改變我們的勞動力所需具備的技能。"]]},{"w":"automation","p":"n.","z":"自動化","c":"供應鏈與製造","ex":[["Automation allowed us to double output without hiring more staff.","自動化讓我們不增聘人手就使產出加倍。"],["Investment in automation will pay off within three years.","對自動化的投資將在三年內回本。"]]},{"w":"robotics","p":"n.","z":"機器人技術","c":"供應鏈與製造","ex":[["Robotics has transformed how we pick and pack orders.","機器人技術改變了我們揀貨與包裝訂單的方式。"],["The factory uses robotics for welding and heavy lifting.","這間工廠用機器人進行焊接與搬運重物。"]]},{"w":"sustainability","p":"n.","z":"永續性","c":"供應鏈與製造","ex":[["Sustainability is now a key factor when we choose suppliers.","永續性現在是我們選擇供應商的關鍵因素。"],["The report highlights our progress in packaging sustainability.","報告強調了我們在包裝永續方面的進展。"]]},{"w":"carbon footprint","p":"n.","z":"碳足跡","c":"供應鏈與製造","ex":[["Switching to rail reduced the carbon footprint of our deliveries.","改用鐵路運輸降低了我們配送的碳足跡。"],["Customers increasingly ask about the carbon footprint of products.","客戶越來越常詢問產品的碳足跡。"]]},{"w":"ethical sourcing","p":"n.","z":"道德採購","c":"供應鏈與製造","ex":[["Ethical sourcing ensures that workers are treated fairly.","道德採購確保工人受到公平對待。"],["We published a policy on ethical sourcing for all suppliers.","我們為所有供應商發布了道德採購政策。"]]},{"w":"service level agreement","p":"n.","z":"服務水準協議","c":"供應鏈與製造","ex":[["The service level agreement guarantees ninety-nine percent on-time delivery.","服務水準協議保證百分之九十九的準時交貨。"],["The carrier breached the service level agreement twice this year.","承運商今年兩度違反服務水準協議。"]]},{"w":"penalty clause","p":"n.","z":"違約罰則條款","c":"供應鏈與製造","ex":[["A penalty clause applies if the supplier delivers late.","如果供應商延遲交貨，就適用違約罰則條款。"],["The penalty clause was removed during contract negotiations.","違約罰則條款在合約協商期間被刪除。"]]},{"w":"return policy","p":"n.","z":"退貨政策","c":"供應鏈與製造","ex":[["Our return policy allows refunds within thirty days.","我們的退貨政策允許三十天內退款。"],["The supplier updated its return policy for damaged goods.","供應商更新了損壞貨品的退貨政策。"]]},{"w":"reverse logistics","p":"n.","z":"逆向物流","c":"供應鏈與製造","ex":[["Reverse logistics handles returns, repairs, and recycling of products.","逆向物流負責產品的退貨、維修與回收。"],["Poor reverse logistics can make online returns very costly.","不良的逆向物流會讓網購退貨成本非常高。"]]},{"w":"consolidate","p":"v.","z":"整合、合併","c":"供應鏈與製造","ex":[["We plan to consolidate three warehouses into one.","我們計劃把三個倉庫整合成一個。"],["Consolidating shipments from different suppliers can lower freight costs significantly.","合併貨件可大幅降低運費。"]]},{"w":"benchmark","p":"n.","z":"基準、標竿","c":"供應鏈與製造","ex":[["We use industry benchmarks to measure supplier performance.","我們以業界基準來衡量供應商的表現。"],["The plant set a new benchmark for energy efficiency.","這間工廠為能源效率樹立了新標竿。"]]},{"w":"key performance indicator","p":"n.","z":"關鍵績效指標","c":"供應鏈與製造","ex":[["On-time delivery is our most important key performance indicator.","準時交貨是我們最重要的關鍵績效指標。"],["Each key performance indicator is reviewed monthly by management.","管理層每月檢視每項關鍵績效指標。"]]},{"w":"cost-effective","p":"adj.","z":"具成本效益的","c":"供應鏈與製造","ex":[["Shipping by sea is the most cost-effective option for bulky goods.","對於大件貨物，海運是最具成本效益的選擇。"],["We found a cost-effective way to package fragile items.","我們找到一個包裝易碎品的省錢方法。"]]},{"w":"reliable","p":"adj.","z":"可靠的","c":"供應鏈與製造","ex":[["We need a reliable carrier that delivers on time.","我們需要一家準時交貨的可靠運輸業者。"],["The new machine is more reliable than the old one.","這台新機器比舊的更可靠。"]]},{"w":"durable","p":"adj.","z":"耐用的","c":"供應鏈與製造","ex":[["Customers prefer durable materials that last for many years.","客戶偏好能使用多年的耐用材料。"],["The packaging must be durable enough for long sea voyages.","包裝必須夠耐用，才能承受長途海運。"]]},{"w":"component","p":"n.","z":"零組件、成分","c":"供應鏈與製造","ex":[["A shortage of one key component delayed the production of our new laptop.","一項關鍵零組件的短缺延誤了我們新筆電的生產。"],["Each component is tested separately before final assembly.","每個零組件在最後組裝前都會單獨測試。"]]},{"w":"production line","p":"n.","z":"生產線","c":"供應鏈與製造","ex":[["The production line stopped for two hours because of a machine failure.","生產線因機器故障停擺了兩小時。"],["We added a second production line to meet the growing demand.","我們增設第二條生產線以滿足不斷成長的需求。"]]},{"w":"output","p":"n.","z":"產出、產量","c":"供應鏈與製造","ex":[["The factory doubled its monthly output after installing the new equipment.","安裝新設備後，工廠的月產量增加了一倍。"],["Higher output does not help if the quality is poor.","如果品質不佳，更高的產量也沒有幫助。"]]},{"w":"inspection","p":"n.","z":"檢驗、查驗","c":"供應鏈與製造","ex":[["Every shipment goes through a strict inspection before it leaves the factory.","每批貨出廠前都要經過嚴格檢驗。"],["The buyer sent a team for an on-site inspection of our plant.","買方派了團隊到我們工廠進行現場查驗。"]]},{"w":"calibrate","p":"v.","z":"校準","c":"供應鏈與製造","ex":[["Technicians must calibrate the machines every month to ensure accurate measurements.","技術人員每月都必須校準機器，以確保測量準確。"],["We need to calibrate the scale before weighing the next batch.","在秤下一批貨之前，我們需要先校準磅秤。"]]},{"w":"stockpile","p":"n.","z":"囤積、儲備量","c":"供應鏈與製造","ex":[["The company built a stockpile of chips to avoid future shortages.","公司囤積了一批晶片，以避免未來缺貨。"],["A large stockpile ties up cash and takes up warehouse space.","大量囤貨會綁住現金並占用倉庫空間。"]]},{"w":"transit","p":"n.","z":"運送途中","c":"供應鏈與製造","ex":[["The goods were damaged in transit, so we are filing an insurance claim.","貨物在運送途中受損，所以我們正在申請保險理賠。"],["The package is still in transit and should arrive on Thursday.","包裹仍在運送途中，應該週四會到。"]]},{"w":"backlog","p":"n.","z":"積壓的訂單或工作","c":"供應鏈與製造","ex":[["A growing backlog of orders is frustrating our customers.","不斷增加的積壓訂單讓客戶很不滿。"],["We hired temporary workers to clear the backlog before the holiday.","我們聘請臨時工在假期前清掉積壓的工作。"]]},{"w":"overstock","p":"n.","z":"庫存過剩","c":"供應鏈與製造","ex":[["Overstock of winter clothing forced us to hold a clearance sale.","冬季衣物庫存過剩，迫使我們舉辦清倉特賣。"],["Better forecasting helps us avoid overstock and wasted storage costs.","更準確的預測有助於避免庫存過剩及浪費倉儲成本。"]]},{"w":"restock","p":"v.","z":"補貨","c":"供應鏈與製造","ex":[["We need to restock the shelves before the weekend rush begins.","我們必須在週末人潮湧入前替貨架補貨。"],["The supplier promised to restock our best-selling items by Friday.","供應商承諾週五前替我們的暢銷品補貨。"]]},{"w":"packaging","p":"n.","z":"包裝","c":"供應鏈與製造","ex":[["Eco-friendly packaging has become an important selling point for our brand.","環保包裝已成為我們品牌的重要賣點。"],["Poor packaging caused many items to arrive broken.","包裝不良導致許多商品抵達時已破損。"]]},{"w":"rework","p":"n.","z":"返工、重工","c":"供應鏈與製造","ex":[["High rework rates are driving up our production costs.","高返工率正推高我們的生產成本。"],["Better training for operators will reduce rework on the assembly line.","更好的操作員訓練將減少組裝線上的返工。"]]},{"w":"vertical integration","p":"n.","z":"垂直整合","c":"供應鏈與製造","ex":[["Vertical integration lets the firm control everything from materials to retail.","垂直整合讓這家公司掌控從原料到零售的一切。"],["Through vertical integration, they cut their dependence on outside suppliers.","透過垂直整合，他們減少了對外部供應商的依賴。"]]},{"w":"assemble","p":"v.","z":"組裝、集合","c":"供應鏈與製造","ex":[["Workers assemble the final product by hand at this plant.","這間工廠的工人以手工組裝最終產品。"],["We will assemble the team in the lobby at nine o'clock.","我們將在九點於大廳集合團隊。"]]},{"w":"spearhead","p":"v.","z":"帶頭推動、領軍","c":"策略與綜合","ex":[["Linda will spearhead the company's expansion into Southeast Asia.","琳達將帶領公司拓展東南亞市場。"],["He spearheaded a campaign to cut energy costs across all offices.","他帶頭推動降低所有辦公室能源成本的活動。"]]},{"w":"roll out","p":"phr.","z":"正式推出、全面實施","c":"策略與綜合","ex":[["We plan to roll out the new system to all branches in March.","我們計畫三月在所有分公司全面導入新系統。"],["The company will roll out a loyalty program next quarter.","公司將在下一季推出會員回饋計畫。"]]},{"w":"downsizing","p":"n.","z":"裁員縮編、精簡規模","c":"策略與綜合","ex":[["The downsizing affected nearly twenty percent of the workforce.","這次裁員縮編影響了近兩成的員工。"],["Downsizing may save money, but it can hurt morale.","縮編也許能省錢，卻可能打擊士氣。"]]},{"w":"scope creep","p":"phr.","z":"範疇蔓延（專案範圍不斷擴大）","c":"策略與綜合","ex":[["Scope creep pushed the project well over budget.","範疇蔓延使專案大幅超出預算。"],["To avoid scope creep, we will freeze the requirements today.","為避免範疇蔓延，我們今天就凍結需求。"]]},{"w":"mitigate","p":"v.","z":"減輕、緩和（風險）","c":"策略與綜合","ex":[["We took steps to mitigate the risk of supply shortages.","我們採取措施降低供應短缺的風險。"],["Diversifying suppliers can mitigate the impact of price increases.","分散供應商可以減輕漲價的衝擊。"]]},{"w":"prioritize","p":"v.","z":"排定優先順序、優先處理","c":"策略與綜合","ex":[["We need to prioritize tasks that directly affect revenue.","我們需要優先處理直接影響營收的工作。"],["She prioritized urgent client requests over internal meetings.","她把緊急的客戶需求排在內部會議之前。"]]},{"w":"feasible","p":"adj.","z":"可行的","c":"策略與綜合","ex":[["Is it feasible to finish the project by the end of June?","要在六月底前完成專案可行嗎？"],["The consultants found the proposal technically feasible but expensive.","顧問認為該提案技術上可行但成本高昂。"]]},{"w":"scalable","p":"adj.","z":"可擴展的、可規模化的","c":"策略與綜合","ex":[["We need a scalable solution that can handle rapid growth.","我們需要能因應快速成長的可擴展解決方案。"],["Their business model is simple and highly scalable.","他們的商業模式簡單且高度可規模化。"]]},{"w":"viable","p":"adj.","z":"可行的、能存續的","c":"策略與綜合","ex":[["The pilot showed that the product is commercially viable.","試辦結果顯示該產品在商業上可行。"],["We are still looking for a viable alternative to the current supplier.","我們仍在尋找目前供應商之外的可行替代方案。"]]},{"w":"robust","p":"adj.","z":"穩健的、強健的","c":"策略與綜合","ex":[["The company has a robust plan for handling market changes.","公司有一套穩健的計畫來因應市場變化。"],["We need a robust system that will not crash during peak hours.","我們需要在尖峰時段不會當機的穩健系統。"]]},{"w":"proactive","p":"adj.","z":"積極主動的、前瞻的","c":"策略與綜合","ex":[["A proactive approach to customer complaints builds long-term trust.","主動處理客訴的做法能建立長期信任。"],["We want proactive employees who spot problems early.","我們想要能及早發現問題的積極員工。"]]},{"w":"comprehensive","p":"adj.","z":"全面的、完整的","c":"策略與綜合","ex":[["The consultant submitted a comprehensive review of our operations.","顧問提交了一份對我們營運的全面檢討。"],["We offer a comprehensive training course for all new managers.","我們為所有新任主管提供完整的訓練課程。"]]},{"w":"sustainable","p":"adj.","z":"永續的、可持續的","c":"策略與綜合","ex":[["Investors prefer companies with a sustainable growth strategy.","投資人偏好有永續成長策略的公司。"],["We are switching to sustainable packaging to cut waste.","我們正改用永續包裝以減少廢棄物。"]]},{"w":"core competency","p":"phr.","z":"核心競爭力","c":"策略與綜合","ex":[["Precision manufacturing is our core competency.","精密製造是我們的核心競爭力。"],["The firm sold units that did not match its core competency.","公司出售了與其核心競爭力不符的部門。"]]},{"w":"pain point","p":"phr.","z":"痛點","c":"策略與綜合","ex":[["Long waiting times are the main pain point for our customers.","等候時間過長是我們客戶的主要痛點。"],["The survey helped us identify key pain points in the buying process.","這份調查幫助我們找出購買流程中的關鍵痛點。"]]},{"w":"exit strategy","p":"phr.","z":"退場策略、出場機制","c":"策略與綜合","ex":[["Investors always ask about the founder's exit strategy.","投資人總會詢問創辦人的退場策略。"],["A clear exit strategy makes the venture less risky.","明確的退場策略讓這項事業風險較低。"]]},{"w":"contingency plan","p":"phr.","z":"應變計畫","c":"策略與綜合","ex":[["We prepared a contingency plan in case the supplier fails to deliver.","我們準備了應變計畫以防供應商無法交貨。"],["Without a contingency plan, the outage could have been disastrous.","沒有應變計畫，這次中斷可能會造成災難。"]]},{"w":"risk assessment","p":"phr.","z":"風險評估","c":"策略與綜合","ex":[["A full risk assessment is required before we enter a new market.","進入新市場之前需要做完整的風險評估。"],["The risk assessment highlighted several legal concerns.","風險評估指出了幾個法律上的疑慮。"]]},{"w":"swot analysis","p":"phr.","z":"SWOT 分析（優勢、劣勢、機會、威脅）","c":"策略與綜合","ex":[["The team completed a SWOT analysis before drafting the strategy.","團隊在擬定策略前完成了 SWOT 分析。"],["Our SWOT analysis shows that pricing is a major weakness.","我們的 SWOT 分析顯示定價是一大劣勢。"]]},{"w":"turnaround","p":"n.","z":"轉虧為盈、好轉；週轉時間","c":"策略與綜合","ex":[["The new CEO led a remarkable turnaround of the failing business.","新任執行長帶領這家虧損的企業出現了驚人的轉機。"],["Our standard turnaround for repairs is three working days.","我們維修的標準週轉時間是三個工作天。"]]},{"w":"diversify","p":"v.","z":"使多元化、分散","c":"策略與綜合","ex":[["We plan to diversify our product range to reduce risk.","我們計畫使產品線多元化以降低風險。"],["The company diversified into renewable energy last year.","公司去年跨足再生能源，朝多元化發展。"]]},{"w":"recruit","p":"v.","z":"招募、徵才","c":"策略與綜合","ex":[["We plan to recruit ten engineers before the end of the year.","我們計畫在年底前招募十名工程師。"],["It is hard to recruit skilled workers in this industry.","在這個產業很難招募到有技術的人才。"]]},{"w":"attrition","p":"n.","z":"自然減員、流失","c":"策略與綜合","ex":[["Natural attrition reduced the team size without any layoffs.","自然減員讓團隊縮小而無需裁員。"],["High attrition in the call center is costing us a lot of money.","客服中心的高流失率讓我們花費大量金錢。"]]},{"w":"severance","p":"n.","z":"資遣費、離職補償","c":"策略與綜合","ex":[["Laid-off workers received severance pay equal to three months of salary.","被裁員的員工獲得相當於三個月薪水的資遣費。"],["The severance package included health insurance for six months.","離職補償方案包含六個月的健康保險。"]]},{"w":"talent pool","p":"phr.","z":"人才庫","c":"策略與綜合","ex":[["Our talent pool is much deeper in the technology sector.","我們在科技領域的人才庫深厚許多。"],["Opening a branch in Taipei gives us access to a bigger talent pool.","在台北設立分公司讓我們能接觸更大的人才庫。"]]},{"w":"work-life balance","p":"phr.","z":"工作與生活平衡","c":"策略與綜合","ex":[["Flexible hours help employees maintain a healthy work-life balance.","彈性工時幫助員工維持健康的工作與生活平衡。"],["Many graduates value work-life balance more than a high salary.","許多畢業生重視工作與生活平衡勝過高薪。"]]},{"w":"job description","p":"phr.","z":"職務說明、工作內容說明","c":"策略與綜合","ex":[["Please read the job description carefully before you apply.","申請前請仔細閱讀職務說明。"],["His duties go well beyond what the job description says.","他的職責遠遠超出職務說明所寫的內容。"]]},{"w":"firewall","p":"n.","z":"防火牆","c":"策略與綜合","ex":[["The IT team installed a stronger firewall to block attacks.","資訊團隊安裝了更強的防火牆來阻擋攻擊。"],["The firewall prevented unauthorized access to our network.","防火牆阻止了未經授權的人存取我們的網路。"]]},{"w":"cybersecurity","p":"n.","z":"網路安全、資安","c":"策略與綜合","ex":[["The bank is investing heavily in cybersecurity this year.","這家銀行今年大舉投資資安。"],["All staff must complete cybersecurity training every six months.","所有員工每六個月都必須完成資安訓練。"]]},{"w":"data breach","p":"phr.","z":"資料外洩","c":"策略與綜合","ex":[["The data breach exposed the personal details of thousands of customers.","這次資料外洩暴露了數千名客戶的個資。"],["The firm was fined heavily after the data breach.","公司在資料外洩事件後被處以重罰。"]]},{"w":"backup","p":"n.","z":"備份、備援","c":"策略與綜合","ex":[["Always make a backup before updating the system.","更新系統前務必先做備份。"],["We keep a daily backup of all customer records.","我們每天備份所有客戶紀錄。"]]},{"w":"upgrade","p":"n.","z":"升級","c":"策略與綜合","ex":[["The software upgrade will be installed over the weekend.","軟體升級將在週末安裝。"],["An upgrade to the server is long overdue.","伺服器早就該升級了。"]]},{"w":"migrate","p":"v.","z":"遷移（系統、資料）","c":"策略與綜合","ex":[["We will migrate all our files to the cloud by October.","我們將在十月前把所有檔案遷移到雲端。"],["The team migrated the database without any downtime.","團隊在沒有停機的情況下完成資料庫遷移。"]]},{"w":"cloud computing","p":"phr.","z":"雲端運算","c":"策略與綜合","ex":[["Cloud computing lets small firms use powerful tools at low cost.","雲端運算讓小公司能以低成本使用強大的工具。"],["Our move to cloud computing cut hardware spending by half.","我們轉向雲端運算使硬體支出減少一半。"]]},{"w":"encryption","p":"n.","z":"加密","c":"策略與綜合","ex":[["Strong encryption protects customer payment details.","強大的加密保護客戶的付款資料。"],["All emails containing contracts must use encryption.","所有包含合約的電子郵件都必須加密。"]]},{"w":"troubleshoot","p":"v.","z":"排除故障、疑難排解","c":"策略與綜合","ex":[["The technician will troubleshoot the printer problem this afternoon.","技術人員今天下午會排查印表機的問題。"],["It took hours to troubleshoot the network error.","排查這個網路錯誤花了好幾個小時。"]]},{"w":"digital transformation","p":"phr.","z":"數位轉型","c":"策略與綜合","ex":[["Digital transformation is the top priority for our CEO.","數位轉型是我們執行長的首要任務。"],["Many traditional manufacturers struggle with digital transformation.","許多傳統製造商在數位轉型上遇到困難。"]]},{"w":"integrate","p":"v.","z":"整合、融入","c":"策略與綜合","ex":[["We need to integrate the new tool with our accounting software.","我們需要把新工具與會計軟體整合。"],["The acquired company was quickly integrated into our operations.","被收購的公司很快就融入了我們的營運。"]]},{"w":"sign off on","p":"phr.","z":"正式批准、簽核","c":"策略與綜合","ex":[["The director must sign off on the budget before we proceed.","總監必須先簽核預算我們才能繼續。"],["Legal has not signed off on the contract yet.","法務尚未簽核這份合約。"]]},{"w":"follow up on","p":"phr.","z":"跟進、後續追蹤","c":"策略與綜合","ex":[["I will follow up on the client's request tomorrow morning.","我明天早上會跟進客戶的要求。"],["Please follow up on any unpaid invoices this week.","請在本週追蹤所有未付款的發票。"]]},{"w":"bring to the table","p":"phr.","z":"帶來（能力、資源）、提出","c":"策略與綜合","ex":[["Each partner brings something valuable to the table.","每位夥伴都帶來有價值的資源。"],["What skills can you bring to the table for this role?","你能為這個職位帶來什麼技能？"]]},{"w":"think outside the box","p":"phr.","z":"跳脫框架思考","c":"策略與綜合","ex":[["We need to think outside the box to stand out from competitors.","我們需要跳脫框架思考才能從競爭者中脫穎而出。"],["The designer encouraged the team to think outside the box.","設計師鼓勵團隊跳脫框架思考。"]]},{"w":"go the extra mile","p":"phr.","z":"多下功夫、額外付出","c":"策略與綜合","ex":[["Our staff always go the extra mile for important clients.","我們的員工總是為重要客戶額外付出。"],["She will go the extra mile to finish the proposal on time.","她會額外付出努力以準時完成提案。"]]},{"w":"take on","p":"phr.","z":"承擔、接下；僱用","c":"策略與綜合","ex":[["We cannot take on any more projects this quarter.","本季我們無法再接更多專案。"],["The firm will take on twenty new staff next month.","公司下個月將僱用二十名新員工。"]]},{"w":"keep track of","p":"phr.","z":"記錄、掌握進度","c":"策略與綜合","ex":[["It is hard to keep track of every order without a system.","沒有系統就很難掌握每一筆訂單。"],["Use this spreadsheet to keep track of your expenses.","用這份試算表來記錄你的支出。"]]},{"w":"run out of","p":"phr.","z":"用完、耗盡","c":"策略與綜合","ex":[["We are running out of time to finalize the contract.","我們定案合約的時間快不夠了。"],["The shop will run out of stock within two hours of the sale.","促銷開始兩小時內商店就會沒貨。"]]},{"w":"look into","p":"phr.","z":"調查、研究","c":"策略與綜合","ex":[["The manager promised to look into the customer's complaint.","經理承諾會調查客戶的投訴。"],["We are looking into cheaper shipping options.","我們正在研究更便宜的運送方式。"]]},{"w":"carry out","p":"phr.","z":"執行、進行","c":"策略與綜合","ex":[["The team will carry out a survey of customer satisfaction.","團隊將進行一項客戶滿意度調查。"],["An external firm carried out the safety inspection.","一家外部公司執行了安全檢查。"]]},{"w":"set up","p":"phr.","z":"設立、安排","c":"策略與綜合","ex":[["We want to set up a regional office in Vietnam.","我們想在越南設立一個區域辦事處。"],["Could you set up a meeting with the finance team?","你能安排與財務團隊的會議嗎？"]]},{"w":"draw up","p":"phr.","z":"草擬、起草","c":"策略與綜合","ex":[["The lawyers will draw up the agreement by Monday.","律師會在週一前草擬好協議。"],["We should draw up a detailed plan for the product launch.","我們應該為產品發表草擬詳細的計畫。"]]},{"w":"figure out","p":"phr.","z":"想出、弄清楚","c":"策略與綜合","ex":[["We must figure out why sales dropped last month.","我們必須搞清楚上個月銷售為什麼下滑。"],["Can you figure out a cheaper way to ship these goods?","你能想出更便宜的方式運送這些貨物嗎？"]]},{"w":"call off","p":"phr.","z":"取消、中止","c":"策略與綜合","ex":[["The company called off the merger at the last minute.","公司在最後一刻取消了合併。"],["Bad weather forced us to call off the sales conference.","惡劣天氣迫使我們取消銷售大會。"]]},{"w":"put off","p":"phr.","z":"延後、拖延","c":"策略與綜合","ex":[["We had to put off the launch until the next quarter.","我們不得不把發表延到下一季。"],["Don't put off decisions that affect the budget.","不要拖延影響預算的決定。"]]},{"w":"step down","p":"phr.","z":"退位、卸任","c":"策略與綜合","ex":[["The chairman will step down at the end of the year.","董事長將於年底卸任。"],["She stepped down as CEO to spend more time with her family.","她卸下執行長職務以多陪伴家人。"]]},{"w":"pull off","p":"phr.",
