r if I showed you one?","如果我給你看其他公司的錄取，你們願意跟進嗎？"]]},{"w":"finalize","p":"v.","z":"敲定、完成","c":"薪資與錄取","ex":[["We hope to finalize the terms by the end of the week.","我們希望在本週底前敲定條件。"],["Once we finalize the contract, you can announce your resignation.","一旦我們敲定合約，你就可以提出離職。"]]},{"w":"think it over","p":"phr.","z":"仔細考慮","c":"薪資與錄取","ex":[["Could I have a few days to think it over?","我可以有幾天的時間仔細考慮嗎？"],["Please think it over and let us know by Monday.","請仔細考慮，並在週一前讓我們知道。"]]},{"w":"get back to you","p":"phr.","z":"(稍後)回覆你","c":"薪資與錄取","ex":[["I will get back to you with my decision by Thursday.","我會在週四前回覆你我的決定。"],["Thank you; we will get back to you about the offer soon.","謝謝你，我們很快就會回覆你關於錄取的事。"]]},{"w":"mandatory","p":"adj.","z":"強制的、必須的","c":"薪資與錄取","ex":[["Attendance at the orientation session is mandatory for all new employees.","所有新進員工都必須出席新人說明會。"],["Is overtime mandatory or voluntary in this department?","這個部門的加班是強制還是自願的？"]]},{"w":"discretionary","p":"adj.","z":"由公司裁量的","c":"薪資與錄取","ex":[["The bonus is discretionary and not guaranteed, so it may change each year.","獎金由公司裁量並非保證，所以每年可能不同。"],["Discretionary bonuses depend on company profit that year.","酌發獎金取決於公司當年的獲利。"]]},{"w":"terms and conditions","p":"n.","z":"條款與條件","c":"薪資與錄取","ex":[["Please review the terms and conditions of employment.","請審閱聘僱的條款與條件。"],["I have a few questions about the terms and conditions.","我對這些條款與條件有幾個問題。"]]},{"w":"working hours","p":"n.","z":"工作時間","c":"薪資與錄取","ex":[["What are the regular working hours for this position?","這個職位的正常工作時間是什麼？"],["The working hours are nine to six with a lunch break.","工作時間是九點到六點，中間有午休。"]]},{"w":"trial run","p":"n.","z":"試用、試行","c":"薪資與錄取","ex":[["The first month will be a trial run for both sides.","第一個月對雙方而言都是試行期。"],["Can we agree on a trial run before a long contract?","在簽長期合約前，我們可以先試行嗎？"]]},{"w":"salary review","p":"n.","z":"薪資檢討","c":"薪資與錄取","ex":[["A salary review takes place every January for all full-time employees.","每年一月會為所有全職員工進行薪資檢討。"],["Can I request an early salary review after six months?","我可以在六個月後申請提早進行薪資檢討嗎？"]]},{"w":"cost of living","p":"n.","z":"生活成本","c":"薪資與錄取","ex":[["The salary should reflect the cost of living in Taipei.","薪水應該反映台北的生活成本。"],["I considered the cost of living before naming my figure.","我在提出數字前考慮了生活成本。"]]},{"w":"backdated","p":"adj.","z":"追溯生效的","c":"薪資與錄取","ex":[["The pay increase will be backdated to the first of March.","加薪將追溯至三月一日生效。"],["Is the insurance coverage backdated to my start date?","保險是追溯到我的到職日生效嗎？"]]},{"w":"sign off","p":"phr.","z":"核准、簽核","c":"薪資與錄取","ex":[["My manager still needs to sign off on the budget.","我的主管還需要簽核這筆預算。"],["Once the director signs off, we can send the offer.","主管一簽核，我們就能發出錄取通知。"]]},{"w":"equal pay","p":"n.","z":"同工同酬","c":"薪資與錄取","ex":[["I value a company that supports equal pay.","我重視支持同工同酬的公司。"],["Does your company have a policy on equal pay?","你們公司有同工同酬的政策嗎？"]]},{"w":"remuneration","p":"n.","z":"酬勞、薪酬","c":"薪資與錄取","ex":[["The remuneration includes a base salary and yearly bonuses.","薪酬包含底薪和年度獎金。"],["He was unhappy with the remuneration offered for the job.","他對這份工作提供的薪酬感到不滿。"]]},{"w":"pay grade","p":"n.","z":"薪級","c":"薪資與錄取","ex":[["New engineers usually start at pay grade three in this company.","新進工程師從第三薪級起敘。"],["Your pay grade depends on your experience and education.","你的薪級取決於你的經驗與學歷。"]]},{"w":"pay scale","p":"n.","z":"薪資級距","c":"薪資與錄取","ex":[["The pay scale for this role runs from low to high.","這個職位的薪資級距從低到高。"],["Public schools follow a fixed pay scale for teachers.","公立學校對教師遵循固定的薪資級距。"]]},{"w":"pay stub","p":"n.","z":"薪資單","c":"薪資與錄取","ex":[["Please bring your latest pay stub to the bank.","請把你最近的薪資單帶到銀行。"],["The pay stub shows tax and insurance deductions clearly.","薪資單清楚顯示稅金和保險的扣款。"]]},{"w":"wage","p":"n.","z":"工資","c":"薪資與錄取","ex":[["The minimum wage in Taiwan rises almost every year.","台灣的基本工資幾乎每年都會調漲。"],["He earns an hourly wage plus tips at the restaurant.","他在餐廳領時薪加小費。"]]},{"w":"net pay","p":"n.","z":"實領薪資","c":"薪資與錄取","ex":[["My net pay is lower than my gross salary after tax.","扣稅後我的實領薪資比總薪資低。"],["Ask how much your net pay will be each month.","問清楚你每個月的實領薪資是多少。"]]},{"w":"lump sum","p":"n.","z":"一次性給付","c":"薪資與錄取","ex":[["He received a lump sum when he left the company.","他離開公司時領到一筆一次性給付。"],["The retirement plan can be paid as a lump sum.","退休金計畫可以一次性領取。"]]},{"w":"incentive","p":"n.","z":"獎勵、誘因","c":"薪資與錄取","ex":[["The company offers a cash incentive for hitting sales goals.","公司為達成銷售目標提供現金獎勵。"],["A flexible schedule is a strong incentive for many workers.","彈性的時間表對許多員工來說是很強的誘因。"]]},{"w":"retention bonus","p":"n.","z":"留任獎金","c":"薪資與錄取","ex":[["They offered me a retention bonus to stay for another year.","他們提供我留任獎金，要我再待一年。"],["A retention bonus is paid only if you remain employed.","留任獎金只有在你繼續任職時才會發放。"]]},{"w":"pension","p":"n.","z":"退休金","c":"薪資與錄取","ex":[["The new labor pension system lets employers contribute monthly.","新的勞工退休金制度讓雇主每月提撥。"],["She will receive a pension after thirty years of service.","她服務滿三十年後將領取退休金。"]]},{"w":"maternity leave","p":"n.","z":"產假","c":"薪資與錄取","ex":[["The company offers generous maternity leave to new mothers.","公司提供新手媽媽優渥的產假。"],["She returned to work after eight weeks of maternity leave.","她休完八週產假後回到工作崗位。"]]},{"w":"parental leave","p":"n.","z":"育嬰假","c":"薪資與錄取","ex":[["Both parents may take parental leave when a baby is born.","嬰兒出生後，父母雙方都可以請育嬰假。"],["He used his parental leave to care for his newborn son.","他利用育嬰假照顧剛出生的兒子。"]]},{"w":"holiday pay","p":"n.","z":"假日加班費","c":"薪資與錄取","ex":[["We receive double holiday pay if we work on national holidays.","如果我們在國定假日上班，會領到雙倍的假日加班費。"],["Please check whether holiday pay is included in the contract.","請確認合約中是否包含假日加班費。"]]},{"w":"acceptance","p":"n.","z":"接受、同意","c":"薪資與錄取","ex":[["Please confirm your acceptance of the offer by Friday.","請在星期五前確認你接受這份錄取。"],["Her acceptance of the job surprised no one.","她接受這份工作並沒有讓任何人感到意外。"]]},{"w":"negotiation","p":"n.","z":"協商、談判","c":"薪資與錄取","ex":[["Salary negotiation is easier when you know the market rate.","當你了解市場行情時，薪資協商會比較容易。"],["The negotiation ended with a better offer for both sides.","這場協商以對雙方都更好的條件收場。"]]},{"w":"bargain","p":"v.","z":"討價還價","c":"薪資與錄取","ex":[["You can bargain politely if the salary seems too low.","如果薪水看起來太低，你可以禮貌地討價還價。"],["I did not want to bargain on my first day.","我不想在第一天就討價還價。"]]},{"w":"stipulate","p":"v.","z":"規定、載明","c":"薪資與錄取","ex":[["The contract stipulates that employees work forty hours a week.","合約規定員工每週工作四十小時。"],["The offer letter stipulated a three-month probation period for new staff.","這份錄取通知載明了三個月的試用期。"]]},{"w":"clause","p":"n.","z":"條款","c":"薪資與錄取","ex":[["Read the termination clause carefully before you sign.","簽名前請仔細閱讀終止條款。"],["There is a clause about working overtime during busy seasons.","有一項關於旺季加班的條款。"]]},{"w":"amendment","p":"n.","z":"修訂、修正條款","c":"薪資與錄取","ex":[["We added an amendment to the contract about remote work.","我們在合約中增加了一項關於遠距工作的修訂。"],["Any amendment must be approved by both parties in writing.","任何修訂都必須經雙方書面同意。"]]},{"w":"non-disclosure agreement","p":"n.","z":"保密協議","c":"薪資與錄取","ex":[["I signed a non-disclosure agreement on my first day.","我在第一天簽了保密協議。"],["A non-disclosure agreement protects the company's trade secrets.","保密協議保護公司的商業機密。"]]},{"w":"probationary","p":"adj.","z":"試用期的","c":"薪資與錄取","ex":[["She passed her probationary period and became a permanent employee.","她通過了試用期，成為正式員工。"],["Probationary staff are evaluated by their managers after ninety days.","試用期的員工在九十天後接受考核。"]]},{"w":"renewal","p":"n.","z":"續約、更新","c":"薪資與錄取","ex":[["My contract renewal is due at the end of December.","我的合約續約期限在十二月底。"],["The renewal comes with a five percent salary increase.","這次續約附帶百分之五的加薪。"]]},{"w":"underpaid","p":"adj.","z":"薪資過低的","c":"薪資與錄取","ex":[["Many nurses feel underpaid for such demanding work.","許多護理師覺得這麼吃重的工作薪水太低。"],["He left because he felt underpaid and overworked.","他因為覺得薪水太低又工作過量而離職。"]]},{"w":"earn","p":"v.","z":"賺取、掙得","c":"薪資與錄取","ex":[["You can earn extra money by working on weekends.","你週末工作可以多賺一些錢。"],["She earns a good living as a translator.","她靠當翻譯過著不錯的生活。"]]},{"w":"diligent","p":"adj.","z":"勤奮的、認真負責的","c":"軟實力與態度","ex":[["I am a diligent worker who checks every detail twice.","我是勤奮的員工，每個細節都會檢查兩次。"],["Her diligent approach earned the trust of the whole team.","她認真負責的態度贏得了全隊的信任。"]]},{"w":"ambitious","p":"adj.","z":"有抱負的、野心勃勃的","c":"軟實力與態度","ex":[["I am ambitious, but I also know I must learn step by step.","我有抱負，但也知道必須一步一步學習。"],["We hire ambitious people who want to grow with the company.","我們聘用有抱負、想與公司一起成長的人。"]]},{"w":"humble","p":"adj.","z":"謙虛的","c":"軟實力與態度","ex":[["I stay humble and always ask for advice from senior colleagues.","我保持謙虛，總會向資深同事請教。"],["He is humble about his success and gives credit to others.","他對自己的成功很謙虛，並把功勞歸給別人。"]]},{"w":"assertive","p":"adj.","z":"果斷自信的、敢於表達的","c":"軟實力與態度","ex":[["I am assertive but never aggressive when I disagree with someone.","我不同意別人時會堅定表達，但絕不咄咄逼人。"],["Being assertive helped me negotiate a better deal with the supplier.","敢於表達讓我與供應商談到更好的條件。"]]},{"w":"empathetic","p":"adj.","z":"有同理心的","c":"軟實力與態度","ex":[["I am empathetic, so customers feel heard when they call me.","我有同理心，所以客戶來電時會覺得被傾聽。"],["A good manager should be empathetic toward team members under stress.","好主管應該對壓力大的成員有同理心。"]]},{"w":"persistent","p":"adj.","z":"堅持不懈的","c":"軟實力與態度","ex":[["I am persistent, and I never give up after the first failure.","我很有毅力，不會在第一次失敗後就放棄。"],["Being persistent helped me win back a difficult client.","堅持不懈幫助我挽回了一位難纏的客戶。"]]},{"w":"trustworthy","p":"adj.","z":"值得信賴的","c":"軟實力與態度","ex":[["I am trustworthy and I keep confidential information private.","我值得信賴，也會為機密資訊保密。"],["Clients prefer a trustworthy partner over the cheapest option.","客戶比起最便宜的選項，更偏好值得信賴的夥伴。"]]},{"w":"inspire","p":"v.","z":"啟發、鼓舞","c":"軟實力與態度","ex":[["I try to inspire others by working hard and staying positive.","我努力工作並保持正向，藉此鼓舞他人。"],["Her leadership inspired the team to exceed its sales target.","她的領導鼓舞團隊超越了銷售目標。"]]},{"w":"lead by example","p":"phr.","z":"以身作則","c":"軟實力與態度","ex":[["I believe in leading by example, so I never ask others to do what I would not do.","我相信以身作則，所以不會要求別人做我自己不願做的事。"],["Good managers lead by example during stressful periods.","好主管在壓力大的時期會以身作則。"]]},{"w":"decision-making","p":"n.","z":"決策","c":"軟實力與態度","ex":[["Fast decision-making is important in our fast-moving industry.","快速決策在我們步調很快的產業中很重要。"],["I use data to support my decision-making whenever possible.","我盡可能用數據來支持我的決策。"]]},{"w":"meet deadlines","p":"phr.","z":"如期完成、趕上期限","c":"軟實力與態度","ex":[["I always meet deadlines by breaking big tasks into smaller steps.","我總是把大任務拆成小步驟，以如期完成。"],["How do you meet deadlines when the workload suddenly increases?","工作量突然增加時，你如何趕上期限？"]]},{"w":"accountability","p":"n.","z":"責任感、問責","c":"軟實力與態度","ex":[["Accountability is important to me, so I admit mistakes quickly.","我很重視責任感，所以會很快承認錯誤。"],["Our culture is built on trust and accountability.","我們的文化建立在信任與責任感之上。"]]},{"w":"area for improvement","p":"n.","z":"待改進之處","c":"軟實力與態度","ex":[["Public speaking is an area for improvement, so I joined a speaking club.","公開演講是我待改進之處，所以我加入了演講社團。"],["Every employee has an area for improvement, and mine is patience.","每個員工都有待改進之處，我的是耐心。"]]},{"w":"learn from mistakes","p":"phr.","z":"從錯誤中學習","c":"軟實力與態度","ex":[["I try to learn from mistakes and share the lessons with my team.","我努力從錯誤中學習，並與團隊分享心得。"],["People who learn from mistakes usually improve very quickly.","能從錯誤中學習的人通常進步很快。"]]},{"w":"comfort zone","p":"n.","z":"舒適圈","c":"軟實力與態度","ex":[["I stepped out of my comfort zone when I moved to a sales role.","我轉到業務職位時走出了舒適圈。"],["Real growth often happens outside your comfort zone.","真正的成長常常發生在舒適圈之外。"]]},{"w":"advance","p":"v.","z":"晉升、進步","c":"軟實力與態度","ex":[["I hope to advance to a senior role after proving myself.","我希望在證明自己之後晉升到資深職位。"],["It is easier to advance in a company that invests in people.","在重視人才投資的公司比較容易晉升。"]]},{"w":"passion","p":"n.","z":"熱情、熱愛的事物","c":"軟實力與態度","ex":[["My passion for design is the reason I applied for this job.","我對設計的熱情是我應徵這份工作的原因。"],["It is great to see candidates with real passion for the industry.","看到對產業懷有真正熱情的求職者真好。"]]},{"w":"aspire","p":"v.","z":"渴望、立志","c":"軟實力與態度","ex":[["I aspire to lead a regional team one day.","我立志有一天能帶領區域團隊。"],["Many young engineers aspire to work for global companies like yours.","許多年輕工程師渴望進入像貴公司這樣的跨國企業。"]]},{"w":"personal growth","p":"n.","z":"個人成長","c":"軟實力與態度","ex":[["I see this job as a chance for personal growth as well as income.","我視這份工作為個人成長的機會，而不只是收入。"],["Personal growth matters to me as much as the job title.","個人成長對我而言和職稱一樣重要。"]]},{"w":"company culture","p":"n.","z":"企業文化","c":"軟實力與態度","ex":[["I was attracted to your open and friendly company culture.","我被貴公司開放友善的企業文化所吸引。"],["How would you describe the company culture in your department?","你會如何形容你們部門的企業文化？"]]},{"w":"core values","p":"n.","z":"核心價值","c":"軟實力與態度","ex":[["Honesty and respect are the core values I try to follow at work.","誠實與尊重是我在工作中努力遵循的核心價值。"],["Our core values guide every hiring decision we make.","我們的核心價值引導每一個聘用決定。"]]},{"w":"fit","p":"n.","z":"適合度、契合","c":"軟實力與態度","ex":[["I think I would be a good fit for your sales team.","我認為我很適合貴公司的業務團隊。"],["Cultural fit is just as important to us as technical skills.","文化契合度對我們和技術能力一樣重要。"]]},{"w":"rapport","p":"n.","z":"融洽的關係","c":"軟實力與態度","ex":[["I quickly build rapport with clients by listening carefully.","我透過專心傾聽，很快就與客戶建立融洽關係。"],["Good rapport with your manager makes daily work much easier.","與主管關係融洽會讓日常工作輕鬆許多。"]]},{"w":"first impression","p":"n.","z":"第一印象","c":"軟實力與態度","ex":[["You only get one chance to make a good first impression.","你只有一次機會留下好的第一印象。"],["Her smile and confident greeting created a great first impression.","她的微笑與自信的問候留下了很好的第一印象。"]]},{"w":"punctual","p":"adj.","z":"準時的","c":"軟實力與態度","ex":[["I am always punctual, and I arrived at the building thirty minutes early.","我總是很準時，今天提早三十分鐘到大樓。"],["Being punctual shows respect for the interviewer's time.","準時表示尊重面試官的時間。"]]},{"w":"dress code","p":"n.","z":"服裝規定","c":"軟實力與態度","ex":[["Could you tell me about the dress code at your office?","能請你告訴我貴公司辦公室的服裝規定嗎？"],["The dress code is business casual, so I wore a clean shirt.","服裝規定是商務休閒，所以我穿了整潔的襯衫。"]]},{"w":"professional","p":"adj.","z":"專業的","c":"軟實力與態度","ex":[["I always try to stay professional, even in stressful situations.","即使在壓力大的情況下，我也盡力保持專業。"],["A professional appearance helps you look prepared and serious.","專業的外表讓你顯得有準備且認真。"]]},{"w":"body language","p":"n.","z":"肢體語言","c":"軟實力與態度","ex":[["Your body language should show that you are relaxed and interested.","你的肢體語言應該顯示你放鬆且有興趣。"],["The interviewer noticed my open body language and friendly smile.","面試官注意到我開放的肢體語言與友善的微笑。"]]},{"w":"eye contact","p":"n.","z":"眼神接觸","c":"軟實力與態度","ex":[["I kept eye contact with each panel member while answering.","回答時我與每位面試官保持眼神接觸。"],["Good eye contact shows both confidence and honesty to the interviewer.","良好的眼神接觸顯示自信與誠實。"]]},{"w":"firm handshake","p":"n.","z":"有力的握手","c":"軟實力與態度","ex":[["A firm handshake and a smile are a good way to start.","有力的握手加上微笑是好的開始。"],["He greeted the interviewer with a firm handshake.","他以有力的握手向面試官問好。"]]},{"w":"courteous","p":"adj.","z":"有禮貌的","c":"軟實力與態度","ex":[["Please be courteous to the receptionist, because she may share her opinion.","請對櫃台人員保持禮貌，因為她可能會表達看法。"],["She stayed courteous even when the questions became difficult.","即使問題變難，她仍保持禮貌。"]]},{"w":"etiquette","p":"n.","z":"禮儀","c":"軟實力與態度","ex":[["Basic interview etiquette includes turning off your phone.","基本的面試禮儀包括把手機關機。"],["Business etiquette differs between countries, so do some research.","商務禮儀因國家而異，所以要先做功課。"]]},{"w":"composed","p":"adj.","z":"沉著的、鎮定的","c":"軟實力與態度","ex":[["I stayed composed even when I did not know the answer.","即使不知道答案，我仍保持鎮定。"],["Candidates who remain composed under pressure impress us.","在壓力下保持沉著的求職者令我們印象深刻。"]]},{"w":"articulate","p":"adj.","z":"口齒清晰、表達流暢的","c":"軟實力與態度","ex":[["She is articulate and explains complex ideas in simple words.","她表達流暢，能用簡單的話解釋複雜的概念。"],["We need an articulate speaker to represent us at conferences.","我們需要口才清晰的人在研討會中代表我們。"]]},{"w":"concise","p":"adj.","z":"簡潔的","c":"軟實力與態度","ex":[["Please keep your answers concise and focused on the question.","請讓你的回答簡潔並緊扣問題。"],["Her concise summary saved everyone a lot of time.","她簡潔的摘要為大家省下很多時間。"]]},{"w":"elaborate","p":"v.","z":"詳細說明","c":"軟實力與態度","ex":[["Could you elaborate on your role in that project?","你能詳細說明你在那個專案中的角色嗎？"],["I would be happy to elaborate if you want more details.","如果你想了解更多細節，我很樂意詳細說明。"]]},{"w":"follow up","p":"phr.","z":"後續跟進","c":"軟實力與態度","ex":[["I plan to follow up with a short email tomorrow morning.","我打算明天早上寄一封簡短的電子郵件跟進。"],["It is polite to follow up if you hear nothing after a week.","如果一週後都沒消息，後續詢問是有禮貌的做法。"]]},{"w":"thank-you email","p":"n.","z":"感謝信","c":"軟實力與態度","ex":[["I sent a thank-you email within twenty-four hours of the interview.","我在面試後二十四小時內寄出了感謝信。"],["A short thank-you email can leave a very positive impression.","一封簡短的感謝信能留下非常正面的印象。"]]},{"w":"references","p":"n.","z":"推薦人、推薦信","c":"軟實力與態度","ex":[["I can provide references from my former manager and two colleagues.","我可以提供前主管和兩位同事作為推薦人。"],["We will contact your references after the final interview.","最後一輪面試後，我們會聯絡你的推薦人。"]]},{"w":"salary expectations","p":"n.","z":"期望薪資","c":"軟實力與態度","ex":[["My salary expectations are in line with the market range.","我的期望薪資符合市場行情。"],["Could you share your salary expectations for this position?","能請你說說對這個職位的期望薪資嗎？"]]},{"w":"availability","p":"n.","z":"可上班時間、有空的時間","c":"軟實力與態度","ex":[["Please let me know your availability for a second interview.","請告知你第二次面試可以的時間。"],["My availability is flexible, and I can start on short notice.","我的時間很彈性，可以在短時間內到職。"]]},{"w":"next steps","p":"n.","z":"後續步驟","c":"軟實力與態度","ex":[["Could you explain the next steps in the hiring process?","能請你說明後續的招聘流程嗎？"],["Thank you, and I look forward to hearing about the next steps.","謝謝你，期待聽到後續的安排。"]]},{"w":"shortlist","p":"v.","z":"列入候選名單","c":"軟實力與態度","ex":[["We will shortlist five candidates for the final round.","我們會挑出五位候選人進入最後一輪。"],["I was happy to hear that I had been shortlisted.","聽到自己進入候選名單，我很開心。"]]},{"w":"second round","p":"n.","z":"第二輪面試","c":"軟實力與態度","ex":[["I was invited to a second round with the department director.","我受邀與部門主管進行第二輪面試。"],["The second round usually focuses on skills and team fit.","第二輪面試通常著重在能力與團隊契合度。"]]},{"w":"hiring manager","p":"n.","z":"用人主管","c":"軟實力與態度","ex":[["The hiring manager will make the final decision next week.","用人主管會在下週做最後決定。"],["I wrote to the hiring manager to thank her for her time.","我寫信向用人主管感謝她撥冗面試。"]]},{"w":"panel interview","p":"n.","z":"小組面試","c":"軟實力與態度","ex":[["A panel interview can feel stressful, so I practiced with friends.","小組面試可能讓人緊張，所以我和朋友練習過。"],["In a panel interview, try to address every person on the panel.","在小組面試中，要設法顧及每一位面試官。"]]},{"w":"make a good impression","p":"phr.","z":"留下好印象","c":"軟實力與態度","ex":[["I want to make a good impression on everyone I meet today.","我想在今天遇到的每個人面前留下好印象。"],["Arriving prepared is the easiest way to make a good impression.","做好準備是留下好印象最簡單的方法。"]]},{"w":"look forward to","p":"phr.","z":"期待","c":"軟實力與態度","ex":[["I look forward to hearing from you about the next steps.","我期待收到你關於後續步驟的消息。"],["We look forward to welcoming you to the team.","我們期待歡迎你加入團隊。"]]},{"w":"grateful","p":"adj.","z":"感激的","c":"軟實力與態度","ex":[["I am grateful for the opportunity to meet your team today.","我很感激今天有機會與貴團隊見面。"],["She was grateful for the feedback and wrote a kind reply.","她對回饋意見很感激，並寫了一封親切的回信。"]]},{"w":"keep in touch","p":"phr.","z":"保持聯絡","c":"軟實力與態度","ex":[["I hope we can keep in touch even if I am not selected.","即使我沒被錄取，也希望我們能保持聯絡。"],["It is wise to keep in touch with people you meet at interviews.","與面試時認識的人保持聯絡是明智的。"]]},{"w":"emotional intelligence","p":"n.","z":"情緒智商、情商","c":"軟實力與態度","ex":[["Emotional intelligence helps me stay calm in difficult conversations.","情商幫助我在困難的對話中保持冷靜。"],["Leaders with high emotional intelligence usually build stronger teams.","情商高的領導者通常能建立更強的團隊。"]]},{"w":"open-minded","p":"adj.","z":"心胸開放的","c":"軟實力與態度","ex":[["I am open-minded and happy to try methods I have not used before.","我心胸開放，樂於嘗試沒用過的方法。"],["We need open-minded people who accept new ideas.","我們需要能接受新想法、心胸開放的人。"]]},{"w":"outgoing","p":"adj.","z":"外向的","c":"軟實力與態度","ex":[["I am outgoing and enjoy meeting new clients at events.","我個性外向，喜歡在活動中認識新客戶。"],["Being outgoing helped her build a network quickly.","個性外向幫助她快速建立人脈。"]]},{"w":"dedicated","p":"adj.","z":"敬業的、全心投入的","c":"軟實力與態度","ex":[["I am dedicated to my work and take pride in the results.","我對工作全心投入，並以成果為傲。"],["We want a dedicated person who cares about quality.","我們想找在乎品質、敬業的人。"]]},{"w":"goal-oriented","p":"adj.","z":"目標導向的","c":"軟實力與態度","ex":[["I am goal-oriented, so I set weekly targets and track them.","我以目標為導向，所以會設定每週目標並追蹤。"],["A goal-oriented manager keeps the team focused on results.","目標導向的主管會讓團隊專注於成果。"]]},{"w":"supportive","p":"adj.","z":"支持的、肯幫忙的","c":"軟實力與態度","ex":[["I try to be supportive when a colleague is having a hard time.","同事遇到困難時，我會盡量給予支持。"],["My manager was supportive and gave me room to grow.","我的主管很支持我，並給我成長的空間。"]]},{"w":"approachable","p":"adj.","z":"平易近人的","c":"軟實力與態度","ex":[["As a team leader, I make myself approachable so people can ask questions.","身為組長，我讓自己平易近人，大家才敢發問。"],["Staff say that our director is very approachable.","員工說我們的主任非常平易近人。"]]},{"w":"decisive","p":"adj.","z":"果斷的","c":"軟實力與態度","ex":[["I can be decisive when time is short and information is limited.","在時間短、資訊有限時，我能果斷決策。"],["A decisive leader helps the team avoid confusion.","果斷的領導者能幫助團隊避免混亂。"]]},{"w":"strategic thinking","p":"n.","z":"策略性思考","c":"軟實力與態度","ex":[["Strategic thinking helps me connect daily tasks to company goals.","策略性思考幫助我把日常工作與公司目標連結起來。"],["This senior role requires strong strategic thinking and planning.","這個資深職位需要很強的策略性思考與規劃能力。"]]},{"w":"empower","p":"v.","z":"賦權、使有能力","c":"軟實力與態度","ex":[["I try to empower my team members to make their own decisions.","我努力讓團隊成員有能力自己做決定。"],["Good warm handshake and a smile.","他伸出手熱情地握手並微笑。"]]},{"w":"posture","p":"n.","z":"姿勢、坐姿","c":"軟實力與態度","ex":[["Sit up straight during the interview, because good posture shows confidence.","面試時要坐直，因為良好的姿勢顯示自信。"],["Her relaxed posture made the interviewer feel comfortable and at ease.","她放鬆的姿勢讓面試官覺得很自在。"]]},{"w":"greet","p":"v.","z":"問候、迎接","c":"軟實力與態度","ex":[["The receptionist will greet you when you arrive.","你抵達時，櫃檯人員會迎接你。"],["I always greet the interviewer with a smile and a handshake.","我總是以微笑和握手來問候面試官。"]]},{"w":"courtesy","p":"n.","z":"禮貌","c":"軟實力與態度","ex":[["It is a courtesy to send a thank-you email after the interview.","面試後寄一封感謝信是一種禮貌。"],["Please treat the receptionist with courtesy and respect.","請以禮貌和尊重對待櫃檯人員。"]]},{"w":"tone","p":"n.","z":"語氣","c":"軟實力與態度","ex":[["Keep a polite and friendly tone throughout the interview.","在整個面試中保持禮貌友善的語氣。"],["His tone sounded impatient when he answered the question.","他回答問題時語氣聽起來不耐煩。"]]},{"w":"enthusiasm","p":"n.","z":"熱忱","c":"軟實力與態度","ex":[["Show your enthusiasm for the role without sounding fake.","表現出你對這個職位的熱忱，但不要顯得虛假。"],["Her enthusiasm made up for her lack of experience.","她的熱忱彌補了她經驗的不足。"]]},{"w":"confidence","p":"n.","z":"自信","c":"軟實力與態度","ex":[["Speak slowly and clearly in the interview to show confidence.","面試時說話緩慢而清楚以展現自信。"],["Regular practice builds the confidence you need for tough interview questions.","練習能建立你面對困難問題所需的自信。"]]},{"w":"humility","p":"n.","z":"謙遜","c":"軟實力與態度","ex":[["Humility means admitting what you do not know yet.","謙遜意味著承認自己還不知道的事。"],["He showed humility by thanking his team for the success.","他感謝團隊的成功，展現了謙遜。"]]},{"w":"sincere","p":"adj.","z":"誠懇的","c":"軟實力與態度","ex":[["Give a sincere answer instead of a rehearsed speech.","給一個誠懇的回答，而不是背好的講稿。"],["Her sincere thanks left a good impression on everyone.","她誠懇的感謝給每個人留下了好印象。"]]},{"w":"poise","p":"n.","z":"沉著、從容","c":"軟實力與態度","ex":[["She answered every tough question from the panel with calm poise.","她以冷靜的沉著回答了小組提出的每一個艱難問題。"],["Poise under pressure is a very valuable skill for managers.","在壓力下保持沉著對管理者來說是珍貴的能力。"]]},{"w":"fidget","p":"v.","z":"坐立不安、動來動去","c":"軟實力與態度","ex":[["Try not to fidget with your pen during the interview.","面試時盡量不要玩弄你的筆。"],["I tend to fidget when I am nervous.","我緊張時會坐立不安。"]]},{"w":"gratitude","p":"n.","z":"感激","c":"軟實力與態度","ex":[["I closed the email by expressing my gratitude for the opportunity.","我在信末表達了對這個機會的感激。"],["Show gratitude to everyone who helped you along the way.","對一路上幫助你的每個人表達感激。"]]}]}];
/* ---------- number-to-speech ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function cardinal(n){
  if(n<20)return ONES[n];
  if(n<100)return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
  if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+cardinal(n%100):'');
  if(n<1e6)return cardinal(Math.floor(n/1000))+' thousand'+(n%1000?' '+cardinal(n%1000):'');
  if(n<1e9)return cardinal(Math.floor(n/1e6))+' million'+(n%1e6?' '+cardinal(n%1e6):'');
  return String(n).split('').map(d=>ONES[+d]).join(' ');
}
function digits(s){return s.split('').map(d=>ONES[+d]).join(' ');}
function ordinal(n){
  const irr={1:'first',2:'second',3:'third',5:'fifth',8:'eighth',9:'ninth',12:'twelfth'};
  if(n<20)return irr[n]||ONES[n]+'th';
  if(n%10===0)return TENS[n/10].replace('y','ie')+'th';
  const r=n%10;return TENS[Math.floor(n/10)]+'-'+(irr[r]||ONES[r]+'th');
}
function year(y){
  const a=Math.floor(y/100),b=y%100;
  if(y>=2000&&y<2010)return 'two thousand'+(b?' '+ONES[b]:'');
  return cardinal(a)+' '+(b===0?'hundred':(b<10?'oh '+ONES[b]:cardinal(b)));
}
function spoken(t){
  return t
    .replace(/(\d+)(st|nd|rd|th)\b/g,(m,n)=>ordinal(+n))
    .replace(/(\b(?:order|PO|number|no\.?|ticket|invoice|case|RMA|report|#)\s*)(\d{3,})/gi,(m,p,n)=>p+digits(n))
    .replace(/\b([A-Z]{1,3})[- ]?(\d+)\b/g,(m,l,n)=>l.split('').join(' ')+' '+(n.length>3?digits(n):cardinal(+n)))
    .replace(/\b(\d+)([A-Z])\b/g,(m,n,l)=>cardinal(+n)+' '+l)
    .replace(/\b(\d+(?:\.\d+){2,})\b/g,m=>m.split('.').map(x=>cardinal(+x)).join(' point '))
    .replace(/\$(\d[\d,]*)(?:\.(\d+))?/g,(m,n,d)=>cardinal(+n.replace(/,/g,''))+(d?' point '+digits(d):'')+' dollars')
    .replace(/\b(\d{1,3}(?:,\d{3})+)\b/g,m=>cardinal(+m.replace(/,/g,'')))
    .replace(/\b(\d+)\.(\d+)\b/g,(m,a,b)=>cardinal(+a)+' point '+digits(b))
    .replace(/\b(19|20)(\d{2})\b/g,(m)=>year(+m))
    .replace(/\b\d{4,}\b/g,m=>digits(m))
    .replace(/\b\d+\b/g,m=>cardinal(+m))
    .replace(/%/g,' percent');
}

/* ---------- data helpers ---------- */
function parseLesson(l){
  if(l._lines)return l;
  if(l.ty==='dialogue'){
    l._lines=l.d.split('\n').map(s=>{const i=s.indexOf(': ');return [s.slice(0,i),s.slice(i+2)];});
  }else{
    l._lines=l.d.split('\n').map(s=>['',s]);
  }
  l._speakers=[...new Set(l._lines.map(x=>x[0]))];
  l._words=l._lines.reduce((n,x)=>n+x[1].split(/\s+/).length,0);
  l._mins=Math.max(1,Math.round(l._words/(140*prefsRateFactor())));
  return l;
}
function prefsRateFactor(){return 1;}
function topicById(id){return TOPICS.find(t=>t.id===id);}
function totalCount(t){return t.lessons.length+(t.more?t.more.split('\n').length:0);}
function doneCount(t){return t.lessons.reduce((n,_,i)=>n+(done[t.id+'-'+i]?1:0),0);}

  const cards=TOPICS.map(t=>{
    const n=totalCount(t),r=t.lessons.length,d=doneCount(t);
    return `<a class="tcard" href="#topic-${t.id}"><span class="en">${esc(t.en)}</span><span class="zh">${esc(t.zh)}</span><span class="ds">${esc(t.ds)}</span><span class="meta">${n} 篇 · 已聽 ${d}</span><span class="bar"><i style="width:${r?Math.round(d/r*100):0}%"></i></span></a>`;
  }).join('');
  const vcards=VOCAB.map(v=>{
    const k=Object.keys(vknown[v.id]||{}).length;
    return `<a class="tcard" href="#vocab-${v.id}"><span class="en">${esc(v.en)}</span><span class="zh">${esc(v.zh)}</span><span class="ds">${esc(v.ds)}</span><span class="meta">${v.words.length} 字 · 已熟悉 ${k}</span><span class="bar"><i style="width:${Math.round(k/v.words.length*100)}%"></i></span></a>`;
  }).join('');
  return `<div class="wrap"><div class="hero"><h1>Business Listening Lab</h1><p>商務英文聽力與單字練習。聽對話與文章，再用單字量練習補強字彙，手機與電腦都能使用。</p>${warn}</div><h2 class="sec">聽力練習</h2><div class="grid">${cards}</div><h2 class="sec">英文單字量</h2><div class="grid">${vcards}</div></div>`;
}
function topicView(t){
  const rows=t.lessons.map((raw,i)=>{
    const l=parseLesson(raw),k=t.id+'-'+i;
    return `<a class="row" href="#lesson-${t.id}-${i}"><span class="n">${i+1}</span><span class="tx"><span class="t">${esc(l.t)}</span><br><span class="z">${esc(l.z)}</span></span><span class="tag ${done[k]?'ok':''}">${done[k]?'已聽':(l.ty==='dialogue'?'對話':'文章')+' · '+l._mins+' 分'}</span></a>`;
  }).join('');
  const soon=(t.more?t.more.split('\n'):[]).map((s,j)=>{
    const [e,z]=s.split('|');
    return `<div class="row soon"><span class="n">${t.lessons.length+j+1}</span><span class="tx"><span class="t">${esc(e)}</span><br><span class="z">${esc(z)}</span></span><span class="tag soon">即將推出</span></div>`;
  }).join('');
  return `<div class="wrap"><header class="top"><a class="back" href="#">‹ 主題</a><span class="crumb">${esc(t.en)}</span></header><div class="thead"><h1>${esc(t.en)}</h1><div class="zh">${esc(t.zh)}</div><p>${esc(t.ds)} 共 ${totalCount(t)} 篇。點選即可收聽，內容會持續新增。</p></div><div class="list">${rows}${soon}</div></div>`;
}
function lessonView(t,i){
  const l=parseLesson(t.lessons[i]);
  const lines=l._lines.map((x,j)=>{
    const sp=l._speakers.indexOf(x[0]);
    return `<button class="line sp${sp%3}" data-i="${j}" type="button">${x[0]?`<span class="who">${esc(x[0])}</span>`:''}<span class="en">${esc(x[1])}</span>${l.tr&&l.tr[j]?`<span class="zhl">${esc(l.tr[j])}</span>`:''}</button>`;
  }).join('');
  const vocab=l.v.map(p=>`<li><b>${esc(p[0])}</b><span>${esc(p[1])}</span></li>`).join('');
  const gram=l.g.map(p=>`<li><em>${esc(p[0])}</em><span>${esc(p[1])}</span></li>`).join('');
  return `<div class="wrap has-player"><header class="top"><a class="back" href="#topic-${t.id}">‹ 列表</a><span class="crumb">${esc(t.en)}</span></header>
  <div class="lhead"><h1>${esc(l.t)}</h1><div class="zh">${esc(l.z)}</div>
  <div class="chips"><span class="tag">${l.ty==='dialogue'?'對話':'文章'}</span><span class="tag">${l.lv}</span><span class="tag">約 ${l._mins} 分鐘</span><span class="tag">${l._words} 字</span></div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="text" aria-selected="true">英文內容</button><button class="tab" role="tab" data-tab="notes" aria-selected="false">中文備註</button></div>
  <div id="pane-text"><div class="chips"><button class="chip" id="trBtn" aria-pressed="${showTr}" type="button">中文翻譯：${showTr?'顯示':'隱藏'}</button><button class="chip" id="hideBtn" aria-pressed="false" type="button">聽力模式：隱藏英文</button></div>
  <details class="set"><summary>播放設定</summary><div class="sgrid">
   <label>語速<select id="rate"><option value="0.7">0.7x 慢</option><option value="0.8">0.8x</option><option value="0.9">0.9x 預設</option><option value="1">1.0x 正常</option><option value="1.15">1.15x 快</option></select></label>
   <label>女聲<select id="vf"></select></label>
   <label>男聲<select id="vm"></select></label></div></details>
  <div class="lines${showTr?'':' notr'}" id="lines">${lines}</div></div>
  <div id="pane-notes" hidden><div class="panel">
   <div class="box"><h3>內容摘要</h3><p>${esc(l.s)}</p></div>
   <div class="box"><h3>重點單字與片語</h3><ul class="vl">${vocab}</ul></div>
   <div class="box"><h3>文法與句型</h3><ul class="gl">${gram}</ul></div></div></div></div>
  <div class="player"><div class="pin"><button class="pbtn" id="prev" aria-label="上一句" type="button">⏮</button><button class="pbtn main" id="play" aria-label="播放" type="button">▶</button><button class="pbtn" id="next" aria-label="下一句" type="button">⏭</button><span class="pcnt" id="cnt">1 / ${l._lines.length}</span></div><div class="prog"><i id="prog"></i></div></div>`;
}


/* ---------- vocabulary ---------- */
let vknown=store.get('bll-known',{});
let VV=null,vq='',vc='',vhide=false,vlimit=40,vlist=[];
function vocabById(id){return VOCAB.find(v=>v.id===id);}
function vocabFilter(){
  const q=vq.trim().toLowerCase();const kn=vknown[VV.id]||{};
  vlist=VV.words.filter(w=>(!vc||w.c===vc)&&(!vhide||!kn[w.w])&&(!q||w.w.toLowerCase().includes(q)||w.z.includes(q)));
}
const ICON='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
function vocabItems(){
  const kn=vknown[VV.id]||{};
  const items=vlist.slice(0,vlimit).map(w=>{
    const ex=w.ex.map(e=>`<div class="vex"><button class="spk sm" type="button" data-say="${esc(e[0])}" aria-label="朗讀例句">${ICON}</button><div><div class="vee">${esc(e[0])}</div><div class="vez">${esc(e[1])}</div></div></div>`).join('');
    return `<div class="vw"><div class="vh"><button class="spk" type="button" data-say="${esc(w.w)}" aria-label="發音 ${esc(w.w)}">${ICON}</button><div class="vt"><div><span class="vword">${esc(w.w)}</span> <span class="vp">${esc(w.p)}</span></div><div class="vzh">${esc(w.z)}</div></div><button class="chip knw${kn[w.w]?' on':''}" type="button" data-k="${esc(w.w)}" aria-pressed="${!!kn[w.w]}">${kn[w.w]?'已熟悉':'標記熟悉'}</button></div>${ex}</div>`;
  }).join('');
  const more=vlist.length>vlimit?`<button class="chip vmore" id="vmore" type="button">顯示更多（還有 ${vlist.length-vlimit} 字）</button>`:'';
  return (items||'<div class="box">沒有符合的單字。</div>')+more;
}
function vocabCount(){const el=document.getElementById('vcount');if(el)el.textContent='顯示 '+Math.min(vlimit,vlist.length)+' / '+vlist.length+' 字';}
function vocabRender(){vocabFilter();document.getElementById('vlist').innerHTML=vocabItems();vocabCount();}
function vocabView(v){
  const cats=['']. concat(v.cats).map(c=>`<button class="chip${c===vc?' on':''}" type="button" data-cat="${esc(c)}">${c?esc(c):'全部'}</button>`).join('');
  return `<div class="wrap"><header class="top"><a class="back" href="#">‹ 首頁</a><span class="crumb">${esc(v.en)}</span></header><div class="thead"><h1>${esc(v.en)}</h1><div class="zh">${esc(v.zh)}</div><p>共 ${v.words.length} 字。按喇叭聽發音，每個單字附例句。</p></div>
  <div class="vtools"><input id="vq" class="vsearch" type="search" placeholder="搜尋英文或中文" autocomplete="off"><div class="chips" id="vcats">${cats}</div><div class="chips"><button class="chip" id="vhide" type="button" aria-pressed="false">隱藏已熟悉的字</button><span class="vcnt" id="vcount"></span></div></div>
  <div class="vlist" id="vlist"></div></div>`;
}
function say(text){
  if(!synth)return;
  stop();
  const u=new SpeechSynthesisUtterance(spoken(text));
  const pv=pickVoice('Sarah',0);
  if(pv.v){u.voice=pv.v;u.lang=pv.v.lang;}else u.lang='en-US';
  u.rate=Math.min(prefs.rate,0.95);u.pitch=pv.pitch;
  setTimeout(()=>synth.speak(u),40);
}

/* ---------- speech ---------- */
function fillVoiceSelects(){
  ['vf','vm'].forEach((id,n)=>{
    const el=document.getElementById(id);if(!el)return;
    el.innerHTML='<option value="">自動</option>'+voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})${vg(v)==='f'?' 女':vg(v)==='m'?' 男':''}</option>`).join('');
    el.value=prefs[id];
  });
  const r=document.getElementById('rate');if(r)r.value=String(prefs.rate);
}
const FEM=new Set(['Sarah','Anna','Priya','Sara','Nina','Karen','Julia','Lina','Emma','Grace','Mei','Alice','Diana','Linda','Laura','Maria','Hannah','Elena','Olivia','Paula','Sophie','Rachel','Emily','Lisa','Rina','Operator','Helen','Wendy','Susan','Rita','Mia','Dana']);
function nameGender(n){return (!n||FEM.has(n))?'f':'m';}
function vg(v){const n=v.name;if(/\bfemale\b|samantha|victoria|karen|moira|tessa|fiona|allison|ava\b|susan|zira|jenny|aria|sonia|libby|hazel|emma|michelle|natasha|google us english|kathy|serena|amy|joanna|kimberly|salli|ivy|nicole|catherine|zoe|heera|eva|linda|catherine/i.test(n))return 'f';if(/\bmale\b|daniel|alex\b|fred|tom\b|aaron|david|mark\b|guy\b|ryan|james|george|rishi|ethan|oliver|arthur|reed|eddy|brian|matthew|joey|justin|liam|ravi|sean/i.test(n))return 'm';return '';}
function pickVoice(name,rank){
  const g=nameGender(name);
  const pref=g==='f'?prefs.vf:prefs.vm;
  const exact=voices.find(x=>x.voiceURI===pref);
  const pool=voices.filter(x=>vg(x)===g);
  let v=null,matched=false;
  if(exact){v=exact;matched=true;}
  else if(pool.length){v=pool[Math.min(rank,pool.length-1)];matched=true;}
  else if(voices.length){v=voices.find(x=>!vg(x))||voices[0];}
  const reused=rank>0&&!exact&&pool.length<=rank;
  let pitch=1;
  if(!matched||!vg(v||{name:''})){pitch=g==='f'?1.3:0.75;}
  if(reused||(!matched&&rank>0))pitch+=g==='f'?-0.15:0.2;
  return {v,pitch};
}
function speak(i){
  if(!synth||!L)return;
  synth.cancel();
  const tk=++token;cur=i;playing=true;ui(true);
  const line=L._lines[i];
  const u=new SpeechSynthesisUtterance(spoken(line[1]));
  const rank=L._speakers.slice(0,L._speakers.indexOf(line[0])).filter(n=>nameGender(n)===nameGender(line[0])).length;
  const pv=pickVoice(line[0],rank);
  if(pv.v){u.voice=pv.v;u.lang=pv.v.lang;}else u.lang='en-US';
  u.rate=prefs.rate;
  u.pitch=pv.pitch;
  u.onend=()=>{
    if(tk!==token)return;
    if(i+1<L._lines.length){setTimeout(()=>{if(tk===token)speak(i+1);},350);}
    else{playing=false;done[LK]=1;store.set('bll-done',done);ui(false);}
  };
  u.onerror=()=>{if(tk===token){playing=false;ui(false);}};
  setTimeout(()=>{if(tk===token)synth.speak(u);},60);
}
function stop(){token++;playing=false;if(synth)synth.cancel();}
function ui(scroll){
  const nodes=document.querySelectorAll('.line');
  nodes.forEach((n,j)=>n.classList.toggle('active',j===cur&&(playing||cur>0)));
  const p=document.getElementById('play');if(p){p.textContent=playing?'⏸':'▶';p.setAttribute('aria-label',playing?'暫停':'播放');}
  const c=document.getElementById('cnt');if(c&&L)c.textContent=(cur+1)+' / '+L._lines.length;
  const g=document.getElementById('prog');if(g&&L)g.style.width=Math.round((cur+1)/L._lines.length*100)+'%';
  if(scroll&&nodes[cur])nodes[cur].scrollIntoView({block:'center',behavior:'smooth'});
}

/* ---------- routing ---------- */
function route(){
  stop();L=null;VV=null;
  const h=location.hash.slice(1);let m;
  if((m=h.match(/^vocab-([a-z]+)$/))&&vocabById(m[1])){
    VV=vocabById(m[1]);vq='';vc='';vhide=false;vlimit=40;app.innerHTML=vocabView(VV);vocabRender();
  }else if((m=h.match(/^lesson-([a-z]+)-(\d+)$/))&&topicById(m[1])&&topicById(m[1]).lessons[+m[2]]){
    const t=topicById(m[1]);L=parseLesson(t.lessons[+m[2]]);LK=m[1]+'-'+m[2];cur=0;hide=false;tab='text';
    app.innerHTML=lessonView(t,+m[2]);fillVoiceSelects();ui(false);
  }else if((m=h.match(/^topic-([a-z]+)$/))&&topicById(m[1])){
    app.innerHTML=topicView(topicById(m[1]));
  }else{app.innerHTML=home();}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(VV){
    if(t.dataset.say){say(t.dataset.say);}
    else if(t.dataset.k){const kn=vknown[VV.id]=vknown[VV.id]||{};if(kn[t.dataset.k])delete kn[t.dataset.k];else kn[t.dataset.k]=1;store.set('bll-known',vknown);vocabRender();}
    else if(t.id==='vmore'){vlimit+=60;vocabRender();}
    else if(t.id==='vhide'){vhide=!vhide;t.setAttribute('aria-pressed',vhide);t.classList.toggle('on',vhide);vlimit=40;vocabRender();}
    else if(t.dataset.cat!==undefined){vc=t.dataset.cat;vlimit=40;document.querySelectorAll('#vcats .chip').forEach(b=>b.classList.toggle('on',b.dataset.cat===vc));vocabRender();}
    return;
  }
  if(!L)return;
  if(t.classList.contains('line')){speak(+t.dataset.i);return;}
  if(t.id==='play'){if(playing){stop();ui(false);}else speak(cur);}
  else if(t.id==='prev'){const was=playing;const n=Math.max(0,cur-1);if(was)speak(n);else{cur=n;ui(true);}}
  else if(t.id==='next'){const was=playing;const n=Math.min(L._lines.length-1,cur+1);if(was)speak(n);else{cur=n;ui(true);}}
  else if(t.id==='trBtn'){showTr=!showTr;store.set('bll-tr',showTr);t.setAttribute('aria-pressed',showTr);t.textContent='中文翻譯：'+(showTr?'顯示':'隱藏');document.getElementById('lines').classList.toggle('notr',!showTr);}
  else if(t.id==='hideBtn'){hide=!hide;t.setAttribute('aria-pressed',hide);t.textContent=hide?'聽力模式：已隱藏（再按顯示）':'聽力模式：隱藏英文';document.getElementById('lines').classList.toggle('hide',hide);}
  else if(t.dataset.tab){
    tab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
    document.getElementById('pane-text').hidden=tab!=='text';
    document.getElementById('pane-notes').hidden=tab!=='notes';
  }
});
app.addEventListener('input',e=>{if(VV&&e.target.id==='vq'){vq=e.target.value;vlimit=40;vocabRender();}});
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='rate'){prefs.rate=parseFloat(el.value);}
  else if(el.id==='vf'||el.id==='vm'){prefs[el.id]=el.value;}
  else return;
  store.set('bll-prefs',prefs);
  if(playing)speak(cur);
});
window.addEventListener('pagehide',stop);
route();
})();
</script>

</body>
</html>
