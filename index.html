["My notice period is one month, so I can start in December.","我的離職預告期是一個月，所以十二月就可以開始上班。"],["What is the notice period in your current contract?","你目前合約中的離職預告期是多久？"]]},{"w":"relocate","p":"v.","z":"搬遷、調職到外地","c":"履歷與資歷","ex":[["I am willing to relocate to Kaohsiung if the company needs me there.","如果公司需要我到高雄，我願意搬遷過去。"],["Would you be open to relocating abroad for this position?","你願意為了這個職位搬到國外嗎？"]]},{"w":"reputable","p":"adj.","z":"信譽良好的、有名望的","c":"履歷與資歷","ex":[["I worked for a reputable firm known for its high standards.","我曾任職於一家以高標準聞名的信譽良好公司。"],["She studied at a reputable university and earned top grades.","她就讀於一所聲譽良好的大學並取得頂尖成績。"]]},{"w":"well-rounded","p":"adj.","z":"全面發展的","c":"履歷與資歷","ex":[["I consider myself a well-rounded person with both technical and people skills.","我認為自己是兼具技術與人際能力、全面發展的人。"],["We want a well-rounded candidate who can handle many tasks.","我們想要能處理多種任務、全面發展的人選。"]]},{"w":"entry-level","p":"adj.","z":"入門級的","c":"履歷與資歷","ex":[["I am applying for an entry-level position to start my career.","我正在應徵入門級職位以開啟我的職涯。"],["The entry-level salary here is competitive compared with similar firms.","與同類公司相比，這裡的入門級薪資很有競爭力。"]]},{"w":"seasoned","p":"adj.","z":"經驗豐富的","c":"履歷與資歷","ex":[["We are looking for a seasoned manager with strong people skills.","我們在找人際能力強、經驗豐富的經理。"],["As a seasoned professional, I have handled many difficult clients.","身為經驗豐富的專業人士，我處理過許多難纏的客戶。"]]},{"w":"fresh graduate","p":"n.","z":"應屆畢業生","c":"履歷與資歷","ex":[["I am a fresh graduate, but I have completed two internships.","我是應屆畢業生，但已完成兩次實習。"],["Do you accept applications from fresh graduates with no experience?","你們接受沒有經驗的應屆畢業生申請嗎？"]]},{"w":"on-the-job training","p":"n.","z":"在職訓練","c":"履歷與資歷","ex":[["The company offers on-the-job training for all new hires.","公司為所有新進員工提供在職訓練。"],["I learned most of my skills through on-the-job training.","我大部分的技能是透過在職訓練學到的。"]]},{"w":"cross-functional","p":"adj.","z":"跨部門的","c":"履歷與資歷","ex":[["I led a cross-functional team made up of sales and engineering staff.","我領導了一個由業務與工程人員組成的跨部門團隊。"],["Cross-functional projects taught me how to communicate with different departments.","跨部門專案教會我如何與不同部門溝通。"]]},{"w":"volunteer work","p":"n.","z":"志工工作","c":"履歷與資歷","ex":[["My volunteer work at a local charity taught me patience and empathy.","我在當地慈善機構的志工工作讓我學到耐心與同理心。"],["I included my volunteer work on my resume because it shows leadership.","我把志工工作列在履歷上，因為它展現了領導力。"]]},{"w":"extracurricular","p":"adj.","z":"課外的","c":"履歷與資歷","ex":[["My extracurricular activities included debate club and a student radio show.","我的課外活動包括辯論社和學生廣播節目。"],["Do you have any extracurricular activities that relate to this job?","你有任何與這份工作相關的課外活動嗎？"]]},{"w":"career goal","p":"n.","z":"職涯目標","c":"履歷與資歷","ex":[["My career goal is to become a product manager within five years.","我的職涯目標是在五年內成為產品經理。"],["This position fits well with my long-term career goal.","這個職位與我的長期職涯目標非常契合。"]]},{"w":"stakeholder","p":"n.","z":"利害關係人","c":"履歷與資歷","ex":[["I regularly reported progress to senior stakeholders during the project.","我在專案期間定期向高階利害關係人報告進度。"],["How do you manage expectations when stakeholders disagree with each other?","當利害關係人彼此意見不合時，你如何管理期待？"]]},{"w":"mentor","p":"v.","z":"指導、輔導（新人）","c":"履歷與資歷","ex":[["I mentored three junior colleagues and helped them reach their goals.","我輔導了三位資淺同事，並協助他們達成目標。"],["I would be happy to mentor new team members if needed.","如有需要，我很樂意輔導新進的團隊成員。"]]},{"w":"hands-on","p":"adj.","z":"親自動手的、實作的","c":"履歷與資歷","ex":[["I prefer a hands-on approach when learning new software.","我學習新軟體時偏好親自動手操作。"],["The job is hands-on, so you will work directly with customers.","這份工作需要親自動手，你會直接與客戶接觸。"]]},{"w":"applicant","p":"n.","z":"求職者、申請人","c":"履歷與資歷","ex":[["Every applicant must submit a resume and a short cover letter online.","每位求職者都必須在線上提交履歷和一封簡短的求職信。"],["The company received over two hundred applicants for the marketing position.","公司為這個行銷職缺收到了兩百多位求職者的申請。"]]},{"w":"recruiter","p":"n.","z":"招募人員","c":"履歷與資歷","ex":[["A recruiter called me to schedule a phone screening on Monday.","一位招募人員打電話給我，安排星期一的電話初篩。"],["The recruiter explained the hiring process step by step.","招募人員一步一步說明了應徵流程。"]]},{"w":"headhunter","p":"n.","z":"獵人頭顧問","c":"履歷與資歷","ex":[["A headhunter contacted him about a senior role at a rival firm.","一位獵人頭顧問就一家競爭對手公司的高階職位聯絡了他。"],["Many executives find new jobs through a trusted headhunter.","許多高階主管透過值得信賴的獵人頭顧問找到新工作。"]]},{"w":"referral","p":"n.","z":"內部推薦","c":"履歷與資歷","ex":[["I got this interview through a referral from my former manager.","我是透過前主管的內部推薦才獲得這次面試的。"],["The company pays a bonus for every successful employee referral.","公司對每一次成功的員工推薦都會發放獎金。"]]},{"w":"networking","p":"n.","z":"人脈經營","c":"履歷與資歷","ex":[["Networking at industry events helped me find my first full-time job.","在產業活動中經營人脈幫助我找到了第一份全職工作。"],["Good networking often matters as much as a strong resume.","良好的人脈經營往往和出色的履歷一樣重要。"]]},{"w":"apply for","p":"phr.","z":"應徵、申請","c":"履歷與資歷","ex":[["I would like to apply for the position of project coordinator.","我想應徵專案協調員這個職位。"],["You can apply for this job through our company website.","你可以透過我們公司的網站應徵這份工作。"]]},{"w":"keyword","p":"n.","z":"關鍵字","c":"履歷與資歷","ex":[["Use keywords from the job description so software can find your resume.","使用職缺說明中的關鍵字，讓系統能找到你的履歷。"],["Recruiters often search resumes by keyword to save time.","招募人員常用關鍵字搜尋履歷以節省時間。"]]},{"w":"proofread","p":"v.","z":"校對","c":"履歷與資歷","ex":[["Always proofread your resume before you send it to an employer.","寄給雇主之前，一定要校對你的履歷。"],["My friend offered to proofread my cover letter for spelling mistakes.","我朋友主動幫我校對求職信中的拼字錯誤。"]]},{"w":"tailor","p":"v.","z":"量身調整","c":"履歷與資歷","ex":[["You should tailor your resume to each job you apply for.","你應該針對每一份應徵的工作量身調整履歷。"],["She tailored her answers to match the company's values.","她調整自己的回答，使其符合公司的價值觀。"]]},{"w":"chronological","p":"adj.","z":"按時間順序的","c":"履歷與資歷","ex":[["A chronological resume lists your most recent job first.","按時間順序排列的履歷會把你最近的工作放在最前面。"],["He used a chronological format to show steady career growth.","他使用時間順序的格式來展現穩定的職涯成長。"]]},{"w":"objective","p":"n.","z":"求職目標","c":"履歷與資歷","ex":[["Her resume objective was clear and focused on data analysis.","她的履歷求職目標清楚，並專注於資料分析。"],["Write a short objective that matches the job you want.","寫一段符合你想要職位的簡短求職目標。"]]},{"w":"summary","p":"n.","z":"摘要、簡介","c":"履歷與資歷","ex":[["Put a short summary at the top of your resume.","在履歷最上方放一段簡短的摘要。"],["The summary highlighted her ten years of experience in sales.","這段摘要突顯了她十年的業務經驗。"]]},{"w":"alma mater","p":"n.","z":"母校","c":"履歷與資歷","ex":[["He returned to his alma mater to speak at a career fair.","他回到母校，在就業博覽會上演講。"],["Employers sometimes ask about your alma mater and your major.","雇主有時會詢問你的母校和主修科系。"]]},{"w":"undergraduate","p":"n.","z":"大學部學生","c":"履歷與資歷","ex":[["As an undergraduate, I worked part-time at a bookstore.","我還是大學部學生時，在書店兼職。"],["She completed her undergraduate degree in business administration.","她完成了企業管理的大學學位。"]]},{"w":"postgraduate","p":"adj.","z":"研究所的","c":"履歷與資歷","ex":[["He holds a postgraduate degree in electrical engineering.","他擁有電機工程的研究所學位。"],["Postgraduate students often apply for research assistant roles.","研究所學生常常應徵研究助理的職位。"]]},{"w":"apprenticeship","p":"n.","z":"學徒制、見習期","c":"履歷與資歷","ex":[["She completed a two-year apprenticeship at a local hotel.","她在當地一間飯店完成了兩年的學徒訓練。"],["An apprenticeship gives you real skills while you earn money.","學徒制讓你在賺錢的同時學到實用技能。"]]},{"w":"freelancer","p":"n.","z":"自由工作者","c":"履歷與資歷","ex":[["As a freelancer, I managed my own clients and deadlines.","身為自由工作者，我自己管理客戶和截止日期。"],["The company often hires a freelancer for short design projects.","公司經常為短期設計案聘請自由工作者。"]]},{"w":"sabbatical","p":"n.","z":"進修長假","c":"履歷與資歷","ex":[["He took a one-year sabbatical to study abroad.","他請了一年的進修長假去國外讀書。"],["My sabbatical explains the gap on my resume.","我的長假說明了履歷上的空白期。"]]},{"w":"career change","p":"phr.","z":"轉換職涯","c":"履歷與資歷","ex":[["I am making a career change from teaching to human resources.","我正從教職轉換跑道到人力資源。"],["A career change at forty can feel scary but rewarding.","四十歲轉換職涯可能令人害怕，但也很有收穫。"]]},{"w":"job hopping","p":"phr.","z":"頻繁跳槽","c":"履歷與資歷","ex":[["Employers may worry about job hopping when they see short stays.","雇主看到短暫任期時，可能會擔心頻繁跳槽。"],["I explained that my job hopping was due to company layoffs.","我解釋了我頻繁換工作是因為公司裁員。"]]},{"w":"endorsement","p":"n.","z":"背書、推薦","c":"履歷與資歷","ex":[["A strong endorsement from my professor helped me get the job.","教授有力的推薦幫助我獲得了這份工作。"],["Employers value an endorsement from a respected industry leader.","雇主重視業界受人敬重的領袖所做的背書。"]]},{"w":"accreditation","p":"n.","z":"認證、立案資格","c":"履歷與資歷","ex":[["The program has full accreditation from a national board.","這個課程獲得了國家級委員會的完整認證。"],["Nurses need proper accreditation before they can practice here.","護理師必須取得適當的認證才能在這裡執業。"]]},{"w":"licensed","p":"adj.","z":"有執照的","c":"履歷與資歷","ex":[["She is a licensed accountant with eight years of experience.","她是一位有執照的會計師，擁有八年經驗。"],["Only licensed engineers may sign off on these drawings.","只有有執照的工程師才能在這些圖面上簽核。"]]},{"w":"fluency","p":"n.","z":"流利程度","c":"履歷與資歷","ex":[["Fluency in English and Japanese is required for this role.","這個職位要求英語和日語流利。"],["Her fluency in English impressed the interview panel.","她流利的英語讓面試小組印象深刻。"]]},{"w":"mother tongue","p":"n.","z":"母語","c":"履歷與資歷","ex":[["My mother tongue is Mandarin, but I speak English at work.","我的母語是華語，但我在工作中使用英語。"],["Please list your mother tongue and any other languages you speak.","請列出你的母語以及你會說的其他語言。"]]},{"w":"proven","p":"adj.","z":"經證實的","c":"履歷與資歷","ex":[["He has a proven record of increasing sales every year.","他有每年提高銷售額的實績。"],["We are looking for someone with proven leadership skills and teamwork.","我們想要具備經證實的領導能力的人。"]]},{"w":"accomplished","p":"adj.","z":"有成就的、技藝精湛的","c":"履歷與資歷","ex":[["She is an accomplished designer with several international awards.","她是一位有成就的設計師，獲得過多項國際獎項。"],["An accomplished engineer led the new product team.","一位經驗豐富的工程師帶領新產品團隊。"]]},{"w":"reapply","p":"v.","z":"重新應徵","c":"履歷與資歷","ex":[["You may reapply after six months if you are not selected.","如果你沒被錄取，六個月後可以重新應徵。"],["I decided to reapply when a better position opened up.","當更好的職位開出來時，我決定重新應徵。"]]},{"w":"perfectionist","p":"n.","z":"完美主義者","c":"面試問答","ex":[["I used to be a perfectionist, but I have learned to prioritize.","我以前是完美主義者，但現在已學會排定優先順序。"],["Being a perfectionist can slow you down when deadlines are tight.","身為完美主義者，在期限很緊時可能會拖慢進度。"]]},{"w":"team player","p":"n.","z":"團隊合作者","c":"面試問答","ex":[["I consider myself a team player who values everyone's input.","我認為自己是重視每個人意見的團隊合作者。"],["Are you more of a team player or an independent worker?","你比較像團隊合作者，還是獨立作業型的人？"]]},{"w":"work ethic","p":"n.","z":"職業道德、工作態度","c":"面試問答","ex":[["My parents taught me a strong work ethic from an early age.","我的父母從小就教導我良好的工作態度。"],["Her work ethic impressed everyone in the department.","她的工作態度讓部門裡的每個人都印象深刻。"]]},{"w":"prioritize","p":"v.","z":"排定優先順序","c":"面試問答","ex":[["I prioritize tasks by urgency and impact on the project.","我依據緊急程度和對專案的影響來排定任務的優先順序。"],["How do you prioritize when everything seems urgent?","當每件事看起來都很緊急時，你如何排定優先順序？"]]},{"w":"meet a deadline","p":"phr.","z":"如期完成、趕上期限","c":"面試問答","ex":[["I have never failed to meet a deadline in my previous role.","我在前一份工作中從未錯過任何期限。"],["We had to work overtime to meet a deadline last quarter.","上一季我們得加班才能如期完成。"]]},{"w":"work under pressure","p":"phr.","z":"在壓力下工作","c":"面試問答","ex":[["I can work under pressure without losing focus on quality.","我能在壓力下工作而不會忽略品質。"],["This job requires you to work under pressure during peak season.","這份工作要求你在旺季時能在壓力下工作。"]]},{"w":"behavioral question","p":"n.","z":"行為面試題","c":"面試問答","ex":[["Behavioral questions usually start with tell me about a time when.","行為面試題通常以請告訴我你何時曾經開頭。"],["I practiced answering behavioral questions with a friend last night.","我昨晚和朋友一起練習回答行為面試題。"]]},{"w":"STAR method","p":"n.","z":"STAR 回答法（情境、任務、行動、結果）","c":"面試問答","ex":[["I used the STAR method to structure my answer clearly.","我用 STAR 回答法讓答案條理清楚。"],["The STAR method helps you tell a concise story with a clear result.","STAR 回答法能幫助你說出結果明確的簡潔故事。"]]},{"w":"situation","p":"n.","z":"情境、處境","c":"面試問答","ex":[["Let me describe the situation I faced at my previous company.","讓我描述一下我在前公司面對的情境。"],["In that situation, I decided to talk to the client directly.","在那種情況下，我決定直接與客戶談。"]]},{"w":"take initiative","p":"phr.","z":"主動採取行動","c":"面試問答","ex":[["I took initiative and created a new filing system for the team.","我主動為團隊建立了一套新的歸檔系統。"],["Managers value employees who take initiative without being asked.","主管重視不需被要求就主動做事的員工。"]]},{"w":"go above and beyond","p":"phr.","z":"付出超乎要求的努力","c":"面試問答","ex":[["I always try to go above and beyond for our customers.","我總是努力為客戶付出超乎要求的心力。"],["She went above and beyond to finish the project on time.","她付出額外努力，讓專案準時完成。"]]},{"w":"achieve","p":"v.","z":"達成、實現","c":"面試問答","ex":[["We achieved our sales target two months ahead of schedule.","我們提前兩個月達成了銷售目標。"],["What goals did you achieve in your first year?","你第一年達成了哪些目標？"]]},{"w":"exceed expectations","p":"phr.","z":"超出預期","c":"面試問答","ex":[["My team exceeded expectations by delivering the app early.","我的團隊提前交付應用程式，超出了預期。"],["I was rated as someone who exceeds expectations in my annual review.","我在年度考核中被評為超出預期。"]]},{"w":"hit the target","p":"phr.","z":"達成目標","c":"面試問答","ex":[["We hit the target every month during my time as sales lead.","我擔任業務主管期間，每個月都達成目標。"],["How did you hit the target when resources were limited?","在資源有限的情況下，你是如何達成目標的？"]]},{"w":"increase by","p":"phr.","z":"增加了（多少）","c":"面試問答","ex":[["Customer satisfaction increased by 25 percent under my management.","在我的管理下，顧客滿意度增加了百分之二十五。"],["Website traffic increased by 40 percent after our redesign.","網站改版後，流量增加了百分之四十。"]]},{"w":"reduce costs","p":"phr.","z":"降低成本","c":"面試問答","ex":[["I reduced costs by renegotiating contracts with our suppliers.","我透過重新與供應商談判合約來降低成本。"],["Our goal this year is to reduce costs without cutting quality.","我們今年的目標是在不犧牲品質的前提下降低成本。"]]},{"w":"lead a team","p":"phr.","z":"帶領團隊","c":"面試問答","ex":[["I led a team of eight engineers on the mobile project.","我在行動專案中帶領一個八人的工程師團隊。"],["Have you ever led a team through a difficult transition?","你是否曾帶領團隊度過困難的轉型期？"]]},{"w":"delegate","p":"v.","z":"授權、委派","c":"面試問答","ex":[["I learned to delegate tasks so that I could focus on strategy.","我學會委派任務，這樣才能專注在策略上。"],["Good managers know when to delegate and when to step in.","好的主管知道何時該授權、何時該介入。"]]},{"w":"take ownership","p":"phr.","z":"負起責任、當作自己的事","c":"面試問答","ex":[["I took ownership of the problem and fixed it by the next morning.","我把問題當作自己的責任，隔天早上就修好了。"],["We want people who take ownership of their projects.","我們想要對自己的專案負起責任的人。"]]},{"w":"accountable","p":"adj.","z":"負有責任的","c":"面試問答","ex":[["I hold myself accountable for the results of my work.","我對自己工作的成果負責。"],["Who was accountable for the final decision on that project?","那個專案的最終決定由誰負責？"]]},{"w":"challenge","p":"n.","z":"挑戰、難題","c":"面試問答","ex":[["The biggest challenge was working with a very small budget.","最大的挑戰是只有非常少的預算。"],["Tell me about a challenge you overcame at work.","請告訴我一個你在工作上克服的挑戰。"]]},{"w":"overcome","p":"v.","z":"克服","c":"面試問答","ex":[["I overcame my fear of public speaking by joining a speaking club.","我加入演講社團，克服了對公開演講的恐懼。"],["How did you overcome the language barrier with your overseas clients?","你如何克服與海外客戶之間的語言障礙？"]]},{"w":"obstacle","p":"n.","z":"障礙、阻礙","c":"面試問答","ex":[["The main obstacle was a lack of support from other departments.","主要的障礙是其他部門缺乏支援。"],["We found a way around every obstacle and finished on time.","我們為每個障礙找到解決辦法，並準時完成。"]]},{"w":"root cause","p":"n.","z":"根本原因","c":"面試問答","ex":[["We spent a week finding the root cause of the system crashes.","我們花了一週找出系統當機的根本原因。"],["Fixing the symptoms is not enough; you must address the root cause.","只處理症狀是不夠的，你必須解決根本原因。"]]},{"w":"troubleshoot","p":"v.","z":"排除故障、找出問題","c":"面試問答","ex":[["I can troubleshoot most network issues without calling IT.","大部分網路問題我都能自己排除，不必找資訊部門。"],["She was asked to troubleshoot the production delay.","她被要求找出生產延誤的問題。"]]},{"w":"come up with","p":"phr.","z":"想出、提出","c":"面試問答","ex":[["I came up with a simple solution that saved the client money.","我想出一個簡單的解決辦法，替客戶省了錢。"],["Can you come up with three ways to improve our service?","你能想出三個改善我們服務的方法嗎？"]]},{"w":"think outside the box","p":"phr.","z":"跳脫框架思考","c":"面試問答","ex":[["When budgets are tight, you have to think outside the box.","預算吃緊時，你必須跳脫框架思考。"],["I like to think outside the box when solving design problems.","我喜歡在解決設計問題時跳脫框架思考。"]]},{"w":"resourceful","p":"adj.","z":"足智多謀的、善用資源的","c":"面試問答","ex":[["I am resourceful and can find answers even without clear instructions.","我很善於運用資源，即使沒有明確指示也能找到答案。"],["A resourceful employee finds solutions instead of making excuses.","足智多謀的員工會找辦法而不是找藉口。"]]},{"w":"conflict resolution","p":"n.","z":"衝突化解","c":"面試問答","ex":[["I took a course in conflict resolution to improve my communication.","我修了衝突化解的課程來改善我的溝通。"],["Good conflict resolution skills keep a team working well together.","良好的衝突化解能力能讓團隊合作順暢。"]]},{"w":"disagreement","p":"n.","z":"意見不合、分歧","c":"面試問答","ex":[["We had a disagreement about the schedule, but we reached a compromise.","我們對時程有意見分歧，但最後達成妥協。"],["How do you handle a disagreement with your supervisor?","你如何處理與主管的意見不合？"]]},{"w":"compromise","p":"n.","z":"妥協、折衷","c":"面試問答","ex":[["We found a compromise that satisfied both departments.","我們找到一個讓兩個部門都滿意的折衷方案。"],["Sometimes the best solution is a compromise.","有時最好的解決方式就是妥協。"]]},{"w":"difficult coworker","p":"phr.","z":"難相處的同事","c":"面試問答","ex":[["I once worked with a difficult coworker who rarely shared information.","我曾和一位很難相處、很少分享資訊的同事共事。"],["How would you deal with a difficult coworker?","你會如何應付難相處的同事？"]]},{"w":"constructive feedback","p":"phr.","z":"建設性的回饋","c":"面試問答","ex":[["I welcome constructive feedback because it helps me grow.","我歡迎建設性的回饋，因為它幫助我成長。"],["My manager gave me constructive feedback after every presentation.","我的主管在每次簡報後都給我建設性的回饋。"]]},{"w":"learn from","p":"phr.","z":"從中學習","c":"面試問答","ex":[["I learned from that mistake and now double-check every figure.","我從那次錯誤中學到教訓，現在每個數字都會再確認。"],["What did you learn from your most difficult project?","你從最困難的專案中學到了什麼？"]]},{"w":"mistake","p":"n.","z":"錯誤、失誤","c":"面試問答","ex":[["I made a mistake in the budget, but I reported it right away.","我在預算上犯了一個錯，但立刻回報了。"],["Tell me about a mistake you made and how you fixed it.","請告訴我你犯過的一個錯誤以及如何補救。"]]},{"w":"failure","p":"n.","z":"失敗","c":"面試問答","ex":[["That failure taught me the importance of testing before launch.","那次失敗讓我明白上線前測試的重要。"],["Can you describe a failure and what you did afterwards?","你能描述一次失敗以及之後你做了什麼嗎？"]]},{"w":"setback","p":"n.","z":"挫折、阻礙","c":"面試問答","ex":[["We faced a major setback when our key supplier closed.","主要供應商倒閉時，我們遭遇了重大挫折。"],["I treat every setback as a chance to improve.","我把每次挫折都當作改進的機會。"]]},{"w":"resilient","p":"adj.","z":"有韌性的、能迅速恢復的","c":"面試問答","ex":[["I am resilient, and I recover quickly from disappointment.","我很有韌性，能很快從失望中恢復。"],["The company needs resilient people to get through this difficult period.","公司需要有韌性的人度過這段艱困時期。"]]},{"w":"handle criticism","p":"phr.","z":"面對批評","c":"面試問答","ex":[["I try to handle criticism calmly and look for useful points.","我試著冷靜面對批評，並找出有用的部分。"],["How do you handle criticism from your manager?","你如何面對主管的批評？"]]},{"w":"tight deadline","p":"phr.","z":"緊迫的期限","c":"面試問答","ex":[["We delivered the report despite a tight deadline.","儘管期限很緊迫，我們還是交出了報告。"],["I work well with tight deadlines when I have a clear plan.","只要有清楚的計畫，我在期限緊迫時也能做得很好。"]]},{"w":"communicate effectively","p":"phr.","z":"有效溝通","c":"面試問答","ex":[["I communicate effectively with both technical and non-technical colleagues.","我能與技術與非技術的同事有效溝通。"],["Leaders must communicate effectively during times of change.","領導者在變動時期必須有效溝通。"]]},{"w":"interpersonal skills","p":"n.","z":"人際溝通技巧","c":"面試問答","ex":[["Strong interpersonal skills help me build trust with clients.","良好的人際溝通技巧幫助我與客戶建立信任。"],["This role requires excellent interpersonal skills and patience.","這個職位需要優秀的人際溝通技巧和耐心。"]]},{"w":"active listening","p":"n.","z":"積極傾聽","c":"面試問答","ex":[["Active listening helps me understand what customers really need.","積極傾聽幫助我了解客戶真正的需求。"],["I practice active listening by repeating key points back to people.","我透過重述重點給對方聽來練習積極傾聽。"]]},{"w":"build rapport","p":"phr.","z":"建立融洽關係","c":"面試問答","ex":[["I build rapport quickly by asking about people's interests.","我藉由詢問別人的興趣，很快就能建立融洽的關係。"],["It takes time to build rapport with new clients.","與新客戶建立融洽關係需要時間。"]]},{"w":"customer-focused","p":"adj.","z":"以客戶為重的","c":"面試問答","ex":[["I have always been customer-focused in every role I have held.","在我擔任過的每個職務中，我始終以客戶為重。"],["We want a customer-focused attitude from everyone on the team.","我們希望團隊每個人都有以客戶為重的態度。"]]},{"w":"go the extra mile","p":"phr.","z":"多付出一點心力","c":"面試問答","ex":[["I like to go the extra mile to make clients happy.","我喜歡多付出一點心力讓客戶開心。"],["He went the extra mile and stayed late to fix the error.","他多付出心力，留到很晚去修正錯誤。"]]},{"w":"key performance indicator","p":"n.","z":"關鍵績效指標（KPI）","c":"面試問答","ex":[["We measured success using three key performance indicators.","我們用三項關鍵績效指標來衡量成效。"],["Which key performance indicator did you improve the most?","你最大幅度改善的是哪一項關鍵績效指標？"]]},{"w":"measurable","p":"adj.","z":"可衡量的","c":"面試問答","ex":[["I set measurable goals so my progress is easy to track.","我設定可衡量的目標，讓進度容易追蹤。"],["The project produced measurable results within three months.","這個專案在三個月內就產生了可衡量的成果。"]]},{"w":"recognition","p":"n.","z":"表揚、肯定","c":"面試問答","ex":[["I received recognition for my work from the regional director.","我的工作受到區域總監的肯定。"],["What kind of recognition motivates you the most?","哪一種肯定最能激勵你？"]]},{"w":"award","p":"n.","z":"獎項","c":"面試問答","ex":[["I won the employee of the year award in 2023.","我在二零二三年獲得年度最佳員工獎。"],["Which award are you most proud of?","你最引以為傲的是哪一個獎項？"]]},{"w":"initiative","p":"n.","z":"主動性、新方案","c":"面試問答","ex":[["The recycling initiative I started reduced office waste by thirty percent.","我發起的回收方案讓辦公室廢棄物減少了百分之三十。"],["Our company values initiative and creative thinking.","我們公司重視主動性和創意思考。"]]},{"w":"proactive","p":"adj.","z":"積極主動的","c":"面試問答","ex":[["I am proactive about spotting problems before they grow.","我會積極主動地在問題擴大前發現它們。"],["We prefer a proactive approach rather than waiting for instructions.","我們偏好積極主動的做法，而不是等待指示。"]]},{"w":"long-term goal","p":"phr.","z":"長期目標","c":"面試問答","ex":[["My long-term goal is to become a senior marketing manager.","我的長期目標是成為資深行銷經理。"],["Does this position fit your long-term goal?","這個職位符合你的長期目標嗎？"]]},{"w":"professional development","p":"n.","z":"專業成長、進修","c":"面試問答","ex":[["I take online courses for professional development every year.","我每年都上線上課程來提升專業。"],["Does your company support professional development?","貴公司支持員工的專業成長嗎？"]]},{"w":"upskill","p":"v.","z":"提升技能","c":"面試問答","ex":[["I upskilled myself in data analysis during the pandemic.","疫情期間我提升了自己的數據分析技能。"],["The company encourages staff to upskill through paid training.","公司鼓勵員工透過付費訓練來提升技能。"]]},{"w":"proficient","p":"adj.","z":"精通的、熟練的","c":"面試問答","ex":[["I am proficient in Excel and several data visualization tools.","我精通 Excel 和幾種數據視覺化工具。"],["Are you proficient in any other languages besides English?","除了英文之外，你還精通其他語言嗎？"]]},{"w":"fluent","p":"adj.","z":"流利的","c":"面試問答","ex":[["I am fluent in English and Mandarin, and conversational in Japanese.","我的英文和中文很流利，日文則能日常對話。"],["Being fluent in English helped me work with overseas teams.","英文流利幫助我與海外團隊合作。"]]},{"w":"leverage","p":"v.","z":"運用、善用","c":"面試問答","ex":[["I leveraged my network to find new clients.","我運用人脈尋找新客戶。"],["How would you leverage your skills in this position?","你會如何在這個職位上運用你的技能？"]]},{"w":"add value","p":"phr.","z":"創造價值","c":"面試問答","ex":[["I always look for ways to add value to the business.","我總是尋找為公司創造價值的方法。"],["How will you add value to our team?","你會如何為我們的團隊創造價值？"]]},{"w":"fit in","p":"phr.","z":"融入、適合","c":"面試問答","ex":[["I think I would fit in well with your collaborative culture.","我認為我能很融入你們合作的文化。"],["How do you fit in when you join a new team?","你加入新團隊時如何融入？"]]},{"w":"learning curve","p":"n.","z":"學習曲線、上手難度","c":"面試問答","ex":[["There was a steep learning curve, but I mastered the system in a month.","學習曲線很陡，但我一個月就掌握了系統。"],["I am a quick learner, so the learning curve does not worry me.","我學得很快，所以不擔心上手的難度。"]]},{"w":"quick learner","p":"n.","z":"學習很快的人","c":"面試問答","ex":[["I am a quick learner and enjoy picking up new tools.","我學習很快，也喜歡學新工具。"],["We need a quick learner who can start contributing in the first week.","我們需要學得快、第一週就能開始貢獻的人。"]]},{"w":"step out of my comfort zone","p":"phr.","z":"走出舒適圈","c":"面試問答","ex":[["I stepped out of my comfort zone and volunteered to lead the pitch.","我走出舒適圈，自願負責簡報提案。"],["Tell us about a time you stepped out of your comfort zone.","請告訴我們你走出舒適圈的一次經驗。"]]},{"w":"constructively","p":"adv.","z":"建設性地","c":"面試問答","ex":[["I try to give feedback constructively rather than just point out flaws.","我試著建設性地給予回饋，而不只是指出缺點。"],["She handled the dispute constructively and kept the team together.","她以建設性的方式處理爭議，讓團隊維持團結。"]]},{"w":"under tight budget","p":"phr.","z":"在預算緊縮下","c":"面試問答","ex":[["We completed the renovation under tight budget by negotiating prices.","我們藉由議價，在預算緊縮下完成了整修。"],["Working under tight budget taught me to be creative.","在預算緊縮下工作教會我發揮創意。"]]},{"w":"turn around","p":"phr.","z":"扭轉（局面）、使好轉","c":"面試問答","ex":[["I helped turn around a struggling team within six months.","我在六個月內協助扭轉一個表現不佳的團隊。"],["The new manager managed to turn around the failing branch.","新經理成功讓業績不佳的分公司轉虧為盈。"]]},{"w":"outcome","p":"n.","z":"結果、成果","c":"面試問答","ex":[["The outcome was a ten percent rise in customer retention.","結果是客戶留存率上升了百分之十。"],["I focus on the outcome rather than just the process.","我專注在成果而不只是過程。"]]},{"w":"result in","p":"phr.","z":"導致、造成","c":"面試問答","ex":[["My new approach resulted in faster delivery times.","我的新方法使交貨時間變快。"],["Poor communication can result in costly mistakes.","溝通不良可能導致代價高昂的錯誤。"]]},{"w":"take the lead","p":"phr.","z":"帶頭、主導","c":"面試問答","ex":[["When the manager was away, I took the lead on the client meeting.","主管不在時，我主導了客戶會議。"],["I am happy to take the lead when the team needs direction.","當團隊需要方向時，我樂於帶頭。"]]},{"w":"manage expectations","p":"phr.","z":"管理期待","c":"面試問答","ex":[["I managed expectations by giving clients realistic timelines.","我提供客戶實際的時程來管理他們的期待。"],["It is important to manage expectations early in a project.","在專案初期管理期待很重要。"]]},{"w":"escalate","p":"v.","z":"向上呈報、升級處理","c":"面試問答","ex":[["I escalated the issue to my manager when I could not solve it.","我無法解決時，就把問題向主管呈報。"],["Serious complaints should be escalated to a senior supervisor.","嚴重的客訴應向資深主管呈報。"]]},{"w":"negotiate","p":"v.","z":"協商、談判","c":"面試問答","ex":[["I negotiated a better contract that saved the company money.","我談成一份更好的合約，為公司省下了錢。"],["Have you ever negotiated with a difficult supplier?","你曾和難纏的供應商談判過嗎？"]]},{"w":"persuade","p":"v.","z":"說服","c":"面試問答","ex":[["I persuaded my manager to try a new marketing channel.","我說服主管嘗試新的行銷管道。"],["How would you persuade a hesitant client to sign?","你會如何說服猶豫的客戶簽約？"]]},{"w":"buy-in","p":"n.","z":"認同、支持","c":"面試問答","ex":[["I gained buy-in from senior leaders before starting the project.","我在專案開始前先取得高階主管的認同。"],["Without team buy-in, the new policy will not work.","沒有團隊的認同，新政策行不通。"]]},{"w":"onboard","p":"v.","z":"帶領新人上手","c":"面試問答","ex":[["I helped onboard new employees and trained them on our tools.","我協助新進員工上手，並訓練他們使用我們的工具。"],["It takes about two weeks to onboard a new analyst.","讓一位新分析師上手大約需要兩週。"]]},{"w":"adapt to","p":"phr.","z":"適應","c":"面試問答","ex":[["I adapted to the new software within a few days.","我幾天內就適應了新軟體。"],["How quickly can you adapt to a new work environment?","你能多快適應新的工作環境？"]]},{"w":"work independently","p":"phr.","z":"獨立作業","c":"面試問答","ex":[["I can work independently, but I also enjoy team brainstorming.","我能獨立作業，但也喜歡團隊腦力激盪。"],["The role requires you to work independently most of the day.","這個職位要求你大部分時間獨立作業。"]]},{"w":"pay attention to detail","p":"phr.","z":"注意細節","c":"面試問答","ex":[["I pay attention to detail, which helps me catch errors early.","我很注意細節，這幫助我及早發現錯誤。"],["Accountants must pay attention to detail at all times.","會計人員隨時都必須注意細節。"]]},{"w":"stay organized","p":"phr.","z":"保持條理","c":"面試問答","ex":[["I stay organized by using a digital calendar and checklists.","我用電子行事曆和檢查清單來保持條理。"],["How do you stay organized when managing several projects?","你同時管理多個專案時如何保持條理？"]]},{"w":"take responsibility","p":"phr.","z":"負起責任","c":"面試問答","ex":[["I took responsibility for the delay and apologized to the client.","我為延誤負起責任，並向客戶道歉。"],["A good leader takes responsibility when things go wrong.","好的領導者會在事情出錯時負起責任。"]]},{"w":"integrity","p":"n.","z":"正直、誠信","c":"面試問答","ex":[["Integrity is the most important quality in a financial advisor.","誠信是財務顧問最重要的特質。"],["I told the truth about the error because I value integrity.","我重視誠信，所以如實說出了錯誤。"]]},{"w":"reliable","p":"adj.","z":"可靠的","c":"面試問答","ex":[["My colleagues describe me as reliable and consistent.","同事形容我可靠又穩定。"],["We need a reliable person who will show up on time.","我們需要一個會準時到班的可靠人選。"]]},{"w":"flexible","p":"adj.","z":"有彈性的","c":"面試問答","ex":[["I am flexible about working hours when the project demands it.","專案需要時，我的工作時間很有彈性。"],["Are you flexible enough to work on weekends occasionally?","你的彈性足以偶爾在週末工作嗎？"]]},{"w":"enthusiastic","p":"adj.","z":"熱忱的","c":"面試問答","ex":[["I am enthusiastic about joining a company with such a clear mission.","我很期待加入使命如此明確的公司。"],["He gave an enthusiastic answer when asked about teamwork.","被問到團隊合作時，他熱情地回答。"]]},{"w":"passionate","p":"adj.","z":"充滿熱情的","c":"面試問答","ex":[["I am passionate about helping small businesses grow online.","我熱衷於協助小型企業在網路上成長。"],["We are looking for someone passionate about education.","我們在找對教育充滿熱情的人。"]]},{"w":"motivate","p":"v.","z":"激勵、鼓舞","c":"面試問答","ex":[["I motivate my team by recognizing their hard work.","我藉由肯定團隊的努力來激勵他們。"],["What motivates you to do your best at work?","是什麼激勵你在工作上全力以赴？"]]},{"w":"a challenging situation","p":"phr.","z":"一個棘手的情況","c":"面試問答","ex":[["I once faced a challenging situation when a client threatened to leave.","我曾遇到客戶揚言離開的棘手情況。"],["Describe a challenging situation and how you handled it.","請描述一個棘手的情況以及你如何處理。"]]},{"w":"in hindsight","p":"phr.","z":"事後回想","c":"面試問答","ex":[["In hindsight, I should have asked for help earlier.","事後回想，我應該早點求助的。"],["In hindsight, the decision was risky but worthwhile.","事後回想，那個決定雖有風險但很值得。"]]},{"w":"tell me about a time","p":"phr.","z":"請告訴我一次……的經驗","c":"面試問答","ex":[["Tell me about a time you disagreed with your boss.","請告訴我一次你和老闆意見不合的經驗。"],["The interviewer said, tell me about a time you led a project.","面試官說：請告訴我一次你領導專案的經驗。"]]},{"w":"give an example","p":"phr.","z":"舉例","c":"面試問答","ex":[["Can you give an example of how you used this skill?","你能舉例說明你如何運用這項技能嗎？"],["I will give an example from my internship last summer.","我來舉一個去年暑假實習的例子。"]]},{"w":"walk me through","p":"phr.","z":"請逐步為我說明","c":"面試問答","ex":[["Walk me through your process for handling a customer complaint.","請逐步為我說明你處理客訴的流程。"],["Could you walk me through your resume briefly?","你能簡單地為我說明一下你的履歷嗎？"]]},{"w":"to be honest","p":"phr.","z":"老實說","c":"面試問答","ex":[["To be honest, public speaking used to make me nervous.","老實說，公開演講以前會讓我緊張。"],["To be honest, I did not have all the skills at first.","老實說，我一開始並不具備所有技能。"]]},{"w":"what I learned from this","p":"phr.","z":"我從中學到的是","c":"面試問答","ex":[["What I learned from this was the value of clear communication.","我從中學到的是清楚溝通的價值。"],["What I learned from this experience changed how I lead.","我從這次經驗中學到的，改變了我領導的方式。"]]},{"w":"I'm currently working on","p":"phr.","z":"我目前正在努力改進／進行","c":"面試問答","ex":[["I'm currently working on improving my delegation skills.","我目前正在努力改進我的授權技巧。"],["I'm currently working on a certification in project management.","我目前正在進修專案管理的認證。"]]},{"w":"areas for improvement","p":"n.","z":"可改進之處","c":"面試問答","ex":[["One of my areas for improvement is public speaking.","我可改進之處之一是公開演講。"],["My last review listed two areas for improvement.","我上次的考核列出了兩個可改進之處。"]]},{"w":"rise to the occasion","p":"phr.","z":"臨危受命、迎難而上","c":"面試問答","ex":[["When our lead quit, I rose to the occasion and took over.","組長離職時，我挺身而出接手。"],["She rises to the occasion whenever the team faces a crisis.","每當團隊面臨危機，她總能挺身而出。"]]},{"w":"meet the needs of","p":"phr.","z":"滿足……的需求","c":"面試問答","ex":[["I redesigned the service to meet the needs of older customers.","我重新設計服務以滿足年長客戶的需求。"],["How do you meet the needs of different clients?","你如何滿足不同客戶的需求？"]]},{"w":"bottom line","p":"n.","z":"底線、最終獲利","c":"面試問答","ex":[["My project improved the company's bottom line by two million dollars.","我的專案讓公司的獲利增加了兩百萬元。"],["In the end, the bottom line is customer satisfaction.","說到底，關鍵就是客戶滿意度。"]]},{"w":"candidate","p":"n.","z":"候選人、應徵者","c":"面試問答","ex":[["The strongest candidate was invited back for a final interview.","最強的候選人被邀請回來參加最後一輪面試。"],["We are looking for a candidate with strong communication skills.","我們正在尋找溝通能力強的候選人。"]]},{"w":"icebreaker","p":"n.","z":"破冰話題","c":"面試問答","ex":[["The interviewer used a joke about traffic as an icebreaker.","面試官用一個關於交通的笑話當作破冰話題。"],["A friendly icebreaker helped me relax at the start.","一個友善的破冰話題幫助我在一開始放鬆下來。"]]},{"w":"small talk","p":"phr.","z":"閒聊","c":"面試問答","ex":[["We made small talk about the weather while walking to the room.","我們走向會議室時閒聊著天氣。"],["Small talk before the interview can help build rapport.","面試前的閒聊有助於建立融洽關係。"]]},{"w":"introduce yourself","p":"phr.","z":"自我介紹","c":"面試問答","ex":[["Can you briefly introduce yourself and your background?","你能簡短地自我介紹並說明你的背景嗎？"],["I practiced how to introduce yourself in under one minute.","我練習了如何在一分鐘內做完自我介紹。"]]},{"w":"elevator pitch","p":"n.","z":"電梯簡報（簡短自我推銷）","c":"面試問答","ex":[["Prepare a thirty-second elevator pitch about your strengths.","準備一段關於你優勢的三十秒電梯簡報。"],["My elevator pitch covers who I am and what I offer.","我的電梯簡報涵蓋我是誰以及我能提供什麼。"]]},{"w":"motivation","p":"n.","z":"動機","c":"面試問答","ex":[["They asked about my motivation for leaving my current job.","他們問了我離開現職的動機。"],["Strong motivation can make up for limited experience.","強烈的動機可以彌補經驗的不足。"]]},{"w":"hypothetical","p":"adj.","z":"假設性的","c":"面試問答","ex":[["The interviewer asked a hypothetical question about an upset client.","面試官問了一個關於憤怒客戶的假設性問題。"],["Hypothetical questions test how you think under pressure.","假設性問題用來測試你在壓力下如何思考。"]]},{"w":"case study","p":"n.","z":"個案研究","c":"面試問答","ex":[["The final round included a case study about market expansion.","最後一輪包含一個關於市場擴張的個案研究。"],["We had thirty minutes to solve the case study in groups.","我們有三十分鐘分組解決這個個案研究。"]]},{"w":"brainteaser","p":"n.","z":"腦力激盪題","c":"面試問答","ex":[["The consulting firm gave me a brainteaser about counting cars.","那家顧問公司給了我一道關於計算汽車數量的腦力激盪題。"],["Do not panic when you get a brainteaser; explain your thinking.","遇到腦力激盪題時不要慌張，說明你的思考過程。"]]},{"w":"mock interview","p":"phr.","z":"模擬面試","c":"面試問答","ex":[["My career center arranged a mock interview before the real one.","我的就業輔導中心在正式面試前安排了一次模擬面試。"],["A mock interview showed me that I talk too fast.","模擬面試讓我發現自己說話太快。"]]},{"w":"rehearse","p":"v.","z":"預演、排練","c":"面試問答","ex":[["I rehearse my answers in front of a mirror every night.","我每天晚上對著鏡子預演我的回答。"],["It helps to rehearse common questions with a friend.","和朋友一起預演常見問題很有幫助。"]]},{"w":"phone screening","p":"phr.","z":"電話初篩","c":"面試問答","ex":[["The phone screening lasted only fifteen minutes, but it felt very long.","這次電話初篩只持續了十五分鐘，但感覺很漫長。"],["I passed the phone screening and was invited to visit the office.","我通過了電話初篩，被邀請到公司面試。"]]},{"w":"assessment","p":"n.","z":"評量、評估","c":"面試問答","ex":[["Candidates must complete an online assessment before the interview.","應徵者必須在面試前完成線上評量。"],["The skills assessment included a short writing task.","這項技能評量包含一個簡短的寫作任務。"]]},{"w":"aptitude test","p":"phr.","z":"性向測驗","c":"面試問答","ex":[["The bank asked every applicant to take an aptitude test.","這間銀行要求每位應徵者參加性向測驗。"],["An aptitude test measures how quickly you can learn new things.","性向測驗衡量你學習新事物的速度。"]]},{"w":"whiteboard","p":"n.","z":"白板","c":"面試問答","ex":[["I had to solve a coding problem on the whiteboard.","我必須在白板上解決一道程式題。"],["She drew a diagram on the whiteboard to explain her idea.","她在白板上畫了一張圖來解釋她的想法。"]]},{"w":"follow-up question","p":"phr.","z":"追問的問題","c":"面試問答","ex":[["The manager asked a follow-up question about my last project.","經理就我上一個專案問了一個追問的問題。"],["Be ready for a follow-up question after each answer.","每次回答後都要準備好應付追問。"]]},{"w":"probe","p":"v.","z":"深入探問","c":"面試問答","ex":[["Good interviewers probe deeper when an answer is vague.","好的面試官在回答模糊時會深入探問。"],["They continued to probe into my role in the failed project.","他們持續深入探問我在那個失敗專案中的角色。"]]},{"w":"clarify","p":"v.","z":"釐清、澄清","c":"面試問答","ex":[["It is fine to clarify the question before you answer.","在回答之前先釐清問題是沒問題的。"],["Could you clarify what kind of experience you are looking for?","你能否釐清一下你們想找的是哪種經驗？"]]},{"w":"rephrase","p":"v.","z":"換個方式說","c":"面試問答","ex":[["Could you rephrase the question? I did not quite catch it.","你可以換個方式問嗎？我沒有完全聽懂。"],["I tried to rephrase my answer to make it clearer.","我試著換個說法，讓我的回答更清楚。"]]},{"w":"ramble","p":"v.","z":"漫無邊際地說","c":"面試問答","ex":[["Try not to ramble when you answer open questions.","回答開放性問題時，盡量不要漫無邊際地說。"],["He began to ramble and lost track of the question.","他開始漫無邊際地說，忘了問題是什麼。"]]},{"w":"deflect","p":"v.","z":"迴避、轉移話題","c":"面試問答","ex":[["She tried to deflect the question about her salary.","她試圖迴避關於薪水的問題。"],["Do not deflect criticism; answer it honestly instead.","不要迴避批評，而要誠實地回應。"]]},{"w":"evasive","p":"adj.","z":"閃爍其詞的","c":"面試問答","ex":[["His evasive answer made the interviewer a little suspicious of him.","他閃爍其詞的回答讓面試官起了疑心。"],["Being evasive about gaps in your resume looks bad.","對履歷中的空白期閃爍其詞會讓人觀感不佳。"]]},{"w":"candid","p":"adj.","z":"坦率的","c":"面試問答","ex":[["I gave a candid answer about my biggest weakness.","我對自己最大的弱點給了一個坦率的回答。"],["The manager appreciated her candid and thoughtful feedback.","經理很欣賞她坦率而周到的回饋。"]]},{"w":"interviewee","p":"n.","z":"受訪者、應試者","c":"面試問答","ex":[["The interviewee arrived ten minutes early and looked calm.","這位應試者提早十分鐘抵達，看起來很冷靜。"],["Each interviewee gets forty minutes with the panel.","每位應試者有四十分鐘與面試小組面談。"]]},{"w":"interviewer","p":"n.","z":"面試官","c":"面試問答","ex":[["The interviewer smiled and asked me to sit down.","面試官微笑著請我坐下。"],["I asked the interviewer about the team's biggest challenge.","我問面試官團隊面臨的最大挑戰是什麼。"]]},{"w":"recap","p":"v.","z":"重述、扼要複述","c":"面試問答","ex":[["Let me quickly recap my main skills for you.","讓我為您扼要複述一下我的主要技能。"],["The interviewer recapped the next steps at the end.","面試官在最後重述了後續步驟。"]]},{"w":"tricky","p":"adj.","z":"棘手的、刁鑽的","c":"面試問答","ex":[["That was a tricky question, so I took a moment to think.","那是個刁鑽的問題，所以我花了一點時間思考。"],["Salary questions can be tricky if you are unprepared.","如果沒有準備，薪資問題可能很棘手。"]]},{"w":"curveball","p":"n.","z":"出乎意料的問題","c":"面試問答","ex":[["The last question was a real curveball, but I stayed calm.","最後一個問題真的出乎意料，但我保持冷靜。"],["Interviewers sometimes throw a curveball to test your reaction.","面試官有時會丟出出乎意料的問題來測試你的反應。"]]},{"w":"put on the spot","p":"phr.","z":"使人難以回答、讓人為難","c":"面試問答","ex":[["I felt put on the spot when he asked about my failures.","當他問起我的失敗經驗時，我覺得被逼到難以回答。"],["Do not worry if you are put on the spot; take a breath.","如果被問得措手不及，別擔心，深呼吸一下。"]]},{"w":"stand out","p":"phr.","z":"脫穎而出","c":"面試問答","ex":[["A thank-you note can help you stand out from other candidates.","一張感謝函可以幫助你從其他應徵者中脫穎而出。"],["How will you stand out in a competitive job market?","在競爭激烈的就業市場中，你要如何脫穎而出？"]]},{"w":"video interview","p":"phr.","z":"視訊面試","c":"面試問答","ex":[["My first video interview was held on a laptop at home.","我的第一次視訊面試是在家裡用筆電進行的。"],["Check your camera and microphone before a video interview.","視訊面試前要檢查你的鏡頭和麥克風。"]]},{"w":"take-home assignment","p":"phr.","z":"回家作業（面試用）","c":"面試問答","ex":[["The startup sent me a take-home assignment due in three days.","這間新創公司寄給我一份三天內要交的回家作業。"],["I spent the whole weekend on the take-home assignment.","我整個週末都花在那份回家作業上。"]]},{"w":"department","p":"n.","z":"部門、系所","c":"職位與工作內容","ex":[["I work in the marketing department of a mid-sized electronics company.","我在一家中型電子公司的行銷部門工作。"],["Which department would I be joining if I get the job?","如果我錄取了，會加入哪個部門？"]]},{"w":"industry","p":"n.","z":"產業、行業","c":"職位與工作內容","ex":[["I have five years of experience in the semiconductor industry.","我在半導體產業有五年經驗。"],["She wants to switch to a different industry after ten years.","她想在十年後轉換到不同的產業。"]]},{"w":"duty","p":"n.","z":"職責、任務","c":"職位與工作內容","ex":[["One of my duties was preparing the monthly sales report.","我的職責之一是準備每月銷售報告。"],["Her daily duties include answering emails and scheduling meetings.","她的日常職責包括回覆電子郵件和安排會議。"]]},{"w":"role","p":"n.","z":"角色、職務","c":"職位與工作內容","ex":[["I am applying for the project coordinator role.","我應徵的是專案協調員一職。"],["What would my role be on the team?","我在團隊中會扮演什麼角色？"]]},{"w":"position","p":"n.","z":"職位","c":"職位與工作內容","ex":[["This position reports directly to the operations director.","這個職位直接向營運總監報告。"],["I was excited to see the position advertised online.","我看到網路上刊登這個職缺時很興奮。"]]},{"w":"vacancy","p":"n.","z":"職缺、空缺","c":"職位與工作內容","ex":[["We have a vacancy in the finance team.","財務團隊目前有一個職缺。"],["How did you first hear about this vacancy at our company?","你最初是怎麼得知我們公司這個職缺的？"]]},{"w":"human resources","p":"n.","z":"人力資源部","c":"職位與工作內容","ex":[["I spoke with human resources about the benefits package.","我和人力資源部談過福利方案。"],["The human resources team will contact you next week.","人力資源團隊下週會與你聯絡。"]]},{"w":"sales","p":"n.","z":"銷售、業務","c":"職位與工作內容","ex":[["I started my career in sales right after graduation.","我畢業後就投入銷售工作。"],["Our sales increased by twenty percent last year.","我們去年的銷售額成長了百分之二十。"]]},{"w":"accounting","p":"n.","z":"會計","c":"職位與工作內容","ex":[["I have a background in accounting and auditing.","我具有會計與審計的背景。"],["The accounting department processes all of our invoices.","會計部門處理我們所有的發票。"]]},{"w":"logistics","p":"n.","z":"物流、後勤","c":"職位與工作內容","ex":[["He manages logistics for a global shipping company.","他負責一家全球運輸公司的物流。"],["Logistics is a big part of this job.","物流是這份工作很重要的一部分。"]]},{"w":"manufacturing","p":"n.","z":"製造業","c":"職位與工作內容","ex":[["Taiwan is known for its strong manufacturing sector.","台灣以強大的製造業聞名。"],["I worked in manufacturing for three years before moving to design.","我在轉做設計之前，從事製造業三年。"]]},{"w":"supply chain","p":"n.","z":"供應鏈","c":"職位與工作內容","ex":[["I helped improve our supply chain efficiency by fifteen percent.","我協助將供應鏈效率提升了百分之十五。"],["The role involves managing the supply chain across Asia.","這個職位涉及管理亞洲各地的供應鏈。"]]},{"w":"client","p":"n.","z":"客戶","c":"職位與工作內容","ex":[["I built strong relationships with our key clients.","我與主要客戶建立了穩固的關係。"],["Our clients expect fast and clear communication at every stage.","我們的客戶期待每個階段都有快速而清楚的溝通。"]]},{"w":"supervisor","p":"n.","z":"主管、督導","c":"職位與工作內容","ex":[["My supervisor trusted me to lead the training session.","我的主管信任我來帶領培訓課程。"],["Can you describe your relationship with your last supervisor?","可以描述你和前任主管的關係嗎？"]]},{"w":"colleague","p":"n.","z":"同事","c":"職位與工作內容","ex":[["My colleagues would describe me as reliable and friendly.","我的同事會形容我可靠又友善。"],["I learned a great deal from my colleagues.","我從同事身上學到很多。"]]},{"w":"subordinate","p":"n.","z":"部屬","c":"職位與工作內容","ex":[["I always give my subordinates clear and honest feedback.","我總是給部屬清楚而誠實的回饋。"],["How do you motivate your subordinates during stressful periods?","在壓力大的時期，你如何激勵你的部屬？"]]},{"w":"direct report","p":"n.","z":"直屬部屬","c":"職位與工作內容","ex":[["I had four direct reports in my previous job.","我上一份工作有四位直屬部屬。"],["As a manager here, you would have six direct reports.","擔任這裡的經理，你會有六位直屬部屬。"]]},{"w":"team leader","p":"n.","z":"組長、團隊領導","c":"職位與工作內容","ex":[["I was promoted to team leader after two years.","我兩年後被升為組長。"],["A good team leader listens before making decisions.","好的團隊領導者會在做決定前先傾聽。"]]},{"w":"report to","p":"phr.","z":"向…報告、隸屬於","c":"職位與工作內容","ex":[["You would report to the head of engineering.","你會向工程部主管報告。"],["I currently report to the regional sales manager.","我目前向區域業務經理報告。"]]},{"w":"handle","p":"v.","z":"處理、應付","c":"職位與工作內容","ex":[["I handle about thirty customer inquiries every day.","我每天處理約三十件客戶詢問。"],["How do you handle tight deadlines when several projects overlap?","當多個專案重疊時，你如何應付緊迫的截止期限？"]]},{"w":"liaise","p":"v.","z":"聯絡、居中協調","c":"職位與工作內容","ex":[["I liaise with suppliers to confirm delivery dates.","我與供應商聯繫以確認交貨日期。"],["You will liaise between the technical and business teams.","你將負責技術團隊與業務團隊之間的溝通協調。"]]},{"w":"maintain","p":"v.","z":"維護、維持","c":"職位與工作內容","ex":[["I maintain the company database and update records weekly.","我維護公司資料庫並每週更新紀錄。"],["It is important to maintain good client relationships.","維持良好的客戶關係很重要。"]]},{"w":"monitor","p":"v.","z":"監控、追蹤","c":"職位與工作內容","ex":[["I monitor project budgets and report any problems early.","我追蹤專案預算並及早回報任何問題。"],["She monitors website traffic every morning and reports any unusual changes.","她每天早上監控網站流量，並回報任何異常變化。"]]},{"w":"analyze","p":"v.","z":"分析","c":"職位與工作內容","ex":[["I analyze sales data to identify market trends.","我分析銷售數據以找出市場趨勢。"],["We analyzed customer feedback before redesigning the app.","我們在重新設計應用程式之前分析了客戶回饋。"]]},{"w":"workload","p":"n.","z":"工作量","c":"職位與工作內容","ex":[["I can handle a heavy workload without losing quality.","我能在不影響品質的情況下應付繁重的工作量。"],["How is the workload shared among team members?","團隊成員之間如何分攤工作量？"]]},{"w":"target","p":"n.","z":"目標、指標","c":"職位與工作內容","ex":[["I exceeded my sales target for three quarters in a row.","我連續三季超越了銷售目標。"],["The team set an ambitious target for next year.","團隊為明年設定了一個有野心的目標。"]]},{"w":"quota","p":"n.","z":"業績配額","c":"職位與工作內容","ex":[["I met my sales quota every month last year.","我去年每個月都達成了業績配額。"],["The quota for new hires is lower in the first year.","新進人員第一年的配額比較低。"]]},{"w":"performance review","p":"n.","z":"績效考核","c":"職位與工作內容","ex":[["I received an excellent performance review last year.","我去年的績效考核成績很優異。"],["Your performance review will be held every six months.","你的績效考核每六個月舉行一次。"]]},{"w":"performance","p":"n.","z":"表現、績效","c":"職位與工作內容","ex":[["My performance improved steadily over the past two years.","我的表現在過去兩年穩定進步。"],["The company rewards strong performance with annual bonuses.","公司以年度獎金獎勵優異的表現。"]]},{"w":"meet expectations","p":"phr.","z":"符合期待","c":"職位與工作內容","ex":[["I always meet expectations and often go beyond them.","我總是符合期待，而且常常超出期待。"],["Employees who meet expectations receive a standard bonus.","符合期待的員工會領到標準獎金。"]]},{"w":"outperform","p":"v.","z":"表現優於","c":"職位與工作內容","ex":[["I outperformed my peers in sales last year.","我去年的銷售表現優於同儕。"],["The new strategy helped us outperform our competitors.","新策略幫助我們表現勝過競爭對手。"]]},{"w":"productivity","p":"n.","z":"生產力","c":"職位與工作內容","ex":[["I improved team productivity by introducing weekly planning.","我藉由導入每週規劃提升了團隊生產力。"],["Remote work has increased our productivity and lowered office costs.","遠端工作提高了我們的生產力並降低了辦公室成本。"]]},{"w":"efficiency","p":"n.","z":"效率","c":"職位與工作內容","ex":[["I looked for ways to boost efficiency in the warehouse.","我尋找提升倉庫效率的方法。"],["In my opinion, efficiency matters more than working long hours.","我認為效率比長時間工作更重要。"]]},{"w":"efficient","p":"adj.","z":"有效率的","c":"職位與工作內容","ex":[["I am an efficient worker who values clear processes.","我是重視明確流程的有效率員工。"],["We need a more efficient system for tracking orders.","我們需要更有效率的訂單追蹤系統。"]]},{"w":"feedback","p":"n.","z":"回饋、意見","c":"職位與工作內容","ex":[["I welcome feedback because it helps me improve.","我歡迎回饋，因為它幫助我進步。"],["My manager gave me positive feedback on the presentation.","我的主管對簡報給了正面的回饋。"]]},{"w":"promote","p":"v.","z":"升遷、推廣","c":"職位與工作內容","ex":[["I was promoted to senior analyst in 2022.","我在2022年被升為資深分析師。"],["We promote employees based on performance, not seniority.","我們依表現而非年資來升遷員工。"]]},{"w":"career path","p":"n.","z":"職涯發展路徑","c":"職位與工作內容","ex":[["Can you describe the typical career path for this role?","可以描述這個職位一般的職涯發展路徑嗎？"],["I see this job as an important step on my career path.","我把這份工作視為職涯路徑上重要的一步。"]]},{"w":"advancement","p":"n.","z":"晉升、進步","c":"職位與工作內容","ex":[["The company offers good opportunities for advancement to hard-working employees.","這家公司為努力的員工提供良好的晉升機會。"],["I am looking for a job with room for advancement.","我在找有晉升空間的工作。"]]},{"w":"part-time","p":"adj.","z":"兼職的","c":"職位與工作內容","ex":[["I worked part-time at a bookstore while finishing my degree.","我在完成學位期間在書店做兼職。"],["Is a part-time arrangement possible for this role?","這個職位可以採兼職方式嗎？"]]},{"w":"probation period","p":"n.","z":"試用期","c":"職位與工作內容","ex":[["The probation period for this position is three months.","這個職位的試用期是三個月。"],["I passed my probation period with very good reviews.","我以很好的評價通過了試用期。"]]},{"w":"overtime","p":"n.","z":"加班","c":"職位與工作內容","ex":[["I am willing to work overtime when a project requires it.","當專案需要時，我願意加班。"],["Is overtime paid in this position, or is it unpaid?","這個職位的加班有給薪嗎，還是沒有薪水？"]]},{"w":"shift","p":"n.","z":"輪班、班次","c":"職位與工作內容","ex":[["I worked the night shift at a hospital for two years.","我在醫院上了兩年的夜班。"],["Will I need to work weekend shifts during the first month?","我第一個月需要上週末的班嗎？"]]},{"w":"remote","p":"adj.","z":"遠端的","c":"職位與工作內容","ex":[["This position allows remote work two days a week.","這個職位允許每週遠端工作兩天。"],["I have two years of experience managing a remote team.","我有兩年管理遠端團隊的經驗。"]]},{"w":"on-site","p":"adj.","z":"現場的、駐點的","c":"職位與工作內容","ex":[["This is an on-site role at our factory in Taichung.","這是在我們台中工廠的現場職位。"],["Do you require on-site work every day, or only on some days?","你們要求每天到現場工作，還是只有某幾天？"]]},{"w":"headquarters","p":"n.","z":"總部","c":"職位與工作內容","ex":[["Our headquarters is in Hsinchu, with offices abroad.","我們的總部在新竹，海外也有辦公室。"],["The regional office reports to our headquarters in Singapore.","區域辦公室向我們位於新加坡的總部報告。"]]},{"w":"branch","p":"n.","z":"分公司、分行","c":"職位與工作內容","ex":[["Before this, I managed a branch with twenty employees in Taipei.","在此之前，我在台北管理過一間有二十名員工的分公司。"],["We are opening a new branch in Kaohsiung.","我們正要在高雄開設新的分公司。"]]},{"w":"startup","p":"n.","z":"新創公司","c":"職位與工作內容","ex":[["I joined a startup where I wore many different hats.","我加入一家新創公司，在那裡身兼多職。"],["Working at a startup taught me to adapt quickly.","在新創公司工作讓我學會快速適應。"]]},{"w":"multinational","p":"adj.","z":"跨國的","c":"職位與工作內容","ex":[["I want to work for a multinational company.","我想為跨國公司工作。"],["Our multinational clients require all reports to be written in English.","我們的跨國客戶要求所有報告以英文撰寫。"]]},{"w":"wear many hats","p":"phr.","z":"身兼多職","c":"職位與工作內容","ex":[["In a small company, you often wear many hats.","在小公司裡，你常常得身兼多職。"],["I like to wear many hats and learn new skills.","我喜歡身兼多職並學習新技能。"]]},{"w":"day-to-day","p":"adj.","z":"日常的","c":"職位與工作內容","ex":[["What does the day-to-day work look like in this role?","這個職位的日常工作是什麼樣子？"],["I handle the day-to-day operations of the store.","我負責這間店的日常營運。"]]},{"w":"senior","p":"adj.","z":"資深的","c":"職位與工作內容","ex":[["I was promoted to a senior position after three years.","我三年後被升到資深職位。"],["We are hiring a senior engineer to lead the team.","我們正在聘請一位資深工程師來帶領團隊。"]]},{"w":"junior","p":"adj.","z":"資淺的、初階的","c":"職位與工作內容","ex":[["As a junior analyst, I learned quickly from my mentors.","身為初階分析師，我從導師身上學得很快。"],["The junior staff attend weekly training sessions led by senior engineers.","資淺的員工每週參加由資深工程師帶領的培訓課程。"]]},{"w":"onboarding","p":"n.","z":"新人到職培訓","c":"職位與工作內容","ex":[["The onboarding takes about two weeks for new hires.","新進人員的到職培訓大約需要兩週。"],["I helped redesign the onboarding for new employees.","我協助重新設計了新進員工的到職培訓。"]]},{"w":"skill set","p":"n.","z":"技能組合","c":"職位與工作內容","ex":[["My skill set includes data analysis and project management.","我的技能組合包括數據分析與專案管理。"],["Your skill set matches what we are looking for.","你的技能組合符合我們所尋找的條件。"]]},{"w":"budget","p":"n.","z":"預算","c":"職位與工作內容","ex":[["I managed an annual budget of five million dollars.","我管理過五百萬美元的年度預算。"],["We must finish the project within budget and before the deadline.","我們必須在預算內並於期限前完成專案。"]]},{"w":"revenue","p":"n.","z":"營收","c":"職位與工作內容","ex":[["My team generated two million dollars in revenue.","我的團隊創造了兩百萬美元的營收。"],["Company revenue grew by ten percent this year.","公司今年營收成長了百分之十。"]]},{"w":"profit","p":"n.","z":"利潤","c":"職位與工作內容","ex":[["I helped the store increase its profit by eight percent.","我協助這間店的利潤提高了百分之八。"],["The company made a healthy profit last quarter.","公司上一季獲得可觀的利潤。"]]},{"w":"cost-effective","p":"adj.","z":"具成本效益的","c":"職位與工作內容","ex":[["I found a more cost-effective way to ship products.","我找到一個更具成本效益的產品運送方式。"],["We need cost-effective solutions for this project because funds are limited.","這個專案需要具成本效益的解決方案，因為資金有限。"]]},{"w":"compliance","p":"n.","z":"法規遵循、合規","c":"職位與工作內容","ex":[["I ensured compliance with safety regulations in the factory.","我確保工廠遵守安全法規。"],["The compliance team reviews all contracts before signing.","合規團隊在簽署前審查所有合約。"]]},{"w":"quality control","p":"n.","z":"品質管制","c":"職位與工作內容","ex":[["I worked in quality control at an electronics plant.","我曾在一家電子工廠從事品質管制。"],["Quality control checks happen in our factory before every single shipment.","我們工廠在每一次出貨前都會進行品質管制檢查。"]]},{"w":"customer service","p":"n.","z":"客戶服務","c":"職位與工作內容","ex":[["I have three years of experience in customer service.","我有三年客戶服務的經驗。"],["I believe good customer service builds long-term loyalty among clients.","我相信良好的客戶服務能在客戶之間建立長期的忠誠度。"]]},{"w":"project management","p":"n.","z":"專案管理","c":"職位與工作內容","ex":[["I also have a certificate in project management from a local university.","我也有一張來自本地大學的專案管理證書。"],["Strong project management skills are essential for this role.","優秀的專案管理能力對這個職位至關重要。"]]},{"w":"procurement","p":"n.","z":"採購","c":"職位與工作內容","ex":[["I work in procurement for a medical device company.","我在一家醫療器材公司負責採購。"],["Procurement negotiates prices with our suppliers every quarter.","採購部門每季與供應商協商價格。"]]},{"w":"recruit","p":"v.","z":"招募、徵才","c":"職位與工作內容","ex":[["I helped recruit more than fifty new employees last year.","我去年協助招募了五十多位新員工。"],["We are recruiting engineers for our new office.","我們正在為新辦公室招募工程師。"]]},{"w":"retention","p":"n.","z":"留任、客戶留存","c":"職位與工作內容","ex":[["I worked to improve employee retention in my department.","我努力提升部門的員工留任率。"],["Customer retention is a key goal for this team.","客戶留存是這個團隊的重要目標。"]]},{"w":"turnover","p":"n.","z":"人員流動率、營業額","c":"職位與工作內容","ex":[["The company has a low employee turnover rate.","這家公司的員工流動率很低。"],["Why is turnover so high in this department?","為什麼這個部門的人員流動率這麼高？"]]},{"w":"benefits","p":"n.","z":"福利","c":"職位與工作內容","ex":[["What benefits does the company offer to new employees?","公司提供新進員工哪些福利？"],["The benefits include health insurance and paid leave.","福利包括健康保險和帶薪假。"]]},{"w":"work-life balance","p":"n.","z":"工作與生活平衡","c":"職位與工作內容","ex":[["I value a healthy work-life balance because it keeps me productive.","我重視健康的工作與生活平衡，因為這讓我保持高效率。"],["How does the company support work-life balance for its employees?","公司如何支持員工工作與生活的平衡？"]]},{"w":"burnout","p":"n.","z":"職業倦怠","c":"職位與工作內容","ex":[["I avoid burnout by setting clear boundaries between work and rest.","我藉由在工作與休息間設定清楚的界線來避免職業倦怠。"],["Heavy workloads can easily lead to burnout if managers ignore them.","如果主管忽視，繁重的工作量很容易導致職業倦怠。"]]},{"w":"deliverable","p":"n.","z":"應交付成果","c":"職位與工作內容","ex":[["I always submit deliverables on time and check them carefully.","我總是準時提交應交付成果，並仔細檢查。"],["What are the main deliverables for this role in the first year?","這個職位第一年的主要應交付成果是什麼？"]]},{"w":"milestone","p":"n.","z":"里程碑、階段目標","c":"職位與工作內容","ex":[["We reached our first milestone two weeks early.","我們提早兩週達成第一個里程碑。"],["I track milestones to keep projects on schedule.","我追蹤各階段目標以確保專案如期進行。"]]},{"w":"bottleneck","p":"n.","z":"瓶頸","c":"職位與工作內容","ex":[["I identified a bottleneck in our approval process.","我找出了核准流程中的瓶頸。"],["Slow delivery is the main bottleneck for the team.","交貨緩慢是這個團隊的主要瓶頸。"]]},{"w":"scope","p":"n.","z":"範圍","c":"職位與工作內容","ex":[["The scope of this role includes training and budgeting.","這個職位的範圍包括培訓與預算編列。"],["The project scope expanded after the client's request.","在客戶提出要求後，專案範圍擴大了。"]]},{"w":"headcount","p":"n.","z":"員額、人數","c":"職位與工作內容","ex":[["We plan to increase headcount in the engineering team.","我們計畫增加工程團隊的員額。"],["The headcount for this department is limited this year.","今年這個部門的員額有限。"]]},{"w":"strategy","p":"n.","z":"策略","c":"職位與工作內容","ex":[["I helped develop our social media strategy for the new product launch.","我協助為新產品上市制定了社群媒體策略。"],["What is your strategy for reaching new customers?","你接觸新客戶的策略是什麼？"]]},{"w":"job posting","p":"n.","z":"職缺公告","c":"職位與工作內容","ex":[["I read the job posting carefully before tailoring my resume.","我在修改履歷之前仔細閱讀了職缺公告。"],["The job posting lists five required skills and two preferred ones.","這份職缺公告列出了五項必備技能和兩項加分技能。"]]},{"w":"job opening","p":"n.","z":"職缺","c":"職位與工作內容","ex":[["There is a job opening in our finance department next month.","下個月我們財務部門有一個職缺。"],["She applied for every job opening that matched her skills.","她應徵了每一個符合自己技能的職缺。"]]},{"w":"contractor","p":"n.","z":"約聘人員、承包商","c":"職位與工作內容","ex":[["He worked as a contractor for the bank for six months.","他以約聘人員的身分為這間銀行工作了六個月。"],["A contractor does not receive the same benefits as full-time staff.","約聘人員享有的福利和全職員工不同。"]]},{"w":"temp","p":"n.","z":"臨時工","c":"職位與工作內容","ex":[["She started as a temp and later became a permanent employee.","她一開始是臨時工，後來成為正式員工。"],["We need a temp to cover the front desk this week.","我們這星期需要一位臨時工來代班櫃檯。"]]},{"w":"workplace","p":"n.","z":"職場、工作場所","c":"職位與工作內容","ex":[["A friendly workplace makes people want to stay longer.","友善的職場讓人想待得更久。"],["She asked about diversity in the workplace during the interview.","她在面試中詢問了職場多元性的情況。"]]},{"w":"coworker","p":"n.","z":"同事","c":"職位與工作內容","ex":[["My coworker showed me how to use the new software.","我的同事教我如何使用新軟體。"],["I get along well with every coworker on my team.","我和團隊裡每位同事都相處得很好。"]]},{"w":"associate","p":"n.","z":"專員、助理人員","c":"職位與工作內容","ex":[["She was hired as a sales associate at a department store.","她被聘為百貨公司的銷售專員。"],["The firm promoted him from junior associate to senior associate.","公司把他從初階專員升為資深專員。"]]},{"w":"specialist","p":"n.","z":"專員、專家","c":"職位與工作內容","ex":[["The company is hiring a cybersecurity specialist this quarter.","公司這一季要聘請一位資安專員。"],["As an HR specialist, she handles recruitment and training.","身為人資專員，她負責招募與訓練。"]]},{"w":"executive","p":"n.","z":"高階主管","c":"職位與工作內容","ex":[["The executive welcomed us all and explained the company vision clearly.","這位高階主管歡迎我們，並說明了公司願景。"],["Every executive attends the weekly strategy meeting held on Monday mornings.","每位高階主管都會參加週一早上舉行的每週策略會議。"]]},{"w":"consultant","p":"n.","z":"顧問","c":"職位與工作內容","ex":[["He works as a management consultant for large banks.","他是一位為大型銀行服務的管理顧問。"],["The company hired a consultant to improve its hiring process.","公司聘請了一位顧問來改善招募流程。"]]},{"w":"coordinator","p":"n.","z":"協調員、專案統籌","c":"職位與工作內容","ex":[["I applied to be an event coordinator at a travel agency.","我應徵旅行社的活動統籌一職。"],["The project coordinator keeps all teams updated on progress.","專案統籌讓所有團隊隨時掌握進度。"]]},{"w":"administrator","p":"n.","z":"行政人員、管理員","c":"職位與工作內容","ex":[["The office administrator orders supplies and books meeting rooms.","辦公室行政人員負責訂購用品和預約會議室。"],["She works as a network administrator at a hospital.","她在一家醫院擔任網路管理員。"]]},{"w":"engineer","p":"n.","z":"工程師","c":"職位與工作內容","ex":[["The company needs a software engineer with Python skills.","公司需要一位具備 Python 技能的軟體工程師。"],["My brother is a mechanical engineer at a Hsinchu factory.","我哥哥是新竹一間工廠的機械工程師。"]]},{"w":"analyst","p":"n.","z":"分析師","c":"職位與工作內容","ex":[["As a data analyst, I turn numbers into useful insights.","身為資料分析師，我把數字轉化為有用的洞見。"],["The financial analyst presented her report to the board.","這位財務分析師向董事會報告了她的分析。"]]},{"w":"technician","p":"n.","z":"技術員","c":"職位與工作內容","ex":[["The lab technician checks every machine each morning.","實驗室技術員每天早上檢查每一台機器。"],["A skilled technician fixed the server in under an hour.","一位技術熟練的技術員不到一小時就修好了伺服器。"]]},{"w":"representative","p":"n.","z":"業務代表、代表","c":"職位與工作內容","ex":[["I would like to work as a customer service representative.","我想擔任客服代表。"],["The sales representative visits ten clients every week.","這位業務代表每星期拜訪十位客戶。"]]},{"w":"director","p":"n.","z":"總監、主任","c":"職位與工作內容","ex":[["The marketing director will join the interview panel today.","行銷總監今天會加入面試小組。"],["She was promoted to director after leading three major projects.","她在領導三個重大專案後升任總監。"]]},{"w":"workforce","p":"n.","z":"勞動力、全體員工","c":"職位與工作內容","ex":[["The company has a workforce of about five hundred people.","這間公司有大約五百名員工。"],["A younger workforce is changing how offices operate.","較年輕的勞動力正在改變辦公室的運作方式。"]]},{"w":"job rotation","p":"phr.","z":"工作輪調","c":"職位與工作內容","ex":[["Job rotation lets new staff try several departments.","工作輪調讓新進員工體驗幾個不同部門。"],["The program includes job rotation across sales and logistics.","這個計畫包含在業務與物流之間的工作輪調。"]]},{"w":"job security","p":"n.","z":"工作保障","c":"職位與工作內容","ex":[["Many people value job security more than a high salary.","許多人重視工作保障勝過高薪。"],["Job security is rare in the fast-changing tech industry.","在快速變動的科技業，工作保障很少見。"]]},{"w":"reporting line","p":"phr.","z":"匯報關係","c":"職位與工作內容","ex":[["Who is in my reporting line if I join the team?","如果我加入團隊，我的匯報對象是誰？"],["The reporting line is clear: you report to the department head.","匯報關係很明確：你向部門主管報告。"]]},{"w":"hybrid","p":"adj.","z":"混合辦公的","c":"職位與工作內容","ex":[["We offer a hybrid schedule of three days in the office.","我們提供每週三天進辦公室的混合辦公時間表。"],["A hybrid role lets you work from home on Fridays.","混合辦公的職位讓你星期五可以在家工作。"]]},{"w":"flextime","p":"n.","z":"彈性工時","c":"職位與工作內容","ex":[["Flextime allows parents to pick up their children from school.","彈性工時讓家長可以去學校接小孩。"],["The firm introduced flextime to improve staff happiness.","公司引進彈性工時以提升員工的快樂程度。"]]},{"w":"commute","p":"n.","z":"通勤","c":"職位與工作內容","ex":[["My commute takes about forty minutes by MRT.","我搭捷運的通勤時間大約四十分鐘。"],["A long commute can make employees tired and unhappy.","很長的通勤時間會讓員工疲憊又不快樂。"]]},{"w":"manager","p":"n.","z":"經理、主管","c":"職位與工作內容","ex":[["My manager gave me clear goals during my first week.","我的經理在我第一週就給了我清楚的目標。"],["The store manager interviews all new sales staff personally.","店經理親自面試所有新進銷售人員。"]]},{"w":"salary","p":"n.","z":"薪水、薪資","c":"薪資與錄取","ex":[["What salary range are you expecting for this position?","你期望這個職位的薪資範圍是多少？"],["The salary is paid monthly on the last working day.","薪水在每月最後一個工作日發放。"]]},{"w":"base salary","p":"n.","z":"底薪、基本薪資","c":"薪資與錄取","ex":[["The base salary is NT$70,000 per month, plus bonuses.","底薪是每月新台幣七萬元，另有獎金。"],["I would like to discuss the base salary before we talk about perks.","在談福利之前，我想先討論底薪。"]]},{"w":"gross salary","p":"n.","z":"稅前薪資","c":"薪資與錄取","ex":[["The figure I mentioned is my gross salary, before tax.","我提到的數字是稅前薪資。"],["Is the gross salary listed in the offer a monthly or annual amount?","錄取通知上的稅前薪資是月薪還是年薪？"]]},{"w":"take-home pay","p":"n.","z":"實領薪資","c":"薪資與錄取","ex":[["After insurance and tax, my take-home pay is about NT$58,000.","扣除保險和稅金後，我的實領薪資約五萬八千元。"],["Could you explain how take-home pay is calculated here?","可以說明這裡的實領薪資是怎麼計算的嗎？"]]},{"w":"compensation","p":"n.","z":"薪酬、報酬","c":"薪資與錄取","ex":[["We offer competitive compensation based on your skills and experience.","我們根據你的技能與經驗提供具競爭力的薪酬。"],["I am looking at the whole compensation, not just the salary.","我看的是整體薪酬，不只是薪水。"]]},{"w":"compensation package","p":"n.","z":"薪酬福利方案","c":"薪資與錄取","ex":[["Could you walk me through the full compensation package?","可以為我說明完整的薪酬福利方案嗎？"],["The compensation package includes salary, bonus, and insurance.","薪酬福利方案包含薪資、獎金和保險。"]]},{"w":"perk","p":"n.","z":"額外福利、優惠","c":"薪資與錄取","ex":[["Free lunch is one of the perks of working here.","免費午餐是在這裡工作的額外福利之一。"],["Besides pay, are there any other perks I should know about?","除了薪水，還有其他我該知道的福利嗎？"]]},{"w":"bonus","p":"n.","z":"獎金","c":"薪資與錄取","ex":[["Is the bonus guaranteed, or does it depend on performance?","獎金是保證的，還是看績效？"],["Employees usually receive a bonus at Lunar New Year.","員工通常在農曆新年領到獎金。"]]},{"w":"signing bonus","p":"n.","z":"簽約獎金","c":"薪資與錄取","ex":[["They offered me a signing bonus of two months' salary.","他們提供我相當於兩個月薪水的簽約獎金。"],["Is there a signing bonus for joining before the end of the month?","月底前報到有簽約獎金嗎？"]]},{"w":"performance bonus","p":"n.","z":"績效獎金","c":"薪資與錄取","ex":[["The performance bonus is paid quarterly based on team targets.","績效獎金依團隊目標按季發放。"],["How is the performance bonus calculated for this role?","這個職位的績效獎金是如何計算的？"]]},{"w":"year-end bonus","p":"n.","z":"年終獎金","c":"薪資與錄取","ex":[["Our year-end bonus is usually one to three months of pay.","我們的年終獎金通常是一到三個月的薪水。"],["Will I be eligible for the year-end bonus in my first year?","我第一年就有資格領年終獎金嗎？"]]},{"w":"commission","p":"n.","z":"佣金、業績抽成","c":"薪資與錄取","ex":[["Sales staff earn a lower base plus commission on each deal.","業務人員拿較低的底薪，加上每筆交易的佣金。"],["What is the commission rate for new accounts?","新客戶的佣金比例是多少？"]]},{"w":"stock options","p":"n.","z":"員工認股權","c":"薪資與錄取","ex":[["Senior engineers also receive stock options as part of their pay.","資深工程師的薪酬也包含員工認股權。"],["How many stock options are included in this offer?","這份錄取通知包含多少認股權？"]]},{"w":"equity","p":"n.","z":"股權","c":"薪資與錄取","ex":[["The startup offers equity in addition to a modest salary.","這家新創公司除了適中的薪水外還提供股權。"],["I would prefer more cash and less equity in the package.","我比較希望方案中現金多一點、股權少一點。"]]},{"w":"vesting","p":"n.","z":"(股票)權利成就、分批取得","c":"薪資與錄取","ex":[["The vesting schedule runs over four years with a one-year cliff.","權利成就期程為四年，並有一年的等待期。"],["What happens to my shares if I leave before vesting is complete?","如果我在權利成就前離職，我的股份會怎麼處理？"]]},{"w":"raise","p":"n.","z":"加薪","c":"薪資與錄取","ex":[["Employees can expect a raise after the annual review.","員工在年度考核後可以預期加薪。"],["Is there a chance of a raise after the probation period?","試用期後有加薪的機會嗎？"]]},{"w":"pay raise","p":"n.","z":"加薪","c":"薪資與錄取","ex":[["I hope to earn a pay raise by showing strong results.","我希望用優異的成果爭取加薪。"],["The average pay raise here is about five percent a year.","這裡平均每年加薪約百分之五。"]]},{"w":"salary range","p":"n.","z":"薪資範圍","c":"薪資與錄取","ex":[["The salary range for this role is NT$60,000 to 80,000.","這個職位的薪資範圍是六萬到八萬元。"],["Could you tell me the salary range before we continue?","在繼續之前，可以告訴我薪資範圍嗎？"]]},{"w":"salary expectation","p":"n.","z":"期望薪資","c":"薪資與錄取","ex":[["My salary expectation is between NT$75,000 and 85,000.","我的期望薪資在七萬五到八萬五之間。"],["Please state your salary expectation on the application form.","請在申請表上填寫您的期望薪資。"]]},{"w":"negotiable","p":"adj.","z":"可協商的","c":"薪資與錄取","ex":[["Is the starting salary negotiable if I have extra certifications?","如果我有額外的證照，起薪可以協商嗎？"],["The start date is negotiable if you need more time.","如果你需要更多時間，到職日是可以協商的。"]]},{"w":"counteroffer","p":"n.","z":"還價、反向提議","c":"薪資與錄取","ex":[["I would like to make a counteroffer of NT$85,000.","我想提出八萬五千元的還價。"],["They sent a counteroffer that was closer to my expectation.","他們提出的還價比較接近我的期望。"]]},{"w":"job offer","p":"n.","z":"工作錄取通知","c":"薪資與錄取","ex":[["I am delighted to receive your job offer.","我很高興收到你們的工作錄取通知。"],["She turned down the job offer because the pay was too low.","她因為薪水太低而拒絕了這份工作。"]]},{"w":"offer letter","p":"n.","z":"錄取通知書","c":"薪資與錄取","ex":[["We will email you the offer letter by Friday.","我們會在週五前把錄取通知書寄給你。"],["Please read the offer letter carefully before signing.","簽名前請仔細閱讀錄取通知書。"]]},{"w":"accept the offer","p":"phr.","z":"接受錄取","c":"薪資與錄取","ex":[["I am happy to accept the offer and join your team.","我很樂意接受錄取並加入你們的團隊。"],["You have three days to accept the offer.","你有三天的時間接受錄取。"]]},{"w":"decline","p":"v.","z":"婉拒","c":"薪資與錄取","ex":[["I regret that I have to decline your offer.","很遺憾我必須婉拒你們的錄取。"],["He politely declined and thanked them for the opportunity.","他有禮貌地婉拒，並感謝對方給的機會。"]]},{"w":"verbal offer","p":"n.","z":"口頭錄取","c":"薪資與錄取","ex":[["I have received a verbal offer, but nothing in writing yet.","我收到口頭錄取，但還沒有書面文件。"],["Could you confirm the verbal offer in an email?","可以用電子郵件確認這個口頭錄取嗎？"]]},{"w":"contract","p":"n.","z":"合約","c":"薪資與錄取","ex":[["The contract runs for two years and may be renewed.","這份合約為期兩年，可以續約。"],["Could I take the contract home to review it?","我可以把合約帶回家看嗎？"]]},{"w":"employment contract","p":"n.","z":"聘僱合約","c":"薪資與錄取","ex":[["Please sign the employment contract on the last page.","請在最後一頁簽署聘僱合約。"],["The employment contract states my working hours and duties.","聘僱合約載明了我的工作時間和職責。"]]},{"w":"permanent position","p":"n.","z":"正職、長期職位","c":"薪資與錄取","ex":[["This is a permanent position with full benefits.","這是享有完整福利的正職職位。"],["I am looking for a permanent position rather than a contract role.","我在找正職，而不是約聘職位。"]]},{"w":"fixed-term contract","p":"n.","z":"定期契約","c":"薪資與錄取","ex":[["The role is a fixed-term contract of twelve months.","這個職位是十二個月的定期契約。"],["Can a fixed-term contract be converted to a permanent one?","定期契約可以轉為不定期契約嗎？"]]},{"w":"give notice","p":"phr.","z":"提出離職通知","c":"薪資與錄取","ex":[["I will give notice to my employer as soon as I sign.","我一簽約就會向現任雇主提出離職。"],["How much notice should I give before leaving the company?","離開公司前我應該提前多久通知？"]]},{"w":"resignation letter","p":"n.","z":"辭呈","c":"薪資與錄取","ex":[["I submitted my resignation letter yesterday and my manager accepted it.","我昨天遞出了辭呈，主管也接受了。"],["Your resignation letter should state your last working day.","你的辭呈應註明最後工作日。"]]},{"w":"severance pay","p":"n.","z":"資遣費","c":"薪資與錄取","ex":[["Severance pay is calculated according to the Labor Standards Act.","資遣費依勞動基準法計算。"],["What severance pay would I receive if the position ends?","如果職位被裁撤，我會領到多少資遣費？"]]},{"w":"non-compete clause","p":"n.","z":"競業禁止條款","c":"薪資與錄取","ex":[["The contract has a non-compete clause lasting one year.","合約裡有一項為期一年的競業禁止條款。"],["Could you explain the scope of the non-compete clause?","可以說明競業禁止條款的範圍嗎？"]]},{"w":"confidentiality agreement","p":"n.","z":"保密協議","c":"薪資與錄取","ex":[["All new hires must sign a confidentiality agreement.","所有新進員工都必須簽署保密協議。"],["The confidentiality agreement covers client data and source code.","保密協議涵蓋客戶資料和原始碼。"]]},{"w":"start date","p":"n.","z":"到職日","c":"薪資與錄取","ex":[["What is the earliest start date you can offer?","你能配合的最早到職日是什麼時候？"],["My start date depends on my notice period.","我的到職日取決於預告期。"]]},{"w":"orientation","p":"n.","z":"新人訓練、說明會","c":"薪資與錄取","ex":[["Orientation starts at nine on your first morning.","新人說明會在你第一天早上九點開始。"],["The orientation covers company policy and safety rules.","新人說明會涵蓋公司政策和安全規定。"]]},{"w":"background check","p":"n.","z":"背景調查","c":"薪資與錄取","ex":[["The offer depends on a successful background check.","這份錄取取決於背景調查通過。"],["They will run a background check before your start date.","他們會在你到職日前進行背景調查。"]]},{"w":"reference check","p":"n.","z":"推薦人查核","c":"薪資與錄取","ex":[["We will contact your referees for a reference check.","我們會聯絡你的推薦人進行查核。"],["Is it all right if you do the reference check next week?","你們下週再做推薦人查核可以嗎？"]]},{"w":"paid time off","p":"n.","z":"有薪假","c":"薪資與錄取","ex":[["How much paid time off do new employees receive?","新進員工有多少有薪假？"],["Paid time off includes vacation, personal days, and holidays.","有薪假包括休假、事假和國定假日。"]]},{"w":"annual leave","p":"n.","z":"年假、特休","c":"薪資與錄取","ex":[["You are entitled to ten days of annual leave this year.","你今年有十天的特休。"],["Can I carry over unused annual leave to next year?","沒用完的特休可以留到明年嗎？"]]},{"w":"sick leave","p":"n.","z":"病假","c":"薪資與錄取","ex":[["Sick leave is paid at half salary under the law.","依法病假按半薪給付。"],["How many days of sick leave can I take each year?","我每年可以請幾天病假？"]]},{"w":"health insurance","p":"n.","z":"健康保險","c":"薪資與錄取","ex":[["The company covers health insurance for employees and families.","公司為員工及家屬負擔健康保險。"],["Does the health insurance start on my first day?","健康保險從我到職第一天就生效嗎？"]]},{"w":"retirement plan","p":"n.","z":"退休金計畫","c":"薪資與錄取","ex":[["The company contributes six percent to the retirement plan.","公司提撥百分之六到退休金計畫。"],["Could you explain how the retirement plan works?","可以說明退休金計畫如何運作嗎？"]]},{"w":"labor insurance","p":"n.","z":"勞工保險","c":"薪資與錄取","ex":[["Labor insurance is arranged for you from your first day.","你到職第一天起就會辦理勞工保險。"],["Does my salary include the labor insurance contribution?","我的薪水有包含勞保自付額嗎？"]]},{"w":"flexible hours","p":"n.","z":"彈性工時","c":"薪資與錄取","ex":[["We offer flexible hours as long as you attend core meetings.","只要你參加核心會議，我們提供彈性工時。"],["Flexible hours were important to me when choosing a job.","在選擇工作時，彈性工時對我很重要。"]]},{"w":"remote work","p":"n.","z":"遠距工作","c":"薪資與錄取","ex":[["Remote work is allowed two days a week.","每週可以遠距工作兩天。"],["Is remote work available after the probation period?","試用期後可以遠距工作嗎？"]]},{"w":"overtime pay","p":"n.","z":"加班費","c":"薪資與錄取","ex":[["Overtime pay is calculated at one and a third times your hourly rate.","加班費按時薪的一又三分之一倍計算。"],["Will I receive overtime pay or compensatory leave?","我會拿到加班費還是補休？"]]},{"w":"allowance","p":"n.","z":"津貼、補助","c":"薪資與錄取","ex":[["There is a monthly meal allowance of NT$2,400.","每月有新台幣兩千四百元的伙食津貼。"],["Does the company provide a transport allowance for staff who commute far?","公司有為通勤較遠的員工提供交通津貼嗎？"]]},{"w":"reimbursement","p":"n.","z":"報銷、費用補償","c":"薪資與錄取","ex":[["Travel reimbursement is processed within two weeks after you submit the receipts.","差旅費用報銷在你提交收據後兩週內處理。"],["How does the reimbursement for business expenses work?","業務費用的報銷是怎麼運作的？"]]},{"w":"relocation package","p":"n.","z":"搬遷補助方案","c":"薪資與錄取","ex":[["They offered a relocation package covering moving costs.","他們提供涵蓋搬家費用的搬遷補助方案。"],["Is a relocation package available if I move to Taichung?","如果我搬到台中，有搬遷補助方案嗎？"]]},{"w":"market rate","p":"n.","z":"市場行情價","c":"薪資與錄取","ex":[["I believe my request is in line with the market rate.","我認為我的要求符合市場行情。"],["We try to pay the market rate for every position.","我們盡量讓每個職位都拿到市場行情的薪資。"]]},{"w":"hourly rate","p":"n.","z":"時薪","c":"薪資與錄取","ex":[["The hourly rate for part-time staff is NT$250.","兼職人員的時薪是新台幣兩百五十元。"],["What hourly rate would you charge as a freelancer?","作為自由工作者，你的時薪是多少？"]]},{"w":"career growth","p":"n.","z":"職涯成長","c":"薪資與錄取","ex":[["I am looking for strong career growth in this role.","我希望這個職位有良好的職涯成長。"],["What career growth opportunities does your team offer?","你們團隊提供哪些職涯成長的機會？"]]},{"w":"employee handbook","p":"n.","z":"員工手冊","c":"薪資與錄取","ex":[["The employee handbook explains leave and dress code policies.","員工手冊說明了請假與服裝規定。"],["You will receive the employee handbook on your first day.","你第一天會拿到員工手冊。"]]},{"w":"total compensation","p":"n.","z":"總薪酬","c":"薪資與錄取","ex":[["Total compensation includes your salary, bonus, insurance, and other benefits.","總薪酬包括你的薪水、獎金、保險和其他福利。"],["I compared the total compensation of both offers carefully.","我仔細比較了兩份錄取的總薪酬。"]]},{"w":"pay cut","p":"n.","z":"減薪","c":"薪資與錄取","ex":[["Accepting this role would mean a pay cut for me.","接受這個職位對我來說意味著減薪。"],["I am not willing to take a pay cut.","我不願意接受減薪。"]]},{"w":"lowball","p":"v.","z":"故意開低價","c":"薪資與錄取","ex":[["I felt they tried to lowball me with that figure.","我覺得他們用那個數字想壓低我的薪水。"],["Don't lowball yourself when you state your expectations.","表達期望時不要低估自己。"]]},{"w":"ballpark figure","p":"n.","z":"大概的數字","c":"薪資與錄取","ex":[["Can you give me a ballpark figure for the bonus?","你可以給我獎金的大概數字嗎？"],["A ballpark figure is fine for now; we can refine it later.","現在先給大概的數字就好，之後再細談。"]]},{"w":"meet halfway","p":"phr.","z":"各讓一步、折衷","c":"薪資與錄取","ex":[["Could we meet halfway at NT$78,000 and then review it in six months?","我們能折衷在七萬八千元，然後六個月後再檢討嗎？"],["I am happy to meet halfway on the start date.","關於到職日，我很樂意各退一步。"]]},{"w":"deal-breaker","p":"n.","z":"致命條件、談判破局的因素","c":"薪資與錄取","ex":[["A long commute would be a deal-breaker for me.","通勤太久對我來說會是破局的因素。"],["Is there anything that would be a deal-breaker for you?","有什麼條件是你絕對無法接受的嗎？"]]},{"w":"room for negotiation","p":"n.","z":"協商空間","c":"薪資與錄取","ex":[["Is there any room for negotiation on the salary?","薪資有任何協商空間嗎？"],["There is some room for negotiation, but not much.","有一些協商空間，但不多。"]]},{"w":"in writing","p":"phr.","z":"以書面形式","c":"薪資與錄取","ex":[["Could you please confirm the terms in writing?","可以請你以書面確認這些條件嗎？"],["I would like to get everything in writing before I resign.","在辭職前，我想把一切都拿到書面文件。"]]},{"w":"pro-rated","p":"adj.","z":"按比例計算的","c":"薪資與錄取","ex":[["Your first-year leave will be pro-rated by start date.","你第一年的假期會依到職日按比例計算。"],["The bonus is pro-rated if you join mid-year.","如果你年中到職，獎金會按比例計算。"]]},{"w":"entitled","p":"adj.","z":"有權利的、享有資格的","c":"薪資與錄取","ex":[["New employees are entitled to seven days of leave.","新進員工享有七天假期。"],["Am I entitled to the bonus during probation?","試用期間我有資格領獎金嗎？"]]},{"w":"eligible","p":"adj.","z":"有資格的","c":"薪資與錄取","ex":[["You become eligible for stock options after six months.","你在六個月後就有資格取得認股權。"],["Am I eligible for health insurance from day one?","我從第一天起就有資格投保健康保險嗎？"]]},{"w":"taxable","p":"adj.","z":"應課稅的","c":"薪資與錄取","ex":[["The signing bonus is taxable income, so tax will be deducted from it.","簽約獎金屬於應稅所得，所以會被扣稅。"],["Are these allowances taxable, or are they paid in full to employees?","這些津貼要課稅嗎？還是全額發給員工？"]]},{"w":"deduction","p":"n.","z":"扣除額、扣款","c":"薪資與錄取","ex":[["The deductions include labor insurance, health insurance, and income tax each month.","每月的扣款包括勞保、健保和所得稅。"],["Could you list all the deductions from my monthly pay?","可以列出我每月薪水的所有扣款嗎？"]]},{"w":"payroll","p":"n.","z":"薪資發放作業、薪資名單","c":"薪資與錄取","ex":[["Payroll is processed on the fifth of each month.","薪資作業在每月五日處理。"],["Please send your bank details to payroll before the first day.","請在第一天前把你的銀行帳戶資料寄給薪資部門。"]]},{"w":"payday","p":"n.","z":"發薪日","c":"薪資與錄取","ex":[["Payday falls on the tenth of every month.","發薪日是每個月十號。"],["When is the first payday for new employees?","新進員工的第一個發薪日是什麼時候？"]]},{"w":"stipend","p":"n.","z":"補助金、津貼","c":"薪資與錄取","ex":[["Interns receive a monthly stipend of NT$30,000 during the six-month program.","實習生在六個月的計畫期間每月領取三萬元補助金。"],["The stipend covers most of your living costs during the training period.","這筆補助金涵蓋你訓練期間大部分的生活費。"]]},{"w":"tuition reimbursement","p":"n.","z":"學費補助","c":"薪資與錄取","ex":[["The company offers tuition reimbursement for approved courses.","公司對核准的課程提供學費補助。"],["Is tuition reimbursement available for a part-time master's degree?","在職碩士有學費補助嗎？"]]},{"w":"training budget","p":"n.","z":"培訓預算","c":"薪資與錄取","ex":[["Each employee has a training budget of NT$30,000 a year.","每位員工每年有三萬元的培訓預算。"],["I would like to use the training budget for a certification.","我想用培訓預算去考一張證照。"]]},{"w":"ramp up","p":"phr.","z":"逐步進入狀況、加速上手","c":"薪資與錄取","ex":[["New engineers usually ramp up within two months.","新進工程師通常在兩個月內上手。"],["How long do you expect it to take me to ramp up?","你預期我需要多久才能上手？"]]},{"w":"hit the ground running","p":"phr.","z":"一上任就迅速進入狀況","c":"薪資與錄取","ex":[["With my experience, I can hit the ground running.","憑我的經驗，我可以一上任就迅速進入狀況。"],["We need someone who can hit the ground running.","我們需要能一上任就進入狀況的人。"]]},{"w":"paperwork","p":"n.","z":"文書作業、表單文件","c":"薪資與錄取","ex":[["HR will help you finish the paperwork on your first day.","人資會在你第一天協助你完成文件作業。"],["There is quite a lot of paperwork to complete before starting.","到職前有相當多文件要完成。"]]},{"w":"HR department","p":"n.","z":"人力資源部門","c":"薪資與錄取","ex":[["The HR department will contact you about your start date.","人資部門會與你聯絡到職日的事。"],["Please send the signed contract to the HR department.","請把簽好的合約寄給人資部門。"]]},{"w":"competitive","p":"adj.","z":"具競爭力的","c":"薪資與錄取","ex":[["We believe our salary is competitive in the industry.","我們認為我們的薪水在業界具競爭力。"],["The offer is competitive, but I have another one to consider.","這份錄取很有競爭力，但我還有另一份要考慮。"]]},{"w":"lucrative","p":"adj.","z":"報酬優厚的","c":"薪資與錄取","ex":[["It is a lucrative offer, but the hours are long.","這是份報酬優厚的錄取，但工時很長。"],["Finance can be a lucrative career for skilled analysts.","對優秀的分析師而言，金融業可能是報酬優渥的職涯。"]]},{"w":"generous","p":"adj.","z":"慷慨的、優渥的","c":"薪資與錄取","ex":[["The company has a generous leave policy, which was a big attraction for me.","公司有優渥的休假制度，這對我很有吸引力。"],["That is a very generous offer, and I appreciate it.","這是非常優渥的錄取，我很感謝。"]]},{"w":"comprehensive","p":"adj.","z":"全面的、完整的","c":"薪資與錄取","ex":[["We provide a comprehensive benefits package that covers health, leave, and training.","我們提供涵蓋健康、休假和培訓的完整福利方案。"],["Does the insurance offer comprehensive coverage for dependents?","這份保險對眷屬提供全面的保障嗎？"]]},{"w":"commensurate with","p":"phr.","z":"與...相稱","c":"薪資與錄取","ex":[["Salary will be commensurate with experience and the skills you bring to us.","薪資將與你的經驗及帶來的技能相稱。"],["I am seeking pay commensurate with my responsibilities.","我希望薪酬與我的職責相稱。"]]},{"w":"competing offer","p":"n.","z":"其他公司的錄取","c":"薪資與錄取","ex":[["I currently have a competing offer from another firm.","我目前有另一家公司的錄取。"],["Would you match a competing offe
